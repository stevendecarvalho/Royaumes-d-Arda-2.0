;////////////////////////////////////////////////////////////////////////////////////
;////////////////////////////////////////////////////////////////////////////////////

Object ScorpionDen
    SelectPortrait                      = bpharadscorpionpitexpansion
    ButtonImage                         = uiharadscorpionexpansion
    
    ;////////////////////////////
    ;// PARAMÈTRES ARTISTIQUES //
    ;////////////////////////////

    Draw                                = W3DScriptedModelDraw ModuleTag_Draw
        OkToChangeModelColor                = Yes
        UseStandardModelNames               = Yes
        StaticModelLODMode                  = Yes
        
        DefaultModelConditionState
            Model                               = hbscorpexp_skn
        End
        
        ;// Modèle : En attente de construction
        ModelConditionState                 = UPGRADE_NUMENOR_STONEWORK ACTIVELY_BEING_CONSTRUCTED
            Model                               = hbscorpexp_bld
            Texture                             = KBFortressX.tga KBFortressX_Ice.tga
            Texture                             = KBFortressX_NRM.tga KBFortressX_Ice_NRM.tga
        End
        ModelConditionState                 = SNOW ACTIVELY_BEING_CONSTRUCTED
            Model                               = hbscorpexp_bld
            Texture                             = KBFortressX.tga KBFortressX_Snow.tga
        End
        ModelConditionState                 = ACTIVELY_BEING_CONSTRUCTED
            Model                               = hbscorpexp_bld
        End
        AnimationState                      = ACTIVELY_BEING_CONSTRUCTED
            Animation                           = hbscorpexp_bld
                AnimationName                       = hbscorpexp_bld.hbscorpexp_bld
                AnimationMode                       = MANUAL
            End
            ParticleSysBone                     = NONE HaradBuildingContructDust FollowBone:Yes
            ParticleSysBone                     = NONE HaradBuildingContructEmbers FollowBone:Yes
            BeginScript
                CurDrawablePlaySound("GondorBarracksBeginConstruction")
                CurDrawableHideSubObject("IceWall")
            EndScript
        End
        
        ;// Modèle : Endommagé
        ModelConditionState                 = DAMAGED
            Model                               = hbscorpexp_d1
        End
        AnimationState                      = DAMAGED
            EnteringStateFX                     = FX_BuildingDamaged
        End
        
        ;// Modèle : Très endommagé   
        ModelConditionState                 = REALLYDAMAGED
            Model                               = hbscorpexp_d2
        End
        AnimationState                      = REALLYDAMAGED
            Animation                           = WBSHole_ReallyDamaged
                AnimationName                       = hbscorpexp_d2.hbscorpexp_d2
                AnimationMode                       = ONCE
            End
            EnteringStateFX                     = FX_BuildingReallyDamaged
        End
        
        ;// Modèle : Décombres
        ModelConditionState                 = RUBBLE
            Model                               = hbscorpexp_d2
            ParticleSysBone                     SmokeLarge01 SmokeBuildingLarge
        End
        AnimationState                      = RUBBLE
            Animation                           = WBSHole_ReallyDamaged
                AnimationName                       = hbscorpexp_d2.hbscorpexp_d2
                AnimationMode                       = ONCE
            End
            EnteringStateFX                     = FX_StructureMediumCollapse
        End
        ModelConditionState                 = UPGRADE_NUMENOR_STONEWORK
            Model                               = KBFKennel
            Texture                             = KBFortressX.tga KBFortressX_Ice.tga
            Texture                             = KBFortressX_NRM.tga KBFortressX_Ice_NRM.tga
        End
        
        ;// Modèle : Enneigé
        ModelConditionState                 = SNOW
            Model                               = KBFKennel
            Texture                             = KBFortressX.tga KBFortressX_Snow.tga
        End
    End
    
    ;// Modèle : Sol
    Draw                                = W3DFloorDraw ModuleTag_DrawFloor
        StaticModelLODMode                  = Yes
        ModelName                           = hbscorpexp_bib
        WeatherTexture                      = SNOWY hbfortress_scorp_bib.tga
        HideIfModelConditions               = AWAITING_CONSTRUCTION
        HideIfModelConditions               = PARTIALLY_CONSTRUCTED
    End
    
    ;// Modèle : Allégeance naturelle
    Draw                                = W3DScriptedModelDraw UntamedAllegianceFX
        DefaultModelConditionState
            Model                               = None
        End
        AnimationState                      = USER_2
            ParticleSysBone                     = None UntamedAllegiance HouseColor:Yes
            ParticleSysBone                     = None UntamedAllegiance2 HouseColor:Yes
        End
    End



    ;/////////////////////////
    ;// PARAMÈTRES GÉNÉRAUX //
    ;/////////////////////////

    DisplayName                         = OBJECT:ScorpionLair
    Description                         = OBJECT:ScorpionDenDescription
    PlacementViewAngle                  = -90

    BuildTime                           = 30
    VisionRange                         = 160.0                                         ;// Distance pour voir les ennemis
    ShroudClearingRange                 = 160.0                                         ;// Rayon qui dévoile le brouillard

    Side                                = Neutral
    IsTrainable                         = No
    EditorSorting                       = STRUCTURE
    IsTrainable                         = No
    ThreatLevel                         = 1                                             ;// Niveau de menace de l'unité pour l'IA

    CommandSet                          = EmptyCommandSet



    ;/////////////////
    ;// COMMANDSETS //
    ;/////////////////
    
    Behavior                            = CommandSetUpgrade ModueTag_FactionCommandSet
        TriggeredBy                         = Upgrade_AngmarFaction Upgrade_IsengardFaction Upgrade_MordorFaction Upgrade_WildFaction Upgrade_MenFaction Upgrade_ElfFaction Upgrade_DwarfFaction
        CommandSet                          = ScorpionDenCommandSet
        CustomAnimAndDuration               = AnimState:USER_2 AnimTime:0
    End



    ;/////////////////////
    ;// ARMES & ARMURES //
    ;/////////////////////
    
    ArmorSet
        Conditions                          = None
        Armor                               = RDA_GENERIC_BUILDINGS_ARMOR
    End



    ;//////////////////////
    ;// PARAMÈTRES AUDIO //
    ;//////////////////////
    
    VoiceSelect                         = HaradScorpionPitSelect
    VoiceSelectUnderConstruction        = BuildingEvilVoiceSelectUnderConstruction
    
    SoundOnDamaged                      = BuildingLightDamageStone
    SoundOnReallyDamaged                = BuildingHeavyDamageStone
    
    UnitSpecificSounds
        UnderConstruction                   = BuildingConstructionLoop
        UnderRepairFromDamage               = BuildingConstructionLoop
        UnderRepairFromRubble               = BuildingConstructionLoop
    End



    ;/////////////////////////////
    ;// PARAMÈTRES D'INGÉNIERIE //
    ;/////////////////////////////

    RadarPriority                       = STRUCTURE
    KindOf                              = PRELOAD STRUCTURE IMMOBILE SELECTABLE SCORE FS_FACTORY AUTO_RALLYPOINT IGNORE_FOR_VICTORY
    
    Behavior                            = GettingBuiltBehavior ModuleTag_04
        RebuildWhenDead                     = Yes
        SelfBuildingLoop                    = BuildingConstructionLoop
        SelfRepairFromDamageLoop            = NoSound
        SelfRepairFromRubbleLoop            = BuildingConstructionLoop
        DisallowRebuildRange                = 300
        DisallowRebuildFilter               = ANY +STRUCTURE
        UseSpawnTimerWithoutWorker          = Yes
    End
    
    Behavior                            = StructureCollapseUpdate ModuleTag_Collapse
        MinCollapseDelay                    = 000
        MaxCollapseDelay                    = 000
        CollapseDamping                     = .5
        MaxShudder                          = 0.6
        MinBurstDelay                       = 250
        MaxBurstDelay                       = 800
        BigBurstFrequency                   = 4
        FXList                              = INITIAL FX_StructureMediumCollapse
        FXList                              = ALMOST_FINAL FX_StructureAlmostCollapse
        DestroyObjectWhenDone               = Yes
        CollapseHeight                      = 120
    End
    
    Behavior                            = KeepObjectDie ModuleTag_IWantRubble
    End
    
    Behavior                            = RebuildHoleExposeDie ModuleTag_ExposeDie
        ExemptStatus                        = SOLD
        HoleName                            = ScorpionDenHole
        HoleMaxHealth                       = 500.0
        FadeInTimeSeconds                   = 2.0
        TransferAttackers                   = No
    End



    ;/////////////////////////
    ;// PARAMÈTRES DE SANTÉ //
    ;/////////////////////////
    
    Body                                = ActiveBody ModuleTag_Body
        MaxHealth                           = 2000
        MaxHealthDamaged                    = 1000
        MaxHealthReallyDamaged              = 500
    End



    ;////////////////
    ;// RESSOURCES //
    ;////////////////
    
    Behavior                            = TerrainResourceBehavior ModuleTag_NewMoneyDeadSpot
        Radius                              = 80
        MaxIncome                           = 0
        IncomeInterval                      = 999999
        HighPriority                        = Yes
    End



    ;////////////////
    ;// PRODUCTION //
    ;////////////////
    
    Behavior                            = QueueProductionExitUpdate ModuleTag_11
        UnitCreatePoint                     = X:20.0 Y:20.0 Z:0.0
        NaturalRallyPoint                   = X:90.0.0 Y:20.0 Z:0.0
        ExitDelay                           = 300
    End
    
    Behavior                            = ProductionUpdate ProductionUpdateModuleTag
        NumDoorAnimations                   = 0
    End



    ;////////////////
    ;// PATROUILLE //
    ;////////////////
    
    Behavior                            = SpawnBehavior ModuleTag_SpawnFighters
        SpawnNumber                         = 8
        InitialBurst                        = 8
        SpawnTemplateName                   = HaradGiantScorpion_Creep
        SpawnReplaceDelay                   = 30000
        CanReclaimOrphans                   = Yes
    End



    ;//////////////////////////
    ;// ALLÉGEANCE NATURELLE //
    ;//////////////////////////

    Behavior                            = FireWeaponUpdate ModuleTag_CreepKiller
        FireWeaponNugget
            WeaponName                          = WildAllegianceCreepKiller
            FireDelay                           = 0
            OneShot                             = No
        End
    End
    
    Behavior                            = ObjectCreationUpgrade MakeTheMoneyMaker
        TriggeredBy                         = Upgrade_WildFaction
        Delay                               = 0.0
        DestroyWhenSold                     = Yes
        ThingToSpawn                        = CreepyMoneyMaker
        FadeInTime                          = 100
    End
    
    Behavior                            = SpawnBehavior ModuleTag_SpawnDefenders
        TriggeredBy                         = Upgrade_WildFaction
        SpawnNumber                         = 18
        InitialBurst                        = 18
        SpawnTemplateName                   = GoblinFighter_Patrol GoblinArcher_Patrol MoriaPikeman_Patrol
        SpawnReplaceDelay                   = 45000
        CanReclaimOrphans                   = Yes
    End
    
    Behavior                            = ObjectCreationUpgrade ModuleTag_TheObjectCreationUpgrade
        TriggeredBy                         = Upgrade_CreepShadowInFog
        ThingToSpawn                        = ScorpionDenShadowInFog
    End



    ;/////////////////////////////
    ;// PARAMÈTRES DE GÉOMÉTRIE //
    ;/////////////////////////////
    
    Geometry                            = CYLINDER
    GeometryMajorRadius                 = 32
    GeometryHeight                      = 34.1545
    GeometryOffset                      = X:-1.65102 Y:-0.483869 Z:0.0
    GeometryIsSmall                     = No
    
    Shadow                              = SHADOW_VOLUME
    BuildCompletion                     = PLACED_BY_PLAYER
    
    GeometryContactPoint                = X:33.624 Y:33.464 Z:0 Repair
    GeometryContactPoint                = X:32.954 Y:-36.306 Z:0 Repair
    GeometryContactPoint                = X:22.954 Y:15.951 Z:0
    GeometryContactPoint                = X:5.435 Y:-23.279 Z:0
    GeometryContactPoint                = X:-0.459 Y:-0.275 Z:116.828 Swoop
End





Object ScorpionDenShadowInFog
    
    ;////////////////////////////
    ;// PARAMÈTRES ARTISTIQUES //
    ;////////////////////////////

    Draw                                = W3DScriptedModelDraw ModuleTag_01
        DefaultModelConditionState
            Model                               = NONE
        End
    End



    ;/////////////////////////
    ;// PARAMÈTRES GÉNÉRAUX //
    ;/////////////////////////

    ShroudClearingRange                 = 0



    ;/////////////////////////////
    ;// PARAMÈTRES D'INGÉNIERIE //
    ;/////////////////////////////

    KindOf                              = SELECTABLE IMMOBILE NOT_AUTOACQUIRABLE UNATTACKABLE REVEAL_TO_ALL CRATE ONE_RING



    ;/////////////////////////
    ;// PARAMÈTRES DE SANTÉ //
    ;/////////////////////////
    
    Body                                = StructureBody ModuleTag_05
        MaxHealth                           = 999999
    End



    ;/////////
    ;// OCL //
    ;/////////

    Behavior                            = CreateObjectDie ModuleTag_06
        DeathTypes                          = ALL
        CreationList                        = OCL_ScorpionDenRealShadowInFog
    End



    ;///////////
    ;// TIMER //
    ;///////////

    Behavior                            = LifetimeUpdate ModuleTag_LifetimeUpdate
        MinLifetime                         = 0
        MaxLifetime                         = 0
    End



    ;////////////////
    ;// MORT LENTE //
    ;////////////////

    Behavior                            = SlowDeathBehavior ModuleTag_Fading
        DeathTypes                          = ALL
        FadeDelay                           = 0
        FadeTime                            = 0
        DestructionDelay                    = 0
    End
End





Object ScorpionDenRealShadowInFog
    
    ;////////////////////////////
    ;// PARAMÈTRES ARTISTIQUES //
    ;////////////////////////////

    Draw                                = W3DScriptedModelDraw ModuleTag_01
        DefaultModelConditionState
            Model                               = hbscorpexp_skn
        End
        
        ;// Modèle : Enneigé
        ModelConditionState                 = SNOW
            Model                               = KBFKennel
            Texture                             = KBFortressX.tga KBFortressX_Snow.tga
        End
    End

    ;// Modèle : Sol
    Draw                                = W3DFloorDraw ModuleTag_DrawFloor
        StaticModelLODMode                  = Yes
        ModelName                           = hbscorpexp_bib
        WeatherTexture                      = SNOWY hbfortress_scorp_bib.tga
        HideIfModelConditions               = AWAITING_CONSTRUCTION
        HideIfModelConditions               = PARTIALLY_CONSTRUCTED
    End



    ;/////////////////////////
    ;// PARAMÈTRES GÉNÉRAUX //
    ;/////////////////////////
    
    VisionRange                         = 0
    ShroudClearingRange                 = 0



    ;/////////////////////////////
    ;// PARAMÈTRES D'INGÉNIERIE //
    ;/////////////////////////////

    KindOf                              = PRELOAD STRUCTURE SELECTABLE IMMOBILE NEED_BASE_FOUNDATION MADE_OF_STONE CAN_SEE_THROUGH_STRUCTURE IGNORE_FOR_VICTORY FS_FACTORY NOT_AUTOACQUIRABLE NEVER_CULL_FOR_MP NOT_SELLABLE



    ;/////////////////////////
    ;// PARAMÈTRES DE SANTÉ //
    ;/////////////////////////
    
    Body                                = StructureBody ModuleTag_05
        MaxHealth                           = 999999
    End



    ;///////////
    ;// TIMER //
    ;///////////

    Behavior                            = LifetimeUpdate ModuleTag_LifetimeUpdate
        MinLifetime                         = 500
        MaxLifetime                         = 500
    End



    ;////////////////
    ;// MORT LENTE //
    ;////////////////

    Behavior                            = SlowDeathBehavior ModuleTag_Fading
        DeathTypes                          = ALL
        FadeDelay                           = 0
        FadeTime                            = 200
        DestructionDelay                    = 200
    End
End