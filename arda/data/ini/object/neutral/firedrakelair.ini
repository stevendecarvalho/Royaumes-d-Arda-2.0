    Behavior                            = AttributeModifierAuraUpdate ModuleTag_DrakeMounter
        StartsActive                        = Yes
        BonusName                           = LairDrakeConversionTrigger
        RefreshDelay                        = 2000
        Range                               = 450
        AntiCategory                        = BUFF
        TargetEnemy                         = No
        ObjectFilter                        = NONE +FireDrake_Slaved ALLIES
    End
End





