Object LairDrakeConversionPing

    ;/////////////////////////
    ;// PARAMÈTRES GÉNÉRAUX //
    ;/////////////////////////

    EditorSorting                       = SYSTEM



    ;//////////////////////
    ;// PARAMÈTRES AUDIO //
    ;//////////////////////
    
    EvaEnemyObjectSightedEvent          = None



    ;/////////////////////////////
    ;// PARAMÈTRES D'INGÉNIERIE //
    ;/////////////////////////////

    KindOf                              = NO_COLLIDE IMMOBILE UNATTACKABLE IGNORE_FOR_VICTORY IGNORE_FOR_EVA_SPEECH_POSITION



    ;/////////////////////////
    ;// PARAMÈTRES DE SANTÉ //
    ;/////////////////////////

    Body                                = ImmortalBody ModuleTag_01
        MaxHealth                           = 10000
        InitialHealth                       = 10000
    End



    ;///////////
    ;// TIMER //
    ;///////////
    
    Behavior                            = DeletionUpdate ModuleTag_DeletionUpdate
        MinLifetime                         = 1000
        MaxLifetime                         = 1000
    End



