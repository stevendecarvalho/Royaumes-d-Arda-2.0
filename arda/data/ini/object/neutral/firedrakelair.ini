Object FireDrakeLair
    SelectPortrait                      = BPCDrakeLair
    
    ;////////////////////////////
    ;// PARAMÈTRES ARTISTIQUES //
    ;////////////////////////////

    Draw                                = W3DScriptedModelDraw ModuleTag_Draw
        DefaultModelConditionState
            Model                               = NBDrakeLair
            ParticleSysBone                     FXbone01 DrakeLairHeat
            ParticleSysBone                     FXbone02 DrakeLairSteam
            ParticleSysBone                     FXbone01 DrakeLairGlow
            ParticleSysBone                     FXbone01 DrakeLairSteam02
        End
        
        ;// Modèle : En attente de construction
        ModelConditionState                 = SNOW AWAITING_CONSTRUCTION
            Model                               = NBDrakeLair_A
            Texture                             = WBStone.tga WBStone_snow.tga
        End
        ModelConditionState                 = AWAITING_CONSTRUCTION
            Model                               = NBDrakeLair_A
        End
        AnimationState                      = AWAITING_CONSTRUCTION
            Animation                           = NBDrakeLair_A
                AnimationName                       = NBDrakeLair_A.NBDrakeLair_A
                AnimationMode                       = MANUAL
            End
            Flags                               = START_FRAME_FIRST
        End
        ModelConditionState                 = SNOW ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
            Model                               = NBDrakeLair_A
            Texture                             = WBStone.tga WBStone_snow.tga
        End
        ModelConditionState                 = ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
            Model                               = NBDrakeLair_A
        End
        AnimationState                      = ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
            Animation                           = NBDrakeLair_A
                AnimationName                       = NBDrakeLair_A.NBDrakeLair_A
                AnimationMode                       = MANUAL
            End
            Flags                               = START_FRAME_FIRST
            StateName                           = BeingConstructed
        End
        
        ;// Modèle : Endommagé
        ModelConditionState                 = DAMAGED
            Model                               = NBDrakeLair_D1
        End
        AnimationState                      = DAMAGED
            EnteringStateFX                     = FX_BuildingDamaged
        End
        
        ;// Modèle : Très endommagé
        ModelConditionState                 = REALLYDAMAGED
            Model                               = NBDrakeLair_D2
        End
        AnimationState                      = REALLYDAMAGED
            Animation                           = RubbleAnimation
                AnimationName                       = NBDrakeLair_D2.NBDrakeLair_D2
                AnimationMode                       = ONCE
            End
            EnteringStateFX                     = FX_BuildingReallyDamaged
        End
        
        ;// Modèle : Décombres
        ModelConditionState                 = COLLAPSING
            Model                               = NBDrakeLair_D3
        End
        AnimationState                      = COLLAPSING
            Animation                           = RubbleAnimation
                AnimationName                       = NBDrakeLair_D3.NBDrakeLair_D3
                AnimationMode                       = ONCE
            End
            EnteringStateFX                     = FX_StructureMediumCollapse
        End
        ModelConditionState                 = RUBBLE
            Model                               = None
        End
        ModelConditionState                 = POST_RUBBLE
            Model                               = NONE
            ParticleSysBone                     NONE SmokeBuildingMediumRubble
        End
        AnimationState                      = POST_RUBBLE
        End
        ModelConditionState                 = POST_COLLAPSE
            Model                               = None
            ParticleSysBone                     NONE SmokeBuildingMediumRubble
        End
        AnimationState                      = POST_COLLAPSE
        End
        
        ;// Modèle : Enneigé
        ModelConditionState                 = SNOW
            Model                               = NBDrakeLair
            Texture                             = WBStone.tga WBStone_snow.tga
        End
    End
    
    ;// Modèle : Sol
    Draw                                = W3DFloorDraw ModuleTag_DrawFloor
        StaticModelLODMode                  = Yes
        ModelName                           = NBDrakeL_Bib
        WeatherTexture                      = SNOWY NBDrakeLair_bib_Snow.tga
    End
    
    ;// Modèle : Allégeance naturelle
    Draw                                = W3DScriptedModelDraw UntamedAllegianceFX
        DefaultModelConditionState
            Model                               = None
        End
        AnimationState                      = USER_2
            ParticleSysBone                     = None UntamedAllegiance HouseColor:Yes
            ParticleSysBone                     = None UntamedAllegiance2 HouseColor:Yes
        End
    End



    ;/////////////////////////
    ;// PARAMÈTRES GÉNÉRAUX //
    ;/////////////////////////

    DisplayName                         = OBJECT:FireDrakeLair
    Description                         = OBJECT:FireDrakeLairDescription
    PlacementViewAngle                  = -90

    BuildTime                           = 30
    VisionRange                         = 160.0                                         ;// Distance pour voir les ennemis
    ShroudClearingRange                 = 160.0                                         ;// Rayon qui dévoile le brouillard

    Side                                = Neutral
    IsTrainable                         = No
    EditorSorting                       = STRUCTURE
    IsTrainable                         = No
    ThreatLevel                         = 1                                             ;// Niveau de menace de l'unité pour l'IA

    CommandSet                          = EmptyCommandSet



    ;/////////////////
    ;// COMMANDSETS //
    ;/////////////////
    
    Behavior                            = CommandSetUpgrade ModueTag_FactionCommandSet
        TriggeredBy                         = Upgrade_MenFaction Upgrade_DwarfFaction Upgrade_ElfFaction Upgrade_MordorFaction Upgrade_IsengardFaction Upgrade_WildFaction Upgrade_AngmarFaction
        CommandSet                          = NeutralFireDrakeLairCommandSet
        CustomAnimAndDuration               = AnimState:USER_2 AnimTime:0
    End



    ;/////////////////////
    ;// ARMES & ARMURES //
    ;/////////////////////
    
    ArmorSet
        Conditions                          = None
        Armor                               = RDA_GENERIC_BUILDINGS_ARMOR
    End



    ;//////////////////////
    ;// PARAMÈTRES AUDIO //
    ;//////////////////////
    
    VoiceSelect                         = CreepBuildingGenericSelect
    
    SoundOnDamaged                      = BuildingLightDamageStone
    SoundOnReallyDamaged                = BuildingHeavyDamageStone



    ;/////////////////////////////
    ;// PARAMÈTRES D'INGÉNIERIE //
    ;/////////////////////////////

    RadarPriority                       = STRUCTURE
    KindOf                              = PRELOAD STRUCTURE IMMOBILE SELECTABLE SCORE FS_FACTORY AUTO_RALLYPOINT IGNORE_FOR_VICTORY
    
    Behavior                            = GettingBuiltBehavior ModuleTag_04
        RebuildWhenDead                     = Yes
        SelfBuildingLoop                    = BuildingConstructionLoop
        SelfRepairFromDamageLoop            = NoSound
        SelfRepairFromRubbleLoop            = BuildingConstructionLoop
        DisallowRebuildRange                = 300
        DisallowRebuildFilter               = ANY +STRUCTURE
        UseSpawnTimerWithoutWorker          = Yes
        SpawnTimer                          = 300
    End
    
    Behavior                            = KeepObjectDie ModuleTag_IWantRubble
    End
    
    Behavior                            = StructureCollapseUpdate ModuleTag_Collapse
        MinCollapseDelay                    = 000
        MaxCollapseDelay                    = 000
        CollapseDamping                     = .5
        MaxShudder                          = 0.6
        MinBurstDelay                       = 250
        MaxBurstDelay                       = 800
        BigBurstFrequency                   = 4
        FXList                              = INITIAL FX_StructureMediumCollapse
        FXList                              = ALMOST_FINAL FX_StructureAlmostCollapse
        OCL                                 = INITIAL OCL_LairDrakeConversionPing
        DestroyObjectWhenDone               = Yes
        CollapseHeight                      = 120
    End
    
    Behavior                            = RebuildHoleExposeDie ModuleTag_ExposeDie
        ExemptStatus                        = SOLD
        HoleName                            = FireDrakeLairHole
        HoleMaxHealth                       = 500.0
        FadeInTimeSeconds                   = 2.0
        TransferAttackers                   = No
    End



    ;/////////////////////////
    ;// PARAMÈTRES DE SANTÉ //
    ;/////////////////////////
    
    Body                                = ActiveBody ModuleTag_Body
        MaxHealth                           = 4000
        MaxHealthDamaged                    = 2000
        MaxHealthReallyDamaged              = 1000
    End



    ;////////////////
    ;// RESSOURCES //
    ;////////////////
    
    Behavior                            = TerrainResourceBehavior ModuleTag_NewMoneyDeadSpot
        Radius                              = 80
        MaxIncome                           = 0
        IncomeInterval                      = 999999
        HighPriority                        = Yes
    End



    ;////////////////
    ;// PRODUCTION //
    ;////////////////
    
    Behavior                            = ProductionUpdate ProductionUpdateModuleTag
        NumDoorAnimations                   = 0
        DoorOpeningTime                     = 1
        DoorWaitOpenTime                    = 1
        DoorCloseTime                       = 1
        ConstructionCompleteDuration        = 7000
        GiveNoXP                            = Yes
    End
    
    Behavior                            = QueueProductionExitUpdate ModuleTag_Exit
        PlacementViewAngle                  = 10
        UnitCreatePoint                     = X:155.0   Y:30.0      Z:0.0
        NaturalRallyPoint                   = X:140.0   Y:30.0      Z:0.0
        ExitDelay                           = STANDARD_HORDE_EXIT_DELAY
    End



    ;////////////////
    ;// PATROUILLE //
    ;////////////////
    
    Behavior                            = SpawnBehavior ModuleTag_Spawn
        SpawnNumber                         = 1
        InitialBurst                        = 1
        FadeInTime                          = 1000
        SpawnTemplateName                   = FireDrake_Slaved
        SpawnReplaceDelay                   = 60000
        SpawnInsideBuilding                 = No
        CanReclaimOrphans                   = Yes
    End



    ;///////////////////////////
    ;// FAIRE DORMIR LE DRAKE //
    ;///////////////////////////
    
    Behavior                            = AttributeModifierAuraUpdate ModuleTag_SleepyTime
        StartsActive                        = Yes
        BonusName                           = SleepyTimeForFireDrakeTrigger
        RefreshDelay                        = 1000
        Range                               = 450
        TargetEnemy                         = No
        ObjectFilter                        = NONE +FireDrake_Slaved ALLIES
    End



    ;//////////////////////////
    ;// ALLÉGEANCE NATURELLE //
    ;//////////////////////////

    Behavior                            = FireWeaponUpdate ModuleTag_CreepKiller
        FireWeaponNugget
            WeaponName                          = WildAllegianceCreepKiller
            FireDelay                           = 0
            OneShot                             = No
        End
    End
    
    Behavior                            = ObjectCreationUpgrade MakeTheMoneyMaker
        TriggeredBy                         = Upgrade_WildFaction
        Delay                               = 0.0
        DestroyWhenSold                     = Yes
        ThingToSpawn                        = CreepyMoneyMaker
        FadeInTime                          = 100
    End
    
    Behavior                            = SpawnBehavior ModuleTag_SpawnDefenders
        TriggeredBy                         = Upgrade_WildFaction
        SpawnNumber                         = 18
        InitialBurst                        = 18
        SpawnTemplateName                   = GoblinFighter_Patrol GoblinArcher_Patrol MoriaPikeman_Patrol
        SpawnReplaceDelay                   = 45000
        CanReclaimOrphans                   = Yes
    End
    
    Behavior                            = ObjectCreationUpgrade ModuleTag_TheObjectCreationUpgrade
        TriggeredBy                         = Upgrade_CreepShadowInFog
        ThingToSpawn                        = FireDrakeLairShadowInFog
    End



    ;/////////////////////////////
    ;// PARAMÈTRES DE GÉOMÉTRIE //
    ;/////////////////////////////
    
    
    Geometry                            = CYLINDER
    GeometryMajorRadius                 = 50.0
    GeometryMinorRadius                 = 50.0
    GeometryHeight                      = 35
    GeometryIsSmall                     = No
    
    GeometryContactPoint                = X: 15 Y: 15 Z:20 Swoop
    GeometryContactPoint                = X:-15 Y:-15 Z:20 Swoop
    GeometryContactPoint                = X:-15 Y: 15 Z:20 Swoop
    GeometryContactPoint                = X: 15 Y:-15 Z:20 Swoop
    
    Shadow                              = SHADOW_DECAL
    BuildCompletion                     = PLACED_BY_PLAYER
End





