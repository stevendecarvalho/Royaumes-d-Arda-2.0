                AnimationName                       = IUWarg_FLYA
                AnimationMode                       = LOOP
                AnimationBlendTime                  = 10
            End
        End
        
        AnimationState                      = DYING BURNINGDEATH
            Animation
                AnimationName                       = IUWarg_DIEA
                AnimationMode                       = ONCE
                AnimationBlendTime                  = 10
            End
        End
        
        AnimationState                      = DYING SPLATTED
            Animation                           = splatted
                AnimationName                       = IUWarg_LNDA
                AnimationMode                       = ONCE
            End
        End
        
        AnimationState                      = STUNNED_FLAILING
            Animation                           = JustDie
                AnimationName                       = IUWarg_FLYA
                AnimationMode                       = LOOP
            End
        End
        
        AnimationState                      = DYING
            Animation                           = JustDie
                AnimationName                       = IUWarg_DIEA
                AnimationMode                       = ONCE
            End
        End
        
        AnimationState                      = BURNINGDEATH
            Animation
                AnimationName                       = IUWarg_MFDA
                AnimationMode                       = LOOP
                Distance                            = 50
            End
        End
        
        AnimationState                      = STUNNED
            Animation                           = Land
                AnimationName                       = IUWarg_LNDA
                AnimationMode                       = ONCE
            End
        End
        
        AnimationState                      = STUNNED_STANDING_UP
            Animation                           = StandUp
                AnimationName                       = IUWarg_GTPA
                AnimationMode                       = ONCE
            End
        End
        
        ; -------------- MOVING ANIMS ---------------
        AnimationState                      = TURN_LEFT_HIGH_SPEED
            Animation                           = MTurnLeft
                AnimationName                       = IUWarg_TNL1
                AnimationMode                       = LOOP
            End
        End
        
        AnimationState                      = TURN_RIGHT_HIGH_SPEED
            Animation                           = MTurnRight
                AnimationName                       = IUWarg_TNR1
                AnimationMode                       = LOOP
            End
        End
        
        AnimationState                      = TURN_LEFT
            Animation                           = TurnRight
                AnimationName                       = IUWarg_TRNL
                AnimationMode                       = LOOP
                AnimationSpeedFactorRange           = 2.0 2.0
            End
        End
        
        AnimationState                      = TURN_RIGHT
            Animation                           = TurnRight
                AnimationName                       = IUWarg_TRNR
                AnimationMode                       = LOOP
                AnimationSpeedFactorRange           = 2.0 2.0
            End
        End
        
        AnimationState                      = MOVING ACCELERATE
            Animation                           = Accelerate
                AnimationName                       = IUWarg_ACCL
                AnimationMode                       = ONCE
            End
            ParticleSysBone                     = None InfantryDustTrails
        End
        
        AnimationState                      = MOVING DECELERATE
            Animation                           = Decelerate
                AnimationName                       = IUWarg_DECL
                AnimationMode                       = ONCE
            End
            ParticleSysBone                     = None InfantryDustTrails
        End
        
        AnimationState                      = MOVING BACKING_UP
            Animation                           = BackingUp
                AnimationName                       = IUWarg_BAKA
                AnimationMode                       = LOOP
            End
        End
        
        AnimationState                      = MOVING
            ShareAnimation                      = Yes
            Animation                           = RunA
                AnimationName                       = IUWarg_RUNA
                AnimationMode                       = LOOP
            End
            ;ParticleSysBone			=	None CalvaryDustTrails
        End
        
        ; ----------- ATTACKING ANIMS --------------
        AnimationState                      = BETWEEN_FIRING_SHOTS_A
            Animation                           = BetweenFiringShots
                AnimationName                       = IUWarg_IDLA
                AnimationMode                       = LOOP
                AnimationBlendTime                  = 10
            End
        End
        
        AnimationState                      = FIRING_OR_PREATTACK_A
            Animation                           = AttackA3
                AnimationName                       = IUWarg_ATKA
                AnimationMode                       = ONCE
                UseWeaponTiming                     = Yes
                AnimationBlendTime                  = 10
            End
        End
        
        AnimationState                      = ATTACKING
            Animation                           = AttackA3
                AnimationName                       = IUWarg_ATKA
                AnimationMode                       = LOOP
                AnimationBlendTime                  = 10
            End
        End
        
        ; ----------- WAR CHANT ANIMS -------------
        AnimationState                      = WAR_CHANT
            Animation                           = Chant
                AnimationName                       = IUWarg_TNTA
                AnimationMode                       = LOOP
            End
        End
        
        ; ----------- EMOTION ANIMS ---------------
        AnimationState                      = EMOTION_TAUNTING
