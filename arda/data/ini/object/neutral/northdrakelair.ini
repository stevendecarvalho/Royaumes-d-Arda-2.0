    End
    
    
    
    ;/////////////////////////
    ;// PARAMÈTRES DE SANTÉ //
    ;/////////////////////////
    
    Body                                = StructureBody ModuleTag_05
        MaxHealth                           = 1
    End
    
    
    
    ;/////////////
    ;// ESCLAVE //
    ;/////////////
    
