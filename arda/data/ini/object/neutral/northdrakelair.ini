Object AotREreborGoldStackB_NorthDrakeLair
    
    ;////////////////////////////
    ;// PARAMÈTRES ARTISTIQUES //
    ;////////////////////////////

	Draw                                = W3DScriptedModelDraw ModuleTag_01
		DefaultModelConditionState
			Model                               = pegoldpileA
		End
	End



    ;/////////////////////////
    ;// PARAMÈTRES GÉNÉRAUX //
    ;/////////////////////////

    DisplayName                         = OBJECT:Prop
    Side                                = Obsolete
    EditorSorting                       = SYSTEM
    CrushableLevel                      = 0
    
    
    
    ;/////////////////////
    ;// ARMES & ARMURES //
    ;/////////////////////
    
    WeaponSet
        Conditions                          = None
    End
    
    ArmorSet
        Conditions                          = None
        Armor                               = NoArmor
    End
    
    
    
    ;//////////////////////
    ;// PARAMÈTRES AUDIO //
    ;//////////////////////
    
