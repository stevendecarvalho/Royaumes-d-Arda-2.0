Object RowdyTubDwarfLair
    SelectPortrait                      = BPDwarf_Well
    
    ;////////////////////////////
    ;// PARAMÈTRES ARTISTIQUES //
    ;////////////////////////////
    
    Draw                                = W3DScriptedModelDraw ModuleTag_Draw
        OkToChangeModelColor                = Yes
        UseStandardModelNames               = Yes
        StaticModelLODMode                  = Yes

        DefaultModelConditionState
            Model                               = DBHearth
            ParticleSysBone                     = NONE EnshroudingMist03
        End
        
        IdleAnimationState
            BeginScript
                Prev                                = CurDrawablePrevAnimationState()
                if Prev                             = = "BeingConstructed" then
                    if not CurDrawableModelcondition( "DYING" ) then
                        CurDrawablePlaySound("TDH_DwarfEVA_BuiltWell")
                    end
                end
            EndScript
        End
        
        ;// Modèle : En attente de construction
        ModelConditionState                 = AWAITING_CONSTRUCTION
            Model                               = DBHearth_A
        End
        AnimationState                      = AWAITING_CONSTRUCTION
            Animation                           = DBHearth_A
                AnimationName                       = DBHearth_A.DBHearth_A
                AnimationMode                       = MANUAL
                AnimationBlendTime                  = 0
            End
            Flags                               = START_FRAME_FIRST
        End
        ModelConditionState                 = ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
            Model                               = DBHearth_A
            ParticleSysBone                     = CONSTDUSTBONE01 BuildingContructDust FollowBone:Yes
        End
        AnimationState                      = ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
            Animation                           = DBHearth_A
                AnimationName                       = DBHearth_A.DBHearth_A
                AnimationMode                       = MANUAL
                AnimationBlendTime                  = 0
            End
            Flags                               = START_FRAME_FIRST
            StateName                           = BeingConstructed
            BeginScript
                CurDrawablePlaySound("GondorBarracksBeginConstruction")
            EndScript
        End
        
        ;// Modèle : Endommagé
        ModelConditionState                 = DAMAGED
            Model                               = DBHearth_D1
            ParticleSysBone                     = dwarfHearth_SPARKS FireBuildingLarge
            ParticleSysBone                     = NONE EnshroudingMist03
        End
        AnimationState                      = DAMAGED
            EnteringStateFX                     = FX_BuildingReallyDamaged
        End
        
        ;// Modèle : Très endommagé
        ModelConditionState                 = REALLYDAMAGED
            Model                               = DBHearth_D2
            ParticleSysBone                     = dwarfHearth_SPARKS FireBuildingLarge
            ParticleSysBone                     = NONE EnshroudingMist03
        End
        AnimationState                      = REALLYDAMAGED
            EnteringStateFX                     = FX_BuildingReallyDamaged
            Animation                           = RubbleAnimation
                AnimationName                       = DBHearth_D2.DBHearth_D2
                AnimationMode                       = ONCE
            End
        End
        
        ;// Modèle : Décombres
        ModelConditionState                 = RUBBLE
            Model                               = DBHearth_D3
            ParticleSysBone                     = NONE EnshroudingMist03
        End
        AnimationState                      = RUBBLE
            EnteringStateFX                     = FX_BuildingReallyDamaged
            Animation                           = RubbleAnimation
                AnimationName                       = DBHearth_D3.DBHearth_D3
                AnimationMode                       = ONCE
            End
        End
        ModelConditionState                 = POST_RUBBLE
            Model                               = None
            ParticleSysBone                     NONE SmokeBuildingMediumRubble
        End
        ModelConditionState                 = POST_COLLAPSE
            Model                               = None
            ParticleSysBone                     NONE SmokeBuildingMediumRubble
        End
    End



    ;/////////////////////////
    ;// PARAMÈTRES GÉNÉRAUX //
    ;/////////////////////////

    DisplayName                         = OBJECT:RowdyTubDwarfLair
    Description                         = OBJECT:RowdyTubDwarfLairDescription
    PlacementViewAngle                  = 0

    BuildTime                           = 30
    VisionRange                         = 160.0                                         ;// Distance pour voir les ennemis
    ShroudClearingRange                 = 160.0                                         ;// Rayon qui dévoile le brouillard

    Side                                = Neutral
    IsTrainable                         = No
    EditorSorting                       = STRUCTURE
    IsTrainable                         = No
    ThreatLevel                         = 1                                             ;// Niveau de menace de l'unité pour l'IA

    CommandSet                          = EmptyCommandSet



    ;/////////////////////
    ;// ARMES & ARMURES //
    ;/////////////////////
    
    ArmorSet
        Conditions                          = None
        Armor                               = RDA_GENERIC_BUILDINGS_ARMOR
    End



    ;//////////////////////
    ;// PARAMÈTRES AUDIO //
    ;//////////////////////

    VoiceSelect                         = GondorWellSelect

    SoundOnDamaged                      = BuildingLightDamageStone
    SoundOnReallyDamaged                = BuildingHeavyDamageStone
    SoundAmbient                        = WaterFountain1AmbientLoop

    VoiceSelectUnderConstruction        = BuildingGoodVoiceSelectUnderConstruction

    UnitSpecificSounds
        UnderConstruction                   = BuildingConstructionLoop
        UnderRepairFromRubble               = BuildingConstructionLoop
    End



    ;/////////////////////////////
    ;// PARAMÈTRES D'INGÉNIERIE //
    ;/////////////////////////////

    RadarPriority                       = STRUCTURE
    KindOf                              = PRELOAD STRUCTURE SELECTABLE IMMOBILE SCORE NEED_BASE_FOUNDATION MP_COUNT_FOR_VICTORY MADE_OF_STONE

    Behavior                            = GettingBuiltBehavior GetBuiltBehaviorTag
        RebuildWhenDead                     = Yes
        SelfBuildingLoop                    = BuildingConstructionLoop
        SelfRepairFromDamageLoop            = NoSound
        SelfRepairFromRubbleLoop            = BuildingConstructionLoop
        DisallowRebuildRange                = 300
        DisallowRebuildFilter               = ANY +STRUCTURE
        UseSpawnTimerWithoutWorker          = Yes
    End

    Behavior                            = CastleMemberBehavior ModuleTag_CMB
    End

    Behavior                            = KeepObjectDie ModuleTag_IWantRubble
    End

    Behavior                            = StructureCollapseUpdate ModuleTag_StructureCollapseUpdate
        MinCollapseDelay                    = 000
        MaxCollapseDelay                    = 000
        CollapseDamping                     = .5
        MaxShudder                          = 0.6
        MinBurstDelay                       = 250
        MaxBurstDelay                       = 800
        BigBurstFrequency                   = 4
        FXList                              = INITIAL FX_StructureMediumCollapse
        FXList                              = ALMOST_FINAL FX_StructureAlmostCollapse
        DestroyObjectWhenDone               = Yes
        CollapseHeight                      = 120
    End

    Behavior                            = RebuildHoleExposeDie ModuleTag_ExposeDie
        ExemptStatus                        = SOLD
        HoleName                            = RowdyTubDwarfHole
        HoleMaxHealth                       = 500.0
        FadeInTimeSeconds                   = 2.0
        TransferAttackers                   = No
    End



    ;/////////////////////////
    ;// PARAMÈTRES DE SANTÉ //
    ;/////////////////////////
    
    Body                                = ActiveBody ModuleTag_Body
        MaxHealth                           = 2000
        MaxHealthDamaged                    = 1000
        MaxHealthReallyDamaged              = 500
    End



    ;////////////////
    ;// RESSOURCES //
    ;////////////////
    
    Behavior                            = TerrainResourceBehavior ModuleTag_NewMoneyDeadSpot
        Radius                              = 80
        MaxIncome                           = 0
        IncomeInterval                      = 999999
        HighPriority                        = Yes
    End



    ;////////////////
    ;// PRODUCTION //
    ;////////////////


    Behavior                            = QueueProductionExitUpdate ModuleTag_11
        UnitCreatePoint                     = X:0.0 Y:-20.0 Z:0.0
        NaturalRallyPoint                   = X:28.8 Y:-80.0 Z:0.0
        ExitDelay                           = STANDARD_HORDE_EXIT_DELAY
    End



    ;////////////////
    ;// PATROUILLE //
    ;////////////////

    Behavior                            = SpawnBehavior ModuleTag_SpawnFighters
        SpawnNumber                         = 10
        InitialBurst                        = 10
        SpawnTemplateName                   = RowdyTubDwarf_Patrol
        SpawnReplaceDelay                   = 30000
        CanReclaimOrphans                   = Yes
    End



    ;//////////////////////////
    ;// ALLÉGEANCE NATURELLE //
    ;//////////////////////////

    Behavior                            = ObjectCreationUpgrade ModuleTag_TheObjectCreationUpgrade
        TriggeredBy                         = Upgrade_CreepShadowInFog
        ThingToSpawn                        = RowdyTubDwarfLairShadowInFog
    End



    ;/////////////////////////////
    ;// PARAMÈTRES DE GÉOMÉTRIE //
    ;/////////////////////////////

    Geometry                            = BOX
    GeometryMajorRadius                 = 17
    GeometryMinorRadius                 = 39
    GeometryHeight                      = 25
    GeometryOffset                      = X:1.8 Y:0.9 Z:0


    AdditionalGeometry                  = BOX
    GeometryName                        = Geom_Orig
    GeometryMajorRadius                 = 39
    GeometryMinorRadius                 = 25
    GeometryHeight                      = 25
    GeometryOffset                      = X:0.47 Y:1.9 Z:0

    GeometryIsSmall                     = No
    Shadow                              = SHADOW_VOLUME
    BuildCompletion                     = PLACED_BY_PLAYER

    GeometryContactPoint                = X:1.8 Y:-38 Z:0 Grab
    GeometryContactPoint                = X:1.8 Y:41 Z:3
    GeometryContactPoint                = X:0 Y:0 Z:25 Swoop
    GeometryContactPoint                = X:-38 Y:0.24 Z:3
    GeometryContactPoint                = X:41 Y:0.24 Z:3
End





Object RowdyTubDwarfLairShadowInFog
    
    ;////////////////////////////
