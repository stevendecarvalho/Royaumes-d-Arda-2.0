Object BarrowWight
    SelectPortrait                      = UPBarrowWightCreep
    ButtonImage                         = UIMordorWightsunused
    
    ;////////////////////////////
    ;// PARAMÈTRES ARTISTIQUES //
    ;////////////////////////////
    
    Draw                                = W3DScriptedModelDraw ModuleTag_Draw
        OkToChangeModelColor                = Yes
        GlowEnabled                         = Yes
        GlowEmissive                        = No

        DefaultModelConditionState
            Model                               = mubwight_skn
            Skeleton                            = KUKarsh_SKL
            ParticleSysBone                     = NONE WTrails02 FollowBone:no
            ParticleSysBone                     = None RingWraithFlare
            ParticleSysBone                     = None RingWraithWindIdle
        End
		
		;// Animations : Chutes
        AnimationState                      = FREEFALL
            Animation                           = FLYA
                AnimationName                       = KUKarsh_FLYA
                AnimationMode                       = LOOP
                AnimationBlendTime                  = 5
            End
        End
		
		;// Animations : Attaques
        AnimationState                      = FIRING_OR_PREATTACK_A
            Animation                           = ATKA
                AnimationName                       = KUKarsh_ATKA
                AnimationMode                       = ONCE
                UseWeaponTiming                     = Yes
            End
            Animation                           = ATKB
                AnimationName                       = KUKarsh_ATKB
                AnimationMode                       = ONCE
                UseWeaponTiming                     = Yes
            End
            Animation                           = ATKC
                AnimationName                       = KUKarsh_ATKC
                AnimationMode                       = ONCE
                UseWeaponTiming                     = Yes
            End
            StateName                           = Attack
        End
		
		;// Animations : Déplacements
        AnimationState                      = MOVING
            Animation                           = RUNA
                AnimationName                       = KUKarsh_RUNA
                AnimationMode                       = LOOP
            End
            Flags                               = RANDOMSTART
        End
		
		;// Animations : Attaques
        AnimationState                      = SPECIAL_WEAPON_ONE
            Animation                           = Whisper
                AnimationName                       = KUKarsh_SPCA
                AnimationMode                       = ONCE
            End
        End
        AnimationState                      = SPLATTED
            Animation                           = LNDA
                AnimationName                       = KUKarsh_LNDA
                AnimationMode                       = ONCE
            End
        End
		
		;// Animations : Morts
        AnimationState                      = DYING DEATH_3
            Animation                           = GUBoromir_DTHA
                AnimationName                       = KUKarsh_IDLB
                AnimationMode                       = ONCE
            End
        End
        AnimationState                      = DYING
            Animation
                AnimationName                       = KUKarsh_DTHA
                AnimationMode                       = ONCE
                AnimationPriority                   = 1
            End
            
            Animation
                AnimationName                       = KUKarsh_DTHB
                AnimationMode                       = ONCE
                AnimationPriority                   = 1
            End
        End
        
		;// Animations : Paralysies
        AnimationState                      = STUNNED_STANDING_UP
            Animation                           = GTPA
                AnimationName                       = KUKarsh_GTPA
                AnimationMode                       = ONCE
            End
        End
        
        AnimationState                      = STUNNED
            Animation                           = LNDA
                AnimationName                       = KUKarsh_LNDA
                AnimationMode                       = ONCE
            End
        End
		
		;// Animations : Émotions
        AnimationState                      = EMOTION_ALERT
            Animation                           = ALERT_1
                AnimationName                       = KUKarsh_IDLA
                AnimationMode                       = LOOP
            End
        End
		
		;// Transitions
        TransitionState                     = TRANS_Idle_to_Selected
            Animation                           = ATNA
                AnimationName                       = KUKarsh_ATNA
                AnimationMode                       = ONCE
            End
        End
        TransitionState                     = TRANS_Selected_To_Idle
            Animation                           = ATNC
                AnimationName                       = KUKarsh_ATNC
                AnimationMode                       = ONCE
            End
        End
		
		;// Animations : Émotions
        AnimationState                      = LEVELED
            Animation                           = LevelUp
                AnimationName                       = KUKarsh_CHRA
                AnimationMode                       = ONCE
            End
        End
        AnimationState                      = RAISING_FLAG
            ShareAnimation                      = Yes
            Animation                           = CHRA
                AnimationName                       = KUKarsh_CHRA
                AnimationMode                       = ONCE
                AnimationSpeedFactorRange           = 0.9 1.1
            End
            Animation                           = CHRB
                AnimationName                       = KUKarsh_CHRB
                AnimationMode                       = ONCE
                AnimationSpeedFactorRange           = 0.9 1.1
            End
            Flags                               = RESTART_ANIM_WHEN_COMPLETE
        End
        AnimationState                      = SELECTED
            StateName                           = Selected
            SimilarRestart                      = Yes
            Animation                           = ATNB
                AnimationName                       = KUKarsh_ATNB
                AnimationMode                       = LOOP
            End
            BeginScript
                Prev                                = CurDrawablePrevAnimationState()
                if Prev                             = = "Idle" then CurDrawableSetTransitionAnimState("TRANS_Idle_to_Selected") end
            EndScript
        End
        AnimationState                      = HIT_REACTION HIT_LEVEL_1
            Animation                           = Hit_Level_1_a
                AnimationName                       = KUKarsh_HITA
                AnimationMode                       = ONCE
            End
        End
        AnimationState                      = EMOTION_TAUNTING
            Animation                           = TNTA
                AnimationName                       = KUKarsh_TNTA
                AnimationMode                       = LOOP
            End
        End
        AnimationState                      = EMOTION_CELEBRATING
            Animation                           = CHRA
                AnimationName                       = KUKarsh_CHRA
                AnimationMode                       = ONCE
            End
        End
        
        IdleAnimationState
            StateName                           = Idle
            Animation
                AnimationName                       = KUKarsh_IDLB
                AnimationPriority                   = 4
                AnimationBlendTime                  = 15
                AnimationMode                       = ONCE
            End
            Animation
                AnimationName                       = KUKarsh_IDLC
                AnimationPriority                   = 1
                AnimationBlendTime                  = 15
                AnimationMode                       = ONCE
            End
            Animation
                AnimationName                       = KUKarsh_IDLD
                AnimationPriority                   = 1
                AnimationBlendTime                  = 15
                AnimationMode                       = ONCE
            End
            Flags                               = RESTART_ANIM_WHEN_COMPLETE
            BeginScript
                Prev                                = CurDrawablePrevAnimationState()
                if Prev                             = = "STATE_Selected" then CurDrawableSetTransitionAnimState("TRANS_Selected_to_Idle") end
            EndScript
        End
    End



    ;/////////////////////////
    ;// PARAMÈTRES GÉNÉRAUX //
    ;/////////////////////////

    DisplayName                         = OBJECT:BarrowWight
    PlacementViewAngle                  = -90

    BuildCost                           = RDA_NEUTRAL_BARROWWIGHT_BUILDCOST
    BuildTime                           = ELITE_UNIT_BUILDTIME
    VisionRange                         = GENERIC_ELITE_VISION                          ;// Distance pour voir les ennemis
    ShroudClearingRange                 = GENERIC_SHROUD_CLEAR_BARROWWIGHT              ;// Rayon qui dévoile le brouillard
    ;VisionSide                          = GENERIC_UNIT_VISIONSIDE                      ;// Vision sur le côté
    ;VisionRear                          = GENERIC_UNIT_VISIONREAR                      ;// Vision derrière
    ;MaxVisionBonusPercent               = GENERIC_UNIT_MAXVISION%                      ;// Empêche la vision de devenir infinie
    ;VisionBonusTestRadius               = GENERIC_UNIT_VISIONBONUS                     ;// Vision bonus sur les collines
    ;VisionBonusPercentPerFoot           = GENERIC_UNIT_VISIONBONUSPERCENT              ;// Bonus de vision par unité en hauteur
    ShockwaveResistance                 = GENERIC_SHOCKWAVE_RESISTANCE_STRONG           ;// Résistance au choc
    BountyValue                         = RDA_NEUTRAL_BARROWWIGHT_BOUNTY_VALUE          ;// Remboursement

    Side                                = Neutral
    EditorSorting                       = UNIT
    ThreatLevel                         = 1                                             ;// Niveau de menace de l'unité pour l'IA
    ;ThingClass                         = HORDE_UNIT

    CrushableLevel                      = 2               ;// Est écrasé   - 0 : Infanterie / 1 : Arbres / 2 : Cavalerie / 3:Lourd
    CrusherLevel                        = 0               ;// Peut écraser - 0 : Animaux / 1 : Infanterie / 2 : Arbres / 3 : Cav
	;UseCrushAttack			            = No				            ;// N'attaque pas en écrasant, écrase juste en marchant
    ;CrushWeapon                        =                               ;// Arme utilisé pour le piétinement
    ;CrushOnlyWhileCharging             = Yes                           ;// Le piétinement ne marche que pendant une charge
    ;MinCrushVelocityPercent            = 50%                           ;// Vitesse minimale pour écraser
    ;CrushDecelerationPercent           = 5                             ;// Perte de vitesse quand elle piétine
    ;CrushKnockback                     = 40                            ;// Valeur haute 50, plus les unités sont projetées loin
    ;CrushZFactor                       = 1.0                           ;// 0 = vol au sol / 1 = projection / >1 = spectaculaire
    ;CrushRevengeWeapon                  = RangedInfantryCrushRevenge   ;// Dégâts qu'inflige l'unité lorsqu'elle se fait écrasée
    ;RamPower                           = 20                            ;// Puissance de collision des monstres sur les structures
    ;RamZMult                           = 0.5                           ;// Soulèvement lors du choc, valeur haute soulève
    TransportSlotCount                  = TRANSPORTSLOTCOUNT_UNIT

    CommandPoints                       = GENERIC_ELITE_10_UNIT
    CommandSet                          = CreepCommandSet



    ;/////////////////////
    ;// ARMES & ARMURES //
    ;/////////////////////
    
    WeaponSet
        Conditions                          = None
        Weapon                              = PRIMARY BarrowWightTouch
        AutoChooseSources                   = PRIMARY FROM_PLAYER FROM_SCRIPT FROM_AI
    End
    
    ArmorSet
        Conditions                          = None
        Armor                               = RDA_UNDEAD_UNITS_ARMOR
        DamageFX                            = NormalDamageFX
    End



    ;//////////////////////
    ;// PARAMÈTRES AUDIO //
    ;//////////////////////
    
    #include "..\includes\StandardUnitEvaEvents.inc"
    
    VoiceAttack                         = BarrowWightVoxAttack
    VoiceGuard                          = BarrowWightVoxAttack
    VoiceCreated                        = EVA:BarrowWightCreated
    VoiceCreated                        = +SOUND:BarrowWightVoxCreated
    VoiceFullyCreated                   = EVA:BarrowWightCreated
    VoiceFullyCreated                   = +SOUND:BarrowWightVoxCreated
    VoiceMove                           = BarrowWightVoxSelect
    VoicePriority                       = 15
    VoiceSelect                         = BarrowWightVoxSelect
    
    SoundAmbient                        = BarrowWightAmbienceMS
    SoundImpact                         = ImpactHorse
    
    UnitSpecificSounds
        VoiceGarrison                       = BarrowWightVoxSelect
        VoiceEnterUnitElvenTransportShip    = BarrowWightVoxSelect
        VoiceEnterUnitEvilMenTransportShip  = BarrowWightVoxSelect
        VoiceEnterUnitMordorMumakil         = BarrowWightVoxSelect
        VoiceEnterUnitSlaughterHouse        = BarrowWightVoxSelect
        VoiceInitiateCaptureBuilding        = BarrowWightVoxSelect
    End



    ;/////////////////////////////
    ;// PARAMÈTRES D'INGÉNIERIE //
    ;/////////////////////////////
    
    RadarPriority                       = UNIT
    KindOf                              = PRELOAD MONSTER SCORE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT ENVIRONMENT SELECTABLE SCARY
    
    Behavior                            = PhysicsBehavior ModuleTag_04
        GravityMult                         = 1.0
    End
    
    Behavior                            = SquishCollide ModuleTag_06
    End



    ;/////////////////////
    ;// INSPIRE LA PEUR //
    ;/////////////////////
    
    Behavior                            = RadiateFearUpdate ModuleTag_GoldenArrowDaylightUpdate
        EmotionPulseRadius                  = 200
        EmotionPulseInterval                = 1000
        GenerateFear                        = Yes
        InitiallyActive                     = Yes
        VictimFilter                        = ALL ENEMIES
    End



    ;/////////////////////////
    ;// PARAMÈTRES DE SANTÉ //
    ;/////////////////////////
    
    Body                                = ActiveBody ModuleTag_Body
        MaxHealth                           = RDA_NEUTRAL_BARROWWIGHT_HEALTH
    End



    ;/////////////
    ;// STANCES //
    ;/////////////
    
    Behavior                            = StancesBehavior ModuleTag_StancesBehavior
        StanceTemplate                      = FighterHorde
    End



    ;///////////////////////////////
    ;// INTELLIGENCE ARTIFICIELLE //
    ;///////////////////////////////
    
    Behavior                            = AIUpdateInterface ModuleTag_03
        AutoAcquireEnemiesWhenIdle          = Yes
        MoodAttackCheckRate                 = 500
        MaxCowerTime                        = 7500
        MinCowerTime                        = 5000
        AILuaEventsList                     = BarrowWightFunctions
    End



    ;//////////////
    ;// ÉMOTIONS //
    ;//////////////
    
    Behavior                            = EmotionTrackerUpdate Module_EmotionTracker
        AddEmotion                          = Terror_Base
        AlwaysAfraidOf                      = NONE +CloudBreakSunbeam +SunflareSunbeam
        AddEmotion                          = Alert_Base
        IgnoreVeterancy                     = Yes
    End



    ;///////////////
    ;// LOCOMOTOR //
    ;///////////////
    
    LocomotorSet
        Locomotor                           = BarrowWightLocomotor
        Condition                           = SET_NORMAL
        Speed                               = 50
    End



    ;////////////////
    ;// MORT LENTE //
    ;////////////////
    
    Behavior                            = SlowDeathBehavior ModuleTag_05
        DeathTypes                          = ALL -FADED
        SinkDelay                           = 0
        SinkRate                            = -2.0
        DestructionDelay                    = 3000
        FX                                  = INITIAL FX_SmallSpiderDie
        Sound                               = INITIAL BarrowWightVoxDie
    End



    ;/////////////////////////////
    ;// PARAMÈTRES DE GÉOMÉTRIE //
    ;/////////////////////////////
    
    Geometry                            = CYLINDER
    GeometryMajorRadius                 = 10.0
    GeometryHeight                      = 30.0
    GeometryIsSmall                     = No
    
    Shadow                              = SHADOW_VOLUME
    Shadow                              = SHADOW_DECAL
    ShadowSizeX                         = 55
    ShadowSizeY                         = 30
    ShadowOffsetX                       = -8
    ShadowTexture                       = ShadowI
End





ChildObject BarrowWight_Slaved BarrowWight
    EditorSorting                       = SYSTEM

    ;//////////////////////
    ;// PARAMÈTRES AUDIO //
    ;//////////////////////
    
    EvaEnemyObjectSightedEvent          = BarrowWightsSighted
    EvaEnemyObjectSightedAfterRespawnEvent = BarrowWightsSighted



    ;/////////////////////////////
    ;// PARAMÈTRES D'INGÉNIERIE //
    ;/////////////////////////////

    KindOf                              = PRELOAD SCORE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT SELECTABLE PATH_THROUGH_EACH_OTHER SCARY MONSTER CREEP



    ;///////////////
    ;// LOCOMOTOR //
    ;///////////////
    
    LocomotorSet
        Locomotor                           = LairWightLocomotor
        Condition                           = SET_NORMAL
        Speed                               = 25
    End



    ;/////////////
    ;// ESCLAVE //
    ;/////////////
    
    Behavior                            = SlavedUpdate ModuleTag_Slave
        GuardMaxRange                       = 250.0
        GuardWanderRange                    = 75.0
        UseSlaverAsControlForEvaObjectSightedEvents = Yes
    End



    ;/////////////////
    ;// COMPÉTENCES //
    ;/////////////////
    
    Behavior                            = DoCommandUpgrade ModuleTag_CrushLevelHackTrigger
        TriggeredBy                         = Upgrade_MenFaction Upgrade_DwarfFaction Upgrade_ElfFaction Upgrade_ArnorFaction Upgrade_MordorFaction Upgrade_IsengardFaction Upgrade_WildFaction Upgrade_AngmarFaction
        GetUpgradeCommandButtonName         = Command_ToggleMountedCaveTrollHack
    End
    
    Behavior                            = SpecialPowerModule ModuleTag_CrushLevelHackStarter
        SpecialPowerTemplate                = SpecialAbilityToggleMounted
        UpdateModuleStartsAttack            = Yes
        StartsPaused                        = No
    End
    
    Behavior                            = ToggleMountedSpecialAbilityUpdate ModuleTag_CrushLevelHackUpdate
        SpecialPowerTemplate                = SpecialAbilityToggleMounted
        MountedTemplate                     = BarrowWight
        UnpackTime                          = 0
        PreparationTime                     = 1
        PackTime                            = 0
        OpacityTarget                       = 1
        IgnoreFacingCheck                   = Yes
    End
End





