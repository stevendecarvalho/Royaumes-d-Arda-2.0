Object GiantSpiderLair
    Scale                               = 1.4
    SelectPortrait                      = BPCSpiderLair
    
    ;////////////////////////////
    ;// PARAMÈTRES ARTISTIQUES //
    ;////////////////////////////

    Draw                                = W3DScriptedModelDraw ModuleTag_Draw
        OkToChangeModelColor                = Yes
        UseStandardModelNames               = Yes
        StaticModelLODMode                  = Yes
        
        DefaultModelConditionState
            Model                               = kbwolflair
        End
        
        IdleAnimationState
            StateName                           = STATE_Idle
            Animation                           = kbwolflair
                AnimationName                       = kbwolflair.kbwolflair
                AnimationPriority                   = 30
            End
        End
        
        ;// Modèle : En attente de construction
        ModelConditionState                 = AWAITING_CONSTRUCTION SNOW
            Model                               = kbwolflair_A
            Texture                             = kbwolflair.tga kbwolflair_snow.tga
            Texture                             = ptreegladdenfields01.tga ptreegladdenfields_snow.tga
            Texture                             = ptreegladdenfields02.tga ptreegladdenfields_snow.tga
        End
        ModelConditionState                 = AWAITING_CONSTRUCTION
            Model                               = kbwolflair_A
        End
        AnimationState                      = AWAITING_CONSTRUCTION
            Animation                           = kbwolflair_A
                AnimationName                       = kbwolflair_A.kbwolflair_A
                AnimationMode                       = MANUAL
                AnimationBlendTime                  = 0
            End
            Flags                               = START_FRAME_FIRST
        End
        ModelConditionState                 = ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED SNOW
            Model                               = kbwolflair_A
            Texture                             = kbwolflair.tga kbwolflair_snow.tga
            Texture                             = ptreegladdenfields01.tga ptreegladdenfields_snow.tga
            Texture                             = ptreegladdenfields02.tga ptreegladdenfields_snow.tga
        End
        ModelConditionState                 = ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
            Model                               = kbwolflair_A
        End
        AnimationState                      = ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
            Animation                           = kbwolflair_A
                AnimationName                       = kbwolflair_A.kbwolflair_A
                AnimationMode                       = MANUAL
                AnimationBlendTime                  = 0
            End
            Flags                               = START_FRAME_FIRST
            StateName                           = BeingConstructed
            BeginScript
                CurDrawablePlaySound("GondorBarracksBeginConstruction")
            EndScript
        End
        
        ;// Modèle : Endommagé
        ModelConditionState                 = DAMAGED
            Model                               = kbwolflair
            Texture                             = kbwolflair.tga kbwolflair_d.tga
        End
        AnimationState                      = DAMAGED
            EnteringStateFX                     = FX_BuildingDamaged
        End
        
        ;// Modèle : Très endommagé   
        ModelConditionState                 = REALLYDAMAGED
            Model                               = kbwolflair
            Texture                             = kbwolflair.tga kbwolflair_d.tga
        End
        AnimationState                      = REALLYDAMAGED
            EnteringStateFX                     = FX_BuildingReallyDamaged
            Animation                           = RubbleAnimation
                AnimationName                       = kbwolflair.kbwolflair
                AnimationMode                       = ONCE
            End
        End
        
        ;// Modèle : Décombres
        ModelConditionState                 = RUBBLE
            Model                               = kbwolflair
            Texture                             = kbwolflair.tga kbwolflair_d.tga
        End
        AnimationState                      = RUBBLE
            Animation                           = RubbleAnimation
                AnimationName                       = kbwolflair.kbwolflair
                AnimationMode                       = ONCE
            End
            EnteringStateFX                     = FX_StructureMediumCollapse
        End
        ModelConditionState                 = POST_RUBBLE
            Model                               = None
            ParticleSysBone                     NONE SmokeBuildingMediumRubble
        End
        ModelConditionState                 = POST_COLLAPSE
            Model                               = None
            ParticleSysBone                     NONE SmokeBuildingMediumRubble
        End
        
        ;// Modèle : Enneigé
        ModelConditionState                 = SNOW
            Model                               = kbwolflair
            Texture                             = kbwolflair.tga kbwolflair_snow.tga
            Texture                             = ptreegladdenfields01.tga ptreegladdenfields_snow.tga
            Texture                             = ptreegladdenfields02.tga ptreegladdenfields_snow.tga
        End
    End
    
    ;// Modèle : Sol
    Draw                                = W3DFloorDraw ModuleTag_DrawFloor
        StaticModelLODMode                  = Yes
        ModelName                           = kbwolflair_bib
        WeatherTexture                      = SNOWY kbwolflair_bib_snow.tga
        HideIfModelConditions               = AWAITING_CONSTRUCTION
        HideIfModelConditions               = PARTIALLY_CONSTRUCTED
    End
    
    ;// Modèle : Allégeance naturelle
    Draw                                = W3DScriptedModelDraw UntamedAllegianceFX
        DefaultModelConditionState
            Model                               = None
        End
        AnimationState                      = USER_2
            ParticleSysBone                     = None UntamedAllegiance HouseColor:Yes
            ParticleSysBone                     = None UntamedAllegiance2 HouseColor:Yes
        End
    End



    ;/////////////////////////
    ;// PARAMÈTRES GÉNÉRAUX //
    ;/////////////////////////

    DisplayName                         = OBJECT:GiantSpiderLair
    Description                         = OBJECT:GiantSpiderLairDescription
    PlacementViewAngle                  = 90

    BuildTime                           = 30
