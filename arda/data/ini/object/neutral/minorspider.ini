Object MinorSpider
    SelectPortrait                      = UPSpiderlingCreep
    
    ;////////////////////////////
    ;// PARAMÈTRES ARTISTIQUES //
    ;////////////////////////////
    
    Draw                                = W3DScriptedModelDraw ModuleTag_01
        OkToChangeModelColor                = Yes

        DefaultModelConditionState
            Model                               = MUGntSpdr_SKN
            Skeleton                            = MUGntSpdr_SKL
        End
        
        IdleAnimationState
            Animation                           = IDLA
                AnimationName                       = MUGntSpdr_IDLA
                AnimationMode                       = ONCE
            End
            Flags                               = RANDOMSTART
        End
		
		;// Animations : Morts
        AnimationState                      = DYING BURNINGDEATH
            Animation
                AnimationName                       = MUGntSpdr_DIEA
                AnimationMode                       = ONCE
                AnimationBlendTime                  = 10
            End
        End
        AnimationState                      = DYING
            Animation                           = DIEA
                AnimationName                       = MUGntSpdr_DIEA
                AnimationMode                       = ONCE
            End
        End
        AnimationState                      = BURNINGDEATH
            Animation
                AnimationName                       = MUGntSpdr_MFDA
                AnimationMode                       = LOOP
                Distance                            = 40
            End
        End
		
		;// Animations : Paralysies
        AnimationState                      = PARALYZED
            Animation
                AnimationName                       = MUGntSpdr_IDLA
                AnimationMode                       = LOOP
            End
        End
		
		;// Animations : Attaques
        AnimationState                      = FIRING_OR_PREATTACK_A
            Animation                           = ATKA
                AnimationName                       = MUGntSpdr_ATKA
                AnimationMode                       = ONCE
                AnimationSpeedFactorRange           = 0.8 1.25
            End
        End
		
		;// Animations : Escalade
        AnimationState                      = CLIMBING
            StateName                           = STATE_Climbing
            Animation                           = Climbing
                AnimationName                       = MUGNTSPDR_WALB
                AnimationMode                       = LOOP
                AnimationBlendTime                  = 10
            End
            BeginScript
                Prev                                = CurDrawablePrevAnimationState()
                if Prev                             = = "STATE_Running" then CurDrawableSetTransitionAnimState("Trans_RunningToClimbing") return end
            EndScript
        End
        TransitionState                     = Trans_RunningToClimbing
            Animation                           = Transition
                AnimationName                       = MUGNTSPDR_WALA
                AnimationMode                       = ONCE
            End
        End
        AnimationState                      = RAPPELLING
            StateName                           = STATE_Rappelling
            Animation                           = Rapelling
                AnimationName                       = MUGNTSPDR_WALD
                AnimationMode                       = LOOP
                AnimationBlendTime                  = 10
            End
            BeginScript
                Prev                                = CurDrawablePrevAnimationState()
                if Prev                             = = "STATE_Running" then CurDrawableSetTransitionAnimState("Trans_RunningToRappelling") return end
            EndScript
        End
        TransitionState                     = Trans_RunningToRappelling
            Animation                           = Transition
                AnimationName                       = MUGNTSPDR_WALG
                AnimationMode                       = ONCE
            End
        End
        TransitionState                     = Trans_ClimbingToRunning
            Animation                           = Transition
                AnimationName                       = MUGNTSPDR_WALF
                AnimationMode                       = ONCE
            End
        End
        TransitionState                     = Trans_RappellingToRunning
            Animation                           = Transition
                AnimationName                       = MUGNTSPDR_WALE
                AnimationMode                       = ONCE
            End
        End
		
		;// Animations : Déplacements
        AnimationState                      = TURN_LEFT
            StateName                           = Turn
            Animation                           = Walk
                AnimationName                       = MUGntSpdr_TRNL
                AnimationMode                       = LOOP
            End
        End
        AnimationState                      = TURN_RIGHT
            StateName                           = Turn
            Animation                           = Walk
                AnimationName                       = MUGntSpdr_TRNR
                AnimationMode                       = LOOP
            End
        End
        AnimationState                      = MOVING
            Animation                           = RUNA
                AnimationName                       = MUGntSpdr_RUNA
                AnimationMode                       = LOOP
            End
            BeginScript
                Prev                                = CurDrawablePrevAnimationState()
                if Prev                             = = "STATE_Climbing" then CurDrawableSetTransitionAnimState("Trans_ClimbingToRunning") return end
                if Prev                             = = "STATE_Rappelling" then CurDrawableSetTransitionAnimState("Trans_RappellingToRunning") return end
            EndScript
        End
        AnimationState                      = MOVING BACKING_UP
            Animation                           = BAKA
                AnimationName                       = MUGntSpdr_BAKA
                AnimationMode                       = LOOP
            End
            Flags                               = RANDOMSTART
        End
		
		;// Animations : Morts dans les airs
        AnimationState                      = STUNNED_FLAILING
            Animation                           = StunFlail
                AnimationName                       = MUGntSpdr_FLYA
                AnimationMode                       = LOOP
            End
            Flags                               = RANDOMSTART
        End
		
		;// Animations : Paralysies
        AnimationState                      = STUNNED
            Animation                           = Stun
                AnimationName                       = MUGntSpdr_LNDA
                AnimationMode                       = ONCE
            End
        End
        AnimationState                      = STUNNED_STANDING_UP
            Animation                           = Stun
                AnimationName                       = MUGntSpdr_GTPA
                AnimationMode                       = ONCE
            End
        End
		
		;// Animations : Émotions
        AnimationState                      = HIT_REACTION HIT_LEVEL_1
            Animation                           = Hit_Level_1_a
                AnimationName                       = MUGntSpdr_HITA
                AnimationMode                       = ONCE
            End
        End
        AnimationState                      = SELECTED
            Animation                           = Selected
                AnimationName                       = MUGntSpdr_IDLA
                AnimationMode                       = ONCE
            End
        End
    End



    ;/////////////////////////
    ;// PARAMÈTRES GÉNÉRAUX //
    ;/////////////////////////

    DisplayName                         = OBJECT:Spider
    PlacementViewAngle                  = -90

    VisionRange                         = GENERIC_STANDARD_VISION                       ;// Distance pour voir les ennemis
    ShroudClearingRange                 = GENERIC_STANDARD_SHROUD_CLEAR                 ;// Rayon qui dévoile le brouillard
    VisionSide                          = GENERIC_UNIT_VISIONSIDE                       ;// Vision sur le côté
    VisionRear                          = GENERIC_UNIT_VISIONREAR                       ;// Vision derrière
    MaxVisionBonusPercent               = GENERIC_UNIT_MAXVISION%                       ;// Empêche la vision de devenir infinie
    VisionBonusTestRadius               = GENERIC_UNIT_VISIONBONUS                      ;// Vision bonus sur les collines
    VisionBonusPercentPerFoot           = GENERIC_UNIT_VISIONBONUSPERCENT               ;// Bonus de vision par unité en hauteur
    ;ShockwaveResistance                 = GENERIC_SHOCKWAVE_RESISTANCE_STRONG           ;// Résistance au choc
    BountyValue                         = RDA_NEUTRAL_SPIDER_BOUNTY_VALUE               ;// Remboursement

    Side                                = Neutral
    EditorSorting                       = UNIT
    ThreatLevel                         = 1.0                                           ;// Niveau de menace de l'unité pour l'IA

    CrushableLevel                      = 1             ;// Est écrasé   - 0 : Infanterie / 1 : Arbres / 2 : Cavalerie / 3:Lourd
    CrusherLevel                        = 0             ;// Peut écraser - 0 : Animaux / 1 : Infanterie / 2 : Arbres / 3 : Cav
	;UseCrushAttack			            = No				            ;// N'attaque pas en écrasant, écrase juste en marchant
    ;CrushWeapon                         = TrollCrush                    ;// Arme utilisé pour le piétinement
    ;CrushOnlyWhileCharging             = Yes                           ;// Le piétinement ne marche que pendant une charge
    ;MinCrushVelocityPercent             = 75%                           ;// Vitesse minimale pour écraser
    ;CrushDecelerationPercent            = 5                             ;// Perte de vitesse quand elle piétine
    ;CrushKnockback                      = 30                            ;// Valeur haute 50, plus les unités sont projetées loin
    ;CrushZFactor                        = 1.0                           ;// 0 = vol au sol / 1 = projection / >1 = spectaculaire
    CrushRevengeWeapon                  = RangedInfantryCrushRevenge    ;// Dégâts qu'inflige l'unité lorsqu'elle se fait écrasée
    ;RamPower                            = 20                            ;// Puissance de collision des monstres sur les structures
    ;RamZMult                            = 0.5                           ;// Soulèvement lors du choc, valeur haute soulève
    TransportSlotCount                  = TRANSPORTSLOTCOUNT_UNIT

    CommandPoints                       = GENERIC_STANDARD_10_UNIT
    CommandSet                          = GenericCommandSet



    ;/////////////////////
    ;// ARMES & ARMURES //
    ;/////////////////////
    
    WeaponSet
        Conditions                          = None
        Weapon                              = PRIMARY MinorSpiderMandibles
        AutoChooseSources                   = PRIMARY FROM_PLAYER FROM_SCRIPT FROM_AI
    End

    ArmorSet
        Conditions                          = None
        Armor                               = RDA_CARAPACE_UNITS_ARMOR
        DamageFX                            = NormalDamageFX
    End



    ;//////////////////////
    ;// PARAMÈTRES AUDIO //
    ;//////////////////////
    
    #include "..\includes\StandardUnitEvaEvents.inc"

    VoiceAttack                         = ShelobVoiceAttack
    VoiceGuard                          = ShelobVoiceMove
    VoiceAttackCharge                   = ShelobVoiceAttack
    VoiceAttackMachine                  = ShelobVoiceAttack
    VoiceAttackStructure                = ShelobVoiceAttack
    VoiceCreated                        = ShelobVoiceSelect
    VoiceFear                           = SpiderVoxHurt
    VoiceFullyCreated                   = ShelobVoiceSelect
    VoiceMove                           = ShelobVoiceMove
    VoiceMoveToCamp                     = ShelobVoiceMove
    VoiceMoveWhileAttacking             = ShelobVoiceMove
    VoicePriority                       = 50
    VoiceRetreatToCastle                = ShelobVoiceDie
    VoiceSelect                         = ShelobVoiceSelect
    VoiceSelectBattle                   = ShelobVoiceSelect
    
    SoundAmbient                        = SpiderAmbientLoopMS
    SoundImpact                         = ImpactHorse
    SoundMoveLoop                       = SpiderMoveLoop



    ;/////////////////////////////
    ;// PARAMÈTRES D'INGÉNIERIE //
    ;/////////////////////////////
    
    RadarPriority                       = UNIT
    KindOf                              = PRELOAD MONSTER SCORE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT ENVIRONMENT SELECTABLE CAN_CLIMB_WALLS

    Behavior                            = PhysicsBehavior ModuleTag_04
        GravityMult                         = 1.0
    End

    Behavior                            = SquishCollide ModuleTag_06
    End

    FormationPreviewDecal
        Texture                             = FPspiderCavalrySingle
        Width                               = 32
        Height                              = 32
    End



    ;/////////////////////////
    ;// PARAMÈTRES DE SANTÉ //
    ;/////////////////////////

    Body                                = ActiveBody ModuleTag_Body
        MaxHealth                           = RDA_NEUTRAL_SPIDER_HEALTH
        BurningDeathBehavior                = Yes
        BurningDeathFX                      = FX_InfantryBurningFlame
    End



    ;/////////////
    ;// STANCES //
    ;/////////////
    
    Behavior                            = StancesBehavior ModuleTag_StancesBehavior
        StanceTemplate                      = FighterHorde
    End



    ;///////////////////////////////
    ;// INTELLIGENCE ARTIFICIELLE //
    ;///////////////////////////////
    
    Behavior                            = AIUpdateInterface ModuleTag_03
        AutoAcquireEnemiesWhenIdle          = Yes
        MoodAttackCheckRate                 = 500
        AILuaEventsList                     = ShelobFunctions
        MaxCowerTime                        = 7500
        MinCowerTime                        = 5000
        BurningDeathTime                    = BURNINGDEATH_DURATION_INFANTRY
    End



    ;//////////////
    ;// ÉMOTIONS //
    ;//////////////
    
    Behavior                            = EmotionTrackerUpdate Module_EmotionTracker
        AddEmotion                          = Terror_Base
        AddEmotion                          = OVERRIDE UncontrollableFear_Base_Evil
            Duration                            = 7000
        End
        AddEmotion                          = Alert_Base
    End



    ;///////////////
    ;// LOCOMOTOR //
    ;///////////////

    LocomotorSet
        Locomotor                           = HeroHumanScalingLocomotorNoBackwards
        Condition                           = SET_NORMAL
        Speed                               = 50
    End

    LocomotorSet
        Locomotor                           = BurningDeathLocomotorInfantry
        Condition                           = SET_BURNINGDEATH
        Speed                               = BURNINGDEATH_WANDERSPEED_INFANTRY
    End



    ;////////////////
    ;// MORT LENTE //
    ;////////////////

    Behavior                            = SlowDeathBehavior ModuleTag_05
        DeathTypes                          = ALL
        SinkDelay                           = 3000
        SinkRate                            = 6.5
        DestructionDelay                    = 8000
        FX                                  = INITIAL FX_SmallSpiderDie
        Sound                               = INITIAL SpiderVoxDie
    End



    ;/////////////////
    ;// PROJECTILES //
    ;/////////////////

    Behavior                            = BezierProjectileBehavior ModuleTag_08
        FirstHeight                         = 24
        SecondHeight                        = 24
        FirstPercentIndent                  = 30%
        SecondPercentIndent                 = 70%
        TumbleRandomly                      = Yes
        CrushStyle                          = Yes
        DieOnImpact                         = Yes
        BounceCount                         = 1
        BounceDistance                      = 40
        BounceFirstHeight                   = 24
        BounceSecondHeight                  = 24
        BounceFirstPercentIndent            = 20%
        BounceSecondPercentIndent           = 80%
        GroundHitFX                         = FX_ThrownRockGroundHit
        GroundBounceFX                      = FX_ThrownRockBounceHit
    End



    ;/////////////////////////////
    ;// PARAMÈTRES DE GÉOMÉTRIE //
    ;/////////////////////////////

    Geometry                            = CYLINDER
    GeometryMajorRadius                 = 10.0
    GeometryMinorRadius                 = 10.0
    GeometryHeight                      = 10.0
    GeometryIsSmall                     = No

    Shadow                              = SHADOW_DECAL
    ShadowSizeX                         = 22
    ShadowSizeY                         = 18
    ShadowOffsetX                       = -1
    ShadowTexture                       = ShadowSpider2
End





ChildObject MinorSpider_Slaved MinorSpider
    EquivalentTo                        = MinorSpider

    ;/////////////////////////
    ;// PARAMÈTRES GÉNÉRAUX //
    ;/////////////////////////
    
    VisionRange                         = GENERIC_CREEP_VISION
    
    Side                                = Obsolete
    EditorSorting                       = SYSTEM
    
    CommandPoints                       = 0



    ;//////////////////////
    ;// PARAMÈTRES AUDIO //
    ;//////////////////////
    
    EvaEnemyObjectSightedEvent          = DiscoveredEnemySpiderlings
    EvaEnemyObjectSightedAfterRespawnEvent = DiscoveredEnemySpiderlings



    ;/////////////////////////////
    ;// PARAMÈTRES D'INGÉNIERIE //
    ;/////////////////////////////
    
    KindOf                              = PRELOAD SELECTABLE CAVALRY PATH_THROUGH_EACH_OTHER PATH_THROUGH_INFANTRY GRAB_AND_DROP HAS_HEALTH_BAR CREEP SCORE CAN_CLIMB_WALLS



    ;/////////////
    ;// ESCLAVE //
    ;/////////////
    
    Behavior                            = SlavedUpdate ModuleTag_Slave
        GuardMaxRange                       = 350.0
        GuardWanderRange                    = 75.0
        UseSlaverAsControlForEvaObjectSightedEvents = Yes
    End
End





ChildObject MinorSpider_Summoned MinorSpider
    EquivalentTo                        = MinorSpider

    ;/////////////////////////
    ;// PARAMÈTRES GÉNÉRAUX //
    ;/////////////////////////
    
    Side                                = Obsolete
    EditorSorting                       = SYSTEM
    
    IsTrainable                         = No
    CommandPoints                       = 0



    ;//////////////////////
    ;// PARAMÈTRES AUDIO //
    ;//////////////////////

    ClientUpdate                        = EvaAnnounceClientCreate ModuleTag_CreateAnnounce
        AnnouncementEventEnemy              = DiscoveredEnemySpiderlings
        AnnouncementEventAlly               = None
        AnnouncementEventOwner              = None
        OnlyIfVisible                       = Yes
        CountAsFirstSightedAnnoucement      = Yes
        UseObjectsPosition                  = No
        CreateFakeRadarEvent                = Yes
    End



    ;/////////////////////////////
    ;// PARAMÈTRES D'INGÉNIERIE //
    ;/////////////////////////////

    KindOf                              = SELECTABLE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT MONSTER PRELOAD SUMMONED CAN_CLIMB_WALLS



    ;///////////
    ;// TIMER //
    ;///////////

    Behavior                            = LifetimeUpdate ModuleTag_LifetimeUpdate
        MinLifetime                         = 180000
        MaxLifetime                         = 180000
        DeathType                           = FADED
    End
End
