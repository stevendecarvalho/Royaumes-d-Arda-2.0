    ;////////////////
    ;// MORT LENTE //
    ;////////////////

    Behavior                            = SlowDeathBehavior ModuleTag_Fading
        DeathTypes                          = ALL
        FadeDelay                           = 0
        FadeTime                            = 0
        DestructionDelay                    = 0
    End
End





