Object WildStoneTrollLair
    SelectPortrait                      = BRTrollLairNebelberge
    
    ;////////////////////////////
    ;// PARAMÈTRES ARTISTIQUES //
    ;////////////////////////////

    Draw                                = W3DScriptedModelDraw ModuleTag_Draw
        DefaultModelConditionState
            Model                               = wb_trol_lair
        End
        
        ;// Modèle : En attente de construction
        ModelConditionState                 = AWAITING_CONSTRUCTION SNOW
            Model                               = wb_trol_lair_a
            Texture                             = wbtrolllair_nh.tga wbtrolllair_nhs.tga
            Texture                             = NBTrollLair.tga NBTrollLair_snow.tga
            Texture                             = NBGoblinLair.tga NBGoblinLair_snow.tga
        End
        ModelConditionState                 = AWAITING_CONSTRUCTION
            Model                               = wb_trol_lair_a
        End
        AnimationState                      = AWAITING_CONSTRUCTION
            Animation                           = wb_trol_lair_a
                AnimationName                       = wb_trol_lair_a.wb_trol_lair_a
                AnimationMode                       = MANUAL
            End
            Flags                               = START_FRAME_FIRST
        End
        ModelConditionState                 = ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED SNOW
            Model                               = wb_trol_lair_a
            Texture                             = wbtrolllair_nh.tga wbtrolllair_nhs.tga
            Texture                             = NBTrollLair.tga NBTrollLair_snow.tga
            Texture                             = NBGoblinLair.tga NBGoblinLair_snow.tga
        End
        ModelConditionState                 = ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
            Model                               = wb_trol_lair_a
        End
        AnimationState                      = ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
            Animation                           = wb_trol_lair_a
                AnimationName                       = wb_trol_lair_a.wb_trol_lair_a
                AnimationMode                       = MANUAL
            End
            Flags                               = START_FRAME_FIRST
            StateName                           = BeingConstructed
            ParticleSysBone                     = DUSTBONE BuildingContructDust
        End
        
        ;// Modèle : Endommagé
        ModelConditionState                 = DAMAGED
            Model                               = wb_trol_lair_d1
        End
        AnimationState                      = DAMAGED
            EnteringStateFX                     = FX_BuildingDamaged
        End
        
        ;// Modèle : Très endommagé
        ModelConditionState                 = REALLYDAMAGED
            Model                               = wb_trol_lair_d2
        End
        AnimationState                      = REALLYDAMAGED
            Animation                           = RubbleAnimation
                AnimationName                       = wb_trol_lair.wb_trol_lair
                AnimationMode                       = ONCE
            End
            EnteringStateFX                     = FX_BuildingReallyDamaged
        End
        
        ;// Modèle : Décombres
        ModelConditionState                 = RUBBLE
            Model                               = wb_trol_lair_d2
        End
        AnimationState                      = RUBBLE
            Animation                           = RubbleAnimation
                AnimationName                       = wb_trol_lair.wb_trol_lair
                AnimationMode                       = ONCE
            End
            EnteringStateFX                     = FX_StructureMediumCollapse
        End
        ModelConditionState                 = POST_RUBBLE
            Model                               = NONE
            ParticleSysBone                     NONE SmokeBuildingMediumRubble
        End
        AnimationState                      = POST_RUBBLE
        End
        ModelConditionState                 = POST_COLLAPSE
            Model                               = None
            ParticleSysBone                     NONE SmokeBuildingMediumRubble
        End
        AnimationState                      = POST_COLLAPSE
        End
        
        ;// Modèle : Enneigé
        ModelConditionState                 = SNOW
            Model                               = wb_trol_lair
            Texture                             = wbtrolllair_nh.tga wbtrolllair_nhs.tga
            Texture                             = NBTrollLair.tga NBTrollLair_snow.tga
            Texture                             = NBGoblinLair.tga NBGoblinLair_snow.tga
        End
    End
    
    ;// Modèle : Allégeance naturelle
    Draw                                = W3DScriptedModelDraw UntamedAllegianceFX
        DefaultModelConditionState
            Model                               = None
        End
        AnimationState                      = USER_2
            ParticleSysBone                     = None UntamedAllegiance HouseColor:Yes
            ParticleSysBone                     = None UntamedAllegiance2 HouseColor:Yes
        End
    End



    ;/////////////////////////
    ;// PARAMÈTRES GÉNÉRAUX //
    ;/////////////////////////

    DisplayName                         = OBJECT:StoneTrollLair
    Description                         = OBJECT:StoneTrollLairDescription
    PlacementViewAngle                  = 0

    BuildTime                           = 30
    VisionRange                         = 160.0                                         ;// Distance pour voir les ennemis
    ShroudClearingRange                 = 160.0                                         ;// Rayon qui dévoile le brouillard

    Side                                = Neutral
    IsTrainable                         = No
    EditorSorting                       = STRUCTURE
    IsTrainable                         = No
    ThreatLevel                         = 1                                             ;// Niveau de menace de l'unité pour l'IA

    CommandSet                          = EmptyCommandSet



    ;/////////////////
    ;// COMMANDSETS //
    ;/////////////////
    
    Behavior                            = CommandSetUpgrade ModueTag_FactionCommandSet
        TriggeredBy                         = Upgrade_MenFaction Upgrade_DwarfFaction Upgrade_ElfFaction Upgrade_MordorFaction Upgrade_IsengardFaction Upgrade_WildFaction Upgrade_AngmarFaction
        CommandSet                          = NeutralStoneTrollCaveCommandSet
        CustomAnimAndDuration               = AnimState:USER_2 AnimTime:0
    End



    ;/////////////////////
    ;// ARMES & ARMURES //
    ;/////////////////////
    
    ArmorSet
        Conditions                          = None
        Armor                               = RDA_GENERIC_BUILDINGS_ARMOR
    End



    ;//////////////////////
    ;// PARAMÈTRES AUDIO //
    ;//////////////////////
    
    VoiceSelect                         = CreepBuildingGenericSelect
    
    SoundOnDamaged                      = BuildingLightDamageStone
    SoundOnReallyDamaged                = BuildingHeavyDamageStone



    ;/////////////////////////////
    ;// PARAMÈTRES D'INGÉNIERIE //
    ;/////////////////////////////

    RadarPriority                       = STRUCTURE
    KindOf                              = PRELOAD STRUCTURE IMMOBILE SELECTABLE SCORE AUTO_RALLYPOINT IGNORE_FOR_VICTORY
    
    Behavior                            = GettingBuiltBehavior ModuleTag_04
        RebuildWhenDead                     = Yes
        SelfBuildingLoop                    = BuildingConstructionLoop
        SelfRepairFromDamageLoop            = NoSound
        SelfRepairFromRubbleLoop            = BuildingConstructionLoop
        DisallowRebuildRange                = 300
        DisallowRebuildFilter               = ANY +STRUCTURE
        UseSpawnTimerWithoutWorker          = Yes
        SpawnTimer                          = 300
    End
    
    Behavior                            = KeepObjectDie ModuleTag_IWantRubble
    End
    
    Behavior                            = StructureCollapseUpdate ModuleTag_Collapse
        MinCollapseDelay                    = 000
        MaxCollapseDelay                    = 000
        CollapseDamping                     = .5
        MaxShudder                          = 0.6
        MinBurstDelay                       = 250
        MaxBurstDelay                       = 800
        BigBurstFrequency                   = 4
        FXList                              = INITIAL FX_StructureMediumCollapse
        FXList                              = ALMOST_FINAL FX_StructureAlmostCollapse
        DestroyObjectWhenDone               = Yes
        CollapseHeight                      = 120
    End
    
    Behavior                            = RebuildHoleExposeDie ModuleTag_ExposeDie
        ExemptStatus                        = SOLD
        HoleName                            = CaveTrollLairHole
        HoleMaxHealth                       = 500.0
        FadeInTimeSeconds                   = 2.0
        TransferAttackers                   = No
    End



    ;/////////////////////////
    ;// PARAMÈTRES DE SANTÉ //
    ;/////////////////////////
    
    Body                                = ActiveBody ModuleTag_Body
        MaxHealth                           = 3000
        MaxHealthDamaged                    = 1500
        MaxHealthReallyDamaged              = 750
    End



    ;////////////////
    ;// RESSOURCES //
    ;////////////////
    
    Behavior                            = TerrainResourceBehavior ModuleTag_NewMoneyDeadSpot
        Radius                              = 80
        MaxIncome                           = 0
        IncomeInterval                      = 999999
        HighPriority                        = Yes
    End



    ;////////////////
    ;// PRODUCTION //
    ;////////////////
    
    Behavior                            = ProductionUpdate ProductionUpdateModuleTag
        NumDoorAnimations                   = 0
        DoorOpeningTime                     = 3250
        DoorWaitOpenTime                    = 2000
        DoorCloseTime                       = 4000
        ConstructionCompleteDuration        = 1500
    End
    
    Behavior                            = QueueProductionExitUpdate ModuleTag_Exit
        UnitCreatePoint                     = X:2.0         Y:40.0      Z:0.0
        NaturalRallyPoint                   = X:100.0       Y:45.0      Z:0.0
        ExitDelay                           = STANDARD_HORDE_EXIT_DELAY
        UnitCreatePoint                     = X:2.0         Y:40.0      Z:0.0
        NaturalRallyPoint                   = X:100.5       Y:45.0      Z:0.0
    End



    ;////////////////
    ;// PATROUILLE //
    ;////////////////
    
    Behavior                            = SpawnBehavior ModuleTag_Spawn
        SpawnNumber                         = 1
        InitialBurst                        = 1
        SpawnTemplateName                   = WildStoneTroll_Slaved
        SpawnReplaceDelay                   = 45000
        CanReclaimOrphans                   = Yes
    End



    ;//////////////////////////
    ;// ALLÉGEANCE NATURELLE //
    ;//////////////////////////

    Behavior                            = FireWeaponUpdate ModuleTag_CreepKiller
        FireWeaponNugget
            WeaponName                          = WildAllegianceCreepKiller
            FireDelay                           = 0
            OneShot                             = No
        End
    End
    
    Behavior                            = ObjectCreationUpgrade MakeTheMoneyMaker
        TriggeredBy                         = Upgrade_WildFaction
        Delay                               = 0.0
        DestroyWhenSold                     = Yes
        ThingToSpawn                        = CreepyMoneyMaker
        FadeInTime                          = 100
    End
    
    Behavior                            = SpawnBehavior ModuleTag_SpawnDefenders
        TriggeredBy                         = Upgrade_WildFaction
        SpawnNumber                         = 18
        InitialBurst                        = 18
        SpawnTemplateName                   = GoblinFighter_Patrol GoblinArcher_Patrol MoriaPikeman_Patrol
        SpawnReplaceDelay                   = 45000
        CanReclaimOrphans                   = Yes
    End
    
    Behavior                            = ObjectCreationUpgrade ModuleTag_TheObjectCreationUpgrade
        TriggeredBy                         = Upgrade_CreepShadowInFog
        ThingToSpawn                        = WildStoneTrollLairShadowInFog
    End



    ;/////////////////////////////
    ;// PARAMÈTRES DE GÉOMÉTRIE //
    ;/////////////////////////////

    Geometry                            = CYLINDER
    GeometryMajorRadius                 = 60.0
    GeometryHeight                      = 75.0
    GeometryOffset                      = X:-7.349 Y:-8.399 Z:0

    AdditionalGeometry                  = CYLINDER
    GeometryMajorRadius                 = 50.0
    GeometryHeight                      = 60.0
    GeometryOffset                      = X:-31.438 Y:30.614 Z:0

    GeometryIsSmall                     = No
    Shadow                              = SHADOW_VOLUME
    BuildCompletion                     = PLACED_BY_PLAYER

    GeometryContactPoint                = X:-66 Y:-40 Z:0 Repair
    GeometryContactPoint                = X:40 Y:40 Z:0 Repair
    GeometryContactPoint                = X:40.629 Y:32.691 Z:0
    GeometryContactPoint                = X:-86.724 Y:-3.451 Z:0
    GeometryContactPoint                = X:27.139 Y:11.062 Z:32.902 Swoop
End





Object WildStoneTrollLairShadowInFog
    
    ;////////////////////////////
    ;// PARAMÈTRES ARTISTIQUES //
    ;////////////////////////////

    Draw                                = W3DScriptedModelDraw ModuleTag_01
        DefaultModelConditionState
            Model                               = NONE
        End
    End



    ;/////////////////////////
    ;// PARAMÈTRES GÉNÉRAUX //
    ;/////////////////////////

    ShroudClearingRange                 = 0



    ;/////////////////////////////
    ;// PARAMÈTRES D'INGÉNIERIE //
    ;/////////////////////////////
    
    KindOf                              = SELECTABLE IMMOBILE NOT_AUTOACQUIRABLE UNATTACKABLE REVEAL_TO_ALL CRATE ONE_RING



    ;/////////////////////////
    ;// PARAMÈTRES DE SANTÉ //
    ;/////////////////////////
    
    Body                                = StructureBody ModuleTag_05
        MaxHealth                           = 999999
    End



    ;/////////
    ;// OCL //
    ;/////////

    Behavior                            = CreateObjectDie ModuleTag_06
        DeathTypes                          = ALL
        CreationList                        = OCL_WildStoneTrollLairRealShadowInFog
    End



    ;///////////
    ;// TIMER //
    ;///////////

    Behavior                            = LifetimeUpdate ModuleTag_LifetimeUpdate
        MinLifetime                         = 0
        MaxLifetime                         = 0
    End



    ;////////////////
    ;// MORT LENTE //
    ;////////////////

    Behavior                            = SlowDeathBehavior ModuleTag_Fading
        DeathTypes                          = ALL
        FadeDelay                           = 0
        FadeTime                            = 0
        DestructionDelay                    = 0
    End
End





Object WildStoneTrollLairRealShadowInFog
    
    ;////////////////////////////
    ;// PARAMÈTRES ARTISTIQUES //
    ;////////////////////////////

    Draw                                = W3DScriptedModelDraw ModuleTag_Draw
        DefaultModelConditionState
            Model                               = wb_trol_lair
        End
        
        ;// Modèle : Enneigé
        ModelConditionState                 = SNOW
            Model                               = wb_trol_lair
            Texture                             = wbtrolllair_nh.tga wbtrolllair_nhs.tga
            Texture                             = NBTrollLair.tga NBTrollLair_snow.tga
            Texture                             = NBGoblinLair.tga NBGoblinLair_snow.tga
        End
    End



    ;/////////////////////////
    ;// PARAMÈTRES GÉNÉRAUX //
    ;/////////////////////////
    
    VisionRange                         = 0
    ShroudClearingRange                 = 0



    ;/////////////////////////////
    ;// PARAMÈTRES D'INGÉNIERIE //
    ;/////////////////////////////

    KindOf                              = PRELOAD STRUCTURE SELECTABLE IMMOBILE NEED_BASE_FOUNDATION MADE_OF_STONE CAN_SEE_THROUGH_STRUCTURE IGNORE_FOR_VICTORY FS_FACTORY NOT_AUTOACQUIRABLE NEVER_CULL_FOR_MP NOT_SELLABLE



    ;/////////////////////////
    ;// PARAMÈTRES DE SANTÉ //
    ;/////////////////////////
    
    Body                                = StructureBody ModuleTag_05
        MaxHealth                           = 999999
    End



    ;///////////
    ;// TIMER //
    ;///////////

    Behavior                            = LifetimeUpdate ModuleTag_LifetimeUpdate
        MinLifetime                         = 500
        MaxLifetime                         = 500
    End



    ;////////////////
    ;// MORT LENTE //
    ;////////////////

    Behavior                            = SlowDeathBehavior ModuleTag_Fading
        DeathTypes                          = ALL
        FadeDelay                           = 0
        FadeTime                            = 200
        DestructionDelay                    = 200
    End
End