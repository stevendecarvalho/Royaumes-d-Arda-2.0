;////////////////////////////////////////////////////////////////////////////////////
;////////////////////////////////////////////////////////////////////////////////////
;/////																			/////
;/////							SCORPIONS GÉANTS								/////
;/////																			/////
;////////////////////////////////////////////////////////////////////////////////////
;////////////////////////////////////////////////////////////////////////////////////

Object NeutralScorpion
    Scale                               = 2.0
    SelectPortrait                      = UPGiantScorpions
    ButtonImage                         = uigiantscorpion
    
    Draw                                = W3DScriptedModelDraw ModuleTag_DRAW
        WadingParticleSys                   = EntRipples
        StaticModelLODMode                  = Yes
        OkToChangeModelColor                = Yes

        DefaultModelConditionState
            Model                               = hugntscorp_skn
            Skeleton                            = WUGbkMnt_SKL
        End

        IdleAnimationState
            Animation
                AnimationName                       = WUGbkMnt_IDLB
                AnimationMode                       = ONCE
                AnimationPriority                   = 5
            End
            Animation
                AnimationName                       = WUGbkMnt_IDLC
                AnimationMode                       = ONCE
                AnimationPriority                   = 5
            End
            StateName                           = Idle
            BeginScript
                Prev                                = CurDrawablePrevAnimationState()
                if Prev                             = = "STATE_PlantingTotem" then
                    CurDrawableSetTransitionAnimState("TRANS_TotemToIdle")
                elseif Prev                         = = "STATE_Selected" or Prev == "STATE_NormalMovement" then
                    CurDrawableSetTransitionAnimState("TRANS_SelectedToBored")
                end
            EndScript
        End
		
		;// Animations : Chutes
        AnimationState                      = PASSENGER
            Animation
                AnimationName                       = WUGbkMnt_FLYA
                AnimationMode                       = LOOP
            End
        End
        AnimationState                      = THROWN_PROJECTILE
            Animation
                AnimationName                       = WUGbkMnt_FLYA
                AnimationMode                       = LOOP
            End
        End
        AnimationState                      = FREEFALL
            Animation
                AnimationName                       = WUGbkMnt_FLYA
                AnimationMode                       = LOOP
                AnimationSpeedFactorRange           = 0.5 0.5
                AnimationBlendTime                  = 5
            End
        End
		
		;// Animations : Morts dans les airs
        AnimationState                      = STUNNED_FLAILING
            Animation
                AnimationName                       = WUGbkMnt_FLYA
                AnimationMode                       = LOOP
                AnimationSpeedFactorRange           = 0.2 0.3
            End
        End
		
		;// Animations : Morts
        AnimationState                      = DYING DEATH_2
            Animation
                AnimationName                       = WUGbkMnt_IDLB
                AnimationMode                       = ONCE
            End
        End
        AnimationState                      = DYING BURNINGDEATH
            Animation
                AnimationName                       = WUGbkMnt_DIEA
                AnimationMode                       = ONCE
                AnimationBlendTime                  = 10
            End
        End
        AnimationState                      = DYING SPLATTED
            Animation
                AnimationName                       = WUGbkMnt_LNDA
                AnimationMode                       = ONCE
            End
        End
        AnimationState                      = DYING
            Animation
                AnimationName                       = WUGbkMnt_DIEA
                AnimationMode                       = ONCE
            End
        End
        AnimationState                      = BURNINGDEATH
            Animation
                AnimationName                       = WUGbkMnt_MFDA
                AnimationMode                       = LOOP
                Distance                            = 120
            End
        End
		
		;// Animations : Paralysies
        AnimationState                      = PARALYZED
            Animation
                AnimationName                       = WUGbkMnt_IDLA
                AnimationMode                       = LOOP
            End
        End
        AnimationState                      = STUNNED
            Animation
                AnimationName                       = WUGbkMnt_LNDA
                AnimationMode                       = ONCE
            End
        End
        AnimationState                      = STUNNED_STANDING_UP
            Animation
                AnimationName                       = WUGbkMnt_GTPA
                AnimationMode                       = ONCE
            End
        End
		
		;// Animations : Déplacements
        AnimationState                      = MOVING WANDER
            Animation
                AnimationName                       = WUGbkMnt_RUNA
                AnimationMode                       = LOOP
            End
        End
        AnimationState                      = MOVING DAMAGED AFLAME
            Animation
                AnimationName                       = WUGbkMnt_MFDA
                AnimationMode                       = LOOP
            End
            Flags                               = RANDOMSTART
        End
        AnimationState                      = MOVING ATTACKING
            Animation
                AnimationName                       = WUGbkMnt_RUNA
                AnimationMode                       = LOOP
            End
            Flags                               = RANDOMSTART
            ParticleSysBone                     = None InfantryDustTrails
        End
        AnimationState                      = MOVING WALKING
            Animation
                AnimationName                       = WUGbkMnt_RUNA
                AnimationMode                       = LOOP
            End
            Flags                               = RANDOMSTART
            ParticleSysBone                     = None InfantryDustTrails
        End
        AnimationState                      = MOVING
            StateName                           = STATE_NormalMovement
            Animation
                AnimationName                       = WUGbkMnt_RUNA
                AnimationMode                       = LOOP
            End
            Flags                               = RANDOMSTART
            ParticleSysBone                     = None InfantryDustTrails
        End
		
		;// Animations : Attaques
        AnimationState                      = PACKING_TYPE_1
            StateName                           = STATE_PlantingTotem
            Animation
                AnimationName                       = WUGbkMnt_SPCC
                AnimationMode                       = ONCE
            End
        End
        AnimationState                      = USER_1
            Animation
                AnimationName                       = WUGbkMnt_SPCA
                AnimationMode                       = ONCE
            End
        End
        AnimationState                      = USER_2
            Animation
                AnimationName                       = WUGbkMnt_SPCB
                AnimationMode                       = ONCE
            End
        End
        AnimationState                      = HIT_REACTION
            Animation
                AnimationName                       = WUGbkMnt_ATNB
                AnimationMode                       = LOOP
            End
        End
        AnimationState                      = FIRING_OR_PREATTACK_A
            Animation
                AnimationName                       = WUGbkMnt_ATKA
                AnimationMode                       = ONCE
                AnimationPriority                   = 10
                UseWeaponTiming                     = Yes
            End
            Animation
                AnimationName                       = WUGbkMnt_ATKC
                AnimationMode                       = ONCE
                AnimationPriority                   = 5
                UseWeaponTiming                     = Yes
            End
        End
        AnimationState                      = SPECIAL_WEAPON_ONE
            Animation
                AnimationName                       = WUGbkMnt_ATKB
                AnimationMode                       = ONCE
                UseWeaponTiming                     = Yes
            End
            ParticleSysBone                     B_S_TAIL06 GoblinKingPoison FollowBone:Yes
            ParticleSysBone                     B_S_TAIL06 GoblinKingPoison2 FollowBone:Yes
        End
        
        AnimationState                      = SPECIAL_WEAPON_TWO
            Animation
                AnimationName                       = WUGbkMnt_ATKB
                AnimationMode                       = ONCE
                UseWeaponTiming                     = Yes
            End
            ParticleSysBone                     B_S_TAIL06 Necro_Cast_LBGlow FollowBone:Yes
            ParticleSysBone                     B_S_TAIL06 Necro_BlackIce_Cast FollowBone:Yes
            ParticleSysBone                     B_S_TAIL06 UndeadTrollToxicBreath FollowBone:Yes
        End
        AnimationState                      = BETWEEN_FIRING_SHOTS_A
            Animation
                AnimationName                       = WUGbkMnt_IDLA
                AnimationMode                       = ONCE
            End
        End
        AnimationState                      = ATTACKING
            Animation
                AnimationName                       = WUGbkMnt_IDLA ; WUGbkMnt_ATKA
                AnimationMode                       = ONCE
                UseWeaponTiming                     = Yes
            End
            Animation
                AnimationName                       = WUGbkMnt_ATKC
                AnimationMode                       = ONCE
                UseWeaponTiming                     = Yes
            End
        End
		
		;// Animations : Émotions
        AnimationState                      = EMOTION_TAUNTING
            Animation
                AnimationName                       = WUGbkMnt_CHRA
                AnimationMode                       = LOOP
                AnimationBlendTime                  = 10
            End
            Flags                               = RESTART_ANIM_WHEN_COMPLETE
        End
        AnimationState                      = EMOTION_CELEBRATING
            Animation
                AnimationName                       = WUGbkMnt_CHRA
                AnimationMode                       = ONCE
                AnimationBlendTime                  = 10
            End
            Flags                               = RESTART_ANIM_WHEN_COMPLETE
        End
        AnimationState                      = LEVELED
            Animation                           = LevelUp
                AnimationName                       = WUGbkMnt_LVLA
                AnimationMode                       = ONCE
            End
        End
        AnimationState                      = RAISING_FLAG
            Animation
                AnimationName                       = WUGbkMnt_CHRA
                AnimationMode                       = LOOP
            End
        End
        AnimationState                      = SELECTED
            StateName                           = STATE_Selected
            Animation
                AnimationName                       = WUGbkMnt_ATNB
                AnimationMode                       = LOOP
            End
            BeginScript
                Prev                                = CurDrawablePrevAnimationState()
                if Prev                             = = "STATE_PlantingTotem" then
                    CurDrawableSetTransitionAnimState("TRANS_TotemToIdle")
                elseif Prev ~                       = "STATE_Selected" and Prev ~= "TRANS_IdleToSelected" then
                    CurDrawableSetTransitionAnimState("TRANS_IdleToSelected")
                end
            EndScript
        End

        ;// Transitions
        TransitionState                     = TRANS_IdleToSelected
            Animation
                AnimationName                       = WUGbkMnt_ATNA
                AnimationMode                       = ONCE
            End
        End
        TransitionState                     = TRANS_SelectedToBored
            Animation
                AnimationName                       = WUGbkMnt_ATNC
                AnimationMode                       = ONCE
            End
        End
        TransitionState                     = TRANS_TotemToIdle
            Animation
                AnimationName                       = WUGbkMnt_IDLA
                AnimationMode                       = ONCE
                AnimationBlendTime                  = 0
            End
        End
    End
    
    ;// Effets : Poussières
    Draw                                = W3DScriptedModelDraw DustEffects
        DefaultModelConditionState
            Model                               = None
        End
        IdleAnimationState
        End
        AnimationState                      = MOVING WADING
            ParticleSysBone                     = None FootstepSlash
        End
        AnimationState                      = MOVING ACCELERATE
            ParticleSysBone                     = None InfantryDustTrails
        End
        AnimationState                      = MOVING ACCELERATE
            ParticleSysBone                     = None InfantryDustTrails
        End
        AnimationState                      = DISGUISED MOVING ACCELERATE
            ParticleSysBone                     = None InfantryDustTrails
        End
        AnimationState                      = DISGUISED MOVING DECELERATE
            ParticleSysBone                     = None InfantryDustTrails
        End
        AnimationState                      = MOVING
        End
        AnimationState                      = DISGUISED MOVING
        End
    End
	
	
	
	;/////////////////////////
	;// PARAMÈTRES GÉNÉRAUX //
	;/////////////////////////

    DisplayName                         = OBJECT:GiantScorpion
    PlacementViewAngle                  = -90
	MaxSimultaneousOfType               = GENERIC_ELITE_MAX_SIMULTANEOUS

    BuildCost                           = RDA_NEUTRAL_GIANT_SCORP_BUILDCOST
    BuildTime                           = ELITE_UNIT_BUILDTIME
    VisionRange                         = GENERIC_ELITE_VISION                      ;// Distance pour voir les ennemis
    ShroudClearingRange                 = GENERIC_SHROUD_CLEAR_GIANT                ;// Rayon qui dévoile le brouillard
    VisionSide                          = GENERIC_UNIT_VISIONSIDE                   ;// Vision sur le côté
    VisionRear                          = GENERIC_UNIT_VISIONREAR                   ;// Vision derrière
    MaxVisionBonusPercent               = GENERIC_UNIT_MAXVISION%                   ;// Empêche la vision de devenir infinie
    VisionBonusTestRadius               = GENERIC_UNIT_VISIONBONUS                  ;// Vision bonus sur les collines
    VisionBonusPercentPerFoot           = GENERIC_UNIT_VISIONBONUSPERCENT           ;// Bonus de vision par unité en hauteur
    ShockwaveResistance                 = GENERIC_SHOCKWAVE_RESISTANCE_STRONG       ;// Résistance au choc
    BountyValue                         = RDA_NEUTRAL_GIANT_SCORP_BOUNTY_VALUE      ;// Remboursement

    Side                                = Neutral
    EditorSorting                       = UNIT
    ThreatLevel                         = 100                                           ;// Niveau de menace de l'unité pour l'IA
    ;ThingClass                          = CAVALRY_UNIT

    CrushableLevel                      = 2             ;// Est écrasé   - 0 : Infanterie / 1 : Arbres / 2 : Cavalerie / 3:Lourd
    CrusherLevel                        = 1             ;// Peut écraser - 0 : Animaux / 1 : Infanterie / 2 : Arbres / 3 : Cav
	UseCrushAttack			            = No				            ;// N'attaque pas en écrasant, écrase juste en marchant
    CrushWeapon                         = TrollCrush                    ;// Arme utilisé pour le piétinement
    ;CrushOnlyWhileCharging             = Yes                           ;// Le piétinement ne marche que pendant une charge
    MinCrushVelocityPercent             = 65%                           ;// Vitesse minimale pour écraser
    CrushDecelerationPercent            = 30                            ;// Perte de vitesse quand elle piétine
    CrushKnockback                      = 40                            ;// Valeur haute 50, plus les unités sont projetées loin
    CrushZFactor                        = 1.0                           ;// 0 = vol au sol / 1 = projection / >1 = spectaculaire
    ;CrushRevengeWeapon                  = RangedInfantryCrushRevenge   ;// Dégâts qu'inflige l'unité lorsqu'elle se fait écrasée
    ;RamPower                            = 30                            ;// Puissance de collision des monstres sur les structures
    ;RamZMult                            = 0.5                           ;// Soulèvement lors du choc, valeur haute soulève
    TransportSlotCount                  = TRANSPORTSLOTCOUNT_UNIT

    CommandPoints                       = GENERIC_STANDARD_10_UNIT
    CommandSet                          = GenericCommandSet



    ;/////////////////////
    ;// ARMES & ARMURES //
    ;/////////////////////

    WeaponSet
        Conditions                          = None
        Weapon                              = PRIMARY GiantScorpionAttack
        AutoChooseSources                   = PRIMARY FROM_PLAYER FROM_SCRIPT FROM_AI
    End

    ArmorSet
        Conditions                          = None
        Armor                               = RDA_CARAPACE_UNITS_ARMOR
        DamageFX                            = NormalDamageFX
    End



    ;//////////////////////
    ;// PARAMÈTRES AUDIO //
    ;//////////////////////
    
    VoiceAttack                         = ScorpionVoxAttack
    VoiceAttackCharge                   = ScorpionVoxAttack
    VoiceAttackMachine                  = ScorpionVoxAttack
    VoiceAttackStructure                = ScorpionVoxAttack
    VoiceCreated                        = ScorpionVoxCreated
    VoiceFullyCreated                   = ScorpionVoxCreated
    VoiceFear                           = SocrpionMoveMS
    VoiceGuard                          = SocrpionMoveMS
    VoiceMove                           = SocrpionMoveMS
    VoiceMoveOverWalls                  = SocrpionMoveMS
    VoiceMoveToCamp                     = SocrpionMoveMS 
    VoiceMoveWhileAttacking             = SocrpionMoveMS
    VoicePriority                       = 50
    VoiceRetreatToCastle                = SocrpionMoveMS
    VoiceSelect                         = ScorpionSelectMS
    VoiceSelectBattle                   = ScorpionSelectMS
    SoundImpact                         = ImpactHorse
    SoundMoveLoop                       = ScorpionMoveLoop
    SoundAmbient                        = WildSpiderlingAmbientLoopMS

    UnitSpecificSounds
        VoiceEnterUnitEvilMenTransportShip  = SocrpionMoveMS
        VoiceEnterUnitMordorMumakil         = SocrpionMoveMS
        VoiceEnterUnitSlaughterHouse        = SocrpionMoveMS
        VoiceGarrison                       = SocrpionMoveMS
        VoiceInitiateCaptureBuilding        = SocrpionMoveMS
    End

    Behavior                            = LargeGroupAudioUpdate ModuleTag_LGAU
        Key                                 = Spiderling
    End
    ClientBehavior                      = AnimationSoundClientBehavior ModuleTag_AnimAudioBehavior
        MaxUpdateRangeCap                   = 800
        AnimationSound                      = Sound:GoblinKingPoisonStingerStrike Animation:WUGbkMnt_SKL.WUGbkMnt_ATKB Frames:4
        AnimationSound                      = Sound:BodyFallOrc Animation:WUGBKMNT_SKL.WUGBKMNT_DIEA Frames:24 30
        AnimationSound                      = Sound:BodyFallOrc Animation:WUGBKMNT_SKL.WUGBKMNT_LNDA Frames:8 21
    End



    ;/////////////////////////////
    ;// PARAMÈTRES D'INGÉNIERIE //
    ;/////////////////////////////

    RadarPriority                       = UNIT
    KindOf                              = PRELOAD SCORE ATTACK_NEEDS_LINE_OF_SIGHT SELECTABLE ARMY_SUMMARY MONSTER CAN_CAST_REFLECTIONS CAN_ATTACK SCARY CAN_ATTACK_WALLS HEAVY_MELEE_HITTER
    PathfindDiameter                    = 25

    Behavior                            = PhysicsBehavior ModuleTag_04
        GravityMult                         = 1.0
        ShockStandingTime                   = 4500
    End

    Behavior                            = SquishCollide ModuleTag_06
    End

    Behavior                            = NotifyTargetsOfImminentProbableCrushingUpdate ModuleTag_NotifyCrushScan
    End

    Behavior                            = HitReactionBehavior HitReactionBehaviorModuleTag
        HitReactionLifeTimer1               = 1800
        HitReactionThreshold1               = 5.0
        FastHitsResetReaction               = No
    End



    ;/////////////////////////
    ;// PARAMÈTRES DE SANTÉ //
    ;/////////////////////////

    Body                                = ActiveBody ModuleTag_Body
        MaxHealth                           = RDA_NEUTRAL_GIANT_SCORP_HEALTH
        BurningDeathBehavior                = Yes
        BurningDeathFX                      = FX_InfantryBurningFlame
    End



    ;///////////////
    ;// AUTO-HEAL //
    ;///////////////

    Behavior                            = AutoHealBehavior ModuleTag_CaveTrollHealing
        StartsActive                        = No
        TriggeredBy                         = Upgrade_ObjectLevel3
        HealingAmount                       = MONSTER_HEAL_AMOUNT
        HealingDelay                        = 1000
        StartHealingDelay                   = MONSTER_HEAL_DELAY
        HealOnlyIfNotInCombat               = Yes
    End



    ;/////////////
    ;// STANCES //
    ;/////////////
    
    Behavior                            = StancesBehavior ModuleTag_StancesBehavior
        StanceTemplate                      = FighterHorde
    End



    ;///////////////////////////////
    ;// INTELLIGENCE ARTIFICIELLE //
    ;///////////////////////////////

    Behavior                            = AIUpdateInterface ModuleTag_03
        AutoAcquireEnemiesWhenIdle          = Yes ATTACK_BUILDINGS
        MoodAttackCheckRate                 = 500
        AILuaEventsList                     = GoblinKingFunctions
        BurningDeathTime                    = BURNINGDEATH_DURATION_INFANTRY
    End



    ;//////////////
    ;// ÉMOTIONS //
    ;//////////////

    Behavior                            = EmotionTrackerUpdate Module_EmotionTracker
        AddEmotion                          = Terror_Base
        AddEmotion                          = Doom_Base
        AddEmotion                          = BraceForBeingCrushed_Base
        AddEmotion                          = UncontrollableFear_Base
        AddEmotion                          = Point_Base
        AddEmotion                          = Taunt_Base
        AddEmotion                          = CheerIdle_Base
        AddEmotion                          = CheerBusy_Base
        AddEmotion                          = HeroCheerIdle_Base
        AddEmotion                          = HeroCheerBusy_Base
        AddEmotion                          = Alert_Base
    End



    ;///////////////
    ;// LOCOMOTOR //
    ;///////////////

    LocomotorSet
        Locomotor                           = GiantScorpionLocomotor
        Condition                           = SET_NORMAL
        Speed                               = 65
    End

    LocomotorSet
        Locomotor                           = BurningDeathLocomotorInfantry
        Condition                           = SET_BURNINGDEATH
        Speed                               = BURNINGDEATH_WANDERSPEED_INFANTRY
    End



    ;////////////////
    ;// MORT LENTE //
    ;////////////////

    Behavior                            = SlowDeathBehavior ModuleTag_05
        DeathTypes                          = ALL
        SinkDelay                           = 3000
        SinkRate                            = 1.40
        DestructionDelay                    = 8000
        Sound                               = INITIAL ScorpionDeathHatchlingsMS
        OCL                                 = INITIAL OCL_HaradDeadScorpion
    End



    ;/////////////
    ;// ESCLAVE //
    ;/////////////

    Behavior                            = SlavedUpdate ModuleTag_Slave
        GuardMaxRange                       = 250
        GuardWanderRange                    = 80
        UseSlaverAsControlForEvaObjectSightedEvents = Yes
    End



    ;/////////////////////////////
    ;// PARAMÈTRES DE GÉOMÉTRIE //
    ;/////////////////////////////
    
    Geometry                            = CYLINDER
    GeometryMajorRadius                 = 25.0
    GeometryMinorRadius                 = 25.0
    GeometryHeight                      = 30.0
    GeometryIsSmall                     = No

    Shadow                              = SHADOW_DECAL
    ShadowSizeX                         = 47
    ShadowSizeY                         = 30
    ShadowOffsetX                       = -4
    ShadowTexture                       = ShadowI
End





ChildObject Scorpion NeutralScorpion
    EquivalentTo                        = NeutralScorpion
    Scale                               = 0.5
    Side                                = Neutral
    EditorSorting                       = UNIT
End