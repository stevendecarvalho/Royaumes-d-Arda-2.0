;////////////////////////////////////////////////////////////////////////////////////
;////////////////////////////////////////////////////////////////////////////////////
;/////																			/////
;/////                          FILLES DE SAENATHRA							    /////
;/////																			/////
;////////////////////////////////////////////////////////////////////////////////////
;////////////////////////////////////////////////////////////////////////////////////

Object GiantSpider
    Scale                               = 1.1
    SelectPortrait                      = UPGuldurSister
    ButtonImage                         = UIGuldurSister
    
    ;////////////////////////////
    ;// PARAMÈTRES ARTISTIQUES //
    ;////////////////////////////
    
    Draw                                = W3DScriptedModelDraw ModuleTag_01
        OkToChangeModelColor                = Yes
        
        DefaultModelConditionState
            Model                               = uusister_skn
            Skeleton                            = MUShelob_SKL
        End
        
        ModelConditionState                 = USER_1
            Model                               = uusister_skn
            Skeleton                            = MUShelob_SKL
            ParticleSysBone                     = B_BACK02 GreatSpiderVenomSacs FollowBone:Yes
        End
        
        IdleAnimationState
            Animation                           = IDLA
                AnimationName                       = MUShelob_IDLA
                AnimationMode                       = ONCE
            End
        End
		
		;// Animations : Escalade
        AnimationState                      = CLIMBING
            StateName                           = STATE_Climbing
            Animation                           = Climbing
                AnimationName                       = MUShelob_WALB
                AnimationMode                       = LOOP
                AnimationBlendTime                  = 15
            End
            BeginScript
                Prev                                = CurDrawablePrevAnimationState()
                if Prev                             = = "STATE_Running" then CurDrawableSetTransitionAnimState("Trans_RunningToClimbing") return end
            EndScript
        End
        TransitionState                     = Trans_RunningToClimbing
            Animation                           = Transition
                AnimationName                       = MUShelob_WALA
                AnimationMode                       = ONCE
            End
        End
        AnimationState                      = RAPPELLING
            StateName                           = STATE_Rappelling
            Animation                           = Rapelling
                AnimationName                       = MUShelob_WALD
                AnimationMode                       = LOOP
                AnimationBlendTime                  = 15
            End
            BeginScript
                Prev                                = CurDrawablePrevAnimationState()
                if Prev                             = = "STATE_Running" then CurDrawableSetTransitionAnimState("Trans_RunningToRappelling") return end
            EndScript
        End
        TransitionState                     = Trans_RunningToRappelling
            Animation                           = Transition
                AnimationName                       = MUShelob_WALD
                AnimationMode                       = ONCE
            End
        End
        TransitionState                     = Trans_ClimbingToRunning
            Animation                           = Transition
                AnimationName                       = MUShelob_WALC
                AnimationMode                       = ONCE
            End
        End
        TransitionState                     = Trans_RappellingToRunning
            Animation                           = Transition
                AnimationName                       = MUShelob_WALE
                AnimationMode                       = ONCE
            End
        End
		
		;// Animations : Paralysies
        AnimationState                      = STUNNED_FLAILING
            Animation                           = StunFlail
                AnimationName                       = MUShelob_FLYA
                AnimationMode                       = LOOP
            End
            Flags                               = RANDOMSTART
        End
        AnimationState                      = STUNNED
            Animation                           = Stun
                AnimationName                       = MUShelob_LNDA
                AnimationMode                       = ONCE
            End
        End
        AnimationState                      = STUNNED_STANDING_UP
            Animation                           = Stun
                AnimationName                       = MUShelob_GTPA
                AnimationMode                       = ONCE
            End
        End
		
		;// Animations : Morts
        AnimationState                      = DYING DEATH_2
            Animation                           = DIEA
                AnimationName                       = MUShelob_DIEA
                AnimationMode                       = ONCE
            End
        End
        AnimationState                      = DYING DEATH_1
            Animation                           = DIEA
                AnimationName                       = MUShelob_DIEA
                AnimationMode                       = ONCE
            End
        End
		
		;// Animations : Attaques
        AnimationState                      = SPECIAL_WEAPON_TWO
            Animation
                AnimationName                       = MUShelob_ATKC
                AnimationMode                       = ONCE
            End
            FXEvent                             = Frame:10 Name:FX_FearBlast
        End
		
		;// Animations : Déplacements
        AnimationState                      = TURN_LEFT
            StateName                           = Turn
            Animation                           = Walk
                AnimationName                       = MUShelob_TRNL
                AnimationMode                       = LOOP
            End
        End
        AnimationState                      = TURN_RIGHT
            StateName                           = Turn
            Animation                           = Walk
                AnimationName                       = MUShelob_TRNR
                AnimationMode                       = LOOP
            End
        End
        AnimationState                      = MOVING BACKING_UP
            Animation                           = BAKA
                AnimationName                       = MUShelob_BAKA
                AnimationMode                       = LOOP
            End
            Flags                               = RANDOMSTART
        End
        AnimationState                      = MOVING ATTACKING
            Animation                           = RUNA
                AnimationName                       = MUShelob_RUNA
                AnimationMode                       = LOOP
                Distance                            = 21
            End
        End
        AnimationState                      = MOVING
            StateName                           = STATE_Running
            Animation                           = WLKA
                AnimationName                       = MUShelob_WLKA
                AnimationMode                       = LOOP
                Distance                            = 21
            End
            BeginScript
                Prev                                = CurDrawablePrevAnimationState()
                if Prev                             = = "STATE_Climbing" then CurDrawableSetTransitionAnimState("Trans_ClimbingToRunning") return end
                if Prev                             = = "STATE_Rappelling" then CurDrawableSetTransitionAnimState("Trans_RappellingToRunning") return end
            EndScript
        End
		
		;// Animations : Tunnels
        AnimationState                      = UNPACKING PACKING_TYPE_3
            Animation
                AnimationName                       = MUShelob_TUNA
                AnimationMode                       = ONCE
            End
            FXEvent                             = Frame:15 Name: FX_ShelobDigA
        End
        AnimationState                      = PACKING PACKING_TYPE_3
            Animation
                AnimationName                       = MUShelob_TUNB
                AnimationMode                       = ONCE
            End
            FXEvent                             = Frame:10 Name: FX_ShelobDigB
        End
		
		;// Animations : Attaques
        AnimationState                      = SPECIAL_WEAPON_ONE
            Animation
                AnimationName                       = MUShelob_SPCA
                AnimationMode                       = ONCE
            End
        End
        AnimationState                      = FIRING_OR_PREATTACK_A
            Animation                           = ATKA
                AnimationName                       = MUShelob_ATKA
                AnimationMode                       = ONCE
            End
        End
        AnimationState                      = FIRING_OR_PREATTACK_E
            Animation
                AnimationName                       = MUShelob_TUNA
                AnimationMode                       = ONCE
            End
            FXEvent                             = Frame:15 Name: FX_ShelobDigA
        End
		
		;// Animations : Émotions
        AnimationState                      = SELECTED
            Animation                           = IDLA
                AnimationName                       = MUShelob_IDLA
                AnimationMode                       = ONCE
                AnimationPriority                   = 1
            End
            Animation                           = IDLA
                AnimationName                       = MUShelob_IDLA
                AnimationMode                       = ONCE
                AnimationPriority                   = 1
            End
            Animation                           = AtAttention
                AnimationName                       = MUShelob_ATNA
                AnimationMode                       = ONCE
            End
            Flags                               = RESTART_ANIM_WHEN_COMPLETE
        End
        AnimationState                      = HIT_REACTION HIT_LEVEL_1
            Animation                           = Hit_Level_1_a
                AnimationName                       = MUShelob_HITA
                AnimationMode                       = ONCE
            End
        End
    End
    
    #include "..\includes\StunDrawModuleSmall.inc"



    ;/////////////////////////
    ;// PARAMÈTRES GÉNÉRAUX //
    ;/////////////////////////

    DisplayName                         = OBJECT:GiantSpider
    PlacementViewAngle                  = -90

    VisionRange                         = GENERIC_ELITE_VISION                          ;// Distance pour voir les ennemis
    ShroudClearingRange                 = GENERIC_ELITE_SHROUD_CLEAR                    ;// Rayon qui dévoile le brouillard
    VisionSide                          = GENERIC_UNIT_VISIONSIDE                       ;// Vision sur le côté
    VisionRear                          = GENERIC_UNIT_VISIONREAR                       ;// Vision derrière
    MaxVisionBonusPercent               = GENERIC_UNIT_MAXVISION%                       ;// Empêche la vision de devenir infinie
    VisionBonusTestRadius               = GENERIC_UNIT_VISIONBONUS                      ;// Vision bonus sur les collines
    VisionBonusPercentPerFoot           = GENERIC_UNIT_VISIONBONUSPERCENT               ;// Bonus de vision par unité en hauteur
    ShockwaveResistance                 = GENERIC_SHOCKWAVE_RESISTANCE_STRONG           ;// Résistance au choc
    BountyValue                         = RDA_NEUTRAL_GIANT_SPIDER_BOUNTY_VALUE         ;// Remboursement

    Side                                = Neutral
    EditorSorting                       = UNIT
    ThreatLevel                         = 1.0                                           ;// Niveau de menace de l'unité pour l'IA

    CrushableLevel                      = 1             ;// Est écrasé   - 0 : Infanterie / 1 : Arbres / 2 : Cavalerie / 3:Lourd
    CrusherLevel                        = 2             ;// Peut écraser - 0 : Animaux / 1 : Infanterie / 2 : Arbres / 3 : Cav
	UseCrushAttack			            = No				            ;// N'attaque pas en écrasant, écrase juste en marchant
    CrushWeapon                         = TrollCrush                    ;// Arme utilisé pour le piétinement
    CrushOnlyWhileCharging             = Yes                            ;// Le piétinement ne marche que pendant une charge
    MinCrushVelocityPercent             = 75%                           ;// Vitesse minimale pour écraser
    CrushDecelerationPercent            = 5                             ;// Perte de vitesse quand elle piétine
    CrushKnockback                      = 30                            ;// Valeur haute 50, plus les unités sont projetées loin
    CrushZFactor                        = 1.0                           ;// 0 = vol au sol / 1 = projection / >1 = spectaculaire
    CrushRevengeWeapon                  = RangedInfantryCrushRevenge    ;// Dégâts qu'inflige l'unité lorsqu'elle se fait écrasée
    ;RamPower                            = 20                            ;// Puissance de collision des monstres sur les structures
    ;RamZMult                            = 0.5                           ;// Soulèvement lors du choc, valeur haute soulève
    TransportSlotCount                  = TRANSPORTSLOTCOUNT_UNIT

    CommandPoints                       = GENERIC_ELITE_10_UNIT
    CommandSet                          = GenericCommandSet



    ;/////////////////////
    ;// ARMES & ARMURES //
    ;/////////////////////
    
    WeaponSet
        Conditions                          = None
        Weapon                              = PRIMARY SpiderSisterMandibles
        AutoChooseSources                   = PRIMARY FROM_PLAYER FROM_SCRIPT FROM_AI
    End

    ArmorSet
        Conditions                          = None
        Armor                               = RDA_CARAPACE_UNITS_ARMOR
        DamageFX                            = NormalDamageFX
    End



    ;//////////////////////
    ;// PARAMÈTRES AUDIO //
    ;//////////////////////

    #include "..\\includes\StandardUnitEvaEvents.inc"

    VoiceAttack                         = GuldurSpiderSisterVoiceAttackMS
    VoiceAttackCharge                   = GuldurSpiderSisterVoiceAttackChargeMS
    VoiceAttackMachine                  = GuldurSpiderSisterVoiceAttackMS
    VoiceAttackStructure                = GuldurSpiderSisterVoiceAttackBuildingMS
    VoiceCreated                        = GuldurSpiderSisterVoiceSalute
    VoiceCreated                        = +SOUND:WildSpiderlingVoxCreated
    VoiceFullyCreated                   = GuldurSpiderSisterVoiceSalute
    VoiceFullyCreated                   = +SOUND:WildSpiderlingVoxCreated
    VoiceFear                           = WildSpiderlingVoxHurt
    VoiceGuard                          = GuldurSpiderSisterVoiceMoveMS
    VoiceMove                           = GuldurSpiderSisterVoiceMoveMS
    VoiceMoveOverWalls                  = GuldurSpiderSisterVoiceMoveMS
    VoiceMoveToCamp                     = GuldurSpiderSisterVoiceMoveCamp
    VoiceMoveWhileAttacking             = GuldurSpiderSisterVoiceDisengage
    VoicePriority                       = 50
    VoiceRetreatToCastle                = WildSpiderlingVoxHurt
    VoiceSelect                         = GuldurSpiderSisterVoiceSelectMS
    VoiceSelectBattle                   = GuldurSpiderSisterVoiceSelectBattleMS

    VoiceEnterStateAttack               = GuldurSpiderSisterVoiceEnterStateAttack
    VoiceEnterStateAttackCharge         = GuldurSpiderSisterVoiceEnterStateAttackCharge
    VoiceEnterStateAttackMachine        = GuldurSpiderSisterVoiceEnterStateAttack
    VoiceEnterStateAttackStructure      = GuldurSpiderSisterVoiceEnterStateAttackBuilding
    VoiceEnterStateMove                 = GuldurSpiderSisterVoiceEnterStateMove
    VoiceEnterStateMoveOverWalls        = GuldurSpiderSisterVoiceEnterStateMove
    VoiceEnterStateMoveToCamp           = GuldurSpiderSisterVoiceEnterStateMoveCamp
    VoiceEnterStateMoveWhileAttacking   = GuldurSpiderSisterVoiceEnterStateDisengage
    VoiceEnterStateRetreatToCastle      = WildSpiderlingVoxEnterStateHurt

    SoundAmbient                        = WildSpiderlingAmbientLoopMS
    SoundImpact                         = ImpactHorse

    UnitSpecificSounds
        VoiceGarrison                       = WildSpiderlingVoxMove
        VoiceEnterUnitEvilMenTransportShip  = WildSpiderlingVoxMove
    End

    ClientBehavior                      = AnimationSoundClientBehavior ModuleTag_AnimAudioBehavior
        MaxUpdateRangeCap                   = 800
        AnimationSound                      = Sound:BodyFallGeneric2 Animation:MUGNTSPDR_SKL.MUGNTSPDR_LNDA Frames:5
    End

    Behavior                            = LargeGroupAudioUpdate ModuleTag_LGAU
        Key                                 = Spiderling
    End



    ;/////////////////////////////
    ;// PARAMÈTRES D'INGÉNIERIE //
    ;/////////////////////////////

    RadarPriority                       = UNIT
    KindOf                              = PRELOAD SCORE ATTACK_NEEDS_LINE_OF_SIGHT SELECTABLE CAN_CLIMB_WALLS ARMY_SUMMARY MONSTER CAN_CAST_REFLECTIONS CAN_ATTACK SCARY CAN_ATTACK_WALLS HEAVY_MELEE_HITTER

    Behavior                            = PhysicsBehavior ModuleTag_04
        GravityMult                         = 1.0
    End

    Behavior                            = SquishCollide ModuleTag_06
    End

    FormationPreviewDecal
        Texture                             = FPspiderCavalrySingle
        Width                               = 80
        Height                              = 80
    End



    ;/////////////////////////
    ;// PARAMÈTRES DE SANTÉ //
    ;/////////////////////////

    Body                                = ActiveBody ModuleTag_Body
        MaxHealth                           = RDA_NEUTRAL_GIANT_SPIDER_HEALTH
        BurningDeathBehavior                = Yes
        BurningDeathFX                      = FX_InfantryBurningFlame
    End



    ;///////////////
    ;// AUTO-HEAL //
    ;///////////////

    Behavior                            = AutoHealBehavior ModuleTag_CaveTrollHealing
        StartsActive                        = No
        TriggeredBy                         = Upgrade_ObjectLevel3
        HealingAmount                       = MONSTER_HEAL_AMOUNT
        HealingDelay                        = 1000
        StartHealingDelay                   = MONSTER_HEAL_DELAY
        HealOnlyIfNotInCombat               = Yes
    End



    ;/////////////
    ;// STANCES //
    ;/////////////

    Behavior                            = StancesBehavior ModuleTag_StancesBehavior
        StanceTemplate                      = Hero
    End



    ;///////////////////////////////
    ;// INTELLIGENCE ARTIFICIELLE //
    ;///////////////////////////////

    Behavior                            = AIUpdateInterface ModuleTag_03
        AutoAcquireEnemiesWhenIdle          = Yes ATTACK_BUILDINGS
        MoodAttackCheckRate                 = 500
        AILuaEventsList                     = ShelobFunctions
        MaxCowerTime                        = 7500
        MinCowerTime                        = 5000
        BurningDeathTime                    = BURNINGDEATH_DURATION_INFANTRY
        AttackPriority                      = AttackPriority_SIEGEWEAPON
    End



    ;//////////////
    ;// ÉMOTIONS //
    ;//////////////

    Behavior                            = EmotionTrackerUpdate Module_EmotionTracker
        AddEmotion                          = Terror_Base
        AddEmotion                          = OVERRIDE UncontrollableFear_Base_Evil
            Duration                            = 7000
        End
        AlwaysAfraidOf                      = NONE +CloudBreakSunbeam +SunflareSunbeam
        AddEmotion                          = Alert_Base
    End



    ;///////////////
    ;// LOCOMOTOR //
    ;///////////////

    LocomotorSet
        Locomotor                           = SaenathraSisterLocomotor
        Condition                           = SET_NORMAL
        Speed                               = 90
    End

    LocomotorSet
        Locomotor                           = BurningDeathLocomotorInfantry
        Condition                           = SET_BURNINGDEATH
        Speed                               = 120
    End



    ;////////////////
    ;// MORT LENTE //
    ;////////////////

    Behavior                            = SlowDeathBehavior ModuleTag_05
        DeathTypes                          = ALL -FADED
        SinkDelay                           = 2500
        SinkRate                            = 3.00 ; in Dist/Sec
        DestructionDelay                    = 20000
        FX                                  = INITIAL FX_GiantSpiderDie
        Sound                               = INITIAL DeathHatchlingsMS
        DeathFlags                          = DEATH_1
        OCL                                 = INITIAL OCL_GuldurDeadGreatSpider
    End

    Behavior                            = SlowDeathBehavior ModuleTag_07
        DeathTypes                          = NONE +FADED
        FadeDelay                           = 0
        FadeTime                            = 8000
        DestructionDelay                    = 8000
        FX                                  = INITIAL FX_RohirrimAlliesUnsummon
        DeathFlags                          = DEATH_2
    End



    ;/////////////////
    ;// PROJECTILES //
    ;/////////////////

    Behavior                            = BezierProjectileBehavior ModuleTag_08
        FirstHeight                         = 24
        SecondHeight                        = 24
        FirstPercentIndent                  = 30%
        SecondPercentIndent                 = 70%
        TumbleRandomly                      = Yes
        CrushStyle                          = Yes
        DieOnImpact                         = Yes
        BounceCount                         = 1
        BounceDistance                      = 40
        BounceFirstHeight                   = 24
        BounceSecondHeight                  = 24
        BounceFirstPercentIndent            = 20%
        BounceSecondPercentIndent           = 80%
        GroundHitFX                         = FX_ThrownRockGroundHit
        GroundBounceFX                      = FX_ThrownRockBounceHit
    End



    ;////////////////
    ;// PRODUCTION //
    ;////////////////

    Behavior                            = ProductionUpdate ProductionUpdateModuleTag
        GiveNoXP                            = Yes
    End



    ;/////////////////////////////
    ;// PARAMÈTRES DE GÉOMÉTRIE //
    ;/////////////////////////////

    Geometry                            = CYLINDER
    GeometryMajorRadius                 = 20.0
    GeometryMinorRadius                 = 20.0
    GeometryHeight                      = 20.0
    GeometryIsSmall                     = No

    Shadow                              = SHADOW_DECAL
    ShadowSizeX                         = 22
    ShadowSizeY                         = 18
    ShadowOffsetX                       = -1
    ShadowTexture                       = ShadowSpider2
End





ChildObject GiantSpider_Slaved GiantSpider
    EquivalentTo                        = GiantSpider

    ;/////////////////////////
    ;// PARAMÈTRES GÉNÉRAUX //
    ;/////////////////////////
    
    VisionRange                         = GENERIC_CREEP_VISION
    
    Side                                = Obsolete
    EditorSorting                       = SYSTEM
    
    CommandPoints                       = 0



    ;//////////////////////
    ;// PARAMÈTRES AUDIO //
    ;//////////////////////
    
    EvaEnemyObjectSightedEvent          = DiscoveredEnemySpiderlings
    EvaEnemyObjectSightedAfterRespawnEvent = DiscoveredEnemySpiderlings



    ;/////////////////////////////
    ;// PARAMÈTRES D'INGÉNIERIE //
    ;/////////////////////////////
    
    KindOf                              = PRELOAD SELECTABLE CAVALRY PATH_THROUGH_EACH_OTHER PATH_THROUGH_INFANTRY GRAB_AND_DROP HAS_HEALTH_BAR CREEP SCORE CAN_CLIMB_WALLS



    ;/////////////
    ;// ESCLAVE //
    ;/////////////
    
    Behavior                            = SlavedUpdate ModuleTag_Slave
        GuardMaxRange                       = 350.0
        GuardWanderRange                    = 100.0
        UseSlaverAsControlForEvaObjectSightedEvents = Yes
    End
End