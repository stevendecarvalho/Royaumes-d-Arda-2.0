;////////////////////////////////////////////////////////////////////////////////////
;////////////////////////////////////////////////////////////////////////////////////
;/////																			/////
;/////							    BATTLE FLAG						            /////
;/////																			/////
;////////////////////////////////////////////////////////////////////////////////////
;////////////////////////////////////////////////////////////////////////////////////

Object BattleFlag
    
    ;////////////////////////////
    ;// PARAMÈTRES ARTISTIQUES //
    ;////////////////////////////
    
    Draw                                = W3DScriptedModelDraw ModuleTag_Draw
        OkToChangeModelColor                = Yes
        UseStandardModelNames               = Yes
        StaticModelLODMode                  = Yes

        DefaultModelConditionState
            Model                               = NBBtlFlag
        End
        
        IdleAnimationState
        End
        
        ;// Modèle : En attente de construction
        ModelConditionState                 = AWAITING_CONSTRUCTION
            Model                               = NBBtlFlag_A
        End
        AnimationState                      = AWAITING_CONSTRUCTION
            Animation                           = NBBtlFlag_A
                AnimationName                       = NBBtlFlag_A.NBBtlFlag_A
                AnimationMode                       = MANUAL
            End
            Flags                               = START_FRAME_FIRST
        End
        ModelConditionState                 = ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
            Model                               = NBBtlFlag_A
            ParticleSysBone                     = DUSTBONE BuildingContructDust
        End;
        AnimationState                      = ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
            Animation                           = NBBtlFlag_A
                AnimationName                       = NBBtlFlag_A.NBBtlFlag_A
                AnimationMode                       = MANUAL
            End
            Flags                               = START_FRAME_FIRST
            StateName                           = BeingConstructed
            BeginScript
                CurDrawablePlaySound("GondorBarracksBeginConstruction")
                CurDrawableHideSubObjectPermanently("V1")
                CurDrawableHideSubObjectPermanently("V2")
            EndScript
        End
        
        ;// Modèle : Détruit
        ModelConditionState                 = DESTROYED_FRONT
            Model                               = NBBtlFlag_D1
            ParticleSysBone                     FireSmall01 FireBuildingSmall
            ParticleSysBone                     FireSmall02 FireBuildingLarge
            ParticleSysBone                     FireMedium01 FireBuildingMedium
            ParticleSysBone                     FireLarge01 FireBuildingLarge
            ParticleSysBone                     SmokeLarge01 SmokeBuildingLarge
        End
        AnimationState                      = DESTROYED_FRONT
            BeginScript
                CurDrawableHideSubObject("GBWorkshop_D2a")
            EndScript
        End
        ModelConditionState                 = DESTROYED_RIGHT
            Model                               = NBBtlFlag_D1
            ParticleSysBone                     FireSmall01 FireBuildingSmall
            ParticleSysBone                     FireSmall02 FireBuildingLarge
            ParticleSysBone                     FireMedium01 FireBuildingMedium
            ParticleSysBone                     FireLarge01 FireBuildingLarge
            ParticleSysBone                     SmokeLarge01 SmokeBuildingLarge
        End
        AnimationState                      = DESTROYED_RIGHT
            BeginScript
                CurDrawableHideSubObject("GBWorkshop_D2b")
            EndScript
        End
        ModelConditionState                 = DESTROYED_BACK
            Model                               = NBBtlFlag_D1
            ParticleSysBone                     FireSmall01 FireBuildingSmall
            ParticleSysBone                     FireSmall02 FireBuildingLarge
            ParticleSysBone                     FireMedium01 FireBuildingMedium
            ParticleSysBone                     FireLarge01 FireBuildingLarge
            ParticleSysBone                     SmokeLarge01 SmokeBuildingLarge
        End
        AnimationState                      = DESTROYED_BACK
            BeginScript
                CurDrawableHideSubObject("GBWorkshop_D2c")
            EndScript
        End
        ModelConditionState                 = DESTROYED_LEFT
            Model                               = NBBtlFlag_D1
            ParticleSysBone                     FireSmall01 FireBuildingSmall
            ParticleSysBone                     FireSmall02 FireBuildingLarge
            ParticleSysBone                     FireMedium01 FireBuildingMedium
            ParticleSysBone                     FireLarge01 FireBuildingLarge
            ParticleSysBone                     SmokeLarge01 SmokeBuildingLarge
        End
        AnimationState                      = DESTROYED_LEFT
            BeginScript
                CurDrawableHideSubObject("GBWorkshop_D2d")
            EndScript
        End
        
        ;// Modèle : Endommagé
        ModelConditionState                 = DAMAGED
            Model                               = NBBtlFlag_D1
            ParticleSysBone                     FireSmall01 FireBuildingSmall
            ParticleSysBone                     FireSmall02 FireBuildingSmall
            ParticleSysBone                     FireMedium01 FireBuildingMedium
            ParticleSysBone                     FireLarge01 FireBuildingLarge
            ParticleSysBone                     SmokeLarge01 SmokeBuildingLarge
        End
        AnimationState                      = DAMAGED
            EnteringStateFX                     = FX_BuildingDamaged
        End
        
        ;// Modèle : Très endommagé
        ModelConditionState                 = REALLYDAMAGED
            Model                               = NBBtlFlag_D2
            ParticleSysBone                     FireSmall01 FireBuildingSmall
            ParticleSysBone                     FireSmall02 FireBuildingLarge
            ParticleSysBone                     FireMedium01 FireBuildingMedium
            ParticleSysBone                     FireLarge01 FireBuildingLarge
            ParticleSysBone                     SmokeLarge01 SmokeBuildingLarge
        End
        AnimationState                      = REALLYDAMAGED
            EnteringStateFX                     = FX_BuildingReallyDamaged
        End
        
        ;// Modèle : Décombres
        ModelConditionState                 = RUBBLE
            Model                               = NBBtlFlag_D2
            ParticleSysBone                     SmokeLarge01 SmokeBuildingLarge
        End
        AnimationState                      = RUBBLE
            BeginScript
                CurDrawableHideSubObject("GBWorkshop_D2a")
                CurDrawableHideSubObject("GBWorkshop_D2b")
                CurDrawableHideSubObject("GBWorkshop_D2c")
                CurDrawableHideSubObject("GBWorkshop_D2d")
            EndScript
        End
        ModelConditionState                 = POST_RUBBLE
            Model                               = None
            ParticleSysBone                     NONE SmokeBuildingMediumRubble
        End
        AnimationState                      = POST_RUBBLE
        End
        ModelConditionState                 = POST_COLLAPSE
            Model                               = None
            ParticleSysBone                     NONE SmokeBuildingMediumRubble
        End
        AnimationState                      = POST_COLLAPSE
        End
    End



    ;/////////////////////////
    ;// PARAMÈTRES GÉNÉRAUX //
    ;/////////////////////////

    DisplayName                         = OBJECT:BattleFlag
    Description                         = OBJECT:BattleFlagDescription
    PlacementViewAngle                  = 0

    BuildCost                           = 2000
    BuildTime                           = 45
    VisionRange                         = 160.0                                         ;// Distance pour voir les ennemis
    ShroudClearingRange                 = 160.0                                         ;// Rayon qui dévoile le brouillard
    BountyValue                         = 50

    Side                                = Neutral
    EditorSorting                       = SYSTEM
    ThreatLevel                         = 1                                             ;// Niveau de menace de l'unité pour l'IA

    CommandSet                          = GondorWorkshopCommandSet



    ;/////////////////////
    ;// ARMES & ARMURES //
    ;/////////////////////
    
    ArmorSet
        Conditions                          = None
        Armor                               = RDA_GENERIC_BUILDINGS_ARMOR
    End



    ;//////////////////////
    ;// PARAMÈTRES AUDIO //
    ;//////////////////////
    
    #include "..\Includes\StandardBuildingEvaEvents.inc"
    
    VoiceSelect                         = GondorWorkshopSelect
    
    SoundOnDamaged                      = BuildingLightDamageStone
    SoundOnReallyDamaged                = BuildingHeavyDamageStone
    
    VoiceSelectUnderConstruction        = BuildingGoodVoiceSelectUnderConstruction
    
    UnitSpecificSounds
        UnderConstruction                   = BuildingConstructionLoop
        UnderRepairFromRubble               = BuildingConstructionLoop
    End
    CampnessValue                       = CAMPNESS_TECH_BUILDING



    ;/////////////////////////////
    ;// PARAMÈTRES D'INGÉNIERIE //
    ;/////////////////////////////
    
    RadarPriority                       = STRUCTURE
    KindOf                              = PRELOAD STRUCTURE SELECTABLE IMMOBILE SCORE NEED_BASE_FOUNDATION MP_COUNT_FOR_VICTORY AUTO_RALLYPOINT FS_FACTORY
    
    Behavior                            = GettingBuiltBehavior GetBuiltBehaviorTag
        WorkerName                          = GondorWorkerNoSelect
    End
    
    Behavior                            = BuildingBehavior BuildingModuleTag
    End
    
    Behavior                            = StructureCollapseUpdate ModuleTag_06
        MinCollapseDelay                    = 000
        MaxCollapseDelay                    = 000
        CollapseDamping                     = .5
        MaxShudder                          = 0.6
        MinBurstDelay                       = 250
        MaxBurstDelay                       = 800
        BigBurstFrequency                   = 4
        FXList                              = INITIAL FX_StructureMediumCollapse
        FXList                              = ALMOST_FINAL FX_StructureAlmostCollapse
        DestroyObjectWhenDone               = Yes
        CollapseHeight                      = 120
    End



    ;/////////////////////////
    ;// PARAMÈTRES DE SANTÉ //
    ;/////////////////////////
    
    Body                                = StructureBody ModuleTag_05
        MaxHealth                           = 3000
        MaxHealthDamaged                    = 2000
        MaxHealthReallyDamaged              = 1000
    End



    ;////////////////
    ;// RESSOURCES //
    ;////////////////
    
    Behavior                            = TerrainResourceBehavior ModuleTag_NewMoneyDeadSpot
        Radius                              = 50
        MaxIncome                           = 0
        IncomeInterval                      = 999999
        HighPriority                        = Yes
    End



    ;////////////////
    ;// PRODUCTION //
    ;////////////////
    
    Behavior                            = ProductionUpdate ProductionUpdateModuleTag
    End
    
    Behavior                            = QueueProductionExitUpdate QueueProductionModuleTag
        UnitCreatePoint                     = X:14.8616     Y:-0.1480       Z:0.0
        NaturalRallyPoint                   = X:56.0        Y:-0.1480       Z:0.0
        ExitDelay                           = 50
    End



    ;/////////////////////////////
    ;// PARAMÈTRES DE GÉOMÉTRIE //
    ;/////////////////////////////
    
    Geometry                            = BOX
    GeometryName                        = Geom_Orig
    GeometryMajorRadius                 = 50.0
    GeometryMinorRadius                 = 37.5
    GeometryHeight                      = 25.0
    GeometryOffset                      = X:5 Y:0 Z:0
    
    AdditionalGeometry                  = BOX
    GeometryName                        = Geom_Orig
    GeometryMajorRadius                 = 12.5
    GeometryMinorRadius                 = 37.5
    GeometryHeight                      = 50.0
    GeometryOffset                      = X:-30 Y:0 Z:0
    
    AdditionalGeometry                  = BOX
    GeometryName                        = Geom_V2
    GeometryMajorRadius                 = 50.0
    GeometryMinorRadius                 = 37.5
    GeometryHeight                      = 25.0
    GeometryOffset                      = X:5 Y:0 Z:0
    
    AdditionalGeometry                  = BOX
    GeometryName                        = Geom_V2
    GeometryMajorRadius                 = 12.5
    GeometryMinorRadius                 = 37.5
    GeometryHeight                      = 80.0
    GeometryOffset                      = X:-30 Y:0 Z:0
    
    GeometryIsSmall                     = No
    Shadow                              = SHADOW_VOLUME
    BuildCompletion                     = PLACED_BY_PLAYER
    
    GeometryContactPoint                = X:-48.348 Y:26.9 Z:0 Repair
    GeometryContactPoint                = X:47.546 Y:-38.677 Z:0 Repair
    GeometryContactPoint                = X:47.546 Y:36.435 Z:0
    GeometryContactPoint                = X:-32.763 Y:-46.121 Z:0
    GeometryContactPoint                = X:26.753 Y:26.753 Z:67.933 Swoop
End