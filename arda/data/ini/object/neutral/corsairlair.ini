;////////////////////////////////////////////////////////////////////////////////////
;////////////////////////////////////////////////////////////////////////////////////

Object CorsairLair
    SelectPortrait                      = BPMTavern
    
    ;////////////////////////////
    ;// PARAMÈTRES ARTISTIQUES //
    ;////////////////////////////
    
    Draw                                = W3DScriptedModelDraw ModuleTag_Draw
        OkToChangeModelColor                = Yes
        UseStandardModelNames               = Yes
        StaticModelLODMode                  = Yes
        ExtraPublicBone                     = ARROW01
        ExtraPublicBone                     = ARROW02
        ExtraPublicBone                     = ARROW03
        ExtraPublicBone                     = ARROW04
        
        DefaultModelConditionState
            Model                               = MBTavern_SKN
            WeaponLaunchBone                    = PRIMARY ARROW
        End
        
        ;// Modèle : Curseur
        AnimationState                      = BUILD_PLACEMENT_CURSOR
            BeginScript
                CurDrawableHideSubObject("V1")
                CurDrawableHideSubObject("V2")
                CurDrawableHideSubObject("V2FLAG")
                CurDrawableHideSubObject("MUCORSAIR")
                CurDrawableHideSubObject("FXFIRE02")
                CurDrawableHideSubObject("FXGLOWCARDS")
            EndScript
        End
        
        ;// Modèle : Structure fantôme
        AnimationState                      = PHANTOM_STRUCTURE
            BeginScript
                CurDrawableHideSubObject("V1")
                CurDrawableHideSubObject("V2")
                CurDrawableHideSubObject("V2FLAG")
                CurDrawableHideSubObject("MUCORSAIR")
                CurDrawableHideSubObject("FXFIRE02")
                CurDrawableHideSubObject("FXGLOWCARDS")
            EndScript
        End
        
        IdleAnimationState
            Animation                           = IdleA
                AnimationName                       = MBTavern_SKL.MBTavern_IDLB
                AnimationMode                       = ONCE
                AnimationPriority                   = 1
            End
            Animation                           = IdleB
                AnimationName                       = MBTavern_SKL.MBTavern_IDLA
                AnimationMode                       = ONCE
                AnimationPriority                   = 1
            End
            ParticleSysBone                     FXSmokeBone Smokechimney
        End
        
        ;// Modèle : En attente de construction
        ModelConditionState                 = SNOW AWAITING_CONSTRUCTION
            Model                               = MBTavern_ASKN
            Texture                             = MBTavern.tga MBTavern_snow.tga
            Texture                             = MBTavernWD.tga MBBarcade_Snow.tga
        End
        ModelConditionState                 = AWAITING_CONSTRUCTION
            Model                               = MBTavern_ASKN
        End
        AnimationState                      = AWAITING_CONSTRUCTION
            Animation                           = MBTavern_ABLD
                AnimationName                       = MBTavern_ASKL.MBTavern_ABLD
                AnimationMode                       = MANUAL
            End
            Flags                               = START_FRAME_FIRST
        End
        ModelConditionState                 = SNOW ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
            Model                               = MBTavern_ASKN
            Texture                             = MBTavern.tga MBTavern_snow.tga
            Texture                             = MBTavernWD.tga MBBarcade_Snow.tga
        End
        ModelConditionState                 = ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
            Model                               = MBTavern_ASKN
            ParticleSysBone                     = DUSTBONE BuildingContructDust
        End
        AnimationState                      = ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
            Animation                           = MBTavern_ABLD
                AnimationName                       = MBTavern_ASKL.MBTavern_ABLD
                AnimationMode                       = MANUAL
            End
            Flags                               = START_FRAME_FIRST
            StateName                           = BeingConstructed
            BeginScript
                CurDrawablePlaySound("GondorBarracksBeginConstruction")
            EndScript
        End
        
        ;// Modèle : Endommagé
        ModelConditionState                 = DAMAGED
            Model                               = MBTavern_D1
            ParticleSysBone                     FireSmall01 FireBuildingSmall
            ParticleSysBone                     FireSmall02 FireBuildingSmall
            ParticleSysBone                     FireMedium01 FireBuildingMedium
            ParticleSysBone                     FireLarge01 FireBuildingLarge
            ParticleSysBone                     SmokeLarge01 SmokeBuildingLarge
        End
        AnimationState                      = DAMAGED
            EnteringStateFX                     = FX_BuildingDamaged
        End
        
        ;// Modèle : Très endommagé    
        ModelConditionState                 = REALLYDAMAGED
            Model                               = MBTavern_D2
            ParticleSysBone                     FireSmall01 FireBuildingSmall
            ParticleSysBone                     FireSmall02 FireBuildingLarge
            ParticleSysBone                     FireMedium01 FireBuildingMedium
            ParticleSysBone                     FireLarge01 FireBuildingLarge
            ParticleSysBone                     SmokeLarge01 SmokeBuildingLarge
        End
        AnimationState                      = REALLYDAMAGED
            Animation                           = RubbleAnimation
                AnimationName                       = MBTavern_D2.MBTavern_D2
                AnimationMode                       = ONCE
            End
            EnteringStateFX                     = FX_BuildingReallyDamaged
        End
        
        ;// Modèle : Décombres
        ModelConditionState                 = RUBBLE
            Model                               = MBTavern_D3
            ParticleSysBone                     SmokeLarge01 SmokeBuildingLarge
        End
        AnimationState                      = RUBBLE
            Animation                           = RubbleAnimation
                AnimationName                       = MBTavern_D3.MBTavern_D3
                AnimationMode                       = ONCE
            End
            EnteringStateFX                     = FX_StructureMediumCollapse
        End
        ModelConditionState                 = POST_RUBBLE
            Model                               = None
            ParticleSysBone                     NONE SmokeBuildingMediumRubble
        End
        AnimationState                      = POST_RUBBLE
        End
        ModelConditionState                 = POST_COLLAPSE
            Model                               = None
            ParticleSysBone                     NONE SmokeBuildingMediumRubble
        End
        AnimationState                      = POST_COLLAPSE
        End
        
        ;// Modèle : Enneigé
        ModelConditionState                 = SNOW
            Model                               = MBTavern_SKN
            Texture                             = MBTavern.tga MBTavern_snow.tga
            Texture                             = MBTavernWD.tga MBTavernWD_Snow.tga
        End
    End
    
    ;// Modèle : Sol
    Draw                                = W3DFloorDraw ModuleTag_DrawFloor
        StaticModelLODMode                  = Yes
        ModelName                           = MBTavern_Bib
        WeatherTexture                      = SNOWY MBTavern_Bib_S.tga
        HideIfModelConditions               = AWAITING_CONSTRUCTION
        HideIfModelConditions               = PARTIALLY_CONSTRUCTED
    End
    
    ;// Modèle : Allégeance naturelle
    Draw                                = W3DScriptedModelDraw UntamedAllegianceFX
        DefaultModelConditionState
            Model                               = None
        End
        AnimationState                      = USER_2
            ParticleSysBone                     = None UntamedAllegiance HouseColor:Yes
            ParticleSysBone                     = None UntamedAllegiance2 HouseColor:Yes
        End
    End



    ;/////////////////////////
    ;// PARAMÈTRES GÉNÉRAUX //
    ;/////////////////////////

    DisplayName                         = OBJECT:MordorTavern
    Description                         = OBJECT:MordorTavernDescription
    PlacementViewAngle                  = 0

    BuildTime                           = 30
    VisionRange                         = 160.0                                         ;// Distance pour voir les ennemis
    ShroudClearingRange                 = 160.0                                         ;// Rayon qui dévoile le brouillard

    Side                                = Neutral
    IsTrainable                         = No
    EditorSorting                       = STRUCTURE
    IsTrainable                         = No
    ThreatLevel                         = 1                                             ;// Niveau de menace de l'unité pour l'IA

    CommandSet                          = EmptyCommandSet



    ;/////////////////
    ;// COMMANDSETS //
    ;/////////////////
    
    Behavior                            = CommandSetUpgrade ModueTag_FactionCommandSet
        TriggeredBy                         = Upgrade_AngmarFaction Upgrade_IsengardFaction Upgrade_MordorFaction Upgrade_WildFaction Upgrade_MenFaction Upgrade_ElfFaction Upgrade_DwarfFaction
        CommandSet                          = NeutralCorsairLairCommandSet
        CustomAnimAndDuration               = AnimState:USER_2 AnimTime:0
    End



    ;/////////////////////
    ;// ARMES & ARMURES //
    ;/////////////////////
    
    ArmorSet
        Conditions                          = None
        Armor                               = RDA_GENERIC_BUILDINGS_ARMOR
    End



    ;//////////////////////
    ;// PARAMÈTRES AUDIO //
    ;//////////////////////
    
    VoiceSelect                         = CreepBuildingGenericSelect
    
    SoundOnDamaged                      = BuildingLightDamageStone
    SoundOnReallyDamaged                = BuildingHeavyDamageStone



    ;/////////////////////////////
    ;// PARAMÈTRES D'INGÉNIERIE //
    ;/////////////////////////////

    RadarPriority                       = STRUCTURE
    KindOf                              = PRELOAD STRUCTURE IMMOBILE SELECTABLE SCORE FS_FACTORY AUTO_RALLYPOINT IGNORE_FOR_VICTORY
    
    Behavior                            = GettingBuiltBehavior ModuleTag_04
        RebuildWhenDead                     = Yes
        SelfBuildingLoop                    = BuildingConstructionLoop
        SelfRepairFromDamageLoop            = NoSound
        SelfRepairFromRubbleLoop            = BuildingConstructionLoop
        DisallowRebuildRange                = 300
        DisallowRebuildFilter               = ANY +STRUCTURE
        UseSpawnTimerWithoutWorker          = Yes
        SpawnTimer                          = 300
    End
    
    Behavior                            = KeepObjectDie ModuleTag_IWantRubble
    End
    
    Behavior                            = StructureCollapseUpdate ModuleTag_Collapse
        MinCollapseDelay                    = 000
        MaxCollapseDelay                    = 000
        CollapseDamping                     = .5
        MaxShudder                          = 0.6
        MinBurstDelay                       = 250
        MaxBurstDelay                       = 800
        BigBurstFrequency                   = 4
        FXList                              = INITIAL FX_StructureMediumCollapse
        FXList                              = ALMOST_FINAL FX_StructureAlmostCollapse
        DestroyObjectWhenDone               = Yes
        CollapseHeight                      = 120
    End
    
    Behavior                            = RebuildHoleExposeDie ModuleTag_ExposeDie
        ExemptStatus                        = SOLD
        HoleName                            = CorsairLairHole
        HoleMaxHealth                       = 500.0
        FadeInTimeSeconds                   = 2.0
        TransferAttackers                   = No
    End



    ;/////////////////////////
    ;// PARAMÈTRES DE SANTÉ //
    ;/////////////////////////
    
    Body                                = ActiveBody ModuleTag_Body
        MaxHealth                           = 2000
        MaxHealthDamaged                    = 1000
        MaxHealthReallyDamaged              = 500
    End



    ;////////////////
    ;// RESSOURCES //
    ;////////////////
    
    Behavior                            = TerrainResourceBehavior ModuleTag_NewMoneyDeadSpot
        Radius                              = 80
        MaxIncome                           = 0
        IncomeInterval                      = 999999
        HighPriority                        = Yes
    End



    ;////////////////
    ;// PRODUCTION //
    ;////////////////
    
    Behavior                            = ProductionUpdate ProductionUpdateModuleTag
        NumDoorAnimations                   = 0
        DoorOpeningTime                     = 3250
        DoorWaitOpenTime                    = 2000
        DoorCloseTime                       = 4000
        ConstructionCompleteDuration        = 1500
    End
    
    Behavior                            = QueueProductionExitUpdate ModuleTag_Exit
        UnitCreatePoint                     = X:14.8616 Y:-0.1480 Z:0.0
        NaturalRallyPoint                   = X:100.0 Y:-0.1480 Z:0.0
        ExitDelay                           = STANDARD_HORDE_EXIT_DELAY
    End



    ;////////////////
    ;// PATROUILLE //
    ;////////////////
    
    Behavior                            = SpawnBehavior ModuleTag_Spawn
        SpawnNumber                         = 10
        InitialBurst                        = 10
        SpawnTemplateName                   = MordorCorsairsOfUmbar_Creep
        SpawnReplaceDelay                   = 30000
        CanReclaimOrphans                   = Yes
    End



    ;//////////////////////////
    ;// ALLÉGEANCE NATURELLE //
    ;//////////////////////////

    Behavior                            = FireWeaponUpdate ModuleTag_CreepKiller
        FireWeaponNugget
            WeaponName                          = WildAllegianceCreepKiller
            FireDelay                           = 0
            OneShot                             = No
        End
    End
    
    Behavior                            = ObjectCreationUpgrade MakeTheMoneyMaker
        TriggeredBy                         = Upgrade_WildFaction
        Delay                               = 0.0
        DestroyWhenSold                     = Yes
        ThingToSpawn                        = CreepyMoneyMaker
        FadeInTime                          = 100
    End
    
    Behavior                            = SpawnBehavior ModuleTag_SpawnDefenders
        TriggeredBy                         = Upgrade_WildFaction
        SpawnNumber                         = 18
        InitialBurst                        = 18
        SpawnTemplateName                   = GoblinFighter_Patrol GoblinArcher_Patrol MoriaPikeman_Patrol
        SpawnReplaceDelay                   = 45000
        CanReclaimOrphans                   = Yes
    End
    
    Behavior                            = ObjectCreationUpgrade ModuleTag_TheObjectCreationUpgrade
        TriggeredBy                         = Upgrade_CreepShadowInFog
        ThingToSpawn                        = CorsairLairShadowInFog
    End



    ;/////////////////////////////
    ;// PARAMÈTRES DE GÉOMÉTRIE //
    ;/////////////////////////////
    
    Geometry                            = CYLINDER
    GeometryMajorRadius                 = 46.0
    GeometryMinorRadius                 = 46.0
    GeometryHeight                      = 57.0
    GeometryIsSmall                     = No
    GeometryOffset                      = X:0.8 Y:-6.5 Z:0
    
    GeometryContactPoint                = X: 15 Y: 15 Z:20 Swoop
    GeometryContactPoint                = X:-15 Y:-15 Z:20 Swoop
    GeometryContactPoint                = X:-15 Y: 15 Z:20 Swoop
    GeometryContactPoint                = X: 15 Y:-15 Z:20 Swoop
    
    Shadow                              = SHADOW_DECAL
    BuildCompletion                     = PLACED_BY_PLAYER
End





Object CorsairLairShadowInFog
    
    ;////////////////////////////
    ;// PARAMÈTRES ARTISTIQUES //
    ;////////////////////////////

    Draw                                = W3DScriptedModelDraw ModuleTag_01
        DefaultModelConditionState
            Model                               = NONE
        End
    End



    ;/////////////////////////
    ;// PARAMÈTRES GÉNÉRAUX //
    ;/////////////////////////

    ShroudClearingRange                 = 0



    ;/////////////////////////////
    ;// PARAMÈTRES D'INGÉNIERIE //
    ;/////////////////////////////

    KindOf                              = SELECTABLE IMMOBILE NOT_AUTOACQUIRABLE UNATTACKABLE REVEAL_TO_ALL CRATE ONE_RING



    ;/////////////////////////
    ;// PARAMÈTRES DE SANTÉ //
    ;/////////////////////////
    
    Body                                = StructureBody ModuleTag_05
        MaxHealth                           = 999999
    End



    ;/////////
    ;// OCL //
    ;/////////

    Behavior                            = CreateObjectDie ModuleTag_06
        DeathTypes                          = ALL
        CreationList                        = OCL_CorsairLairRealShadowInFog
    End



    ;///////////
    ;// TIMER //
    ;///////////

    Behavior                            = LifetimeUpdate ModuleTag_LifetimeUpdate
        MinLifetime                         = 0
        MaxLifetime                         = 0
    End



    ;////////////////
    ;// MORT LENTE //
    ;////////////////

    Behavior                            = SlowDeathBehavior ModuleTag_Fading
        DeathTypes                          = ALL
        FadeDelay                           = 0
        FadeTime                            = 0
        DestructionDelay                    = 0
    End
End





Object CorsairLairRealShadowInFog
    
    ;////////////////////////////
    ;// PARAMÈTRES ARTISTIQUES //
    ;////////////////////////////

    Draw                                = W3DScriptedModelDraw ModuleTag_01
        DefaultModelConditionState
            Model                               = MBTavern_SKN
            WeaponLaunchBone                    = PRIMARY ARROW
        End
        
        ;// Modèle : Enneigé
        ModelConditionState                 = SNOW
            Model                               = MBTavern_SKN
            Texture                             = MBTavern.tga MBTavern_snow.tga
            Texture                             = MBTavernWD.tga MBTavernWD_Snow.tga
        End
    End

    ;// Modèle : Sol
    Draw                                = W3DFloorDraw ModuleTag_DrawFloor
        StaticModelLODMode                  = Yes
        ModelName                           = MBTavern_Bib
        WeatherTexture                      = SNOWY MBTavern_Bib_S.tga
        HideIfModelConditions               = AWAITING_CONSTRUCTION
        HideIfModelConditions               = PARTIALLY_CONSTRUCTED
    End



    ;/////////////////////////
    ;// PARAMÈTRES GÉNÉRAUX //
    ;/////////////////////////
    
    VisionRange                         = 0
    ShroudClearingRange                 = 0



    ;/////////////////////////////
    ;// PARAMÈTRES D'INGÉNIERIE //
    ;/////////////////////////////

    KindOf                              = PRELOAD STRUCTURE SELECTABLE IMMOBILE NEED_BASE_FOUNDATION MADE_OF_STONE CAN_SEE_THROUGH_STRUCTURE IGNORE_FOR_VICTORY FS_FACTORY NOT_AUTOACQUIRABLE NEVER_CULL_FOR_MP NOT_SELLABLE



    ;/////////////////////////
    ;// PARAMÈTRES DE SANTÉ //
    ;/////////////////////////
    
    Body                                = StructureBody ModuleTag_05
