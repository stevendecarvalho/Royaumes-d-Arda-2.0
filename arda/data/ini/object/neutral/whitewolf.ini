Object WhiteWolf
    Scale                               = 1.09
    ButtonImage                         = UIMMGolfimbulWolves
    SelectPortrait                      = UPMMWhiteWolves
    
    ;////////////////////////////
    ;// PARAMÈTRES ARTISTIQUES //
    ;////////////////////////////
    
    Draw                                = W3DHordeModelDraw ModuleTag_01
        OkToChangeModelColor                = Yes
        StaticModelLODMode                  = Yes
        
        LodOptions                          = LOW
            AllowMultipleModels                 = ALLOW_MULTIPLE_MODELS_LOW
            MaxRandomTextures                   = 4
            MaxRandomAnimations                 = MAX_RANDOM_ANIMATIONS_LOW
            MaxAnimFrameDelta                   = MAX_ANIM_FRAME_DELTA_LOW
        End
        LodOptions                          = MEDIUM
            AllowMultipleModels                 = ALLOW_MULTIPLE_MODELS_MED
            MaxRandomTextures                   = 4
            MaxRandomAnimations                 = MAX_RANDOM_ANIMATIONS_MED
            MaxAnimFrameDelta                   = MAX_ANIM_FRAME_DELTA_MED
        End
        LodOptions                          = HIGH
            AllowMultipleModels                 = ALLOW_MULTIPLE_MODELS_HIGH
            MaxRandomTextures                   = 4
            MaxRandomAnimations                 = MAX_RANDOM_ANIMATIONS_HIGH
            MaxAnimFrameDelta                   = MAX_ANIM_FRAME_DELTA_HIGH
        End        
        
        DefaultModelConditionState
            Model                               = wuwolf
            Skeleton                            = IUWarg_SKL
        End
		
		;// Animations : Chutes
        AnimationState                      = PASSENGER
            Animation                           = Grabbed
                AnimationName                       = IUWarg_GBDA
                AnimationMode                       = LOOP
            End
        End
        AnimationState                      = FREEFALL
            Animation                           = freefall
                AnimationName                       = IUWarg_FLYA
                AnimationMode                       = LOOP
                AnimationBlendTime                  = 10
            End
        End
		
		;// Animations : Morts dans les airs
        AnimationState                      = STUNNED_FLAILING
            Animation                           = JustDie
                AnimationName                       = IUWarg_FLYA
                AnimationMode                       = LOOP
            End
        End
		
		;// Animations : Morts
        AnimationState                      = DYING DEATH_2
            Animation                           = Splatted_On_Ground
                AnimationName                       = IUWarg_IDLA
                AnimationMode                       = LOOP
            End
        End
        AnimationState                      = DYING SPLATTED
            Animation                           = splatted
                AnimationName                       = IUWarg_LNDA
                AnimationMode                       = ONCE
            End
        End
        AnimationState                      = DYING
            Animation                           = JustDie
                AnimationName                       = IUWarg_DIEA
                AnimationMode                       = ONCE
            End
        End
		
		;// Animations : Paralysies
        AnimationState                      = STUNNED
            Animation                           = Land
                AnimationName                       = IUWarg_LNDA
                AnimationMode                       = ONCE
            End
        End
        AnimationState                      = STUNNED_STANDING_UP
            Animation                           = StandUp
                AnimationName                       = IUWarg_GTPA
                AnimationMode                       = ONCE
            End
        End
		
		;// Animations : Déplacements
        AnimationState                      = TURN_LEFT_HIGH_SPEED
            Animation                           = MTurnLeft
                AnimationName                       = IUWarg_TNL1
                AnimationMode                       = LOOP
            End
            ParticleSysBone                     = None InfantryDustTrails
        End
        AnimationState                      = TURN_RIGHT_HIGH_SPEED
            Animation                           = MTurnRight
                AnimationName                       = IUWarg_TNR1
                AnimationMode                       = LOOP
            End
            ParticleSysBone                     = None InfantryDustTrails
        End
        AnimationState                      = TURN_LEFT
            Animation                           = TurnRight
                AnimationName                       = IUWarg_TRNL
                AnimationMode                       = LOOP
                AnimationSpeedFactorRange           = 1.0 1.0
            End
            ParticleSysBone                     = None InfantryDustTrails
        End
        AnimationState                      = TURN_RIGHT
            Animation                           = TurnRight
                AnimationName                       = IUWarg_TRNR
                AnimationMode                       = LOOP
                AnimationSpeedFactorRange           = 1.0 1.0
            End
            ParticleSysBone                     = None InfantryDustTrails
        End
        AnimationState                      = MOVING ACCELERATE
            Animation                           = Accelerate
                AnimationName                       = IUWarg_ACCL
                AnimationMode                       = ONCE
            End
            ParticleSysBone                     = None InfantryDustTrails
        End
        AnimationState                      = MOVING DECELERATE
            Animation                           = Decelerate
                AnimationName                       = IUWarg_DECL
                AnimationMode                       = ONCE
            End
            ParticleSysBone                     = None InfantryDustTrails
        End
        AnimationState                      = MOVING
            ShareAnimation                      = Yes
            Animation                           = RunA
                AnimationName                       = IUWarg_RUNA
                AnimationMode                       = LOOP
            End
            ParticleSysBone                     = None InfantryDustTrails
        End
        AnimationState                      = MOVING BACKING_UP
            Animation                           = BackingUp
                AnimationName                       = IUWarg_BAKA
                AnimationMode                       = LOOP
            End
        End
        AnimationState                      = MOVING ATTACKING
            ShareAnimation                      = Yes
            Animation                           = RunA
                AnimationName                       = IUWarg_RUNA
                AnimationMode                       = LOOP
            End
            ParticleSysBone                     = None InfantryDustTrails
        End
        AnimationState                      = MOVING LEASHED_RETURNING
            ShareAnimation                      = Yes
            Animation                           = RunA
                AnimationName                       = IUWarg_RUNA
                AnimationMode                       = LOOP
            End
            ParticleSysBone                     = None InfantryDustTrails
        End
        AnimationState                      = MOVING
            ShareAnimation                      = Yes
            Animation                           = WalkA
                AnimationName                       = IUWarg_WLKA
                AnimationMode                       = LOOP
                AnimationBlendTime                  = 10
                AnimationPriority                   = 10
                Distance                            = 30
            End
            Animation                           = WalkB
                AnimationName                       = IUWarg_WLKB
                AnimationMode                       = LOOP
                AnimationBlendTime                  = 10
                AnimationPriority                   = 3
                Distance                            = 30
            End
            Animation                           = WalkC
                AnimationName                       = IUWarg_WLKC
                AnimationMode                       = LOOP
                AnimationBlendTime                  = 10
                AnimationPriority                   = 3
                Distance                            = 30
            End
            ParticleSysBone                     = None InfantryDustTrails
        End
		
		;// Animations : Attaques
        AnimationState                      = BETWEEN_FIRING_SHOTS_A
            Animation                           = BetweenFiringShots
                AnimationName                       = IUWarg_IDLA
                AnimationMode                       = LOOP
                AnimationBlendTime                  = 10
            End
        End
        AnimationState                      = FIRING_OR_PREATTACK_A
            Animation                           = AttackA3
                AnimationName                       = IUWarg_ATKA
                AnimationMode                       = ONCE
                UseWeaponTiming                     = Yes
                AnimationBlendTime                  = 10
            End
        End
        AnimationState                      = ATTACKING
            Animation                           = AttackA3
                AnimationName                       = IUWarg_ATKA
                AnimationMode                       = LOOP
                AnimationBlendTime                  = 10
            End
        End
		
		;// Animations : Émotions
        AnimationState                      = WAR_CHANT
            Animation                           = Chant
                AnimationName                       = IUWarg_TNTA
                AnimationMode                       = LOOP
                AnimationPriority                   = 2
            End
        End
        AnimationState                      = EMOTION_TAUNTING
            Animation                           = TNTA
                AnimationName                       = IUWarg_TNTA
                AnimationMode                       = LOOP
                AnimationPriority                   = 2
            End
        End
        AnimationState                      = EMOTION_CELEBRATING
            Animation                           = CHRA
                AnimationName                       = IUWarg_CHRA
                AnimationMode                       = ONCE
            End
        End
        AnimationState                      = EMOTION_ALERT
            StateName                           = STATE_Ready
            Animation                           = ALERT
                AnimationName                       = IUWarg_IDLA
                AnimationMode                       = LOOP
            End
            BeginScript
                Prev                                = CurDrawablePrevAnimationState()
                if Prev                             = = "Selected" then CurDrawableSetTransitionAnimState("Selected_to_Ready") end
            EndScript
        End
        AnimationState                      = SELECTED
            SimilarRestart                      = Yes
            Animation                           = AtAttention
                AnimationName                       = IUWarg_ATNB
                AnimationMode                       = LOOP
            End
            StateName                           = Selected
            BeginScript
                Prev                                = CurDrawablePrevAnimationState()
                if Prev                             = = "Idle" then CurDrawableSetTransitionAnimState("Idle_to_Selected") end
                if Prev                             = = "STATE_Ready" then CurDrawableSetTransitionAnimState("Ready_to_Selected") end
            EndScript
        End
        
        IdleAnimationState
            Animation
                AnimationName                       = IUWarg_IDLC
                AnimationMode                       = ONCE
                AnimationBlendTime                  = 10
                AnimationPriority                   = 4
            End
            Animation
                AnimationName                       = IUWarg_IDLB
                AnimationMode                       = ONCE
                AnimationBlendTime                  = 10
                AnimationPriority                   = 5
            End
            Animation
                AnimationName                       = IUWarg_IDLD
                AnimationMode                       = ONCE
                AnimationBlendTime                  = 10
                AnimationPriority                   = 5
            End
            StateName                           = Idle
            BeginScript
                Prev                                = CurDrawablePrevAnimationState()
                if Prev                             = = "Selected" then CurDrawableSetTransitionAnimState("Selected_to_Idle") end
            EndScript
        End
		
		;// Transitions
        TransitionState                     = Selected_to_Idle
            Animation                           = ATNE
                AnimationName                       = IUWarg_ATNC
                AnimationMode                       = ONCE
                AnimationSpeedFactorRange           = 0.7 1.3
            End
        End
        TransitionState                     = Idle_to_Selected
            Animation                           = ATND
                AnimationName                       = IUWarg_ATNA
                AnimationMode                       = ONCE
                AnimationSpeedFactorRange           = 0.7 1.3
            End
        End
    End



    ;/////////////////////////
    ;// PARAMÈTRES GÉNÉRAUX //
    ;/////////////////////////

    DisplayName                         = OBJECT:WhiteWolf
    PlacementViewAngle                  = -90

    BuildCost                           = RDA_NEUTRAL_WHITEWOLF_BUILDCOST
    BuildTime                           = STANDARD_UNIT_BUILDTIME
    VisionRange                         = GENERIC_STANDARD_VISION                       ;// Distance pour voir les ennemis
    ShroudClearingRange                 = GENERIC_STANDARD_SHROUD_CLEAR                 ;// Rayon qui dévoile le brouillard
    ;VisionSide                          = GENERIC_UNIT_VISIONSIDE                      ;// Vision sur le côté
    ;VisionRear                          = GENERIC_UNIT_VISIONREAR                      ;// Vision derrière
    ;MaxVisionBonusPercent               = GENERIC_UNIT_MAXVISION%                      ;// Empêche la vision de devenir infinie
    ;VisionBonusTestRadius               = GENERIC_UNIT_VISIONBONUS                     ;// Vision bonus sur les collines
    ;VisionBonusPercentPerFoot           = GENERIC_UNIT_VISIONBONUSPERCENT              ;// Bonus de vision par unité en hauteur
    ;ShockwaveResistance                 = GENERIC_SHOCKWAVE_RESISTANCE_STRONG           ;// Résistance au choc
    BountyValue                         = RDA_NEUTRAL_WHITEWOLF_BOUNTY_VALUE                ;// Remboursement
    EmotionRange                        = 240

    Side                                = Neutral
    EditorSorting                       = UNIT
    ThreatLevel                         = 2.0                                           ;// Niveau de menace de l'unité pour l'IA
    ThingClass                          = CAVALRY_UNIT

    CrushableLevel                      = 2             ;// Est écrasé   - 0 : Infanterie / 1 : Arbres / 2 : Cavalerie / 3:Lourd
    CrusherLevel                        = 1             ;// Peut écraser - 0 : Animaux / 1 : Infanterie / 2 : Arbres / 3 : Cav
	UseCrushAttack			            = No				            ;// N'attaque pas en écrasant, écrase juste en marchant
    CrushWeapon                         = NeutralWargCrush              ;// Arme utilisé pour le piétinement
    ;CrushOnlyWhileCharging             = Yes                           ;// Le piétinement ne marche que pendant une charge
    MinCrushVelocityPercent             = 50%                           ;// Vitesse minimale pour écraser
    CrushDecelerationPercent            = 20                            ;// Perte de vitesse quand elle piétine
    ;CrushKnockback                      = 30                            ;// Valeur haute 50, plus les unités sont projetées loin
    ;CrushZFactor                        = 1.0                           ;// 0 = vol au sol / 1 = projection / >1 = spectaculaire
    ;CrushRevengeWeapon                  = RangedInfantryCrushRevenge   ;// Dégâts qu'inflige l'unité lorsqu'elle se fait écrasée
    RamPower                            = 30                            ;// Puissance de collision des monstres sur les structures
    RamZMult                            = 0.5                           ;// Soulèvement lors du choc, valeur haute soulève
    TransportSlotCount                  = TRANSPORTSLOTCOUNT_UNIT

    CommandPoints                       = GENERIC_STANDARD_10_UNIT
    CommandSet                          = GenericCommandSet



    ;/////////////////////
    ;// ARMES & ARMURES //
    ;/////////////////////
    
    WeaponSet
        Conditions                          = None
        Weapon                              = PRIMARY WargSentryWargWeapon
    End
    
    ArmorSet
