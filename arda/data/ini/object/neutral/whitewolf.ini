    #include "..\includes\StandardUnitEvaEvents.inc"
    
    VoiceSelect                         = MMWolfVoiceSelectMS
    VoiceMove                           = MMWolfVoiceMove
    VoiceAttack                         = MMWolfVoiceAttack
