    VoiceEnterStateMove                 = MMWolfVoiceEnterStateMove
    VoiceEnterStateMoveToCamp           = MMWolfVoiceEnterStateMoveCamp
    VoiceEnterStateRetreatToCastle      = MMWolfVoiceEnterStateDisengage
    
    SoundAmbient                        = WolfAmbienceVOX
