;/////				            TRÉSORS DES CREEPS						    	/////
;/////																			/////
;////////////////////////////////////////////////////////////////////////////////////
;////////////////////////////////////////////////////////////////////////////////////

Object CreepyMoneyMaker

    ;/////////////////////////
    ;// PARAMÈTRES GÉNÉRAUX //
    ;/////////////////////////

    VisionRange                         = 0                                             ;// Distance pour voir les ennemis
    ShroudClearingRange                 = 0                                             ;// Rayon qui dévoile le brouillard

    Side                                = Obsolete
    EditorSorting                       = SYSTEM
    Browser                             = SYSTEM
    ThreatLevel                         = 0                                             ;// Niveau de menace de l'unité pour l'IA

    ;/////////////////////
    ;// ARMES & ARMURES //
    ;/////////////////////
    
    ArmorSet
        Conditions                          = None
        Armor                               = PingArmor
        DamageFX                            = NormalDamageFX
    End



    ;//////////////////////
    ;// PARAMÈTRES AUDIO //
    ;//////////////////////
    
    EvaEnemyObjectSightedEvent          = None



    ;/////////////////////////////
    ;// PARAMÈTRES D'INGÉNIERIE //
    ;/////////////////////////////

    KindOf                              = NO_COLLIDE CREEP IGNORE_FOR_VICTORY IGNORE_FOR_EVA_SPEECH_POSITION
    
    Behavior                            = DestroyDie ModuleTag_Die
    End



    ;/////////////////////////
    ;// PARAMÈTRES DE SANTÉ //
    ;/////////////////////////
    
    Body                                = ActiveBody ModuleTag_Body
        MaxHealth                           = 1.0
    End



    ;///////////////////////////////
    ;// INTELLIGENCE ARTIFICIELLE //
    ;///////////////////////////////
    
    Behavior                            = AIUpdateInterface ModuleTag_AIUpdateInterface
        AutoAcquireEnemiesWhenIdle          = No
    End



    ;/////////////
    ;// ESCLAVE //
    ;/////////////

    Behavior                            = SlavedUpdate ModuleTag_Slave
        UseSlaverAsControlForEvaObjectSightedEvents = Yes
        DieOnMastersDeath                   = Yes
    End



    ;////////////////
    ;// RESSOURCES //
    ;////////////////
    
    ClientBehavior                      = TerrainResourceClientBehavior ModuleTag_NewMoneyClient
    End
    
    Behavior                            = TerrainResourceBehavior ModuleTag_CreepyMoney
        Radius                              = 60
        MaxIncome                           = 15
        IncomeInterval                      = 6000
    End



    ;/////////////////
    ;// RÉCOMPENSES //
    ;/////////////////
    
    Behavior                            = AttachUpdate ModuleTag_Attach
        ObjectFilter                        = NONE +BarrowWightLair +CaveTrollLair +CaveTrollLairSnow +WildStoneTrollLair +HillTrollLair +HillTrollLairSnow +WildHillTrollLair +AOTRJungleTrollLair +SnowTrollLair +JungleWargLair +WargLair +WargLair2 +WargLair3 +WargLair4 +WargLair5 +FireDrakeLair
        ScanRange                           = 20
        AlwaysTeleport                      = No
        AnchorToTopOfGeometry               = Yes
    End
End
