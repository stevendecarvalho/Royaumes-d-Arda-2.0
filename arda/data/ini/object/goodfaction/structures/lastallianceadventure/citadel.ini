// Ithilien Fortress
// This is the one object that you would place on a map and that the porter builds.
// It unpacks in to the citadel and the buildplots.  It's an old CampFlag.
Object LastAllianceFortress

	SelectPortrait = UPLAGatheringHosts

    Draw = W3DScriptedModelDraw ModuleTag_Draw
        DefaultModelConditionState
            Model				= abLAcomtent_skn
        End
		ModelConditionState		= ACTIVELY_BEING_CONSTRUCTED
			Model				= abLAcomtent_bld
;			ParticleSysBone		= NONE BuildingDoughnutCloud
			ParticleSysBone		= NONE BuildingContructDust
		End
		AnimationState          = ACTIVELY_BEING_CONSTRUCTED
			Animation
				AnimationName	= abLAcomtent_bld.abLAcomtent_bld
				AnimationMode	= MANUAL
			End
			BeginScript
				CurDrawablePlaySound("GondorBarracksBeginConstruction")
				CurDrawablePlaySound("BuildingTopple")
;				CurDrawableHideSubObject("FIRE02")
			EndScript
		End

		ModelConditionState		= BASE_BUILD
			Model				= abLAcomtent_bld
;			ParticleSysBone		= NONE BuildingDoughnutCloud
			ParticleSysBone		= NONE BuildingContructDust
		End
		AnimationState			= BASE_BUILD
			Animation
				AnimationName	= abLAcomtent_bld.abLAcomtent_bld
				AnimationMode	= ONCE
				AnimationBlendTime = 0			
				AnimationSpeedFactorRange = 2.0 2.0 ; 300 frame anim, but need to shrink down to 5 seconds
			End
			BeginScript
				CurDrawablePlaySound("GondorBarracksBeginConstruction")
				CurDrawablePlaySound("BuildingTopple")
			EndScript
		End

		ModelConditionState		= JUST_BUILT
			Model				= abLAcomtent_bld
		End
		AnimationState			= JUST_BUILT
			Animation
				AnimationName	= abLAcomtent_bld.abLAcomtent_bld
				AnimationMode	= MANUAL			
				AnimationBlendTime = 0
			End
			Flags				= START_FRAME_FIRST
;			BeginScript
;				CurDrawableHideSubObject("FIRE02")
;			EndScript
		End

		ModelConditionState		= DAMAGED
			Model				= abLAcomtent_d1  
			ParticleSysBone dustbone01 TrebuchetImpactDebris
;			ParticleSysBone		= glowbone01 TorchGlow
;			ParticleSysBone		= glowbone02 furnaceSmoke
		End
		AnimationState			= DAMAGED
			EnteringStateFX		= FX_BuildingDamaged
		End

		ModelConditionState		= REALLYDAMAGED
			Model				= abLAcomtent_d2  
			ParticleSysBone		= glowbone02 TrebuchetImpactDebris
			ParticleSysBone		= glowbone01 Explosion5
		End
		AnimationState			= REALLYDAMAGED
			EnteringStateFX		= FX_BuildingReallyDamaged
		End

		ModelConditionState		= RUBBLE
			Model				= abLAcomtent_d2
			ParticleSysBone dustbone01 TrebuchetImpactDebris
			ParticleSysBone		= glowbone01 Explosion5
			ParticleSysBone		= glowbone02 BuildingChunkDebris
		End
		AnimationState			= RUBBLE
		End

		ModelConditionState		= POST_RUBBLE
			Model				= abLAcomtent_d2 ;GBGenRubble
			ParticleSysBone NONE SmokeBuildingMediumRubble
		End
		AnimationState			= POST_RUBBLE
		End
	
		ModelConditionState		= POST_COLLAPSE
			Model				= abLAcomtent_d2 ;GBGenRubble
			ParticleSysBone NONE SmokeBuildingMediumRubble
		End
		AnimationState			= POST_COLLAPSE
		End
    End
	
		Draw = W3DScriptedModelDraw TheHordeEffects
	    DefaultModelConditionState
	      Model = None
	    End
		AnimationState = UPGRADE_ECONOMY_BONUS
			ParticleSysBone = None MusterTheRangersPulseFX
			ParticleSysBone	= None MusterTheRangersSparkleFX
		End
	End

	;------------Mirror Bonus---------------------- 
	Draw = W3DScriptedModelDraw Draw_BonusEffects2
	    DefaultModelConditionState
	      Model = None
	    End
		AnimationState = USER_5 
			ParticleSysBone	= None MirrorofGaladrielMallornSparkle
		End
	End

  	ArmorSet
		Conditions        = None
  		Armor             = FortressArmor
  		//DamageFX          = StructureDamageFXNoShake
  	End

	Side                = LastAlliance
	EditorSorting       = STRUCTURE

	PlacementViewAngle = 0 // A -90 makes the door of the base face natural south.  0 would have it to the East.

	MaxSimultaneousOfType = 5 ;;,;; Added for 2.02e (T.C.)

	BuildCost           = 5000 ;MORDOR_FORTRESS_BUILDCOST
	BuildTime           = MORDOR_FORTRESS_BUILDTIME
	PlacementViewAngle		= 45
	DisplayName			= OBJECT:LastAllianceCitadel

	;; AUDIO PARAMETERS

	#include "..\..\..\Includes\StandardBuildingEvaEvents.inc"

	VoiceSelect						= GondorCitadelSelect
	SoundAmbient					= CitadelSignalFireLoop
	EvaEventDieOwner				= EvaFortressDie
	EvaEventDieAlly					= AllyCampDestroyed
    EvaEventDieEnemy				= EnemyCampDestroyed

	SoundOnDamaged					= BuildingLightDamageStone
	SoundOnReallyDamaged			= BuildingHeavyDamageStone
	VoiceSelectUnderConstruction	= BuildingGoodVoiceSelectUnderConstruction
	UnitSpecificSounds
		UnderConstruction			= BuildingConstructionLoop
		UnderRepairFromRubble		= BuildingConstructionLoop
	End


	// *** AUTO RESOLVE DATA ***
	; When fighting an auto-resolve battle, a World Map castle actually becomes this unit
	AutoResolveUnitType = AutoResolveUnit_Fortress

    	AutoResolveBody = AutoResolve_MordorFortressBody

    	AutoResolveArmor
    		Armor = AutoResolve_MordorFortressArmor
    	End

    	AutoResolveWeapon
    		Weapon = AutoResolve_MordorFortressWeapon
    	End


	// *** ENGINEERING Parameters ***
	RadarPriority       = STRUCTURE
	KindOf              = STRUCTURE SELECTABLE IMMOBILE BASE_FOUNDATION MP_COUNT_FOR_VICTORY BASE_SITE CAN_SEE_THROUGH_STRUCTURE LIVING_WORLD_BUILDING_MIRROR

	Body                        = StructureBody ModuleTag_05
		MaxHealth         		    = MONUMENT_FORTRESS_HEALTH
	End

	Behavior = CastleBehavior ModuleTag_castle
		CastleToUnpackForFaction	= Mordor fortress_last_alliance
		CastleToUnpackForFaction	= Isengard fortress_last_alliance
		CastleToUnpackForFaction	= Men fortress_last_alliance
		CastleToUnpackForFaction	= Elves fortress_last_alliance
		CastleToUnpackForFaction	= Dwarves fortress_last_alliance
		CastleToUnpackForFaction	= Wild fortress_last_alliance
		CastleToUnpackForFaction	= Angmar fortress_last_alliance
		CastleToUnpackForFaction	= Arnor fortress_last_alliance
		CastleToUnpackForFaction	= Guldur fortress_last_alliance

		//Anything that does not fit this filter will be given to the neutral player, so the template can have rocks and props.
		FilterValidOwnedEntries = ANY +STRUCTURE +WALK_ON_TOP_OF_WALL +BASE_FOUNDATION +TACTICAL_MARKER

		MaxCastleRadius 			= 130.0
		InstantUnpack				= Yes
		KeepDeathKillsEverything	= Yes

		EvaEnemyCastleSightedEvent = EnemyFortressSighted
	End

	Behavior                  = StructureCollapseUpdate ModuleTag_06
