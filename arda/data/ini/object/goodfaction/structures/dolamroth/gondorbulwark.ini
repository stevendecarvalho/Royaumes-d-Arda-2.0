//------------------------------------------------------------------------------
Object DolAmrothGondorBulwark
	 
	SelectPortrait = UPDolAmrothWhiteCityDelegation
 
	; *** ART Parameters ***
	ButtonImage = UIGondorBattleTower
	  
	Draw = W3DScriptedModelDraw ModuleTag_Draw

	    StaticModelLODMode = yes ; Will append M or L to the skin name depending on GameLOD  
	    
		ExtraPublicBone = ARROW_01
		ExtraPublicBone = ARROW_02
		ExtraPublicBone = ARROW_03
		ExtraPublicBone = ARROW_04
		ExtraPublicBone = ARROW_05
		ExtraPublicBone = ARROW_06
		ExtraPublicBone = ARROW_07
		ExtraPublicBone = ARROW_08
		
		OkToChangeModelColor  = Yes
		UseStandardModelNames = Yes

    		StaticModelLODMode = yes ; Will append M or L to the skin name depending on GameLOD

		DefaultModelConditionState
			Model = gbNtower_skn
			WeaponLaunchBone = PRIMARY ARROW_
		End
		
		IdleAnimationState
		ParticleSysBone   	= TORCH01 OrcBarracksTorchSmoke FollowBone:Yes
		ParticleSysBone   	= TORCH01 OrcBarracksTorchFireNoSmoke FollowBone:Yes
		ParticleSysBone   	= TORCH02 OrcBarracksTorchSmoke FollowBone:Yes
		ParticleSysBone   	= TORCH02 OrcBarracksTorchFireNoSmoke FollowBone:Yes		
		End		

		;//	Animation state for build placement cursor
		AnimationState = BUILD_PLACEMENT_CURSOR
			BeginScript
				CurDrawableHideSubObject("N_Window")
			EndScript
		End

		;//	Animation state for phantom structure
		AnimationState = PHANTOM_STRUCTURE
			BeginScript
				CurDrawableHideSubObject("N_Window")
			EndScript
		End	

		ModelConditionState =  AWAITING_CONSTRUCTION SNOW
			Model   = gbNtower_bld
			Texture	= GBAotRGondorFortress.tga GBAotRGondorFortress_snow.tga
		End	   
		ModelConditionState   = AWAITING_CONSTRUCTION 
			Model               = gbNtower_bld
	;		ParticleSysBone	  = NONE BuildingDoughnutCloud
		End;
		AnimationState        = AWAITING_CONSTRUCTION
			Animation           = gbNtower_bld
				AnimationName     = gbNtower_bld.gbNtower_bld
				AnimationMode     = MANUAL
			End
			Flags				  = START_FRAME_FIRST
		End

		ModelConditionState = ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED SNOW
			Model   = gbNtower_bld
			Texture	= GBAotRGondorFortress.tga GBAotRGondorFortress_snow.tga
		End	
        ModelConditionState   = ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
			Model               = gbNtower_bld
			ParticleSysBone   = DUSTBONE BuildingContructDust
		End;

		AnimationState        = ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
			Animation           = gbbtltwrs_bld
				AnimationName     = gbNtower_bld.gbNtower_bld
				AnimationMode     = MANUAL
			End
			Flags					= START_FRAME_FIRST
			StateName				= BeingConstructed
			BeginScript
				CurDrawablePlaySound("GondorBarracksBeginConstruction")
			EndScript
		End
	    
        ;--damaged building
   
		ModelConditionState  = DAMAGED
      	Model         = gbNtower_d1  
			ParticleSysBone FireSmall01 FireBuildingLarge
			ParticleSysBone FireSmall02 FireBuildingMedium
			ParticleSysBone FireSmall03 FireBuildingMedium
			ParticleSysBone FireSmall04 FireBuildingMedium
			ParticleSysBone FireSmall05 SmokeBuildingLarge
		ParticleSysBone   	= TORCH01 OrcBarracksTorchSmoke FollowBone:Yes
		ParticleSysBone   	= TORCH01 OrcBarracksTorchFireNoSmoke FollowBone:Yes
		ParticleSysBone   	= TORCH02 OrcBarracksTorchSmoke FollowBone:Yes
		ParticleSysBone   	= TORCH02 OrcBarracksTorchFireNoSmoke FollowBone:Yes		
    	End
    	
		AnimationState = DAMAGED
			EnteringStateFX	= FX_BuildingDamaged
		End

		ModelConditionState  = REALLYDAMAGED
      	Model         = gbNtower_d2  
			ParticleSysBone FireSmall01 FireBuildingLarge
			ParticleSysBone FireSmall02 FireBuildingLarge
			ParticleSysBone FireSmall03 FireBuildingMedium
			ParticleSysBone FireSmall04 FireBuildingMedium
			ParticleSysBone FireSmall05 SmokeBuildingLarge
		ParticleSysBone   	= TORCH01 OrcBarracksTorchSmoke FollowBone:Yes
		ParticleSysBone   	= TORCH01 OrcBarracksTorchFireNoSmoke FollowBone:Yes
		ParticleSysBone   	= TORCH02 OrcBarracksTorchSmoke FollowBone:Yes
		ParticleSysBone   	= TORCH02 OrcBarracksTorchFireNoSmoke FollowBone:Yes			
    	End

		AnimationState = REALLYDAMAGED
			EnteringStateFX	= FX_BuildingReallyDamaged
		End
    	
    	ModelConditionState  = RUBBLE
      		Model         = gbNtower_d2
   		   	ParticleSysBone SmokeLarge01 SmokeBuildingLarge
    	End
    	
		AnimationState = RUBBLE
			EnteringStateFX	= FX_StructureMediumCollapse
		End

		ModelConditionState  = POST_RUBBLE
			Model         = None
			ParticleSysBone NONE SmokeBuildingMediumRubble
		End
    
		AnimationState = POST_RUBBLE
		End

		ModelConditionState  = POST_COLLAPSE
			Model         = None
			ParticleSysBone NONE SmokeBuildingMediumRubble
		End
		AnimationState = POST_COLLAPSE
		End

		ModelConditionState = SNOW
			Model   = gbNtower_skn
			Texture	= GBAotRGondorFortress.tga GBAotRGondorFortress_snow.tga
		End				

	End ; draw
	Draw = W3DScriptedModelDraw Draw_BonusEffects
	    DefaultModelConditionState
	      Model = None
	    End
	    AnimationState = ACTIVELY_BEING_CONSTRUCTED
	    End
		AnimationState = USER_4
			ParticleSysBone	= None StoneWorkerFX
		End
	End
	Draw = W3DFloorDraw ModuleTag_DrawFloor    
    		StaticModelLODMode = yes ; Will append M or L to the skin name depending on GameLOD
		ModelName = gbNtower_bib
		WeatherTexture = SNOWY gbNbattletowerbib_snow.tga
  		HideIfModelConditions	=	AWAITING_CONSTRUCTION
  		HideIfModelConditions	=	PARTIALLY_CONSTRUCTED
	End
  
 PlacementViewAngle  = -45

	// ***DESIGN parameters ***
	DisplayName         		= OBJECT:GondorBulwark
	Side                		= DolAmroth
	EditorSorting       		= STRUCTURE
	ThreatLevel					= FORTRESS_THREAT_LEVEL		; 1.0

	BuildCost					= 0
	BuildTime					= 5.0           ; in seconds
	VisionRange					= 350.0 ;;,;; 160.0          
	ShroudClearingRange			= 550.0 ;;,;; 200

	CommandSet				= DolAmrothGondorBulwarkCommandSet

	ArmorSet
		Conditions			= None
		Armor				= FortressArmor	
	End

	WeaponSet
		Weapon				= PRIMARY FortressArrowTowerBow
		AutoChooseSources		= PRIMARY FROM_PLAYER FROM_SCRIPT FROM_AI
	End 
	
	// *** AUDIO Parameters ***

	VoiceSelect         				= MenFortressSelect
	VoiceSelectUnderConstruction		= BuildingGoodVoiceSelectUnderConstruction

	SoundOnDamaged				= BuildingLightDamageStone
	SoundOnReallyDamaged			= BuildingHeavyDamageStone

	UnitSpecificSounds
		UnderConstruction		= BuildingBigConstructionLoop	;// Built first time
		;//UnderRepairFromDamage	= NoSound						;// Repaired No animation on the building, so don't bother playing sound
		UnderRepairFromRubble		= BuildingBigConstructionLoop	;// Repaired from completely destroyed (not used???)
	End


	#include "..\..\..\Includes\StandardBuildingEvaEvents.inc"

;    CampnessValue = CAMPNESS_SUMMONED_CITADEL

	// *** ENGINEERING Parameters ***

	RadarPriority       	= STRUCTURE 	
	KindOf			= PRELOAD STRUCTURE IMMOBILE CASTLE_KEEP SELECTABLE FS_FACTORY AUTO_RALLYPOINT SCORE DONT_USE_CANCEL_BUILD_BUTTON MP_COUNT_FOR_VICTORY LIVING_WORLD_BUILDING_MIRROR ;;.;; SUMMONED DOZER_FACTORY COMMANDCENTER VITAL_FOR_BASE_SURVIVAL ;; Removed GARRISONABLE_UNTIL_DESTROYED	

	Behavior            = GettingBuiltBehavior GetBuiltBehaviorTag
		WorkerName		  = GondorWorkerNoSelect
		UseSpawnTimerWithoutWorker 	= Yes
		SpawnTimer	= DEFAULT_STRUCTURE_HEALDELAY
	End

     Behavior = CastleMemberBehavior ModuleTag_CMB
		BeingBuiltSound = BuildingBigConstructionLoop
     End 

	Behavior = TerrainResourceBehavior ModuleTag_NewMoneyDeadSpot
		Radius			= 150		// How far we try to claim ground
		MaxIncome		= 0		// If we were to get all we wanted, how much we would earn.  Linear slope to 0 at 0% claim
		IncomeInterval		= 999999	// How often (in msec) we give that much money
		HighPriority		= Yes		// A high priority claim gets to pretend it was there first.
	End

	//-----------------------------------------------	
	Behavior = ProductionUpdate ProductionUpdateModuleTag	
	End

	Behavior = QueueProductionExitUpdate QueueProductionModuleTag
		UnitCreatePoint			= X:0.0 Y:-26.0 Z:0.0
		NaturalRallyPoint		= X:80.0 Y:-80.0 Z:0.0
		ExitDelay				= STANDARD_HORDE_EXIT_DELAY
	End
	
	//-----------------------------------------------
	Body                = StructureBody ModuleTag_05
		MaxHealth			= 5000
		MaxHealthDamaged  		= 2500
		MaxHealthReallyDamaged 	  	= 1250
	End
 
	Behavior                  = StructureCollapseUpdate ModuleTag_08
		MinCollapseDelay        = 000
		MaxCollapseDelay        = 000
		CollapseDamping         = .5
		MaxShudder              = 0.6
		MinBurstDelay           = 250
		MaxBurstDelay           = 800
		BigBurstFrequency       = 4
		FXList                  = INITIAL   FX_StructureMediumCollapse
		FXList                  = ALMOST_FINAL  FX_StructureAlmostCollapse
		DestroyObjectWhenDone	= Yes
		CollapseHeight		= 155
	End

	MaxSimultaneousOfType		= 2

	Behavior = AIUpdateInterface ModuleTag_SoWeCanUseWeapon
		AutoAcquireEnemiesWhenIdle	= Yes
		MoodAttackCheckRate		= 250
	End

// money maker ;;,;; added for 2.02d
	Behavior = AutoDepositUpdate AutoDepositModuleTag
		DepositTiming       	= GENERIC_KEEP_MONEY_TIME
		DepositAmount       	= GENERIC_KEEP_MONEY_AMOUNT 
		InitialCaptureBonus 	= 0  ;// no initial bonus
	End
	
	Behavior = RefundDie ModuleTag_refund
		UpgradeRequired = Upgrade_MarketplaceUpgradeDefiance
		BuildingRequired = ANY +GondorMarketPlace
		RefundPercent = 50%
	End
	;-----------------------------------------------------------------------------
	;	Siege Preparations
	;-----------------------------------------------------------------------------
	Behavior = AttributeModifierUpgrade ModuleTag_SauronsRewardBonus
		TriggeredBy			= Upgrade_GiftsofLorien
		AttributeModifier	= SpellBookSiegePreparationsBuff
	End

	Geometry				= CYLINDER
    GeometryName			= Geom_Orig
  	GeometryMajorRadius		= 40.2
	GeometryHeight			= 175
	GeometryOffset			= X:-0.308 Y:-1.231 Z:0


	GeometryIsSmall       = No
	Shadow                = SHADOW_VOLUME
	BuildCompletion     = PLACED_BY_PLAYER

	GeometryContactPoint = X:-60	Y:60	Z:0			Repair
	GeometryContactPoint = X:72		Y:-66	Z:0			Repair
	GeometryContactPoint = X:24.669		Y:36.984	Z:0
	GeometryContactPoint = X:-1.623		Y:-45.628	Z:0
	GeometryContactPoint = X:-17.937	Y:17.244	Z:73.532	Swoop
End
