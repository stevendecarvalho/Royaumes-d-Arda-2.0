Object DolAmrothRoyalBarracks
	 
	// *** ART Parameters ***
		SelectPortrait         = UPDolAmrothRoyalBarracks
	//	ButtonImage            = SNReactor

	//--------------------------------
	Draw = W3DScriptedModelDraw ModuleTag_MainDraw
		OkToChangeModelColor	= Yes
		UseStandardModelNames	= Yes

		ExtraPublicBone			= ARROW_01
		ExtraPublicBone			= ARROW_02
		ExtraPublicBone			= ARROW_03
		ExtraPublicBone			= ARROW_04
		ExtraPublicBone			= ARROW_05
		ExtraPublicBone			= ARROW_06
		ExtraPublicBone			= ARROW_07
		ExtraPublicBone			= ARROW_08
		
		DefaultModelConditionState
			Model = gbdolamr
			WeaponLaunchBone	= PRIMARY ARROW
		End

		IdleAnimationState						
		End

		;//	Animation state for build placement cursor
	AnimationState = BUILD_PLACEMENT_CURSOR
		BeginScript
			CurDrawableHideSubObject("BANNERS")
			CurDrawableHideSubObject("MOAT")
			CurDrawableHideSubObject("WATER")
			CurDrawableHideSubObject("WHITETREEEMBOSS")
		EndScript
	End
	
	;//	Animation state for phantom structure
	AnimationState = PHANTOM_STRUCTURE
		BeginScript
			CurDrawableHideSubObject("BANNERS")
			CurDrawableHideSubObject("MOAT")
			CurDrawableHideSubObject("WATER")
			CurDrawableHideSubObject("WHITETREEEMBOSS")
		EndScript
	End		

		IdleAnimationState						
		End

    ;------------ New Build Up States coming soon. 
	ModelConditionState = AWAITING_CONSTRUCTION SNOW
		Model	= gbdolamr_bld
		Texture	= gbdolamroth.tga gbdolamroth_snow.tga
    End    
    ModelConditionState   = AWAITING_CONSTRUCTION 
      Model               = gbdolamr_bld
    End;
    AnimationState        = AWAITING_CONSTRUCTION
      Animation           =  gbdolamr_bld
        AnimationName     =  gbdolamr_bld.gbdolamr_bld
        AnimationMode     = MANUAL
        AnimationBlendTime = 0
      End
	  Flags				  = START_FRAME_FIRST
    End

	ModelConditionState = ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED SNOW
		Model	= gbdolamr_bld
		Texture	= gbdolamroth.tga gbdolamroth_snow.tga
    End   
    ModelConditionState   = ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
      Model               = gbdolamr_bld
		ParticleSysBone   = CONSTDUSTBONE01 BuildingContructDust FollowBone:Yes
    End
    AnimationState        = ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
		Animation           = gbdolamr_bld
			AnimationName     = gbdolamr_bld.gbdolamr_bld
			AnimationMode     = MANUAL
			AnimationBlendTime = 0
		End
		Flags				  = START_FRAME_FIRST
		StateName			  = BeingConstructed
		BeginScript
		EndScript
    End
		
		//------------- Damge -------------------
		ModelConditionState = DAMAGED
			Model					= gbdolamr_d1
		End  
		AnimationState = DAMAGED
			EnteringStateFX = FX_FortressDamaged
		End

		ModelConditionState = REALLYDAMAGED
			Model					= gbdolamr_d2
		End  

		ModelConditionState = RUBBLE
			Model					= gbdolamr_d2
			ParticleSysBone SmokeLarge01 SmokeBuildingLarge
		End
		
		ModelConditionState	=	SNOW
			Model = gbdolamr
			Texture 		= gbdolamroth.tga gbdolamroth_snow.tga
		End
	End
  
	Draw = W3DFloorDraw ModuleTag_DrawFloor    
		StaticModelLODMode 	= Yes		; THIS NEEDS TO BE COMMENTED OUT WHEN ENGINEERING ENABLES LOD'S IN THE FLOOR DRAW
		ModelName 		= GBAmroth_Bib
		WeatherTexture		= SNOWY gbamrothbib_snow.tga
  		HideIfModelConditions	=	AWAITING_CONSTRUCTION
  		HideIfModelConditions	=	PARTIALLY_CONSTRUCTED
	End

	// ***DESIGN parameters ***
	DisplayName         		= OBJECT:DolAmrothRoyalBarracks
	Side                		= DolAmroth
	EditorSorting       		= STRUCTURE
	ThreatLevel					= 1.0
	BuildCost					= 600
	BuildTime					= GONDOR_BARRACKS_BUILDTIME
	VisionRange					= 350.0 ;;,;; 160.0          
	ShroudClearingRange			= 550.0 ;;,;; 200
	PlacementViewAngle			= 135
	CommandSet					= DolAmrothRoyalBarracksCommandSet
	
	ArmorSet
