		TriggeredBy								= Upgrade_GenericObject_20
		RefreshDelay							= 2000
		Range									= 99999
		ObjectFilter							= NONE +HeroBilboBotfa SAME_PLAYER
	End
	
	#include "..\..\..\AOTRfortressupgrades.inc"
	
	
	
	;///////////////
	;// ATTRIBUTS //
	;///////////////
	
	Behavior								= AttributeModifierAuraUpdate ModuleTag_AllowDwarvenRiches
