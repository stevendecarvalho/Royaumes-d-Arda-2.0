Object ElvenkingThroneKeep
	SelectPortrait							= UPElvenkingsThrone
	
	;////////////////////////////
	;// PARAMÈTRES ARTISTIQUES //
	;////////////////////////////

	Draw									= W3DScriptedModelDraw ModuleTag_Draw
		OkToChangeModelColor					= Yes
		UseStandardModelNames					= Yes		
		WallBoundsMesh							= WALLPLANE
		RampMesh1								= STAIRPLANE

		DefaultModelConditionState  
			Model									= prTHthrone_skn
		End
		
		IdleAnimationState
			StateName								= STATE_None
		End
		
		;// Animations : En cours de construction
		ModelConditionState						= ACTIVELY_BEING_CONSTRUCTED
			Model									= prTHthrone_bld
			ParticleSysBone							= NONE BuildingContructDust
		End  
		AnimationState							= ACTIVELY_BEING_CONSTRUCTED
			StateName								= STATE_Constructing
			Animation
				AnimationName							= prTHthrone_bld.prTHthrone_bld
				AnimationMode							= MANUAL
			End
			BeginScript
				CurDrawablePlaySound("GondorBarracksBeginConstruction")
				CurDrawablePlaySound("BuildingTopple")
			EndScript
		End		
		ModelConditionState						= DESTROYED_WHILST_BEING_CONSTRUCTED
			Model									= prTHthrone_bld
			ParticleSysBone							NONE Explosion3
			ParticleSysBone							NONE ExplosiveMineSmoke02
		End  
		AnimationState							= DESTROYED_WHILST_BEING_CONSTRUCTED
			StateName								= STATE_DetroyedConstructing
			Animation
				AnimationName							= prTHthrone_bld.prTHthrone_bld
				AnimationMode							= ONCE_BACKWARDS
				AnimationBlendTime						= 90
			End
			Flags									= START_FRAME_FIRST
		End
		
		;// Animations : Construit
		ModelConditionState						= BASE_BUILD
			Model									= prTHthrone_bld
			ParticleSysBone							= NONE BuildingContructDust
		End  
		AnimationState							= BASE_BUILD
			StateName								= STATE_None
			Animation
				AnimationName							= prTHthrone_bld.prTHthrone_bld
				AnimationMode							= ONCE
				AnimationBlendTime						= 0			
				AnimationSpeedFactorRange				= 2.0 2.0
			End
			BeginScript
				CurDrawablePlaySound("GondorBarracksBeginConstruction")
				CurDrawablePlaySound("BuildingTopple")
			EndScript
		End
		ModelConditionState						= JUST_BUILT
			Model									= prTHthrone_bld
		End  
		AnimationState							= JUST_BUILT
			StateName								= STATE_None
			Animation
				AnimationName							= prTHthrone_bld.prTHthrone_bld
				AnimationMode							= MANUAL			
				AnimationBlendTime						= 0
			End
			Flags									= START_FRAME_FIRST
		End
		
		;// Animations : Endommagée
		ModelConditionState						= DAMAGED
			Model									= prTHthrone_d1 
		End		
		AnimationState							= DAMAGED
			EnteringStateFX							= FX_BuildingDamaged
		End
		
		;// Animations : Très endommagée
		ModelConditionState						= REALLYDAMAGED
			Model									= prTHthrone_d2
		End
		AnimationState							= REALLYDAMAGED
			EnteringStateFX							= FX_BuildingReallyDamaged
		End
		
		;// Animations : Décombres
		ModelConditionState						= RUBBLE
			Model									= prTHthrone_d2
			ParticleSysBone							SmokeLarge01 SmokeBuildingLarge
		End
		AnimationState							= RUBBLE
			EnteringStateFX							= FX_StructureMediumCollapse
		End        
	End
	
	
	
	;/////////////////////////
	;// PARAMÈTRES GÉNÉRAUX //
	;/////////////////////////

	DisplayName								= OBJECT:ElvenkingThrone
	Description								= OBJECT:ElvenkingThroneDescription
	
	BuildCost								= 5000
	BuildTime								= GENERIC_FORTRESS_STRUCTURE_BUILDTIME
 	VisionRange								= GENERIC_FORTRESS_STRUCTURE_VISION
	ShroudClearingRange						= GENERIC_FORTRESS_STRUCTURE_SHROUD_CLEAR
	BountyValue								= 1250
	
	Side									= Mirkwood
	EditorSorting							= STRUCTURE
	ThreatLevel								= 200
	PlacementViewAngle						= 0

	CommandPointBonus						= GENERIC_FORTRESS_COMMAND_POINT_BONUS
	CommandSet								= GondorCastleBaseKeepRebuildCommandSet
	
	
	
	;/////////////////////
	;// ARMES & ARMURES //
	;/////////////////////
	
	ArmorSet
		Conditions								= None
		Armor									= GenericArmor_80
		DamageFX								= MinasWallADamageFX
	End
	
	WeaponSet
		Conditions								= None
		Weapon									= PRIMARY GenericDefenseStructureBow
		AutoChooseSources						= PRIMARY FROM_PLAYER FROM_SCRIPT FROM_AI
	End
	
	
	
	;//////////////////////
	;// PARAMÈTRES AUDIO //
	;//////////////////////
	
	#include "..\..\..\Includes\StandardBuildingEvaEvents.inc"
	
	VoiceSelect								= GondorCitadelSelect
	
	EvaEventDieOwner						= CitadelDie
	EvaEventDieAlly							= AllyCampDestroyed
    EvaEventDieEnemy						= EnemyCampDestroyed

	SoundOnDamaged							= BuildingLightDamageStone
	SoundOnReallyDamaged					= BuildingHeavyDamageStone
	VoiceSelectUnderConstruction			= BuildingGoodVoiceSelectUnderConstruction
	
	UnitSpecificSounds
		UnderConstruction						= BuildingConstructionLoop
		UnderRepairFromRubble					= BuildingConstructionLoop
	End

	CampnessValue							= CAMPNESS_FORTRESS

	ClientBehavior							= AnimationSoundClientBehavior ModuleTag_AnimAudioBehavior
		MaxUpdateRangeCap						= 800
 		AnimationSound							= Sound:BuildingSink				Animation:dbcastlecit_D3.dbcastlecit_D3		Frames:0
		AnimationSound							= Sound:BuildingHeavyDamageStone	Animation:dbcastlecit_D3.dbcastlecit_D3		Frames:40
	End

	Behavior								= GettingBuiltBehavior GetBuiltBehaviorTag
		SelfBuildingLoop						= BuildingConstructionLoop
		SelfRepairFromDamageLoop				= NoSound
		SelfRepairFromRubbleLoop				= BuildingConstructionLoop
	End
	
	Behavior								= CastleMemberBehavior ModuleTag_CMB
		BeingBuiltSound							= BuildingBigConstructionLoop
	End
	
	
	
	;/////////////////////////////
	;// PARAMÈTRES D'INGÉNIERIE //
	;/////////////////////////////
	
    RadarPriority							= STRUCTURE
    KindOf									= VITAL_FOR_BASE_SURVIVAL PRELOAD SELECTABLE STRUCTURE IMMOBILE SCORE CASTLE_KEEP MP_COUNT_FOR_VICTORY CAN_ATTACK FS_FACTORY AUTO_RALLYPOINT DOZER_FACTORY NEVER_CULL_FOR_MP COMMANDCENTER DONT_HIDE_IF_FOGGED
	KeepSelectableWhenDead					= Yes

	Behavior								= EvacuateDamage ModuleTag_evacuateDamage
		WeaponThatCausesEvacuation				= MordorCatapultHumanHeads
	End
	
	
	
	;/////////////////////////
	;// PARAMÈTRES DE SANTÉ //
	;/////////////////////////

	Body									= ActiveBody ModuleTag_03
		MaxHealth								= GENERIC_FORTRESS_HEALTH
		MaxHealthDamaged						= GENERIC_FORTRESS_HEALTH_DAMAGED
		MaxHealthReallyDamaged					= GENERIC_FORTRESS_HEALTH_REALLY_DAMAGED
	End
	
	
	
	;//////////////////////
	;// RÉPARATIONS AUTO //
	;//////////////////////
	
	#include "..\..\..\AotRFortressCommandsetsRepair.inc"
	
	
	
	;////////////////
	;// PRODUCTION //
	;////////////////

	Behavior								= ProductionUpdate ProductionUpdateModuleTag
		GiveNoXP								= Yes
	End

	Behavior								= QueueProductionExitUpdate ModuleTag_QueuePEU
		UnitCreatePoint							= X:0.0 Y:-20.0 Z:0.0
		NaturalRallyPoint						= X:28.8 Y:-80.0 Z:0.0
    	ExitDelay								= 300
    	AllowAirborneCreation					= yes
	End 
	
	
	
	;///////////////////////////////
	;// INTELLIGENCE ARTIFICIELLE //
	;///////////////////////////////

	Behavior								= AIUpdateInterface ModuleTag_SoWeCanUseWeapon
 		AutoAcquireEnemiesWhenIdle				= Yes
 		MoodAttackCheckRate						= 250
		AILuaEventsList							= GenericKeepFunctions		
 	End
	
	
	
	;////////////////
	;// RESSOURCES //
	;////////////////

	Behavior								= AutoDepositUpdate AutoDepositModuleTag
		DepositTiming							= GENERIC_KEEP_MONEY_TIME
		DepositAmount							= GENERIC_KEEP_MONEY_AMOUNT 
		InitialCaptureBonus						= 0
	End
	
	Behavior								= TerrainResourceBehavior ModuleTag_NewMoneyDeadSpot
		Radius									= GENERIC_KEEP_MONEY_RANGE
		MaxIncome								= 0
		IncomeInterval							= 999999
		HighPriority							= Yes
	End
	
	
	
	;////////////////////
	;// ATTRIBUTS WOTR //
	;////////////////////
	
  	Behavior								= AttributeModifierUpgrade ModuleTag_WotrIncomeBonus
		TriggeredBy								= Upgrade_WOTRMode
		AttributeModifier						= WotRFortressMapsIncomeBoost
	End
	
	Behavior								= AttributeModifierUpgrade ModuleTag_WotrIncomeBonusAI
		TriggeredBy								= Upgrade_WOTRMode Upgrade_ObjectUnderAIControl
		RequiresAllTriggers						= Yes
		AttributeModifier						= WotRAIEcoBoost
	End
	
	
	
	;///////////////////
	;// ANNEAU UNIQUE //
	;///////////////////
	
	Behavior								= CitadelSlaughterHordeContain ModuleTag_SlaughterMe
		PassengerFilter							= ANY +INFANTRY +CAVALRY +MordorWorker AOTR_COMBO_HORDES_POS -HERO -DOZER -SUMMONED
		ObjectStatusOfContained					= UNSELECTABLE ENCLOSED
		CashBackPercent							= 200%		
		ContainMax								= 99
		AllowEnemiesInside						= No
		AllowAlliesInside						= No
 		AllowNeutralInside						= No
 		AllowOwnPlayerInsideOverride			= Yes
		EnterSound								= MordorSlaughterhouseEnterSound
		EntryOffset								= X:0.0 Y:-100.0 Z:0.0
		EntryPosition							= X:0.0 Y:-50.0 Z:0.0		
		ExitOffset								= X:-150.0 Y:0.0 Z:0.0
		StatusForRingEntry						= HOLDING_THE_RING
		UpgradeForRingEntry						= Upgrade_RingHero Upgrade_GenericObject_20
		ObjectToDestroyForRingEntry				= NONE +TheDroppedRing
		FXForRingEntry							= FX_OneRingFlare
	End
	
