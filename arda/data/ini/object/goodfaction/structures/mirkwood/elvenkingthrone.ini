		ObjectFilter							= ANY +DwarvenMineShaft +DwarvenMineShaftFoundation +DwarvenMineShaftForUndermine SAME_PLAYER
	End
	
	Behavior								= AttributeModifierAuraUpdate ModuleTag_AllowFuelTheFires
