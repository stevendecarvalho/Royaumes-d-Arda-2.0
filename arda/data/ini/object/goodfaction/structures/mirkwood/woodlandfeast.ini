Object MirkwoodWoodlandFeast
	SelectPortrait							= UPElvenkingFeast
	
	;////////////////////////////
	;// PARAMÈTRES ARTISTIQUES //
	;////////////////////////////

	Draw									= W3DScriptedModelDraw ModuleTag_Draw
		DefaultModelConditionState
			Model									= tbfeast_skn
			ParticleSysBone							= None TaintHCPing HouseColor:yes
		End
		
		IdleAnimationState
			ParticleSysBone							= GLOW01 lampGlowMirkwood FollowBone:Yes
			ParticleSysBone							= GLOW02 lampGlowMirkwood FollowBone:Yes
			ParticleSysBone							= GLOW03 lampGlowMirkwood FollowBone:Yes
			ParticleSysBone							= GLOW04 lampGlowMirkwood FollowBone:Yes
			ParticleSysBone							= GLOW05 lampGlowMirkwood FollowBone:Yes
		End
		
		;// Modèle : Déplacement
		ModelConditionState						= MOVING
	    	Model									= None
		End
		
		;// Animations : Construit
	    ModelConditionState						= SNOW JUST_BUILT
			Model									= tbfeast_bld
			Texture									= tbfeasttree.tga tbfeasttree_snow.tga
		End
		ModelConditionState						= JUST_BUILT
	    	Model									= tbfeast_bld
		End
		AnimationState							= JUST_BUILT
			Animation
				AnimationName							= tbfeast_bld.tbfeast_bld
				AnimationMode							= ONCE
				AnimationBlendTime						= 0
				AnimationSpeedFactorRange				= 0.9 0.9
			End
	    End
		
		;// Animations : Maître des Vins
		ModelConditionState						= USER_9
			Model									= tbfeast_bld
			WeaponLaunchBone						= PRIMARY ARROW
			ParticleSysBone							= None MasterOfWinesCellarDoorFX FollowBone:No
		End
		
		;// Animations : Unpacking / Packing
		AnimationState							= UNPACKING
			EnteringStateFX							= FX_FeastTransport
	    End
		AnimationState							= PACKING
			EnteringStateFX							= FX_FeastTransport
	    End
		
		;// Animations : En cours de construction
	    ModelConditionState						= SNOW AWAITING_CONSTRUCTION
			Model									= tbfeast_bld
			Texture									= tbfeasttree.tga tbfeasttree_snow.tga
        End
		ModelConditionState						= AWAITING_CONSTRUCTION
			Model									= tbfeast_bld
		End
		AnimationState							= AWAITING_CONSTRUCTION
			Animation								= tbfeast_bld
				AnimationName							= tbfeast_bld.tbfeast_bld
				AnimationMode							= MANUAL
			End
			Flags									= START_FRAME_FIRST
		End
	    ModelConditionState						= SNOW ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
			Model									= tbfeast_bld
			Texture									= tbfeasttree.tga tbfeasttree_snow.tga
			ParticleSysBone							= DUSTBONE BuildingContructDust
        End
		ModelConditionState						= ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
			Model									= tbfeast_bld
			ParticleSysBone							= DUSTBONE BuildingContructDust
		End
		
		;// Animations : Endommagée
		ModelConditionState						= DAMAGED
			Model									= tbfeast_skn
		End
		AnimationState							= DAMAGED
			ParticleSysBone							= GLOW01 lampGlowMirkwood FollowBone:Yes
			ParticleSysBone							= GLOW02 lampGlowMirkwood FollowBone:Yes
			ParticleSysBone							= GLOW03 lampGlowMirkwood FollowBone:Yes
			ParticleSysBone							= GLOW04 lampGlowMirkwood FollowBone:Yes
			ParticleSysBone							= GLOW05 lampGlowMirkwood FollowBone:Yes
		End
		
		;// Animations : Très endommagée
		ModelConditionState						= REALLYDAMAGED
			Model									= tbfeast_skn
		End
		AnimationState							= REALLYDAMAGED
			ParticleSysBone							= GLOW01 lampGlowMirkwood FollowBone:Yes
			ParticleSysBone							= GLOW02 lampGlowMirkwood FollowBone:Yes
			ParticleSysBone							= GLOW03 lampGlowMirkwood FollowBone:Yes
			ParticleSysBone							= GLOW04 lampGlowMirkwood FollowBone:Yes
			ParticleSysBone							= GLOW05 lampGlowMirkwood FollowBone:Yes
		End
		
		;// Animations : Décombres
		ModelConditionState						= RUBBLE
			Model									= tbfeast_skn
		End
		ModelConditionState						= POST_RUBBLE
			Model									= None
		End
		ModelConditionState						= POST_COLLAPSE
			Model									= None
		End
		
		;// Animations : Enneigé
	    ModelConditionState						= SNOW
			Model									= tbfeast_skn
			Texture									= tbfeasttree.tga tbfeasttree_snow.tga
        End
	End
	
	;// Modèle : Sol
	Draw									= W3DFloorDraw ModuleTag_DrawFloor
		StaticModelLODMode						= Yes
		ModelName								= tbfeast_bib
  		HideIfModelConditions					= JUST_BUILT
  		HideIfModelConditions					= AWAITING_CONSTRUCTION
  		HideIfModelConditions					= PARTIALLY_CONSTRUCTED
	End
	
	;// Modèle : Bonus
	Draw								= W3DScriptedModelDraw Draw_BonusEffects
	    DefaultModelConditionState
			Model								= None
	    End
	    AnimationState						= ACTIVELY_BEING_CONSTRUCTED
	    End
		AnimationState						= USER_9
			ParticleSysBone						= None MasterOfWinesCellarDoorFX FollowBone:No
		End
	End
	
	
	
	;/////////////////////////
	;// PARAMÈTRES GÉNÉRAUX //
	;/////////////////////////

	DisplayName								= OBJECT:WoodlandFeast
	Description								= OBJECT:WoodlandFeastDescription
	
 	VisionRange								= VISION_BASE_DEFENSE
	ShroudClearingRange						= SHROUD_CLEAR_BASE_DEFENSE
	
	Side									= Mirkwood
	EditorSorting							= STRUCTURE
	ThreatLevel								= 1.0
	PlacementViewAngle						= 0

	CommandSet								= MirkwoodFeastCommandSet
	
	
	
	;/////////////////////
	;// ARMES & ARMURES //
	;/////////////////////
	
   	WeaponSet
		Conditions								= None
	End
	
	ArmorSet
		Conditions								= None
		Armor									= GenericArmor_60
	End
	
	
	
	;//////////////////////
	;// PARAMÈTRES AUDIO //
	;//////////////////////
	
	#include "..\..\..\Includes\StandardBuildingEvaEvents.inc"
	
	VoiceSelect								= MirkwoodFeastSelect
	
	
	
	;/////////////////////////////
	;// PARAMÈTRES D'INGÉNIERIE //
	;/////////////////////////////
	
	RadarPriority							= STRUCTURE
	KindOf									= PRELOAD MACHINE SELECTABLE SCORE ALWAYS_SHOW_HOUSE_COLOR PATH_THROUGH_EACH_OTHER SUMMONED IGNORES_SELECT_ALL
	
	ThreatBreakdown ModuleTag_ThreatBreakdown
		AIKindOf								= BATTLE_TOWER
	End
	
	Behavior								= KeepObjectDie ModuleTag_IWantRubble
	End
	
	Behavior								= StructureCollapseUpdate ModuleTag_StructureCollapseUpdate
		MinCollapseDelay						= 000
		MaxCollapseDelay						= 000
		CollapseDamping							= .5
		MaxShudder								= 0.6
		MinBurstDelay							= 250
		MaxBurstDelay							= 800
		BigBurstFrequency						= 4
		FXList									= INITIAL FX_StructureMediumCollapse
		DestroyObjectWhenDone					= Yes
		CollapseHeight							= 0
		DeathTypes								= ALL -FADED
		ExemptStatus							= DEATH_2
	End
	
	Behavior								= BuildingBehavior ModuleTag_Building
	End
	
	
	
	;/////////////////////////
	;// PARAMÈTRES DE SANTÉ //
	;/////////////////////////
	
	Body									= StructureBody ModuleTag_05
		MaxHealth								= RDA_MIRKWOOD_WOODLAND_FEAST_HEALTH
		MaxHealthDamaged						= RDA_MIRKWOOD_WOODLAND_FEAST_HEALTH_DAMAGED
		MaxHealthReallyDamaged					= RDA_MIRKWOOD_WOODLAND_FEAST_HEALTH_REALLY_DAMAGED
	End
	
	
	
	;/////////////////
	;// INFLAMMABLE //
	;/////////////////

	Flammability
		Fuel									= ELVEN_BATTLETOWER_FIRE_FUEL
		MaxBurnRate								= ELVEN_BATTLETOWER_FIRE_MAX_BURN_RATE
		Decay									= ELVEN_BATTLETOWER_FIRE_DECAY
		Resistance								= ELVEN_BATTLETOWER_FIRE_RESISTANCE
    End
	
	
	
	;////////////////
	;// PRODUCTION //
	;////////////////
	
	Behavior								= ProductionUpdate ProductionUpdateModuleTag
		GiveNoXP								= Yes
	End
	
	
	
	;///////////////////////////////
	;// INTELLIGENCE ARTIFICIELLE //
	;///////////////////////////////
	
	Behavior								= AIUpdateInterface ModuleTag_SoWeCanUseWeapon
 		AutoAcquireEnemiesWhenIdle				= Yes
		AILuaEventsList							= MirkwoodFeastFunctions
 	End
	
	
	
	;///////////////
	;// LOCOMOTOR //
	;///////////////
	
	LocomotorSet
		Locomotor								= WebbedLocomotor
		Condition								= SET_NORMAL
		Speed									= 0
	End
	
	
	
	;///////////
	;// TIMER //
	;///////////
	
	Behavior								= LifetimeUpdate LifetimeTag
		MinLifetime								= 180000
		MaxLifetime								= 180000
		DeathType								= FADED
	End
	
	
	
	;////////////////
	;// MORT LENTE //
	;////////////////
	
	Behavior								= SlowDeathBehavior ModuleTag_FadeDeath
		DeathTypes								= NONE +FADED
		FadeDelay								= 0
		FadeTime								= 5000
		DestructionDelay						= 5000
		DeathFlags								= DEATH_2
		ProbabilityModifier						= 100
		Sound									= INITIAL SpellGenericUnsummonMS
	End
	
	Behavior								= SlowDeathBehavior ModuleTag_SlowDeathWithoutRubble
		DestructionDelay						= 5000
	End
	
	
	
	;///////////////////////
	;// COMPÉTENCE : HEAL //
	;///////////////////////
	
	Behavior								= PassiveAreaEffectBehavior ModuleTag_SplashOfHealingWater_Ahh
		EffectRadius							= GENERIC_STATUE_BUFF_RADIUS
		PingDelay								= 3000
		HealPercentPerSecond					= 2%
		AllowFilter								= ANY +INFANTRY +CAVALRY -HERO -MACHINE -IMMOBILE +DOZER
		NonStackable							= Yes
		HealFX									= FX_SpellHealUnitHealBuff
		ModifierName							= WoodlandFeastBuff
	End
	
	Behavior								= PassiveAreaEffectBehavior ModuleTag_SplashOfHealingWater_AhhHero
		EffectRadius							= GENERIC_STATUE_BUFF_RADIUS
		PingDelay								= 3000
		HealPercentPerSecond					= 2%
		AllowFilter								= ANY +HERO -INFANTRY -CAVALRY -MACHINE -IMMOBILE -DOZER
		NonStackable							= Yes
		HealFX									= FX_SpellHealUnitHealBuff
	End
	
	Behavior								= BannerCarrierUpdate BannerCarrierUpdateModuleTag
		IdleSpawnRate							= 18000
		UnitSpawnFX								= FX_BannerCarrierSpawnUnit
		ReplenishNearbyHorde					= Yes
		ReplenishAllNearbyHordes				= Yes
		ScanHordeDistance						= GENERIC_STATUE_BUFF_RADIUS
	End
	
	
	
	;//////////////////////////////////
	;// COMPÉTENCE : MAÎTRE DES VINS //
	;//////////////////////////////////
	
	Behavior								= PassiveAreaEffectBehavior ModuleTag_FeelGoodHero
		EffectRadius							= GENERIC_STATUE_BUFF_RADIUS
		PingDelay								= 2000
		ModifierName							= GalionFeastLeadership
		AllowFilter								= NONE +MirkwoodGalion +MirkwoodGalion_WOTR +MirkwoodGalion_Dorwinion
	End
	
	
	
	;//////////////////////////////
	;// COMPÉTENCE : BUFF ARMURE //
	;//////////////////////////////
	
	Behavior								= PassiveAreaEffectBehavior ModuleTag_FeelGoodUnits
		EffectRadius							= GENERIC_STATUE_BUFF_RADIUS
		PingDelay								= 2000
		ModifierName							= ArmorFeastLeadership
		AllowFilter								= ANY +HORDE +INFANTRY +CAVALRY +MONSTER +DOZER -HERO ALLIES
	End
	
	
	
	;///////////////////////////////
	;// COMPÉTENCE : AMOUR DU VIN //
	;///////////////////////////////
	
	Behavior								= SpecialPowerModule ModuleTag_RestorationRefresh
		SpecialPowerTemplate					= SpecialAbilityWellFeast
		AttributeModifier						= FeastModifier
		UpdateModuleStartsAttack				= No
		AffectAllies							= Yes
		AttributeModifierRange					= 100
		AttributeModifierAffects				= ALL
	End
	
  	Behavior								= PlayerHealSpecialPower ModuleTag_RestorationHeal
		SpecialPowerTemplate					= SpecialAbilityWellFeastHeal
		HealAffects								= INFANTRY CAVALRY MONSTER
		HealAmount								= 0.5
		HealRadius								= 100
		HealFX									= FX_WellofWineFeast
	End
	
	Behavior								= AutoAbilityBehavior ModuleTag_ElrondRestorationAutoAbility
		SpecialAbility							= SpecialAbilityWellFeast
		ForbiddenStatus							= INSIDE_GARRISON
		MaxScanRange							= GENERIC_STATUE_BUFF_RADIUS
		Query									= 2 ANY ALLIES +HORDE
		Query									= 1 NONE +HERO ALLIES
    End
	
	
	
	;/////////////////////////////////////
	;// COMPÉTENCE : LA FÊTE SE DÉPLACE //
	;/////////////////////////////////////
	
	Behavior								= SpecialPowerModule ModuleTag_TeleportStarter
		SpecialPowerTemplate					= SpecialAbilityFeastReposition
		UpdateModuleStartsAttack				= No
		StartsPaused							= No
	End
	
	Behavior								= TeleportSpecialAbilityUpdate ModuleTag_TeleportUpdate
		SpecialPowerTemplate					= SpecialAbilityFeastReposition
		UnpackTime								= 2000
		PackTime								= 2000
		ApproachRequiresLOS						= No
		IgnoreFacingCheck						= Yes
		AttributeModifierDuration				= 3000
	End
	
	Behavior								= AutoAbilityBehavior ModuleTag_AutoAbilityBehavior
		SpecialAbility							= SpecialAbilityFeastReposition
		StartsActive							= No
		BaseMaxRangeFromStartPos				= Yes
		AdjustAttackMeleePosition				= Yes
		MaxScanRange							= 750
		MinScanRange							= 50
		AllowSelf								= No
		IdleTimeSeconds							= 2
		Query									= 1 ANY ENEMIES +INFANTRY -HORDE -SWARM_DOZER
		Query									= 1 ALL ENEMIES AOTR_NOT_FLYING_UNITS -SWARM_DOZER
	End
	
	
	
	;///////////////////////////////////////////////
	;// POUVOIR DU SPELLBOOK : DOUBLEZ LA GARDE ! //
	;///////////////////////////////////////////////
	
    Behavior								= ObjectCreationUpgrade ModuleTag_RemoveUpgradesPrisonGuard1
		TriggeredBy								= Upgrade_PrisonGuard1
