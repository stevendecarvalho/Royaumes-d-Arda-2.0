Object WardingStones
    Scale                               = 1.10
    SelectPortrait                      = UPWardingStones
    
    ;////////////////////////////
    ;// PARAMÈTRES ARTISTIQUES //
    ;////////////////////////////
    
    Draw                                = W3DScriptedModelDraw ModuleTag_DrawStones
        OkToChangeModelColor                = Yes
        StaticModelLODMode                  = Yes
        UseStandardModelNames               = Yes
        
        DefaultModelConditionState
            Model                               = tbstones_skn
        End
        
        ModelConditionState                 = WORLD_BUILDER
            Model                               = tbstones_skn
        End
        
        ;// Animations : Déjà construit
        ModelConditionState                 = JUST_BUILT
            Model                               = tbstones_bld
        End
        AnimationState                      = JUST_BUILT
            StateName                           = JustBuilt
            Animation                           = tbstones_bld
                AnimationName                       = tbstones_bld.tbstones_bld
                AnimationMode                       = ONCE
                AnimationBlendTime                  = 0
                AnimationSpeedFactorRange           = 1.2 1.2
            End
            Flags                               = START_FRAME_FIRST
        End
        
        ;// Modèle : Enneigé
        ModelConditionState                 = SNOW
            Model                               = tbstones_skn
            Texture                             = tbstonecircle.tga tbstonecircle_snow.tga
        End
    End
    
    
    
    ;/////////////////////////
    ;// PARAMÈTRES GÉNÉRAUX //
    ;/////////////////////////
    
    DisplayName                         = OBJECT:WardingStones
    Description                         = OBJECT:WardingStonesDescription
    MaxSimultaneousOfType               = 1
    
    VisionRange                         = GENERIC_STANDARD_STRUCTURE_VISION
    ShroudClearingRange                 = GENERIC_STANDARD_STRUCTURE_SHROUD_CLEAR
    
    Side                                = Mirkwood
    EditorSorting                       = STRUCTURE
    ThreatLevel                         = 0.5
    
    CommandSet                          = GenericCommandSet
    
    
    
    ;/////////////////////
    ;// ARMES & ARMURES //
    ;/////////////////////
    
    WeaponSet
        Conditions                          = None
    End
    
    ArmorSet
        Conditions                          = None
        Armor                               = RDA_GENERIC_BUILDINGS_ARMOR
    End
    
    
    
    ;//////////////////////
    ;// PARAMÈTRES AUDIO //
    ;//////////////////////
    
    #include "..\..\..\Includes\StandardBuildingEvaEvents.inc"
    
    VoiceSelect                         = MirkwoodStoneCircleSelect
    
    SoundAmbientDamaged                 = BuildingDamageFireMediumLoop
    SoundAmbientReallyDamaged           = BuildingDamageFireLargeLoop
    
    
    
    ;/////////////////////////////
    ;// PARAMÈTRES D'INGÉNIERIE //
    ;/////////////////////////////
    
    RadarPriority                       = NOT_ON_RADAR
    KindOf                              = PRELOAD STRUCTURE IMMOBILE UNATTACKABLE SCORE MADE_OF_STONE IGNORE_FOR_VICTORY
    
    Behavior                            = StructureCollapseUpdate ModuleTag_06
        MinCollapseDelay                    = 000
        MaxCollapseDelay                    = 000
        CollapseDamping                     = .5
        MaxShudder                          = 0.6
        MinBurstDelay                       = 250
        MaxBurstDelay                       = 800
        BigBurstFrequency                   = 4
        FXList                              = INITIAL FX_StructureMediumCollapse
        FXList                              = ALMOST_FINAL FX_StructureAlmostCollapse
        DestroyObjectWhenDone               = Yes
        CollapseHeight                      = 120
        ExemptStatus                        = DEATH_2
    End
    
    
    
    ;/////////////////////////
    ;// PARAMÈTRES DE SANTÉ //
    ;/////////////////////////
    
    Body                                = StructureBody ModuleTag_05
        MaxHealth                           = 1
    End
    
    
    
    ;/////////////
    ;// ESCLAVE //
    ;/////////////
    
    Behavior                            = SlavedUpdate ModuleTag_Slave
        GuardMaxRange                       = 0
        GuardWanderRange                    = 0
        UseSlaverAsControlForEvaObjectSightedEvents = No
        DieOnMastersDeath                   = Yes
        MarkUnselectable                    = No
    End
    
    
    
    ;/////////////////////////////
    ;// PARAMÈTRES DE GÉOMÉTRIE //
    ;/////////////////////////////
    
    Geometry                            = BOX
    GeometryName                        = Geom_Orig
    GeometryMajorRadius                 = 65.0
    GeometryMinorRadius                 = 65.0
    GeometryHeight                      = 18.0
    GeometryOffset                      = X:-8 Y:0 Z:0
    
    GeometryIsSmall                     = Yes
    Shadow                              = SHADOW_VOLUME
    BuildCompletion                     = PLACED_BY_PLAYER
End
