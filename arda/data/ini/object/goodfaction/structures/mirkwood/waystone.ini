    End

    Behavior                            = SubObjectsUpgrade ModuleTag_SwitchFloors
        TriggeredBy                         = Upgrade_MirkwoodAvenement
        ShowSubObjects                      = ModuleTag_DrawFloorV2
        HideSubObjects                      = ModuleTag_DrawFloorV1
    End



    ;/////////////////////////////
    ;// PARAMÈTRES DE GÉOMÉTRIE //
    ;/////////////////////////////

    Geometry                            = CYLINDER
    GeometryMajorRadius                 = 40.0
    GeometryMinorRadius                 = 40.0
    GeometryHeight                      = 80.0
    GeometryIsSmall                     = No

    Shadow                              = SHADOW_VOLUME
    BuildCompletion                     = PLACED_BY_PLAYER

    GeometryContactPoint                = X:-26 Y:27 Z:0 Repair
    GeometryContactPoint                = X:28 Y:-25 Z:0 Repair
    GeometryContactPoint                = X:5.576 Y:44.987 Z:0
    GeometryContactPoint                = X:-38.348 Y:-42.113 Z:0
    GeometryContactPoint                = X:-28.448 Y:-0.003 Z:75.14 Swoop
End





