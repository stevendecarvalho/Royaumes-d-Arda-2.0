        AttributeModifierRange              = 99999999.0
        AttributeModifierAffectsSelf        = Yes
        AttributeModifierAffects            = ANY +MirkwoodWaystone +MirkwoodWaystone_Green SAME_PLAYER
    End

    Behavior                            = TeleportToCasterSpecialPower ModuleTag_TeleportToCaster
        SpecialPowerTemplate                = SpecialAbilityWaystoneTeleport
        StartAbilityRange                   = 99999999.0
        ApproachRequiresLOS                 = No
        IgnoreFacingCheck                   = Yes
        Radius                              = 100
        TargetFX                            = FX_CAHBlink
        TriggerFX                           = FX_CAHTeleport
        MinDestinationRadius                = 50
        MaxDestinationRadius                = 100
    End

    Behavior                            = ObjectCreationUpgrade ModuleTag_SpellTeleportToCaster
        TriggeredBy                         = Upgrade_EconomyBonus2
        Delay                               = 0
        DestroyWhenSold                     = No
        ThingToSpawn                        = MirkwoodRoadPower
        Offset                              = X:0 Y:0 Z:0
    End



    ;///////////////////////////////////////////////
    ;// POUVOIR DU SPELLBOOK : DOUBLEZ LA GARDE ! //
    ;///////////////////////////////////////////////

    Behavior                            = ObjectCreationUpgrade ModuleTag_RemoveUpgradesPrisonGuard1
        TriggeredBy                         = Upgrade_PrisonGuard1
        RemoveUpgrade                       = Upgrade_PrisonGuard2
    End

    Behavior                            = ObjectCreationUpgrade ModuleTag_RemoveUpgradesPrisonGuard2
        TriggeredBy                         = Upgrade_PrisonGuard2
        RemoveUpgrade                       = Upgrade_PrisonGuard1
    End

    Behavior                            = ObjectCreationUpgrade ModuleTag_SpellPrisonGuard1
        TriggeredBy                         = Upgrade_PrisonGuard1
        Delay                               = 200.0
        DestroyWhenSold                     = Yes
        ThingToSpawn                        = MirkwoodMobilisationEgg
        Offset                              = X:0 Y:-50 Z:0
        Angle                               = -90
        FadeInTime                          = 2000
    End

    Behavior                            = ObjectCreationUpgrade ModuleTag_SpellPrisonGuard2
        TriggeredBy                         = Upgrade_PrisonGuard1
        Delay                               = 200.0
        DestroyWhenSold                     = Yes
        ThingToSpawn                        = MirkwoodMobilisationEgg
        Offset                              = X:0 Y:50 Z:0
        Angle                               = 90
        FadeInTime                          = 2000
    End



    ;/////////////////////////////////////////
    ;// POUVOIR : AVÈNEMENT D'ERYN LASGALEN //
    ;/////////////////////////////////////////

    Behavior                            = AttributeModifierUpgrade ModuleTag_AvenementFlashModifier
        TriggeredBy                         = Upgrade_MirkwoodAvenement
