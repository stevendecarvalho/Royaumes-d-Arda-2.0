Object MirkwoodWaystone
	SelectPortrait							= UPGreenwoodWaystone
	
	;////////////////////////////
	;// PARAMÈTRES ARTISTIQUES //
	;////////////////////////////

	Draw									= W3DScriptedModelDraw ModuleTag_Draw
		OkToChangeModelColor					= Yes
		StaticModelLODMode						= Yes
		UseStandardModelNames					= Yes
		
		DefaultModelConditionState
			Model									= tbwaystone_skn
		End
		
		IdleAnimationState
		End
		
		;// Animations : Féerie enchanteresse
		ModelConditionState						= SNOW USER_31
			Model									= tbwaystone_bld
			Texture									= tbwaystone.tga tbwaystone_snow.tga
			WeaponLaunchBone						= PRIMARY ARROW
			ParticleSysBone							= None MirkwoodButterflies Followbone:No
		End
		ModelConditionState						= USER_31
			Model									= tbwaystone_bld
			WeaponLaunchBone						= PRIMARY ARROW
			ParticleSysBone							= None MirkwoodButterflies Followbone:No
		End
		
		;// Animations : Construit
		ModelConditionState						= JUST_BUILT
			Model									= tbwaystone_bld
		End
		AnimationState							= JUST_BUILT
			StateName								= JustBuilt
			Animation								= GBBtlTwrM_A
				AnimationName							= tbwaystone_bld.tbwaystone_bld
				AnimationMode							= ONCE
				AnimationBlendTime						= 0
				AnimationSpeedFactorRange				= 5.0 5.0
			End
			Flags									= START_FRAME_FIRST
		End
		
		;// Animations : En cours de construction
		ModelConditionState						= SNOW ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
			Model									= tbwaystone_bld
			Texture									= tbwaystone.tga tbwaystone_snow.tga
		End
		ModelConditionState						= ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
			Model									= tbwaystone_bld
			ParticleSysBone							= NONE BuildingContructDust
		End
		AnimationState							= ACTIVELY_BEING_CONSTRUCTED
			Animation
				AnimationName							= tbwaystone_bld.tbwaystone_bld
				AnimationMode							= MANUAL
			End
			StateName								= BeingConstructed
			BeginScript
				CurDrawablePlaySound("GondorBarracksBeginConstruction")
			EndScript
		End
		
		;// Animations : Endommagée
		ModelConditionState						= DAMAGED
			Model									= tbwaystone_d1
		End
		AnimationState							= DAMAGED
			EnteringStateFX							= FX_StatueDamaged
		End
		
		;// Animations : Très endommagée
		ModelConditionState						= REALLYDAMAGED
			Model									= tbwaystone_d2
		End
		AnimationState							= REALLYDAMAGED
			EnteringStateFX							= FX_StatueDamaged
		End
		
		;// Animations : Décombres
		ModelConditionState						= RUBBLE
			Model									= tbwaystone_d2
			ParticleSysBone							SmokeLarge01 SmokeBuildingLarge
		End
		AnimationState							= RUBBLE
	  		EnteringStateFX							= FX_StatueDamaged
		End
		ModelConditionState						= POST_RUBBLE
			Model									= None
			ParticleSysBone							NONE SmokeBuildingMediumRubble
		End
		ModelConditionState						= POST_COLLAPSE
			Model									= None
			ParticleSysBone							NONE SmokeBuildingMediumRubble
		End
		
		;// Animations : Enneigé
		ModelConditionState						= SNOW
			Model									= tbwaystone_skn
			Texture									= tbwaystone.tga tbwaystone_snow.tga
		End
	End
	
	;// Modèle : Sol
	Draw								= W3DFloorDraw ModuleTag_DrawFloor
		StaticModelLODMode					= Yes
		ModelName							= tbwaystone_bib
  		HideIfModelConditions				= AWAITING_CONSTRUCTION
  		HideIfModelConditions				= PARTIALLY_CONSTRUCTED
	End
	
	
	
	;/////////////////////////
	;// PARAMÈTRES GÉNÉRAUX //
	;/////////////////////////

	DisplayName								= OBJECT:MirkwoodWaystone
	Description								= OBJECT:MirkwoodWaystoneDescription
	
 	VisionRange								= GENERIC_STANDARD_STRUCTURE_VISION
	ShroudClearingRange						= GENERIC_STANDARD_STRUCTURE_SHROUD_CLEAR
	BountyValue								= 0
	
	Side									= Mirkwood
	IsTrainable								= No
	EditorSorting							= STRUCTURE
	ThreatLevel								= 1.0
	PlacementViewAngle						= 45

	CommandPointBonus						= 0
	CommandSet								= MirkwoodWaystoneCommandSet
	
	
	
	;/////////////////////
	;// ARMES & ARMURES //
	;/////////////////////
	
	ArmorSet
		Conditions								= None
		Armor									= GenericArmor_60
	End
	
	
	
	;//////////////////////
	;// PARAMÈTRES AUDIO //
	;//////////////////////
	
	#include "..\..\..\Includes\StandardBuildingEvaEvents.inc"
	
	VoiceSelect								= GondorStatueSelect
	
	SoundOnDamaged							= BuildingLightDamageStone
	SoundOnReallyDamaged					= BuildingHeavyDamageStone
	
	VoiceSelectUnderConstruction			= BuildingGoodVoiceSelectUnderConstruction
	
	UnitSpecificSounds
		UnderConstruction						= BuildingConstructionLoop
		UnderRepairFromRubble					= BuildingConstructionLoop
	End
	
	ClientBehavior							= AnimationSoundClientBehavior ModuleTag_AnimAudioBehavior
		MaxUpdateRangeCap						= 800
		AnimationSound							= Sound:StatueHeroicBuildStoneExplode	Animation:GPHealstue_A.GPHealstue_A		Frames:540
		AnimationSound							= Sound:StatueHeroicBuildStoneDebris1	Animation:GPHealstue_A.GPHealstue_A		Frames:560
		AnimationSound							= Sound:StatueHeroicBuildStoneDebris2	Animation:GPHealstue_A.GPHealstue_A		Frames:600
	End
	
	
	
	;/////////////////////////////
	;// PARAMÈTRES D'INGÉNIERIE //
	;/////////////////////////////
	
	RadarPriority							= STRUCTURE
	KindOf									= PRELOAD STRUCTURE SELECTABLE IMMOBILE SCORE IGNORE_FOR_VICTORY CAN_SEE_THROUGH_STRUCTURE ;SUMMONED
	
	Behavior								= GettingBuiltBehavior GetBuiltBehaviorTag
		WorkerName								= ElvenWorkerNoSelect
		SpawnTimer								= DEFAULT_STRUCTURE_HEALDELAY
	End
	
	Behavior								= StructureCollapseUpdate ModuleTag_Collapse
		MinCollapseDelay						= 000
		MaxCollapseDelay						= 000
		CollapseDamping							= 0.5
		MaxShudder								= 0.6
		MinBurstDelay							= 250
		MaxBurstDelay							= 800
		BigBurstFrequency						= 4
		FXList									= INITIAL FX_StructureMediumCollapse
		FXList									= ALMOST_FINAL FX_StructureAlmostCollapse
		DestroyObjectWhenDone					= Yes
		CollapseHeight							= 126
	End
	
	
	
	;/////////////////////////
	;// PARAMÈTRES DE SANTÉ //
	;/////////////////////////
	
	Body									= StructureBody ModuleTag_05
		MaxHealth								= RDA_MIRKWOOD_WAYSTONE_HEALTH
		MaxHealthDamaged						= RDA_MIRKWOOD_WAYSTONE_HEALTH_DAMAGED
		MaxHealthReallyDamaged					= RDA_MIRKWOOD_WAYSTONE_HEALTH_REALLY_DAMAGED
	End
	
	
	
	;/////////////////
	;// INFLAMMABLE //
	;/////////////////
	
	Flammability
		Fuel									= ELVEN_STATUE_FIRE_FUEL
		MaxBurnRate								= ELVEN_STATUE_FIRE_MAX_BURN_RATE
		Decay									= ELVEN_STATUE_FIRE_DECAY
		Resistance								= ELVEN_STATUE_FIRE_RESISTANCE
	End
	
	
	
	;///////////////////////////////
	;// INTELLIGENCE ARTIFICIELLE //
	;///////////////////////////////
	
	Behavior								= AIUpdateInterface ModuleTag_AI
		AutoAcquireEnemiesWhenIdle				= Yes
		MoodAttackCheckRate						= 250
		AILuaEventsList							= MirkwoodWaystoneFunctions
	End
	
	
	
	;////////////////
	;// MORT LENTE //
	;////////////////
	
	Behavior								= SlowDeathBehavior ModuleTag_SlowDeathWithoutRubble
		DestructionDelay						= 5000
	End
	
	
	
	;////////////////
	;// RESSOURCES //
	;////////////////
	
	Behavior								= TerrainResourceBehavior ModuleTag_NewMoneyDeadSpot
		Radius									= 40
		MaxIncome								= 0
		IncomeInterval							= 999999
		HighPriority							= Yes
		Visible									= No
	End
	
	
	
	;////////////////////////////////////////////
	;// COMPÉTENCE : LA ROUTE DU ROI DES ELFES //
	;////////////////////////////////////////////
	
	Behavior								= SpecialPowerModule ModuleTag_TeleportToCasterModule
		SpecialPowerTemplate					= SpecialAbilityWaystoneTeleport
		StartsPaused							= No
		UpdateModuleStartsAttack				= No
		InitiateSound							= CaH_TeleportPart1
		AttributeModifier						= MirkwoodWaystoneTeleportPower
		AttributeModifierRange					= 1000000.0
		AttributeModifierAffectsSelf			= Yes
		AttributeModifierAffects				= ANY +MirkwoodWaystone SAME_PLAYER 
	End
	
	Behavior								= TeleportToCasterSpecialPower ModuleTag_TeleportToCaster
		SpecialPowerTemplate					= SpecialAbilityWaystoneTeleport
		StartAbilityRange						= 1000000.0
		ApproachRequiresLOS						= No
		IgnoreFacingCheck						= Yes
		Radius									= 100
		TargetFX								= FX_CAHBlink
		TriggerFX								= FX_CAHTeleport
		MinDestinationRadius					= 50
		MaxDestinationRadius					= 100
	End
	
	Behavior								= ObjectCreationUpgrade ModuleTag_SpellTeleportToCaster
		TriggeredBy								= Upgrade_EconomyBonus2
		Delay									= 0
		DestroyWhenSold							= No
		ThingToSpawn							= MirkwoodRoadPower
		Offset									= X:0 Y:0 Z:0
	End
	
	
	
	;///////////////////////////////////////////////
	;// POUVOIR DU SPELLBOOK : DOUBLEZ LA GARDE ! //
