        MaxIncome                           = 0
        IncomeInterval                      = 999999
        HighPriority                        = Yes
        Visible                             = No
    End



    ;////////////////////////////////////////////
    ;// COMPÉTENCE : LA ROUTE DU ROI DES ELFES //
    ;////////////////////////////////////////////

    Behavior                            = SpecialPowerModule ModuleTag_TeleportToCasterModule
