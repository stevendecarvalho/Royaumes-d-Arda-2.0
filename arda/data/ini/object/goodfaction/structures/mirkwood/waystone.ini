Object MirkwoodRoadPower
	
	;////////////////////////////
	;// PARAMÈTRES ARTISTIQUES //
	;////////////////////////////
	
	Draw									= W3DScriptedModelDraw ModuleTag_Draw		
		DefaultModelConditionState
			Model									= None
		End
	End
	
	
	
	;/////////////////////////////
	;// PARAMÈTRES D'INGÉNIERIE //
	;/////////////////////////////

	KindOf									= INERT IMMOBILE UNATTACKABLE
	
	
	
	;/////////////////////////
	;// PARAMÈTRES DE SANTÉ //
	;/////////////////////////
	
	Body									= StructureBody ModuleTag_05
		MaxHealth								= 1
	End
	
	
	
	;///////////
	;// TIMER //
	;///////////
	
	Behavior								= LifetimeUpdate ModuleTag_LifetimeUpdate
		MinLifetime								= 148000
		MaxLifetime								= 148000
		DeathType								= FADED
	End	
	
	
	
	;////////////////
	;// MORT LENTE //
	;////////////////
	
	Behavior								= SlowDeathBehavior ModuleTag_SlowDeathWithoutRubble
		DestructionDelay						= 5000
	End
	
	
	
	;/////////////
	;// ESCLAVE //
	;/////////////
	
	Behavior								= SlavedUpdate ModuleTag_Slave
		LeashRange								= 0
		GuardMaxRange							= 0
		GuardWanderRange						= 0
		AttackRange								= 0
		UseSlaverAsControlForEvaObjectSightedEvents	= No	
		GuardPositionOffset						= X:0 Y:0 Z:0
		DieOnMastersDeath						= No
	End
	
	
	
	;//////////////
	;// ATTRIBUT //
	;//////////////
	
	Behavior								= AttributeModifierAuraUpdate ModuleTag_GateDebuff
		StartsActive							= Yes
		BonusName								= MirkwoodWaystoneTeleportPower
		RefreshDelay							= 2000
		Range									= 9999999
		ObjectFilter							= NONE +MirkwoodWaystone SAME_PLAYER
	End	
End