Object ElvenUnpackedFortress
    
    ;////////////////////////////
    ;// PARAMÈTRES ARTISTIQUES //
    ;////////////////////////////

    Draw                                = W3DScriptedModelDraw ModuleTag_01
        OkToChangeModelColor                = Yes

        DefaultModelConditionState
            Model                               = NCastle_SKN
        End

        ModelConditionState                 = USER_1
            Model                               = None
        End
        ModelConditionState                 = USER_2
            Model                               = None
        End
        ModelConditionState                 = USER_3
            Model                               = None
        End
        ModelConditionState                 = USER_4
            Model                               = None
        End

        IdleAnimationState
            Animation                           = flag
                AnimationName                       = NCastle_SKL.NCastle_IDLA
                AnimationMode                       = ONCE
                AnimationBlendTime                  = 90
            End
        End

        ;// Modèle : Déjà construit
        ModelConditionState                 = SNOW JUST_BUILT
            Model                               = NCastle_A
            Texture                             = cbcastleruin01.tga cbcastleruin01_s.tga
            Texture                             = cbcastleruin02.tga cbcastleruin02_s.tga
            Texture                             = ncampsite.tga ncampsite_s.tga
            Texture                             = p_stat01n.tga p_stat01n_s.tga
        End
        ModelConditionState                 = JUST_BUILT
            Model                               = NCastle_A
        End
        AnimationState                      = JUST_BUILT
            Animation                           = flag
                AnimationName                       = NCastle_SKL.NCastle_A
                AnimationMode                       = ONCE
                AnimationBlendTime                  = 0
            End
            Flags                               = START_FRAME_LAST
        End
        ModelConditionState                 = SNOW
            Model                               = NCastle_SKN
            Texture                             = cbcastleruin01.tga cbcastleruin01_s.tga
            Texture                             = cbcastleruin02.tga cbcastleruin02_s.tga
            Texture                             = ncampsite.tga ncampsite_s.tga
            Texture                             = p_stat01n.tga p_stat01n_s.tga
        End
    End
    
    
    
    ;/////////////////////////
    ;// PARAMÈTRES GÉNÉRAUX //
    ;/////////////////////////
    
    DisplayName                         = OBJECT:CastleFlag
    Description                         = OBJECT:CastleFlagDescription
    
    VisionRange                         = GENERIC_STANDARD_STRUCTURE_VISION
    ShroudClearingRange                 = GENERIC_STANDARD_STRUCTURE_SHROUD_CLEAR
    
    Side                                = Mirkwood
    EditorSorting                       = STRUCTURE
    ThreatLevel                         = 1.0
    PlacementViewAngle                  = -45
    
    CommandSet                          = ElvenUnpackedFortressCommandSet
    
    
    
    ;/////////////////////
    ;// ARMES & ARMURES //
    ;/////////////////////
    
    WeaponSet
        Weapon                              = PRIMARY GenericFortressStructureBow
        AutoChooseSources                   = PRIMARY FROM_PLAYER FROM_SCRIPT FROM_AI
    End
    
    ArmorSet
        Conditions                          = None
        Armor                               = RDA_COMMANDCENTER_BUILDINGS_ARMOR
    End
    
    
    
    ;//////////////////////
    ;// PARAMÈTRES AUDIO //
    ;//////////////////////
    
    #include "..\..\..\Includes\StandardBuildingEvaEvents.inc"

    VoiceSelect                         = Gui_PlotSelect

    CampnessValue                       = CAMPNESS_FORTRESS
    
    
    
    ;/////////////////////////////
    ;// PARAMÈTRES D'INGÉNIERIE //
    ;/////////////////////////////
    
    RadarPriority                       = STRUCTURE
    KindOf                              = PRELOAD VITAL_FOR_BASE_SURVIVAL STRUCTURE IMMOBILE CASTLE_KEEP MP_COUNT_FOR_VICTORY SELECTABLE FS_FACTORY AUTO_RALLYPOINT MADE_OF_WOOD SCORE
    
    
    
    ;/////////////////////////
    ;// PARAMÈTRES DE SANTÉ //
    ;/////////////////////////
    
    Body                                = StructureBody ModuleTag_05
        MaxHealth                           = GENERIC_FORTRESS_HEALTH
        MaxHealthDamaged                    = GENERIC_FORTRESS_HEALTH_DAMAGED
        MaxHealthReallyDamaged              = GENERIC_FORTRESS_HEALTH_REALLY_DAMAGED
    End
    
    
    
    ;////////////////
    ;// PRODUCTION //
    ;////////////////
    
    Behavior                            = ProductionUpdate ModuleTag_RequiredForUpgradeProduction
    End
    
    
    
    ;////////////////
    ;// COMMANDSET //
    ;////////////////
    
    Behavior                            = ReplaceSelfUpgrade ModuleTag_ReplaceWithLothlorienFortress
        TriggeredBy                         = Upgrade_ChooseSubFactionLothlorien
        ConflictsWith                       = Upgrade_ChooseSubFactionMirkwood
        ReplaceWith                         = LothlorienFortressTempHack
    End

    Behavior                            = DoCommandUpgrade ModuleTag_TriggerLothlorienFortress
        TriggeredBy                         = Upgrade_ChooseSubFactionLothlorien
        GetUpgradeCommandButtonName         = Command_LothlorienFortressFirstSummon
    End

    ; Behavior                            = OCLSpecialPower ModuleTag_SummonLothlorienFortress
    ;     SpecialPowerTemplate                = SpecialAbilityPersonalGuard
    ;     OCL                                 = OCL_LothlorienFortress
    ;     CreateLocation                      = CREATE_AT_LOCATION
    ;     AvailableAtStart                    = Yes
    ; End

    ;/////
    
    Behavior                            = ReplaceSelfUpgrade ModuleTag_ReplaceWithMirkwoodFortress
        TriggeredBy                         = Upgrade_ChooseSubFactionMirkwood
        ConflictsWith                       = Upgrade_ChooseSubFactionLothlorien
        ReplaceWith                         = MirkwoodFortressTempHack
    End

    Behavior                            = DoCommandUpgrade ModuleTag_TriggerMirkwoodFortress
        TriggeredBy                         = Upgrade_ChooseSubFactionMirkwood
        GetUpgradeCommandButtonName         = Command_MirkwoodFortressFirstSummon
    End

    Behavior                            = OCLSpecialPower ModuleTag_SummonMirkwoodFortress
        SpecialPowerTemplate                = SpecialAbilityPersonalGuard2
        OCL                                 = OCL_MirkwoodFortress
        CreateLocation                      = CREATE_AT_LOCATION
        AvailableAtStart                    = Yes
    End



    ;/////////////////////////////
    ;// PARAMÈTRES DE GÉOMÉTRIE //
    ;/////////////////////////////
    
    Geometry                            = BOX
    GeometryName                        = CampFlag
    GeometryMajorRadius                 = 52.0
    GeometryMinorRadius                 = 52.0
    GeometryHeight                      = 24.0
    GeometryIsSmall                     = No
    Shadow                              = SHADOW_VOLUME
End