    ;////////////////////////////
    
    Draw                                = W3DScriptedModelDraw ModuleTag_Draw
        OkToChangeModelColor                = Yes
        StaticModelLODMode                  = Yes
        UseStandardModelNames               = Yes
        
        DefaultModelConditionState
            Model                               = tbsacoak_skn
        End
        
        ModelConditionState                 = WORLD_BUILDER
            Model                               = tbsacoak_skn
        End
        
        ;// Animations : Adoration de Vana et Este
        AnimationState                      = USER_30
            ParticleSysBone                     = None TaintHCPing HouseColor:yes
        End
        
        ;// Animations : Féerie enchanteresse
        ModelConditionState                 = USER_31 SNOW
            Model                               = tbsacoak_skn
            Texture                             = tbsacredoak.tga tbsacredoak_snow.tga
            ParticleSysBone                     = None MirkwoodButterflies Followbone:No
        End
        ModelConditionState                 = USER_31
            Model                               = tbsacoak_skn
            ParticleSysBone                     = None MirkwoodButterflies Followbone:No
        End
        
        ;// Animations : Adoration de Nessa
        ModelConditionState                 = USER_32
            Model                               = tbsacoak_skn
            ParticleSysBone                     = NONE SacredOakLightRays FollowBone:No
        End
        
        ;// Animations : Déjà construit
        ModelConditionState                 = JUST_BUILT
            Model                               = tbsacoak_bld
        End
        AnimationState                      = JUST_BUILT
            StateName                           = JustBuilt
            Animation                           = tbsacoak_bld
                AnimationName                       = tbsacoak_bld.tbsacoak_bld
                AnimationMode                       = ONCE
                AnimationBlendTime                  = 0
                AnimationSpeedFactorRange           = 1.2 1.2
            End
            Flags                               = START_FRAME_FIRST
        End
        
        ;// Animations : Endommagée
        ModelConditionState                 = DAMAGED
            Model                               = tbsacoak_d1
            ParticleSysBone                     FireSmall02 FireBuildingMedium
        End
        AnimationState                      = DAMAGED
            EnteringStateFX                     = FX_BuildingDamaged
        End
        
        ;// Animations : Très endommagée
        ModelConditionState                 = REALLYDAMAGED
            Model                               = tbsacoak_d2
            ParticleSysBone                     FireSmall02 FireBuildingMedium
        End
        AnimationState                      = REALLYDAMAGED
            EnteringStateFX                     = FX_BuildingReallyDamaged
        End
        
