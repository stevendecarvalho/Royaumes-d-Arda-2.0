Object MirkwoodWatchtowerExpansion
    SelectPortrait                      = UPGreenwoodFletExpansion
    ButtonImage                         = UIGreenwoodFletExpansion
    
    ;////////////////////////////
    ;// PARAMÈTRES ARTISTIQUES //
    ;////////////////////////////
    
    Draw                                = W3DScriptedModelDraw ModuleTag_Draw
        OkToChangeModelColor                = Yes
        UseStandardModelNames               = Yes
        StaticModelLODMode                  = Yes
        ExtraPublicBone                     = ARCHER01
        ExtraPublicBone                     = ARCHER02
        ExtraPublicBone                     = ARCHER03
        ExtraPublicBone                     = ARCHER04
        
        DefaultModelConditionState
            Model                               = tbNforttwr_skn
            WeaponLaunchBone                    = PRIMARY ARROW_
        End
        
        ;// Animations : Féerie enchanteresse
        ModelConditionState                 = USER_75 USER_31 SNOW
            Model                               = tbNforttwrg_skn
            WeaponLaunchBone                    = PRIMARY ARROW_
            Texture                             = tbNfortress_green.tga tbNfortress_snow_green.tga
            Texture                             = tbNfortress2_green.tga tbNfortress2_snow_green.tga
            ParticleSysBone                     = None MirkwoodButterflies Followbone:No
        End
        ModelConditionState                 = USER_75 USER_31
            Model                               = tbNforttwrg_skn
            WeaponLaunchBone                    = PRIMARY ARROW_
            ParticleSysBone                     = None MirkwoodButterflies Followbone:No
        End
        ModelConditionState                 = USER_31 SNOW
            Model                               = tbNforttwr_skn
            WeaponLaunchBone                    = PRIMARY ARROW_
            Texture                             = tbNfortress.tga tbNfortress_snow.tga
            Texture                             = tbNfortress2.tga tbNfortress2_snow.tga
            ParticleSysBone                     = None MirkwoodButterflies Followbone:No
        End
        ModelConditionState                 = USER_31
            Model                               = tbNforttwr_skn
            WeaponLaunchBone                    = PRIMARY ARROW_
            ParticleSysBone                     = None MirkwoodButterflies Followbone:No
        End
        
        ;// Modèle : Avènement d'Eryn Lasgalen
        ModelConditionState                 = SNOW USER_74
            Model                               = tbNforttwrg_skn
            WeaponLaunchBone                    = PRIMARY ARROW_
            Texture                             = tbNfortress_green.tga tbNfortress_snow_green.tga
            Texture                             = tbNfortress2_green.tga tbNfortress2_snow_green.tga
        End
        ModelConditionState                 = USER_74
            Model                               = tbNforttwrg_skn
            WeaponLaunchBone                    = PRIMARY ARROW_
        End
        ModelConditionState                 = SNOW USER_75
            Model                               = tbNforttwrg_skn
            WeaponLaunchBone                    = PRIMARY ARROW_
            Texture                             = tbNfortress_green.tga tbNfortress_snow_green.tga
            Texture                             = tbNfortress2_green.tga tbNfortress2_snow_green.tga
        End
        ModelConditionState                 = USER_75
            Model                               = tbNforttwrg_skn
            WeaponLaunchBone                    = PRIMARY ARROW_
        End
        
        ;// Animations : En cours de construction
        ModelConditionState                 = USER_75 SNOW ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
            Model                               = tbNforttwrg_bld
            Texture                             = EBFortress.tga EBFortress_snow.tga
        End
        ModelConditionState                 = USER_75 ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
            Model                               = tbNforttwrg_bld
        End
        AnimationState                      = USER_75 ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
            Animation                           = tbNforttwrg_bld
                AnimationName                       = tbNforttwrg_bld.tbNforttwrg_bld
                AnimationMode                       = MANUAL
            End
            ParticleSysBone                     = NONE BuildingContructDustExp
            ParticleSysBone                     = NONE ExpMirkwood_Green
            BeginScript
                CurDrawablePlaySound("GondorBarracksBeginConstruction")
            EndScript
        End
        ModelConditionState                 = SNOW ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
            Model                               = tbNforttwr_bld
            Texture                             = EBFortress.tga EBFortress_snow.tga
        End
        ModelConditionState                 = ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
            Model                               = tbNforttwr_bld
        End
        AnimationState                      = ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
            Animation                           = tbNforttwr_bld
                AnimationName                       = tbNforttwr_bld.tbNforttwr_bld
                AnimationMode                       = MANUAL
            End
            ParticleSysBone                     = NONE BuildingContructDustExp
            ParticleSysBone                     = NONE ExpMirkwood
            BeginScript
                CurDrawablePlaySound("GondorBarracksBeginConstruction")
            EndScript
        End
        
        ;// Animations : Endommagée
        ModelConditionState                 = USER_75 DAMAGED
            Model                               = tbNforttwrg_d1
        End
        AnimationState                      = USER_75 DAMAGED
            EnteringStateFX                     = FX_BuildingDamaged
        End
        ModelConditionState                 = DAMAGED
            Model                               = tbNforttwr_d1
        End
        AnimationState                      = DAMAGED
            EnteringStateFX                     = FX_BuildingDamaged
        End
        
        ;// Animations : Très endommagée
        ModelConditionState                 = USER_75 REALLYDAMAGED
            Model                               = tbNforttwrg_d2
        End
        AnimationState                      = USER_75 REALLYDAMAGED
            EnteringStateFX                     = FX_BuildingReallyDamaged
        End
        ModelConditionState                 = REALLYDAMAGED
            Model                               = tbNforttwr_d2
        End
        AnimationState                      = REALLYDAMAGED
            EnteringStateFX                     = FX_BuildingReallyDamaged
        End
        
        ;// Animations : Décombres
        ModelConditionState                 = USER_75 RUBBLE
            Model                               = tbNforttwrg_d2
        End
        ModelConditionState                 = RUBBLE
            Model                               = tbNforttwr_d2
        End
        AnimationState                      = RUBBLE
            EnteringStateFX                     = FX_StructureMediumCollapse
        End
        
        ;// Modèle : Enneigé
        ModelConditionState                 = SNOW
            Model                               = tbNforttwr_skn
            Texture                             = tbNfortress.tga tbNfortress_snow.tga
            Texture                             = tbNfortress2.tga tbNfortress2_snow.tga
        End
    End
    
    ;// Modèle : Sol
    Draw                                = W3DFloorDraw ModuleTag_DrawFloorV2
        StaticModelLODMode                  = Yes
        ModelName                           = tbNforttwrg_bib
        WeatherTexture                      = SNOWY tbNforttwr_bib_snow_green.tga
        HideIfModelConditions               = AWAITING_CONSTRUCTION
        HideIfModelConditions               = PARTIALLY_CONSTRUCTED
    End
    Draw                                = W3DFloorDraw ModuleTag_DrawFloorV1
        StaticModelLODMode                  = Yes
        ModelName                           = tbNforttwr_bib
        WeatherTexture                      = SNOWY tbNforttwr_bib_snow.tga
        HideIfModelConditions               = AWAITING_CONSTRUCTION
        HideIfModelConditions               = PARTIALLY_CONSTRUCTED
        HideIfModelConditions               = USER_75
    End
    
    
    
    ;/////////////////////////
    ;// PARAMÈTRES GÉNÉRAUX //
    ;/////////////////////////
    
    DisplayName                         = OBJECT:MirkwoodWatchtowerExpansion
    Description                         = OBJECT:MirkwoodWatchtowerExpansionDescription
    IsTrainable                         = No
    
    BuildCost                           = RDA_MIRKWOOD_FORTRESS_TOWER_EXPANSION_BUILDCOST
    BuildTime                           = GENERIC_FORTRESS_EXPANSION2_BUILDTIME
    VisionRange                         = GENERIC_DEFENSE_STRUCTURE_VISION
    ShroudClearingRange                 = GENERIC_DEFENSE_STRUCTURE_SHROUD_CLEAR
    BountyValue                         = RDA_MIRKWOOD_FORTRESS_TOWER_EXPANSION_BOUNTY_VALUE
    
    Side                                = Mirkwood
    EditorSorting                       = STRUCTURE
    ThreatLevel                         = 11.0
    PlacementViewAngle                  = 0
    
    CommandSet                          = SellableCommandSet
    
    
    
    ;/////////////////////
    ;// ARMES & ARMURES //
    ;/////////////////////
    
    ArmorSet
        Conditions                          = None
        Armor                               = RDA_WALLS_BUILDINGS_ARMOR
    End
    
    
    
    ;//////////////////////
    ;// PARAMÈTRES AUDIO //
    ;//////////////////////
    
    #include "..\..\..\Includes\StandardBuildingEvaEvents.inc"
    
    VoiceSelect                         = NeutralArrowTowerSelect
    VoiceSelectUnderConstruction        = BuildingGoodVoiceSelectUnderConstruction
    
    SoundOnDamaged                      = BuildingLightDamageStone
    SoundOnReallyDamaged                = BuildingHeavyDamageStone
    
    UnitSpecificSounds
        UnderConstruction                   = BuildingConstructionLoop
        UnderRepairFromRubble               = BuildingConstructionLoop
    End
    
    CampnessValue                       = CAMPNESS_FORTRESS_EXPANSION
    
    
    
    ;/////////////////////////////
    ;// PARAMÈTRES D'INGÉNIERIE //
    ;/////////////////////////////
    
    RadarPriority                       = STRUCTURE
    KindOf                              = PRELOAD STRUCTURE SELECTABLE IMMOBILE SCORE NEED_BASE_FOUNDATION CAN_ATTACK FS_BASE_DEFENSE SPAWNS_ARE_THE_WEAPONS
    
    Behavior                            = GettingBuiltBehavior ModuleTag_04
        WorkerName                          = MirkwoodWorkerNoSelect
        SpawnTimer                          = DEFAULT_STRUCTURE_HEALDELAY
    End
    
    Behavior                            = StructureCollapseUpdate ModuleTag_StructureCollapseUpdate
        MinCollapseDelay                    = 000
        MaxCollapseDelay                    = 000
        CollapseDamping                     = .5
        MaxShudder                          = 0.6
        MinBurstDelay                       = 250
        MaxBurstDelay                       = 800
        BigBurstFrequency                   = 4
        FXList                              = INITIAL FX_StructureMediumCollapse
        FXList                              = ALMOST_FINAL FX_StructureAlmostCollapse
        DestroyObjectWhenDone               = Yes
        CollapseHeight                      = 89
    End
    
    Behavior                            = CastleMemberBehavior ModuleTag_CMB
    End
    
    Behavior                            = BuildingBehavior BuildingModuleTag
        NightWindowName                     = WINDOW_N01
    End
    
    Behavior                            = SpawnPointProductionExitUpdate ModuleTag_ProductionExit
        SpawnPointBoneName                  = ARCHER
    End
    
    
    
    ;/////////////////////////
    ;// PARAMÈTRES DE SANTÉ //
    ;/////////////////////////
    
    Body                                = StructureBody ModuleTag_05
        MaxHealth                           = GENERIC_TOWER_HEALTH
        MaxHealthDamaged                    = GENERIC_TOWER_HEALTH_DAMAGED
        MaxHealthReallyDamaged              = GENERIC_TOWER_HEALTH_REALLY_DAMAGED
    End
    
    
    
    ;///////////////////////////////
    ;// INTELLIGENCE ARTIFICIELLE //
    ;///////////////////////////////
    
    Behavior                            = AIUpdateInterface ModuleTag_SoWeCanUseWeapon
        AutoAcquireEnemiesWhenIdle          = Yes
        MoodAttackCheckRate                 = 250
    End
    
    
    
    ;////////////////
    ;// MORT LENTE //
    ;////////////////
    
    Behavior                            = SlowDeathBehavior ModuleTag_SlowDeathWithoutRubble
        DestructionDelay                    = 4000
    End
    
    
    
    ;////////////////
    ;// RESSOURCES //
    ;////////////////
    
    Behavior                            = TerrainResourceBehavior ModuleTag_NewMoneyDeadSpot
        Radius                              = 100
        MaxIncome                           = 0
        IncomeInterval                      = 999999
        HighPriority                        = Yes
        Visible                             = No
    End
    
    
    
    ;/////////////////
    ;// PATROUILLES //
    ;/////////////////
    
    Behavior                            = SpawnBehavior ModuleTag_Spawn
        SpawnNumber                         = 3
        InitialBurst                        = 3
        SpawnTemplateName                   = MirkwoodPrisonGuard_Blue_Slaved
        KillSpawnsBasedOnModelConditionState = No
        SpawnReplaceDelay                   = 999999
        CanReclaimOrphans                   = No
        SpawnedRequireSpawner               = Yes
        ShareUpgrades                       = Yes
    End
    
    
    
    ;/////////////////////////////////////////
    ;// POUVOIR : AVÈNEMENT D'ERYN LASGALEN //
    ;/////////////////////////////////////////
    
    Behavior                            = AttributeModifierUpgrade ModuleTag_AvenementFlashModifier
        TriggeredBy                         = Upgrade_MirkwoodAvenement
        AttributeModifier                   = MirkwoodAvenementFlashModifier
    End

    Behavior                            = AttributeModifierUpgrade ModuleTag_AvenementArmorModifier
        TriggeredBy                         = Upgrade_MirkwoodAvenement
        AttributeModifier                   = MirkwoodAvenementArmorModifier
    End
    
    ;/////
    
    Behavior                            = ModelConditionUpgrade ModuleTag_AvenementVisual
        TriggeredBy                         = Upgrade_MirkwoodAvenement
        AddConditionFlags                   = USER_75
        Permanent                           = Yes
    End
    
    Behavior                            = SubObjectsUpgrade ModuleTag_SwitchFloors
        TriggeredBy                         = Upgrade_MirkwoodAvenement
        ShowSubObjects                      = ModuleTag_DrawFloorV2
        HideSubObjects                      = ModuleTag_DrawFloorV1
    End
    
    
    
    ;/////////////////////////////
    ;// PARAMÈTRES DE GÉOMÉTRIE //
    ;/////////////////////////////
    
    Geometry                            = BOX
    GeometryMajorRadius                 = 14.0
    GeometryMinorRadius                 = 14.0
    GeometryHeight                      = 140.0
    GeometryOffset                      = X:-5 Y:0 Z:0
    
    AdditionalGeometry                  = BOX
    GeometryMajorRadius                 = 15.0
    GeometryMinorRadius                 = 10.0
    GeometryHeight                      = 50.0
    GeometryOffset                      = X:-30 Y:0 Z:0
    GeometryIsSmall                     = No
    
    Shadow                              = SHADOW_VOLUME
    BuildCompletion                     = PLACED_BY_PLAYER
    
    GeometryContactPoint                = X:23.624 Y:23.464 Z:0 Repair
    GeometryContactPoint                = X:22.954 Y:-16.306 Z:0 Repair
    GeometryContactPoint                = X:22.954 Y:15.951 Z:0
    GeometryContactPoint                = X:5.435 Y:-23.279 Z:0
    GeometryContactPoint                = X:-0.459 Y:-0.275 Z:116.828 Swoop
End





