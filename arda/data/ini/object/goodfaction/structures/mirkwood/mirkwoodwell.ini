;////////////////////////////////////////////////////////////////////////////////////
;////////////////////////////////////////////////////////////////////////////////////
;/////																			/////
;/////							FONTAINE A VINS									/////
;/////																			/////
;////////////////////////////////////////////////////////////////////////////////////
;////////////////////////////////////////////////////////////////////////////////////

Object MirkwoodWell
	SelectPortrait							= UPWellofWine
	
	;////////////////////////////
	;// PARAMÈTRES ARTISTIQUES //
	;////////////////////////////

	Draw									= W3DScriptedModelDraw ModuleTag_Draw
		OkToChangeModelColor					= Yes
		UseStandardModelNames					= Yes
		StaticModelLODMode						= Yes

		DefaultModelConditionState
			Model									= tbwell_skn
		End

		IdleAnimationState
		End
		
		;// Animations : Maître des Vins
		ModelConditionState						= USER_9
			Model									= tbwell_skn
			WeaponLaunchBone						= PRIMARY ARROW
			ParticleSysBone							= None MasterOfWinesCellarDoorFX FollowBone:No
		End
		
		;// Animations : Féerie enchanteresse
		ModelConditionState						= USER_31 SNOW
			Model									= tbwell_skn
			Texture									= tbwell.tga tbwell_snow.tga
			ParticleSysBone							= None MirkwoodButterflies Followbone:No			
		End		
		ModelConditionState						= USER_31
			Model									= tbwell_skn
			ParticleSysBone							= None MirkwoodButterflies Followbone:No			
		End		
		
		;// Animations : Curseur
		ModelConditionState						= BUILD_PLACEMENT_CURSOR
			Shadow									= SHADOW_ALPHA_DECAL
			ShadowTexture							= decal_buff_radius
			ShadowSizeX								= GENERIC_STATUE_BUFF_RADIUS_DECAL
			ShadowSizeY								= GENERIC_STATUE_BUFF_RADIUS_DECAL
		    ShadowOverrideLODVisibility				= Yes
		End
		
		;// Animations : En cours de construction
		ModelConditionState						= AWAITING_CONSTRUCTION 
			Model									= tbwell_bld
		End
		AnimationState							= AWAITING_CONSTRUCTION
			Animation								= tbwell_bld
				AnimationName							= tbwell_bld.tbwell_bld
				AnimationMode							= MANUAL
				AnimationBlendTime						= 0
			End
			Flags									= START_FRAME_FIRST
		End
		ModelConditionState						= ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
			Model									= tbwell_bld
			ParticleSysBone							= CONSTDUSTBONE01 BuildingContructDust FollowBone:Yes
			ParticleSysBone							= NONE ExpMirkwood	
		End
		AnimationState							= ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
			Animation								= tbwell_bld
				AnimationName							= tbwell_bld.tbwell_bld
				AnimationMode							= MANUAL
				AnimationBlendTime						= 0
			End
			Flags									= START_FRAME_FIRST
			StateName								= BeingConstructed
			BeginScript
				CurDrawablePlaySound("GondorBarracksBeginConstruction")
			EndScript
		End
		
		;// Animations : Endommagée
		ModelConditionState						= DAMAGED
			Model									= tbwell_d1
			ParticleSysBone							FireSmall01 FireBuildingMedium
			ParticleSysBone							FireSmall02 FireBuildingLarge
			ParticleSysBone							FireSmall03 FireBuildingMedium
			ParticleSysBone							FireSmall04 FireBuildingMedium
			ParticleSysBone							FireSmall05 SmokeBuildingLarge
		End
		AnimationState							= DAMAGED
			EnteringStateFX							= FX_BuildingDamaged
		End
		
		;// Animations : Très endommagée
		ModelConditionState						= REALLYDAMAGED
			Model									= tbwell_d2
			ParticleSysBone							FireSmall01 FireBuildingMedium
			ParticleSysBone							FireSmall02 FireBuildingLarge
			ParticleSysBone							FireSmall03 FireBuildingMedium
			ParticleSysBone							FireSmall04 FireBuildingLarge
			ParticleSysBone							FireSmall05 SmokeBuildingLarge
		End
		AnimationState							= REALLYDAMAGED
			EnteringStateFX							= FX_BuildingReallyDamaged
		End
		
		;// Animations : Décombres
		ModelConditionState						= RUBBLE
			Model									= tbwell_d2  
			ParticleSysBone							NONE SmokeBuildingLarge
			ParticleSysBone							NONE TrebuchetImpactDebris
		End
		AnimationState							= RUBBLE
			EnteringStateFX							= FX_StructureMediumCollapse
		End
		ModelConditionState						= POST_RUBBLE
			Model									= None
			ParticleSysBone							NONE SmokeBuildingMediumRubble
		End
		ModelConditionState						= POST_COLLAPSE
			Model									= None
			ParticleSysBone							NONE SmokeBuildingMediumRubble
		End
		
		;// Modèle : Enneigé
		ModelConditionState						= SNOW
			Model									= tbwell_skn
			Texture									= tbwell.tga tbwell_snow.tga
		End
	End
	
	;// Modèle : Sol
	Draw								= W3DFloorDraw ModuleTag_DrawFloor
		StaticModelLODMode						= Yes
		ModelName								= tbwell_bib
		WeatherTexture							= SNOWY tbwell_bib_snow.tga
  		HideIfModelConditions					= AWAITING_CONSTRUCTION
  		HideIfModelConditions					= PARTIALLY_CONSTRUCTED
	End
	
	;// Modèle : Bonus
	Draw								= W3DScriptedModelDraw TheHealEffect
		ModelConditionState					= NONE
			Model								= None
			ParticleSysBone						NONE MirkwoodWellHealFX
		End
		ModelConditionState					= ACTIVELY_BEING_CONSTRUCTED
			Model								= None
		End
		AnimationState						= USER_9
			ParticleSysBone						= None MasterOfWinesCellarDoorFX FollowBone:No
		End
	End
	
	
	
	;/////////////////////////
	;// PARAMÈTRES GÉNÉRAUX //
	;/////////////////////////

	DisplayName								= OBJECT:MirkwoodWell
	Description								= OBJECT:MirkwoodWellDescription
	
	BuildCost								= RDA_MIRKWOOD_WELL_BUILDCOST
	BuildTime								= GENERIC_STRUCTURE_SUPPORT_BUILDTIME
 	VisionRange								= GENERIC_STANDARD_STRUCTURE_VISION
	ShroudClearingRange						= GENERIC_STANDARD_STRUCTURE_SHROUD_CLEAR
	BountyValue								= RDA_MIRKWOOD_WELL_BOUNTY_VALUE
	
	Side									= Mirkwood
	IsTrainable								= No
	EditorSorting							= STRUCTURE
	ThreatLevel								= 1.0
	PlacementViewAngle						= -45

	CommandSet								= MirkwoodWellCommandSet
	
	
	
	;/////////////////////
	;// ARMES & ARMURES //
	;/////////////////////
	
	ArmorSet
		Conditions								= None
		Armor									= GenericArmor_30
	End
	
	
	
	;//////////////////////
	;// PARAMÈTRES AUDIO //
	;//////////////////////
	
	#include "..\..\..\Includes\StandardBuildingEvaEvents.inc"

	VoiceFullyCreated						= EVA:MirkwoodWellofWineComplete
	
	VoiceSelect								= WellofWineSelect
	VoiceSelectUnderConstruction			= BuildingGoodVoiceSelectUnderConstruction

	SoundAmbient							= WaterFountain1AmbientLoop
	SoundAmbientDamaged						= BuildingDamageFireMediumLoop
	SoundAmbientReallyDamaged				= BuildingDamageFireLargeLoop
	SoundOnDamaged							= BuildingLightDamageStone
	SoundOnReallyDamaged					= BuildingHeavyDamageStone

	UnitSpecificSounds
		UnderConstruction						= BuildingConstructionLoop
		UnderRepairFromRubble					= BuildingConstructionLoop
	End
	
	
	
	;/////////////////////////////
	;// PARAMÈTRES D'INGÉNIERIE //
	;/////////////////////////////

	RadarPriority							= STRUCTURE
	KindOf									= PRELOAD STRUCTURE SELECTABLE IMMOBILE SCORE NEED_BASE_FOUNDATION MADE_OF_STONE CAN_SEE_THROUGH_STRUCTURE IGNORE_FOR_VICTORY

	Behavior								= GettingBuiltBehavior GetBuiltBehaviorTag
		WorkerName								= MirkwoodWorkerNoSelect
		SpawnTimer								= DEFAULT_STRUCTURE_HEALDELAY
	End

	Behavior								= StructureCollapseUpdate ModuleTag_StructureCollapseUpdate
		MinCollapseDelay						= 000
		MaxCollapseDelay						= 000
		CollapseDamping							= .5
		MaxShudder								= 0.6
		MinBurstDelay							= 250
		MaxBurstDelay							= 800
		BigBurstFrequency						= 4
		FXList									= INITIAL FX_StructureMediumCollapse
		CollapseHeight							= 75
	End
	
	Behavior								= CastleMemberBehavior ModuleTag_CMB
	End
	
	
	
	;/////////////////////////
	;// PARAMÈTRES DE SANTÉ //
	;/////////////////////////

	Body									= StructureBody ModuleTag_05
		MaxHealth								= GENERIC_BUFF_STRUCTURE_HEALTH
		MaxHealthDamaged						= GENERIC_BUFF_STRUCTURE_HEALTH_DAMAGED
		MaxHealthReallyDamaged					= GENERIC_BUFF_STRUCTURE_HEALTH_REALLY_DAMAGED
	End
	
	
	
	;///////////////////////////////
	;// INTELLIGENCE ARTIFICIELLE //
	;///////////////////////////////
	
	Behavior								= AIUpdateInterface ModuleTag_SoWeCanUseWeapon
		AutoAcquireEnemiesWhenIdle				= Yes
		MoodAttackCheckRate						= 250
		AILuaEventsList							= MirkwoodWellFunctions
	End
	
	
	
	;////////////////
	;// MORT LENTE //
	;////////////////

	Behavior								= SlowDeathBehavior ModuleTag_SlowDeathWithoutRubble
		DestructionDelay						= 5000
	End
	
	
	
	;//////////
	;// HEAL //
	;//////////
	
	Behavior								= BannerCarrierUpdate BannerCarrierUpdateModuleTag
		IdleSpawnRate							= 18000
		UnitSpawnFX								= FX_BannerCarrierSpawnUnit
		ReplenishNearbyHorde					= Yes
		ReplenishAllNearbyHordes				= Yes
		ScanHordeDistance						= GENERIC_STATUE_BUFF_RADIUS_DECAL
	End
	
	
	
	;//////////////////////////////////
	;// COMPÉTENCE : MAÎTRE DES VINS //
	;//////////////////////////////////

	Behavior								= PassiveAreaEffectBehavior ModuleTag_WineMasterBonus
		UpgradeRequired							= Upgrade_MirkwoodWell_GalionNear
		EffectRadius							= GENERIC_STATUE_BUFF_RADIUS_DECAL
		PingDelay								= 3000
		HealPercentPerSecond					= 2%
		AllowFilter								= ANY +INFANTRY +CAVALRY -MACHINE -IMMOBILE +DOZER
		NonStackable							= No
		HealFX									= FX_SpellHealUnitHealBuff
	End
	
	
	
	;//////////////////////////
	;// DÉTECTE LA FURTIVITÉ //
	;//////////////////////////
	
	Behavior								= StealthDetectorUpdate StealthDetectorUpdateModuleTag
		DetectionRate							= 500
		CancelOneRingEffect						= No
	End
	
	
	
	;////////////////////////
	;// COMPÉTENCE PASSIVE //
	;////////////////////////

	Behavior								= PassiveAreaEffectBehavior ModuleTag_SplashOfHealingWater_Ahh
		EffectRadius							= GENERIC_STATUE_BUFF_RADIUS_DECAL
		PingDelay								= 3000
		HealPercentPerSecond					= 1%
		AllowFilter								= ANY +INFANTRY +CAVALRY -MACHINE -IMMOBILE +DOZER
		NonStackable							= Yes
		HealFX									= FX_SpellHealUnitHealBuff
	End
	
	
	
	;///////////////////////////////////////////////
	;// POUVOIR DU SPELLBOOK : DOUBLEZ LA GARDE ! //
	;///////////////////////////////////////////////
	
    Behavior								= ObjectCreationUpgrade ModuleTag_RemoveUpgradesPrisonGuard1
		TriggeredBy								= Upgrade_PrisonGuard1
		RemoveUpgrade							= Upgrade_PrisonGuard2
    End
	
    Behavior								= ObjectCreationUpgrade ModuleTag_RemoveUpgradesPrisonGuard2
		TriggeredBy								= Upgrade_PrisonGuard2
		RemoveUpgrade							= Upgrade_PrisonGuard1
    End	
	
	Behavior								= ObjectCreationUpgrade ModuleTag_SpellPrisonGuard1
		TriggeredBy								= Upgrade_PrisonGuard1
		Delay									= 200.0
		DestroyWhenSold							= Yes
		ThingToSpawn							= MirkwoodMobilisationEgg
		Offset									= X:-55 Y:0 Z:0
		Angle									= 180
		FadeInTime								= 2000
	End

	Behavior								= ObjectCreationUpgrade ModuleTag_SpellPrisonGuard2
		TriggeredBy								= Upgrade_PrisonGuard1
		Delay									= 200.0
		DestroyWhenSold							= Yes
		ThingToSpawn							= MirkwoodMobilisationEgg
		Offset									= X:55 Y:0 Z:0
		Angle									= 0
		FadeInTime								= 2000
	End
	
	
	
	;/////////////////////////////
	;// PARAMÈTRES DE GÉOMÉTRIE //
	;/////////////////////////////
	
	Geometry								= CYLINDER
	GeometryMajorRadius						= 50.0
	GeometryHeight							= 52.0
	GeometryIsSmall							= No
	Shadow									= SHADOW_VOLUME
	BuildCompletion							= PLACED_BY_PLAYER

	GeometryContactPoint					= X:0		Y:-40	Z:0 	Grab
	GeometryContactPoint					= X:-5		Y:-5	Z:16 
	GeometryContactPoint					= X:-40		Y:0		Z:0 	Grab
	GeometryContactPoint					= X:-5		Y:5		Z:16 
	GeometryContactPoint					= X:0		Y:40	Z:0		Grab
	GeometryContactPoint					= X:5		Y:5		Z:16 
	GeometryContactPoint					= X:40		Y:0		Z:0		Grab
	GeometryContactPoint					= X:5		Y:-5	Z:16 	
	GeometryContactPoint					= X:-23		Y:24	Z:0		Repair
	GeometryContactPoint					= X:46		Y:-54	Z:0		Repair
End





ChildObject MirkwoodWellFoundation MirkwoodWell
	EquivalentTo							= MirkwoodWell
	PlacementViewAngle						= 0
	EditorSorting							= SYSTEM
	Behavior								= CastleMemberBehavior ModuleTag_CMB
	End
End