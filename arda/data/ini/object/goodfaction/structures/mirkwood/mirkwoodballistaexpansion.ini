Object MirkwoodBallistaExpansion
	SelectPortrait							= UPMirkwoodFortressBallista
	
	;////////////////////////////
	;// PARAMÈTRES ARTISTIQUES //
	;////////////////////////////

	Draw									= W3DScriptedModelDraw ModuleTag_Draw
		OkToChangeModelColor					= Yes
		UseStandardModelNames					= Yes
		StaticModelLODMode						= Yes
		
		DefaultModelConditionState
			Model									= tbforttwr_skn
		End
		
		ModelConditionState						= USER_31 SNOW
			Model									= tbforttwr_skn
			Texture									= tbNfortress.tga tbNfortress_snow.tga
			ParticleSysBone							= None MirkwoodButterflies Followbone:No
		End
		ModelConditionState						= USER_31
			Model									= tbforttwr_skn
			ParticleSysBone							= None MirkwoodButterflies Followbone:No
		End
		
		;// Animations : En cours de construction		
		ModelConditionState						= UPGRADE_NUMENOR_STONEWORK ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
			Model									= tbforttwr_bld
		End
		ModelConditionState						= ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED SNOW
			Model									= tbforttwr_bld
			Texture									= tbNfortress.tga tbNfortress_snow.tga
		End
		ModelConditionState						= ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
			Model									= tbforttwr_bld
		End
		AnimationState							= ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
			Animation								= tbforttwr_bld
				AnimationName							= tbforttwr_bld.tbforttwr_bld
				AnimationMode							= MANUAL
			End
			Flags									= START_FRAME_FIRST
			StateName								= BeingConstructed
			ParticleSysBone							= NONE BuildingContructDustExp
			ParticleSysBone							= NONE ExpMirkwood
			BeginScript
				CurDrawablePlaySound("GondorBarracksBeginConstruction")
			EndScript
		End
		
		;// Animations : Endommagée
		ModelConditionState						= DAMAGED
			Model									= tbforttwr_D1
		End
		AnimationState							= DAMAGED
			EnteringStateFX							= FX_BuildingDamaged
		End
		
		;// Animations : Très endommagée
		ModelConditionState						= REALLYDAMAGED
			Model									= tbforttwr_D2
		End
		AnimationState							= REALLYDAMAGED
			EnteringStateFX							= FX_BuildingReallyDamaged
		End
		
		;// Animations : Décombres
		ModelConditionState						= RUBBLE
			Model									= tbforttwr_D2
		End
		AnimationState							= RUBBLE
			EnteringStateFX							= FX_StructureMediumCollapseNoSound
		End
		
		;// Animations : Améliorations
		ModelConditionState						= UPGRADE_NUMENOR_STONEWORK
			Model									= tbforttwr_skn
			Texture									= IBFortress.tga IBFortress_U.tga
		End
		ModelConditionState						= SNOW
			Model									= tbforttwr_skn
			Texture									= tbNfortress.tga tbNfortress_snow.tga
		End
	End
	
	;// Modèle : Sol
	Draw								= W3DFloorDraw DrawFloorV1
		StaticModelLODMode						= Yes
		ModelName								= tbforttwr_bib
		WeatherTexture							= SNOWY tblookout_bib_snow.tga
	End
	
	
	
	;/////////////////////////
	;// PARAMÈTRES GÉNÉRAUX //
	;/////////////////////////

	DisplayName								= OBJECT:MirkwoodBallistaExpansion
	Description								= OBJECT:MirkwoodBallistaExpansionDescription
	IsTrainable								= No
	
	BuildCost								= RDA_MIRKWOOD_FORTRESS_BALISTA_EXPANSION_BUILDCOST
	BuildTime								= GENERIC_FORTRESS_EXPANSION3_BUILDTIME
 	VisionRange								= GENERIC_DEFENSE_STRUCTURE_VISION
	ShroudClearingRange						= GENERIC_DEFENSE_STRUCTURE_SHROUD_CLEAR
	BountyValue								= RDA_MIRKWOOD_FORTRESS_BALISTA_EXPANSION_BOUNTY_VALUE
	
	Side									= Mirkwood
	EditorSorting							= STRUCTURE
	ThreatLevel								= 11.0
	PlacementViewAngle						= 0

	CommandSet								= SellableCommandSet
	
	
	
	;/////////////////////
	;// ARMES & ARMURES //
	;/////////////////////
	
	WeaponSet
		Conditions								= None
		Weapon									= PRIMARY HighBallistaExpansionWeapon
	End
	
	ArmorSet
		Conditions								= None
		Armor									= GenericArmor_60
	End
	
	
	
	;//////////////////////
	;// PARAMÈTRES AUDIO //
	;//////////////////////
	
	#include "..\..\..\Includes\StandardBuildingEvaEvents.inc"
	
	VoiceSelect								= MirkwoodBallistaExpansionSelect
	VoiceSelectUnderConstruction			= BuildingEvilVoiceSelectUnderConstruction
	
	SoundOnDamaged							= BuildingLightDamageStone
	SoundOnReallyDamaged					= BuildingHeavyDamageStone
	
	UnitSpecificSounds
		UnderConstruction						= BuildingConstructionLoop
		UnderRepairFromRubble					= BuildingConstructionLoop
	End
	
	CampnessValue							= CAMPNESS_FORTRESS_EXPANSION
	
	
	
	;/////////////////////////////
	;// PARAMÈTRES D'INGÉNIERIE //
	;/////////////////////////////
	
	RadarPriority							= STRUCTURE
	KindOf									= PRELOAD STRUCTURE SELECTABLE IMMOBILE SCORE NEED_BASE_FOUNDATION FS_BASE_DEFENSE
	
	Behavior								= GettingBuiltBehavior ModuleTag_04
		WorkerName								= MirkwoodWorkerNoSelect
		SpawnTimer								= DEFAULT_STRUCTURE_HEALDELAY
	End
	
	Behavior								= StructureCollapseUpdate ModuleTag_StructureCollapseUpdate
		MinCollapseDelay						= 000
		MaxCollapseDelay						= 000
		CollapseDamping							= .5
		MaxShudder								= 0.6
		MinBurstDelay							= 250
		MaxBurstDelay							= 800
		BigBurstFrequency						= 4
		FXList									= INITIAL FX_StructureMediumCollapse
		FXList									= ALMOST_FINAL FX_StructureAlmostCollapse
		DestroyObjectWhenDone					= Yes
		CollapseHeight							= 89
	End
	
    Behavior								= CastleMemberBehavior ModuleTag_CMB
    End
	
	Behavior								= BuildingBehavior BuildingModuleTag
		NightWindowName							= WINDOW_N01
	End
	
	
	
	;/////////////////////////
	;// PARAMÈTRES DE SANTÉ //
	;/////////////////////////
	
	Body									= StructureBody ModuleTag_05
		MaxHealth								= GENERIC_TOWER_HEALTH
		MaxHealthDamaged						= GENERIC_TOWER_HEALTH_DAMAGED
		MaxHealthReallyDamaged					= GENERIC_TOWER_HEALTH_REALLY_DAMAGED
	End
	
	
	
	;///////////////////////////////
	;// INTELLIGENCE ARTIFICIELLE //
	;///////////////////////////////
	
	Behavior								= AIUpdateInterface ModuleTag_SoWeCanUseWeapon
		AutoAcquireEnemiesWhenIdle				= Yes
		MoodAttackCheckRate						= 250
		AttackPriority							= AttackPriority_ARCHER
	End
	
	
	
	;////////////////
	;// MORT LENTE //
	;////////////////
	
	Behavior								= SlowDeathBehavior ModuleTag_SlowDeathWithoutRubble
		DestructionDelay						= 4000
	End
	
	
	
	;////////////////
	;// PRODUCTION //
	;////////////////
	
	Behavior								= ProductionUpdate ProductionUpdateModuleTag
	End
	
	
	
	;////////////////
	;// RESSOURCES //
	;////////////////
	
	Behavior								= TerrainResourceBehavior ModuleTag_NewMoneyDeadSpot
		Radius									= 100
		MaxIncome								= 0
		IncomeInterval							= 999999
		HighPriority							= Yes
		Visible									= No
	End
	
	
	
	;/////////////
	;// BALISTE //
	;/////////////
	
	Behavior								= GrantUpgradeCreate ModuleTag_ActLikeAnOldUpgrade
		UpgradeToGrant							= Upgrade_MirkwoodBallistaTurret
		GiveOnBuildComplete						= Yes
	End
	
	Behavior								= CommandSetUpgrade ModueTag_TrebCommandSet
		TriggeredBy								= Upgrade_MirkwoodBallistaTurret
		ConflictsWith							= Upgrade_HasWallTrebuchet
		CommandSet								= MirkwoodUpgradeCommandSetBuyNewBallista
	End
	
	Behavior								= CommandSetUpgrade ModueTag_TrebCommandSet3
		TriggeredBy								= Upgrade_HasWallTrebuchet Upgrade_MirkwoodBallistaTurret
		CommandSet								= SellableCommandSet
		RequiresAllTriggers						= Yes
	End
	
	Behavior								= ObjectCreationUpgrade MakeTheFreeTreb
		TriggeredBy								= Upgrade_MirkwoodBallistaTurret
		Delay									= 0
		RemoveUpgrade							= Upgrade_GenericObject_01
		GrantUpgrade							= Upgrade_HasWallTrebuchet
		DestroyWhenSold							= Yes
		DeathAnimAndDuration					= AnimState:DEATH_2 AnimTime:999999
		Offset									= X:-6.0 Y:0.0 Z:73.0
	End
	
	Behavior								= ObjectCreationUpgrade MakeTheFreeTreb2
		TriggeredBy								= Upgrade_HasWallTrebuchet
		ConflictsWith							= Upgrade_OpenGarrison Upgrade_PosternGate
		Delay									= 0.0
		RemoveUpgrade							= Upgrade_GenericObject_01
		ThingToSpawn							= MirkwoodFortressBallista
		Offset									= X:1.0 Y:0.0 Z:73.0
		FadeInTime								= 600
	End
	
	Behavior								= SlaveWatcherBehavior WatchTheTreb
		RemoveUpgrade							= Upgrade_HasWallTrebuchet
		GrantUpgrade							= Upgrade_GenericObject_01
		ShareUpgrades							= Yes
	End
	
	
	
	;/////////////////////////////
	;// PARAMÈTRES DE GÉOMÉTRIE //
	;/////////////////////////////
	
	Geometry								= BOX
	GeometryMajorRadius						= 25
	GeometryMinorRadius						= 25
	GeometryHeight							= 50.0
	GeometryOffset							= X:-5 Y:0 Z:0
	GeometryIsSmall							= No
	
	Shadow									= SHADOW_VOLUME
	BuildCompletion							= PLACED_BY_PLAYER
	
	GeometryContactPoint					= X:10.0	Y:-30.0	Z:0			Repair
	GeometryContactPoint					= X:10.0	Y:30.0	Z:0			Repair
End