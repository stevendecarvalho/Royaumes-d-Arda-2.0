            Texture                             = tbbarracks.tga tbbarracks_green.tga
            Texture                             = ptmirktree2.tga ptmirktree2_green.tga
            ParticleSysBone                     = CONSTDUSTBONE01 BuildingContructDust FollowBone:Yes
            ParticleSysBone                     = NONE ExpMirkwood_Green
        End
        AnimationState                      = USER_75 ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
            Animation                           = tbgrounds_blb
                AnimationName                       = tbgrounds_blb.tbgrounds_blb
                AnimationMode                       = MANUAL
                AnimationBlendTime                  = 0
            End
            Flags                               = START_FRAME_FIRST
            StateName                           = BeingConstructed
            BeginScript
                CurDrawablePlaySound("GondorBarracksBeginConstruction")
                CurDrawableHideSubObjectPermanently("V1")
                CurDrawableHideSubObjectPermanently("V1FLAG")
                CurDrawableHideSubObjectPermanently("V2")
                CurDrawableHideSubObjectPermanently("GBBARRACKS_02")
            EndScript
        End
        ModelConditionState                 = ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED SNOW
            Model                               = tbgrounds_blb
            Texture                             = tbbarracks.tga tbbarracks_snow.tga
