            ParticleSysBone                     FireSmall02 FireBuildingMedium
            ParticleSysBone                     FireSmall03 FireBuildingMedium
            ParticleSysBone                     FireSmall04 FireBuildingMedium
            ParticleSysBone                     FireSmall05 SmokeBuildingLarge
        End
        AnimationState                      = DAMAGED
            EnteringStateFX                     = FX_BuildingDamaged
            ParticleSysBone                     = FIRE01 TreebeardFire FollowBone:Yes
            ParticleSysBone                     = FIRE01 TreebeardSmoke FollowBone:Yes
        End
        
        ;// Animations : Très endommagée
        ModelConditionState                 = USER_75 REALLYDAMAGED
            Model                               = tbgroundsg_d2
            ParticleSysBone                     FireSmall01 FireBuildingLarge
            ParticleSysBone                     FireSmall02 FireBuildingLarge
            ParticleSysBone                     FireSmall03 FireBuildingMedium
            ParticleSysBone                     FireSmall04 FireBuildingMedium
            ParticleSysBone                     FireSmall05 SmokeBuildingLarge
        End
        AnimationState                      = USER_75 REALLYDAMAGED
            EnteringStateFX                     = FX_BuildingDamaged
            ParticleSysBone                     = FIRE01 TreebeardFire FollowBone:Yes
            ParticleSysBone                     = FIRE01 TreebeardSmoke FollowBone:Yes
            ParticleSysBone                     = FIRE02 TreebeardFire FollowBone:Yes
            ParticleSysBone                     = FIRE02 TreebeardSmoke FollowBone:Yes
        End
        ModelConditionState                 = REALLYDAMAGED
            Model                               = tbgrounds_d2
            ParticleSysBone                     FireSmall01 FireBuildingLarge
            ParticleSysBone                     FireSmall02 FireBuildingLarge
            ParticleSysBone                     FireSmall03 FireBuildingMedium
            ParticleSysBone                     FireSmall04 FireBuildingMedium
            ParticleSysBone                     FireSmall05 SmokeBuildingLarge
        End
        AnimationState                      = REALLYDAMAGED
            EnteringStateFX                     = FX_BuildingDamaged
            ParticleSysBone                     = FIRE01 TreebeardFire FollowBone:Yes
            ParticleSysBone                     = FIRE01 TreebeardSmoke FollowBone:Yes
            ParticleSysBone                     = FIRE02 TreebeardFire FollowBone:Yes
            ParticleSysBone                     = FIRE02 TreebeardSmoke FollowBone:Yes
        End
        
        ;// Animations : Décombres
        ModelConditionState                 = USER_75 RUBBLE
            Model                               = tbgroundsg_d2
            ParticleSysBone                     SmokeLarge01 SmokeBuildingLarge
        End
        ModelConditionState                 = RUBBLE
            Model                               = tbgrounds_d2
            ParticleSysBone                     SmokeLarge01 SmokeBuildingLarge
        End
        ModelConditionState                 = POST_RUBBLE
            Model                               = None
            ParticleSysBone                     NONE SmokeBuildingMediumRubble
        End
        ModelConditionState                 = POST_COLLAPSE
            Model                               = None
            ParticleSysBone                     NONE SmokeBuildingMediumRubble
        End
        
        ;// Animations : Nuit
        ModelConditionState                 = USER_75 SNOW NIGHT
            Model                               = tbgroundsg_skn
            Texture                             = tbbarracks_green.tga tbbarracks_snow_green.tga
            Texture                             = ptmirktree2_green.tga ptmirktree2_snow_green.tga
        End
        ModelConditionState                 = USER_75 NIGHT
            Model                               = tbgroundsg_skn
        End
        ModelConditionState                 = SNOW NIGHT
            Model                               = tbgrounds_skn
            Texture                             = tbbarracks.tga tbbarracks_snow.tga
            Texture                             = ptmirktree2.tga ptmirktree2_snow.tga
        End
        ModelConditionState                 = NIGHT
            Model                               = tbgrounds_skn
        End
        
        ;// Animations : Enneigé
        ModelConditionState                 = SNOW
            Model                               = tbgrounds_skn
            Texture                             = tbbarracks.tga tbbarracks_snow.tga
            Texture                             = ptmirktree2.tga ptmirktree2_snow.tga
        End
    End
    
    ;// Modèle : Effets Bonus
    Draw                                = W3DScriptedModelDraw Draw_BonusEffects
        DefaultModelConditionState
            Model                               = None
        End
        AnimationState                      = ACTIVELY_BEING_CONSTRUCTED
        End
        AnimationState                      = USER_4
            ParticleSysBone                     = None StoneWorkerFX
        End
    End
    
    ;// Modèle : Sol
    Draw                                = W3DFloorDraw ModuleTag_DrawFloorV2
        StaticModelLODMode                  = Yes
        ModelName                           = tbgroundsg_bib
        WeatherTexture                      = SNOWY tbgrounds_bib_snow_green.tga
