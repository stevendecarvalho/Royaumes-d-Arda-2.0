        MaxHealthDamaged                    = RDA_MIRKWOOD_TRAINING_GROUND_HEALTH_DAMAGED
        MaxHealthReallyDamaged              = RDA_MIRKWOOD_TRAINING_GROUND_HEALTH_REALLY_DAMAGED
    End
    
    
    
    ;/////////////////
