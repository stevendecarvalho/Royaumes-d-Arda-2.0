            Texture                             = tbbarracks.tga tbbarracks_snow_green.tga
            Texture                             = ptmirktree2.tga ptmirktree2_snow_green.tga
        End
        ModelConditionState                 = USER_75 AWAITING_CONSTRUCTION
            Model                               = tbgrounds_blb
            Texture                             = tbbarracks.tga tbbarracks_green.tga
            Texture                             = ptmirktree2.tga ptmirktree2_green.tga
        End
