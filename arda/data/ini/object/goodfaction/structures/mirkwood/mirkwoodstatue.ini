Object MirkwoodStatue
	SelectPortrait							= UPStatueOropher
	
	;////////////////////////////
	;// PARAMÈTRES ARTISTIQUES //
	;////////////////////////////

	Draw									= W3DScriptedModelDraw ModuleTag_Draw
		OkToChangeModelColor					= Yes
		StaticModelLODMode						= Yes
		UseStandardModelNames					= Yes

		DefaultModelConditionState
			Model									= tbstatue_skn
		End
		
		;// Animations : Féerie enchanteresse
		ModelConditionState						= USER_31 SNOW
			Model									= tbstatue_skn
			Texture									= tbstatueA.tga tbstatueA_snow.tga
			Texture									= tbstatueB.tga tbstatueB_snow.tga
			ParticleSysBone							= None MirkwoodButterflies Followbone:No				
		End		
		ModelConditionState						= USER_31
			Model									= tbstatue_skn
			ParticleSysBone							= None MirkwoodButterflies Followbone:No				
		End		
		
		;// Animations : Curseur
		ModelConditionState						= BUILD_PLACEMENT_CURSOR
			Shadow									= SHADOW_ALPHA_DECAL
			ShadowTexture							= decal_buff_radius
			ShadowSizeX								= GENERIC_STATUE_BUFF_RADIUS_DECAL
			ShadowSizeY								= GENERIC_STATUE_BUFF_RADIUS_DECAL
		    ShadowOverrideLODVisibility				= Yes
		End
		
		;// Animations : En cours de construction
		ModelConditionState						= SNOW ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
			Model									= tbstatue_bld
			Texture									= tbstatueA.tga tbstatueA_snow.tga
			Texture									= tbstatueB.tga tbstatueB_snow.tga
			ParticleSysBone							= NONE BuildingContructDust
			ParticleSysBone							= NONE ExpMirkwood	
		End  
		ModelConditionState						= ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
			Model									= tbstatue_bld
			ParticleSysBone							= NONE BuildingContructDust
			ParticleSysBone							= NONE ExpMirkwood	
		End  
		AnimationState							= ACTIVELY_BEING_CONSTRUCTED
			Animation
				AnimationName							= tbstatue_bld.tbstatue_bld
				AnimationMode							= MANUAL
			End
			StateName								= BeingConstructed
			BeginScript
				CurDrawablePlaySound("GondorBarracksBeginConstruction")
			EndScript
		End
		
		;// Animations : Endommagée
		ModelConditionState						= DAMAGED
			Model									= tbstatue_d1
		End  
		AnimationState							= DAMAGED
			EnteringStateFX							= FX_StatueDamaged
		End
		
		;// Animations : Très endommagée
		ModelConditionState						= REALLYDAMAGED
			Model									= tbstatue_d2
		End  
		
		;// Animations : Décombres
		ModelConditionState						= RUBBLE
			Model									= tbstatue_d2
			ParticleSysBone							SmokeLarge01 SmokeBuildingLarge
		End
		ModelConditionState						= POST_RUBBLE
			Model									= None
			ParticleSysBone							NONE SmokeBuildingMediumRubble
		End
		ModelConditionState						= POST_COLLAPSE
			Model									= None
			ParticleSysBone							NONE SmokeBuildingMediumRubble
		End
		
		;// Modèle : Enneigé
		ModelConditionState						= SNOW
			Model									= tbstatue_skn
			Texture									= tbstatueA.tga tbstatueA_snow.tga
			Texture									= tbstatueB.tga tbstatueB_snow.tga
		End      
	End
	
	;// Modèle : Sol
	Draw								= W3DFloorDraw ModuleTag_DrawFloor
		StaticModelLODMode						= Yes
		ModelName								= tbstatue_bib
		WeatherTexture							= SNOWY tbstatue_bib_snow.tga
  		HideIfModelConditions					= AWAITING_CONSTRUCTION
  		HideIfModelConditions					= PARTIALLY_CONSTRUCTED
	End
	
	;// Modèle : Bonus
	Draw								= W3DScriptedModelDraw TheHealEffect
		ModelConditionState					= NONE
			Model								= None
			ParticleSysBone						NONE StatueHeroFX
		End
		ModelConditionState					= ACTIVELY_BEING_CONSTRUCTED
			Model								= None
		End
	End
	
	
	
	;/////////////////////////
	;// PARAMÈTRES GÉNÉRAUX //
	;/////////////////////////

	DisplayName								= OBJECT:MirkwoodStatue
	Description								= OBJECT:MirkwoodHeroicStatueDescription
	
	BuildCost								= RDA_MIRKWOOD_STATUE_BUILDCOST
	BuildTime								= GENERIC_STRUCTURE_SUPPORT_BUILDTIME
 	VisionRange								= GENERIC_STANDARD_STRUCTURE_VISION
	ShroudClearingRange						= GENERIC_STANDARD_STRUCTURE_SHROUD_CLEAR
	BountyValue								= RDA_MIRKWOOD_STATUE_BOUNTY_VALUE
	
	Side									= Mirkwood
	IsTrainable								= No
	EditorSorting							= STRUCTURE
	ThreatLevel								= 1.0
	PlacementViewAngle						= -90

	CommandSet								= MirkwoodStatueCommandSet
	
	
	
	;/////////////////////
	;// ARMES & ARMURES //
	;/////////////////////
	
	ArmorSet
		Conditions								= None
		Armor									= GenericArmor_40
	End
	
	
	
	;//////////////////////
	;// PARAMÈTRES AUDIO //
	;//////////////////////
	
	#include "..\..\..\Includes\StandardBuildingEvaEvents.inc"

	VoiceSelect								= MirkwoodStatueSelect
	
	SoundOnDamaged							= BuildingLightDamageStone
	SoundOnReallyDamaged					= BuildingHeavyDamageStone

	VoiceSelectUnderConstruction			= BuildingGoodVoiceSelectUnderConstruction
	VoiceFullyCreated						= EVA:MirkwoodStatueofOropherComplete

	UnitSpecificSounds
		UnderConstruction						= BuildingConstructionLoop
		UnderRepairFromRubble					= BuildingConstructionLoop
	End

	ClientBehavior							= AnimationSoundClientBehavior ModuleTag_AnimAudioBehavior
		MaxUpdateRangeCap						= 800
		AnimationSound							= Sound:StatueHeroicBuildStoneExplode	Animation:GPHealstue_A.GPHealstue_A		Frames:540
		AnimationSound							= Sound:StatueHeroicBuildStoneDebris1	Animation:GPHealstue_A.GPHealstue_A		Frames:560
		AnimationSound							= Sound:StatueHeroicBuildStoneDebris2	Animation:GPHealstue_A.GPHealstue_A		Frames:600
	End
	
	
	
	;/////////////////////////////
	;// PARAMÈTRES D'INGÉNIERIE //
	;/////////////////////////////

	RadarPriority							= STRUCTURE
	KindOf									= PRELOAD STRUCTURE SELECTABLE IMMOBILE SCORE MADE_OF_STONE NEED_BASE_FOUNDATION CAN_SEE_THROUGH_STRUCTURE IGNORE_FOR_VICTORY

	Behavior								= GettingBuiltBehavior GetBuiltBehaviorTag
		WorkerName								= MirkwoodWorkerNoSelect
		SpawnTimer								= DEFAULT_STRUCTURE_HEALDELAY
	End

	Behavior								= StructureCollapseUpdate ModuleTag_Collapse
		MinCollapseDelay						= 000
		MaxCollapseDelay						= 000
		CollapseDamping							= 0.5
		MaxShudder								= 0.6
		MinBurstDelay							= 250
		MaxBurstDelay							= 800
		BigBurstFrequency						= 4
		FXList									= INITIAL FX_StructureMediumCollapse
		FXList									= ALMOST_FINAL FX_StructureAlmostCollapse
		DestroyObjectWhenDone					= Yes
		CollapseHeight							= 126
	End
	
	
	
	;/////////////////////////
	;// PARAMÈTRES DE SANTÉ //
	;/////////////////////////

	Body									= StructureBody ModuleTag_05
		MaxHealth								= GENERIC_BUFF_STRUCTURE_HEALTH
		MaxHealthDamaged						= GENERIC_BUFF_STRUCTURE_HEALTH_DAMAGED
		MaxHealthReallyDamaged					= GENERIC_BUFF_STRUCTURE_HEALTH_REALLY_DAMAGED
	End
	
	
	
	;///////////////////////////////
	;// INTELLIGENCE ARTIFICIELLE //
	;///////////////////////////////
	
	Behavior								= AIUpdateInterface ModuleTag_SoWeCanUseWeapon
		AutoAcquireEnemiesWhenIdle				= Yes
		MoodAttackCheckRate						= 250
		AILuaEventsList							= MirkwoodStatueFunctions
	End
	
	
	
	;////////////////
	;// MORT LENTE //
	;////////////////

	Behavior								= SlowDeathBehavior ModuleTag_SlowDeathWithoutRubble
		DestructionDelay						= 5000
	End
	
	
	
	;//////////////////////////////
	;// COMPÉTENCE : INSPIRATION //
	;//////////////////////////////

	Behavior								= PassiveAreaEffectBehavior ModuleTag_FeelGoodHero
		EffectRadius							= GENERIC_STATUE_BUFF_RADIUS
		PingDelay								= 2000
		ModifierName							= HeroStatueLeadership
		ModifierName							= ElvenStatuePassiveLeadershipResistFear
		AllowFilter								= RDA_GENERIC_BUFF_STATUE_OBJECT_FILTER
	End
	
	
	
	;///////////////////////////////////
	;// COMPÉTENCE : AUDACE D'OROPHER //
	;///////////////////////////////////

	; Behavior								= PassiveAreaEffectBehavior ModuleTag_FeelGoodHeroique
		; EffectRadius							= GENERIC_STATUE_BUFF_RADIUS
		; PingDelay								= 2000
		; ModifierName							= HeroStatueLeadershipHeroique
		; AllowFilter								= RDA_GENERIC_HERO_BUFF_STATUE_OBJECT_FILTER
	; End
	
	
	
	;///////////////////////////////////////////////////////
	;// COMPÉTENCE : VESTIGE DE LA VIEILLE ROUTE DES BOIS //
	;///////////////////////////////////////////////////////

	; Behavior								= PassiveAreaEffectBehavior ModuleTag_FeelNotGoodHero
		; EffectRadius							= GENERIC_STATUE_BUFF_RADIUS
		; PingDelay								= 2000
		; ModifierName							= AntiHeroStatueLeadership
		; AllowFilter								= RDA_GENERIC_ANTIBUFF_STATUE_OBJECT_FILTER
	; End
	
	
	
	;////////////////////
	;// BONUS PALANTIR //
	;////////////////////

	Behavior								= CostModifierUpgrade ModuleTag_WellHeroDiscount
		LabelForPalantirString					= GUI:HERO_DISCOUNT
		StartsActive							= Yes
		ObjectFilter							= ANY +HERO
		Percentage								= 0%
		Percentage								= -5%
		Percentage								= -10%
		Percentage								= -15%
		Percentage								= -20%
		Percentage								= -25%
	End
	
	
	
	;///////////////////////////////////////////////
	;// POUVOIR DU SPELLBOOK : DOUBLEZ LA GARDE ! //
	;///////////////////////////////////////////////
	
    Behavior								= ObjectCreationUpgrade ModuleTag_RemoveUpgradesPrisonGuard1
		TriggeredBy								= Upgrade_PrisonGuard1
		RemoveUpgrade							= Upgrade_PrisonGuard2
    End
	
    Behavior								= ObjectCreationUpgrade ModuleTag_RemoveUpgradesPrisonGuard2
		TriggeredBy								= Upgrade_PrisonGuard2
		RemoveUpgrade							= Upgrade_PrisonGuard1
    End	
	
	Behavior								= ObjectCreationUpgrade ModuleTag_SpellPrisonGuard1
		TriggeredBy								= Upgrade_PrisonGuard1
		Delay									= 0
		DestroyWhenSold							= Yes
		ThingToSpawn							= MirkwoodMobilisationEgg
		Offset									= X:-25 Y:0 Z:0
		Angle									= 180
		FadeInTime								= 2000
	End

	Behavior								= ObjectCreationUpgrade ModuleTag_SpellPrisonGuard2
		TriggeredBy								= Upgrade_PrisonGuard1
		Delay									= 0
		DestroyWhenSold							= Yes
		ThingToSpawn							= MirkwoodMobilisationEgg
		Offset									= X:25 Y:0 Z:0
		Angle									= 0
		FadeInTime								= 2000
	End
	
	
	
	;/////////////////////////////
	;// PARAMÈTRES DE GÉOMÉTRIE //
	;/////////////////////////////
	
	Geometry								= CYLINDER
	GeometryMajorRadius						= 12.0
	GeometryMinorRadius						= 12.0
	GeometryHeight							= 70.0
	GeometryIsSmall							= No
	
	Shadow									= SHADOW_VOLUME
	BuildCompletion							= PLACED_BY_PLAYER
	
	GeometryContactPoint					= X:-26		Y:27		Z:0			Repair
	GeometryContactPoint					= X:28		Y:-25		Z:0			Repair
	GeometryContactPoint					= X:5.576	Y:44.987	Z:0
	GeometryContactPoint					= X:-38.348	Y:-42.113	Z:0
	GeometryContactPoint					= X:-28.448	Y:-0.003	Z:75.14		Swoop
End





ChildObject MirkwoodStatueFoundation MirkwoodStatue
	EquivalentTo							= MirkwoodStatue
	PlacementViewAngle						= 0
	EditorSorting							= SYSTEM
	Behavior								= CastleMemberBehavior ModuleTag_CMB
	End
End