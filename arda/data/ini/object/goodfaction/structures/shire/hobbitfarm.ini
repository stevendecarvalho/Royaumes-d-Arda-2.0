Object ShireHobbitFarm

	SelectPortrait = UPShireHobbitFarm

  ; *** ART Parameters ***
  Draw = W3DScriptedModelDraw ModuleTag_Draw

    OkToChangeModelColor  = Yes
    UseStandardModelNames = Yes
	StaticModelLODMode = yes ; If yes, will append M or L to the skin name depending on GameLOD
	DefaultModelConditionState
		Model = sbhobfarm_skn
		WeaponLaunchBone = PRIMARY ARROW
		; ParticleSysBone     = B_EMBER GatheringEmbers Followbone:YES
		; ParticleSysBone     = B_EMBER FireTorch FollowBone:Yes
		; ParticleSysBone     = B_EMBER OrcTorchFlare FollowBone:Yes
	End

	;//	Animation state for build placement cursor
	AnimationState = BUILD_PLACEMENT_CURSOR
		BeginScript
			CurDrawableHideSubObject("N_Window")
			CurDrawableHideSubObject("N_Glow")
   			CurDrawableHideSubObject("V1")
   			CurDrawableHideSubObject("V1a")
			CurDrawableHideSubObject("V2")
		EndScript
	End

	;//	Animation state for phantom structure
	AnimationState = PHANTOM_STRUCTURE
		BeginScript
			CurDrawableHideSubObject("N_Window")
			CurDrawableHideSubObject("N_Glow")
   			CurDrawableHideSubObject("V1")
   			CurDrawableHideSubObject("V1a")
			CurDrawableHideSubObject("V2")
		EndScript
	End

    IdleAnimationState
		StateName	=	STATE_Idle
		ParticleSysBone   = SMOKE01 forgeSmoke FollowBone:Yes
		ParticleSysBone   = SMOKE02 forgeSmoke FollowBone:Yes
		ParticleSysBone = LAMP01 lampGlowMirkwood FollowBone:Yes
	End
	
	ModelConditionState				= BUILD_PLACEMENT_CURSOR
		Shadow						= SHADOW_ALPHA_DECAL
		ShadowTexture				= decal_hero_good
		ShadowSizeX					= GONDOR_WELL_AOE_RADIUS_DECAL
		ShadowSizeY					= GONDOR_WELL_AOE_RADIUS_DECAL
		ShadowOverrideLODVisibility = Yes
	End	

    ;------------ Build Up States -------
    ModelConditionState = SNOW AWAITING_CONSTRUCTION
		Model	= sbfarm_bld
	End

    ModelConditionState   = AWAITING_CONSTRUCTION
      Model               = sbfarm_bld
;		ParticleSysBone	  = NONE BuildingDoughnutCloud
    End;
    AnimationState        = AWAITING_CONSTRUCTION
      Animation           =  sbfarm_bld
        AnimationName     =  sbfarm_bld.sbfarm_bld
        AnimationMode     = MANUAL
        AnimationBlendTime = 0
      End
	  Flags				  = START_FRAME_FIRST
    End

	ModelConditionState = SNOW ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
		Model	= sbfarm_bld
	End

    ModelConditionState   = ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
      Model               = sbfarm_bld
		ParticleSysBone   = CONSTDUSTBONE01 BuildingContructDust FollowBone:Yes
    End;

    AnimationState        = ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
		Animation           = sbfarm_bld
			AnimationName     = sbfarm_bld.sbfarm_bld
			AnimationMode     = MANUAL
			AnimationBlendTime = 0
		End
		Flags				  = START_FRAME_FIRST
		StateName			  = BeingConstructed
		BeginScript
			CurDrawablePlaySound("GondorBarracksBeginConstruction")
		EndScript
    End



      ;--damaged building

    ModelConditionState  = DAMAGED
      Model         = sbfarm_d1
		ParticleSysBone B_DFIRE01 FireBuildingLarge
		ParticleSysBone B_DFIRE02 FireBuildingLarge
		ParticleSysBone B_DFIRE03 SmokeBuildingMedium
		ParticleSysBone B_DFIRE04 FireBuildingLarge
		ParticleSysBone B_DFIRE05 FireBuildingLarge
		ParticleSysBone B_DFIRE06 SmokeBuildingMedium
		ParticleSysBone B_DFIRE07 FireBuildingLarge
		ParticleSysBone B_DFIRE08 SmokeBuildingMedium
    End
    AnimationState = DAMAGED
		EnteringStateFX	= FX_BuildingDamaged
    End

    ModelConditionState  = REALLYDAMAGED
      Model         = sbfarm_d2
		ParticleSysBone B_DFIRE01 FireBuildingLarge
		ParticleSysBone B_DFIRE02 FireBuildingLarge
		ParticleSysBone B_DFIRE03 SmokeBuildingMedium
		ParticleSysBone B_DFIRE04 FireBuildingLarge
		ParticleSysBone B_DFIRE05 FireBuildingLarge
		ParticleSysBone B_DFIRE06 SmokeBuildingMedium
		ParticleSysBone B_DFIRE07 FireBuildingLarge
		ParticleSysBone B_DFIRE08 SmokeBuildingMedium
    End
    AnimationState = REALLYDAMAGED
		EnteringStateFX	= FX_BuildingReallyDamaged
    End

    ModelConditionState  = RUBBLE
      Model         = sbfarm_d2
      ParticleSysBone B_DFIRE01 SmokeBuildingLarge
    End

    AnimationState = RUBBLE
		EnteringStateFX	= FX_StructureMediumCollapse
    End

    ModelConditionState  = POST_RUBBLE
      Model         = None
		ParticleSysBone NONE SmokeBuildingMediumRubble
    End

    ModelConditionState  = POST_COLLAPSE
      Model         = None
		ParticleSysBone NONE SmokeBuildingMediumRubble
    End

    ModelConditionState = SNOW
		Model = sbhobfarm_skn
		;Texture = abdunecamp.tga abdunecamp_snw.tga
    End
	
	ModelConditionState = USER_2
		ParticleSysBone = None PartyPipeSmoke ;FollowBone:Yes ;HouseColor:yes
		ParticleSysBone = None PartyPipeSmoke2 ;FollowBone:Yes ;HouseColor:yes		
    End	

  End


;---------------------------------------

  Draw = W3DFloorDraw ModuleTag_DrawFloor
	StaticModelLODMode = yes ; Will append M or L to the skin name depending on GameLOD
    ModelName = sbhobfarm_bib
	;WeatherTexture		= SNOWY abdunecamp_bib_snw.tga
  		HideIfModelConditions	=	AWAITING_CONSTRUCTION
  		HideIfModelConditions	=	PARTIALLY_CONSTRUCTED
  End
  
  	Draw = W3DScriptedModelDraw ModuleTag_MarishMushrooms
	    DefaultModelConditionState
	      Model = None
	    End
		ModelConditionState   = ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
			Model             = None
		End	
		ModelConditionState   = USER_10
			Model             = sbshrms_skn
		End			
	End  
  
	Draw = W3DScriptedModelDraw Draw_BonusEffects
	    DefaultModelConditionState
	      Model = None
	    End
	    AnimationState = ACTIVELY_BEING_CONSTRUCTED
	    End
		AnimationState = UPGRADE_ECONOMY_BONUS
			ParticleSysBone	= None FueltheFiresEmbers
		End
		AnimationState = USER_5 ;;,;; Added for 2.3 - Grand Harvest particle system
			ParticleSysBone	= None GrandHarvestEmbers
		End
		AnimationState = USER_5 UPGRADE_ECONOMY_BONUS ;;,;; Added for 2.3
			ParticleSysBone	= None FueltheFiresEmbers
		End		
	End  	

  PlacementViewAngle  = 315
  
  ; ***DESIGN parameters ***
  DisplayName		= OBJECT:ShireHobbitFarm
  Side			= Shire
  EditorSorting		= STRUCTURE
  ThreatLevel		= 1.0
	CommandPointBonus	= 25
  CommandSet		= ShireHobbitFarmCommandSet

  BuildCost           	= 400 ;350 ;ELVEN_GREEN_PASTURE_BUILDCOST
  BuildTime           	= ELVEN_GREEN_PASTURE_BUILDTIME
  VisionRange         	= ELVEN_GREEN_PASTURE_VISION_RANGE
  ShroudClearingRange 	= ELVEN_GREEN_PASTURE_SHROUD_CLEAR
  BountyValue        	= 125

  Description 		= OBJECT:ShireHobbitFarmDescription

  ArmorSet
    Conditions        	= None
    Armor             	= FactoryArmor
  End

	WeaponSet
		Conditions		= None
	End

	WeaponSet
		Weapon			= PRIMARY RivendellStructureBow
		Conditions		= PLAYER_UPGRADE
		AutoChooseSources	= PRIMARY FROM_PLAYER FROM_SCRIPT FROM_AI
	End

	; *** AUDIO Parameters ***

	#include "..\..\..\Includes\StandardBuildingEvaEvents.inc"

	VoiceFullyCreated		= EVA:HobbitFarmComplete
	VoiceSelect			= ShireHobbitFarmSelect				;RohanStablesSelect
	VoiceSelectUnderConstruction	= BuildingGoodVoiceSelectUnderConstruction

 	; SoundAmbient			= BuildingRohanStableAmbience
	SoundAmbientDamaged		= BuildingDamageFireMediumLoop
	SoundAmbientReallyDamaged	= BuildingDamageFireMediumLoop
	SoundOnDamaged			= BuildingLightDamageWood
	SoundOnReallyDamaged		= BuildingHeavyDamageWood

	UnitSpecificSounds
		UnderConstruction	= BuildingConstructionLoop  	; Built first time
		; UnderRepairFromDamage	= NoSound			; Repaired No animation on the building, so don't bother playing sound
		UnderRepairFromRubble	= BuildingConstructionLoop	; Repaired from completely destroyed (not used???)
	End
  ; *** ENGINEERING Parameters ***

  RadarPriority       = STRUCTURE
  KindOf              = PRELOAD STRUCTURE SELECTABLE IMMOBILE SCORE NEED_BASE_FOUNDATION FS_FACTORY MP_COUNT_FOR_VICTORY AUTO_RALLYPOINT ATTACK_NEEDS_LINE_OF_SIGHT CAN_ATTACK MADE_OF_WOOD
	
	Body                      = StructureBody ModuleTag_05
		MaxHealth               = ELVEN_GREEN_PASTURE_MAXHEALTH
		MaxHealthDamaged        = ELVEN_GREEN_PASTURE_MAXHEALTHDAMAGED
		MaxHealthReallyDamaged  = ELVEN_GREEN_PASTURE_MAXHEALTH_REALLYDAMAGED
	End

	Flammability   ; should be after the 'Body' statement
			Fuel          =   ELVEN_GREENPASTURE_FIRE_FUEL
			MaxBurnRate   =   ELVEN_GREENPASTURE_FIRE_MAX_BURN_RATE
			Decay         =   ELVEN_GREENPASTURE_FIRE_DECAY
			Resistance    =   ELVEN_GREENPASTURE_FIRE_RESISTANCE
	End

	Behavior = TerrainResourceBehavior ModuleTag_NewMoney
		Radius = GONDOR_FARM_MONEY_RANGE		; How far we try to claim ground
		MaxIncome = GONDOR_FARM_MONEY_AMOUNT	; If we were to get all we wanted, how much we would earn.  Linear slope to 0 at 0% claim
		IncomeInterval = GONDOR_FARM_MONEY_TIME	; How often (in msec) we give that much money
	End


	ClientBehavior = TerrainResourceClientBehavior ModuleTag_NewMoneyClient
	End

	Behavior = ProductionUpdate ProductionUpdateModuleTag
		; GiveNoXP                       = Yes  ;disable granting xp when producing units.
	End

	Behavior = QueueProductionExitUpdate ModuleTag_07
		UnitCreatePoint			= X:0.0 Y:-50.0 Z:0.0
		NaturalRallyPoint			= X:0.0 Y:-120.0 Z:0.0
		ExitDelay			= STANDARD_HORDE_EXIT_DELAY
	End

	Behavior            = GettingBuiltBehavior GetBuiltBehaviorTag
		WorkerName	= ArnorWorkerNoSelect
		SpawnTimer	= DEFAULT_STRUCTURE_HEALDELAY
	End

	Behavior = AIUpdateInterface ModuleTag_SoWeCanUseWeapon
		AutoAcquireEnemiesWhenIdle	= Yes
		MoodAttackCheckRate		= 250
		AILuaEventsList				= BreelandEncampmentFunctions
	End 

	Behavior                  = StructureCollapseUpdate ModuleTag_StructureCollapseTag
		MinCollapseDelay        = 000
		MaxCollapseDelay        = 000
		CollapseDamping         = .5
		MaxShudder              = 0.6
		MinBurstDelay           = 250
		MaxBurstDelay           = 800
		BigBurstFrequency       = 4
		FXList                  = INITIAL   FX_StructureMediumCollapse
		FXList                  = ALMOST_FINAL  FX_StructureAlmostCollapse
		DestroyObjectWhenDone	= Yes
		CollapseHeight			= 66
	End

 	Behavior = SpawnBehavior ModuleTag_SpawnRangerPatrols
		TriggeredBy			= Upgrade_WildSpiderVenomSackScience
		SpawnNumber			= 4
		InitialBurst		= 4
		SpawnTemplateName	= ShireRangerSword_Patrol ShireRangerSpear_Patrol
		SpawnReplaceDelay	= 45000;
		CanReclaimOrphans	= Yes
	End 
	
	Behavior = PassiveAreaEffectBehavior ModuleTag_SplashOfHealingWater_Ahh
		EffectRadius			= GONDOR_WELL_AOE_RADIUS
		PingDelay				= 2000;msec
		HealPercentPerSecond	= 2% ;;,;; 3%
		UpgradeRequired					= Upgrade_MiniHordeLvl2
		AllowFilter				= ANY +INFANTRY +CAVALRY -MACHINE -IMMOBILE +DOZER
		NonStackable			= Yes
		HealFX					= FX_SpellHealUnitHealBuff
	End
	
	Behavior = PassiveAreaEffectBehavior ModuleTag_SplashOfHealingWater_Upgrade
		EffectRadius			= 300
		PingDelay				= 1500;msec
		HealPercentPerSecond	= 2% ;;,;; 3%
		UpgradeRequired					= Upgrade_MallornTreeRoots
		AllowFilter				= ANY +INFANTRY +CAVALRY -MACHINE -IMMOBILE +DOZER
		NonStackable			= Yes
		HealFX					= FX_SpellHealUnitHealBuff
	End

	;/////////////////////////////////////////////////////////
	;// BannerCarrierUpdate module for Well Object
	;/////////////////////////////////////////////////////////
	Behavior = GrantUpgradeCreate ModuleTag_GrantUpgrade
		UpgradeToGrant	= Upgrade_MiniHordeLvl2
	End	
	Behavior = ObjectCreationUpgrade ModuleTag_RemoveUpgrades1
		TriggeredBy = Upgrade_MiniHordeLvl2
		RemoveUpgrade = Upgrade_MallornTreeRoots
    End
    Behavior = ObjectCreationUpgrade ModuleTag_RemoveUpgrades2
		TriggeredBy = Upgrade_MallornTreeRoots
		RemoveUpgrade = Upgrade_MiniHordeLvl2
    End
	Behavior = AttributeModifierUpgrade ModuleTag_SorceryBonusSelf
		TriggeredBy			= Upgrade_MallornTreeRoots
		AttributeModifier	= MarishMushroomsVisual
	End	
	
	Behavior = BannerCarrierUpdate BannerCarrierUpdateModuleTagUpgraded
		IdleSpawnRate				= 8000 ;;,;; 5000							; spawn a new member every n seconds when idle (in miliseconds)		
		UnitSpawnFX					= FX_BannerCarrierSpawnUnit		; name of particle FX to use when the BannerCarrier spawns a new unit		
		UpgradeRequired					= Upgrade_MallornTreeRoots
		; This well object acts like a banner carrier except it spawns unit on nearby hordes instead of itself.
		ReplenishNearbyHorde		= Yes
		ReplenishAllNearbyHordes	= Yes
		ScanHordeDistance			= 300
	End

//--------------------------------------------------------------------------	
//	AN UNEXPECTED PARTY
//--------------------------------------------------------------------------	
	Behavior = UnpauseSpecialPowerUpgrade ModuleTag_TheodenGloriousChargeEnabler
		SpecialPowerTemplate = SpecialAbilityDancingHobbits
		TriggeredBy = Upgrade_ThingsThatWere
	End
	Behavior = SpecialPowerModule ModuleTag_TheodenGloriousChargeUpdate   
		SpecialPowerTemplate      = SpecialAbilityDancingHobbits
		UpdateModuleStartsAttack  = No
		StartsPaused = No
		AttributeModifier = RivendellDancingHobbits
		AttributeModifierRange = 200
		AttributeModifierAffectsSelf = Yes
		AttributeModifierAffects = NONE
		;AttributeModifierFX = FX_TheodenGloriousChargeFX
	End
    Behavior = ObjectCreationUpgrade ModuleTag_RemoveUpgrades3
		TriggeredBy = Upgrade_Drafted
		RemoveUpgrade = Upgrade_SwitchToRockThrowing
    End
    Behavior = ObjectCreationUpgrade ModuleTag_RemoveUpgrades4
		TriggeredBy = Upgrade_SwitchToRockThrowing
		RemoveUpgrade = Upgrade_Drafted
    End	
	Behavior = SpawnBehavior ModuleTag_SpawnDancingHobbits
		TriggeredBy			= Upgrade_Drafted
		SpawnNumber			= 6
		InitialBurst		= 6
		SpawnTemplateName	= RivendellDancingHobbit_Patrol
		SpawnReplaceDelay	= 0
		CanReclaimOrphans	= No
	End
	Behavior = AttributeModifierAuraUpdate ModuleTag_UnexpectedParty
		StartsActive	= No ;If no, requires upgrade to turn on.
		BonusName		= UnexpectedPartyDebuff
		TriggeredBy		= Upgrade_Drafted
		RefreshDelay	= 2000
		Range			= 200
		TargetEnemy		= Yes
		ObjectFilter	= AOTR_GENERIC_BUFF_RECIPIENT_WITH_HORDES_OBJECT_FILTER
	End	

	;; This is required for setting rally points which needs a small geometry to determine if quick path exists in tight spaces
  ;; If this was any bigger, it would fail to create the rallu points when in a camp or castle.
  Geometry              = CYLINDER
  GeometryMajorRadius   = 8.0
  GeometryMinorRadius   = 8.0
  GeometryHeight        = 10

  ;; These are the actual building geometry pieces
  Geometry    = BOX
  GeometryName			= Geom_Orig
  GeometryMajorRadius   = 57.231
  GeometryMinorRadius   = 66.154
  GeometryHeight        = 30.154
  GeometryOffset		= X:0.088 Y:4.396 Z:0

  AdditionalGeometry    = BOX
  GeometryName			= Geom_Orig
  GeometryMajorRadius   = 12.307
  GeometryMinorRadius   = 12
  GeometryHeight        = 66.462
  GeometryOffset		= X:-33.147 Y:19.143 Z:0

  GeometryIsSmall       = No

  Shadow                = SHADOW_VOLUME
  BuildCompletion		= PLACED_BY_PLAYER

  GeometryContactPoint = X:-44.644	Y:-56.367	Z:0		Repair
  GeometryContactPoint = X:33.041	Y:52.568	Z:0		Repair
  GeometryContactPoint = X:-9.861	Y:51.413	Z:0
  GeometryContactPoint = X:-33.314	Y:-54.902	Z:0
  GeometryContactPoint = X:-6.106	Y:-15.828	Z:40.3	Swoop

End

ChildObject ShireHobbitFarmFoundation ShireHobbitFarm
  PlacementViewAngle  = 0
  CommandPointBonus	= 100
	Behavior = CastleMemberBehavior ModuleTag_CMB
	End
	RemoveModule ModuleTag_NewMoney
	RemoveModule ModuleTag_NewMoneyClient	
	Behavior = AutoDepositUpdate AutoDepositModuleTag
		DepositTiming       = FOUNDATION_FARM_MONEY_TIME 	   ; in milliseconds
		DepositAmount       = 25   ; cash amount to deposit every DepositTiming
		InitialCaptureBonus = 0  ; no initial bonus
	End	
End