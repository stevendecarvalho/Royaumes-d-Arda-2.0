Object DurinsFolkPing
;/ this ping exists to trigger the spellbook changes for Durin's Folk
;/ so that the resurrection mechanic can work

Draw = W3DScriptedModelDraw ModuleTag_Draw
	DefaultModelConditionState
				Model = None ; wbNtunnel_skn
			End
	End

  EvaEnemyObjectSightedEvent = None ; Not a real unit

	ArmorSet
		Conditions		= None
		Armor			= InvulnerableArmor ; StructureArmor
	End

	;WeaponSet
	;	Conditions	= NONE
	;	Weapon		= PRIMARY GuldurForlornStatueFearWeapon   ;MordorGateWatchersFearWeapon
	;End


 ; ***DESIGN parameters ***

  EditorSorting   = SYSTEM
  Side = Dwarves
  KindOf = NO_COLLIDE CREEP IGNORE_FOR_VICTORY IGNORE_FOR_EVA_SPEECH_POSITION;INERT

	ThreatLevel			= 0.0
	VisionRange		= 0
	ShroudClearingRange	= 0

 ; *** ENGINEERING Parameters ***

	Body = ActiveBody ModuleTag_Body;Can take damage, but won't die.  Can only die from ::kill() or other unresistable damage
		MaxHealth	  = 1.0
	End

	Behavior = DestroyDie ModuleTag_Die
	End

	Behavior = LifetimeUpdate ModuleTag_HatchTrigger
		MinLifetime = 10000.0
		MaxLifetime = 10000.0
		DeathType		= FADED
	End

	Behavior = AttachUpdate ModuleTag_Attach
		ObjectFilter = NONE +DwarvenFortressCitadel SAME_PLAYER 
		ScanRange = 500
	;	ParentStatus = HOLDING_THE_RING
		AlwaysTeleport = Yes
		AnchorToTopOfGeometry = No
	End


	
	

	Behavior = AIUpdateInterface	ModuleTag_AIUpdateInterface
		AutoAcquireEnemiesWhenIdle = No
		;// MoodAttackCheckRate		= 250
	End

	LocomotorSet
		Locomotor = InvisiblePingLocomotor
		Condition = SET_NORMAL
		Speed	 = 1
	End
