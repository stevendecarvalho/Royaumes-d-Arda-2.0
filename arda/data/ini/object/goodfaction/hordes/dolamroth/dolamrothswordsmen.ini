		StartsPaused 					= Yes
		AttributeModifier 				= DolAmrothSwordShipAndSwan	
		AttributeModifierRange 			= 200
		AttributeModifierAffectsSelf 	= No
		AttributeModifierAffects 		= NONE +HERO ALLIES
		AttributeModifierFX 			= FX_MAASallyForthFX
		InitiateSound					= KnightOfDAVoiceAttackCharge
	End	
	Behavior = AutoAbilityBehavior ModuleTag_ShipAndSwanAutoAbility
		SpecialAbility					= SpecialAbilityElphirProperPreparations
		ForbiddenStatus 				= INSIDE_GARRISON
		MaxScanRange					= 160
		Query							= 10 ANY ALLIES +HERO -STRUCTURE -WALL_UPGRADE -WALL_HUB -WALL_SEGMENT -DEFENSIVE_WALL -FS_BASE_DEFENSE
	End	
	;-----------------------------------------------------------------------------
	; Thoringil Tactics
	;-----------------------------------------------------------------------------	
	Behavior = UnpauseSpecialPowerUpgrade ModuleTag_ZealotBoomAxeEnabler
		SpecialPowerTemplate		= SpecialAbilityZealotBoomAxe
		TriggeredBy 				= Upgrade_ObjectLevel4
	End

	Behavior = SpecialPowerModule ModuleTag_ZealotBoomAxeStarter
		SpecialPowerTemplate		= SpecialAbilityZealotBoomAxe
		UpdateModuleStartsAttack	= Yes
		StartsPaused				= Yes
	End
	Behavior = WeaponFireSpecialAbilityUpdate ModuleTag_ZealotBoomAxeWeaponFireUpdate
		SpecialPowerTemplate		= SpecialAbilityZealotBoomAxe
		; this has to be longer than the weapon firing time on the members or
		; else the horde will fire its regular weapon and blow away the members' ai.
		WhichSpecialWeapon			= 1
		PackTime					= 5000 
		StartAbilityRange			= 275
		SpecialWeapon				= DwarvenZealotBoomAxeRangeFinder
		ApproachUntilMembersInRange	= Yes
		TriggerSound				= DAMAAVoiceThorongilTactics
	End

	Behavior = AutoAbilityBehavior ModuleTag_AxeThrowAutoAbility
		SpecialAbility				= SpecialAbilityZealotBoomAxe
		ForbiddenStatus 			= INSIDE_GARRISON
		MaxScanRange				= 175
		Query						= 1 ALL ENEMIES -STRUCTURE -WALL_UPGRADE -WALL_HUB -WALL_SEGMENT -DEFENSIVE_WALL -FS_BASE_DEFENSE
	End
	
	/////////////////////
	// AISpecialPowers
	/////////////////////
	
	Behavior = AISpecialPowerUpdate GondorFighterHordeCaptureBuildingAI
		CommandButtonName = Command_CaptureBuilding
		SpecialPowerAIType = AI_SPECIAL_POWER_CAPTURE_BUILDING
	End
	Behavior = AISpecialPowerUpdate GondorFighterHordeStanceBattle
