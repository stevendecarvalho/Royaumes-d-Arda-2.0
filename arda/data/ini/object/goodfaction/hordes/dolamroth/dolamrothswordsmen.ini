		LevelsToGain 				= 4
		LevelCap 					= 5
	End
	;-----------------------------------------------------------------------------
	; Ship and Swan!
	;-----------------------------------------------------------------------------	
	Behavior = UnpauseSpecialPowerUpgrade ModuleTag_ShipAndSwanEnabler
		SpecialPowerTemplate 			= SpecialAbilityElphirProperPreparations
		TriggeredBy 					= Upgrade_ObjectLevel2
	End
	Behavior = SpecialPowerModule ModuleTag_ShipAndSwanUpdate   
