		DefaultModelConditionState
			Model = None
		End
		ModelConditionState = HORDE_EMPTY
			Model = None
		End

		ModelConditionState = WORLD_BUILDER
			Model = HordeMarkGUTow
		End
	End

	Side = DolAmroth
	EditorSorting = UNIT
	EmotionRange = 240
	DisplayName = OBJECT:RoyalSwanGuardHorde

	WeaponSet
