		FlankedDelay = 500
		ObjectStatusOfContained = 
		InitialPayload = ErynGalenArcher 10
		Slots = 10
		PassengerFilter	= NONE +INFANTRY
		ShowPips = No
		ThisFormationIsTheMainFormation = No	//Used to determine which armorset to use (and anything else we want!)
        AlternateFormation = ErynGalenArcherHorde ;RohanArcherNewHordeWedgeFormation
        AttributeModifiers = HarondorArcherVolley
		MeleeBehavior = Amoeba
		End

		// Banner Carrier info		
		BannerCarriersAllowed	= ErynGalenBanner										// types of units that are allowed as banner carriers
		BannerCarrierPosition	= UnitType:ErynGalenBanner	Pos:X:20.0 Y:0.0		// (DEFAULT) position of banner carrier
		
		RankInfo = RankNumber:1 UnitType:ErynGalenArcher Position:X:0 Y:12 Position:X:0 Y:-12
		RankInfo = RankNumber:2 UnitType:ErynGalenArcher Position:X:-15 Y:25 Position:X:-15 Y:0 Position:X:-15 Y:-25
		RankInfo = RankNumber:3 UnitType:ErynGalenArcher Position:X:-30 Y:25 Position:X:-30 Y:0 Position:X:-30 Y:-25
		RankInfo = RankNumber:4 UnitType:ErynGalenArcher Position:X:-45 Y:12 Position:X:-45 Y:-12
		
		RanksToReleaseWhenAttacking = 1 2 3 4
	End
End

