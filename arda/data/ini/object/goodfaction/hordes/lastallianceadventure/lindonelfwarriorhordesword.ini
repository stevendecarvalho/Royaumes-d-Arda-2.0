		AttributeModifierDuration	= 15000 ; 15 Seconds
		Instant					= Yes
		TriggerSound			= VeteranLastAllianceSound
	End
	Behavior = AutoAbilityBehavior ModuleTag_BladeOfPurityAutoAbility
