        ; Positions for 5 RohanElvenWarrior        
        ; // Positions for 5
        ; RankInfo = RankNumber:1 UnitType:SecondAgeLindonWarrior Position:X:0 Y:0    Position:X:0 Y:25    Position:X:0 Y:-25    Position:X:0 Y:50    Position:X:0 Y:-50 
