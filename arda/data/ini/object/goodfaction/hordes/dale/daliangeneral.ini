//////////////////////////////////////////////////////////////////////////////////
Object DaleGeneralsHorde

	// This is required for garrisoned objects - please put in all objects.
	ButtonImage		= uirivgreycompany
	SelectPortrait	= UPRivGreyCompany

	Draw = W3DScriptedModelDraw ModuleTag_W3DModelDraw
	    DependencySharedModelFlags = EMOTION_ALERT EMOTION_MORALE_HIGH EMOTION_MORALE_LOW EMOTION_AFRAID EMOTION_COWER SELECTED EMOTION_TERROR EMOTION_LOOK_TO_SKY EMOTION_TAUNTING
		DefaultModelConditionState
			Model = None //InvisHrdeTmp5x2
		End
		ModelConditionState = HORDE_EMPTY
			Model = None
		End

		ModelConditionState = WORLD_BUILDER
			Model = HordeMarkGURan
		End
	End

	Side = Dale
	EditorSorting = UNIT
	EmotionRange = 240
	DisplayName = OBJECT:HordeDaleGenerals
	DisplayNameStrategic = CONTROLBAR:LW_Unit_GreyCompanyHorde
	DescriptionStrategic = CONTROLBAR:LW_ToolTip_GreyCompanyHorde

	WeaponSet
		Conditions = None
		Weapon = PRIMARY    GondorRangerMissileHordeRangefinder
		Weapon = TERTIARY   GondorRangerMissileHordeRangefinderBombard
		AutoChooseSources = TERTIARY FROM_PLAYER FROM_SCRIPT				; Not AI.
	End
	WeaponSet
		Conditions = WEAPONSET_TOGGLE_1
		Weapon 		= PRIMARY	NormalMeleeHordeRangefinder
;;,;;		Weapon 		= TERTIARY	MirkwoodArcherMissileHordeRangefinderBombard
;;,;;		AutoChooseSources = TERTIARY FROM_PLAYER FROM_SCRIPT
	End
	WeaponSet ;;,;;
		Conditions = CONTAINED
		Weapon 		= PRIMARY    	GondorRangerMissileHordeRangefinder
	End
	WeaponSet ;;,;;
		Conditions = WEAPONSET_TOGGLE_1 CONTAINED
		Weapon 		= PRIMARY    	GondorRangerMissileHordeRangefinder
	End

	// *** AUDIO Parameters ***
	// Note: Don't put voice parameters here -- they will be ignored. Voice play requests
	// are always passed through to members
	#include "..\..\..\includes\StandardHordeEvaEvents.inc"


	BuildCost = 1800 ;GONDOR_RANGER_BUILDCOST
	BuildTime = 50	;ELVEN_NOLDORWARRIOR_BUILDTIME
	VisionRange = GONDOR_RANGER_HORDE_VISION_RANGE
	ShroudClearingRange = GONDOR_RANGER_HORDE_SHROUD_RANGE
	VisionSide = 50%
	VisionRear = 25%
	MaxVisionBonusPercent = 300%
	VisionBonusTestRadius = 200
	VisionBonusPercentPerFoot = 1.0%
	CommandPoints = 120 ;;,;; 60

	MaxSimultaneousOfType = 1

 	CrushableLevel = 0  //What am I?:        0 = for infantry, 1 = for trees, 2 = general vehicles
	CrusherLevel = 0
	UseCrushAttack = No	;Archer hordes cannot crush or Bombard will not work

	FormationWidth = 2 // Width it occupies in formations. Current choices are 1 or 2.
	FormationDepth = 1 // Depth it occupies in formations. Current choices are 1 or 2.

    TransportSlotCount = TRANSPORTSLOTCOUNT_SMALL_HORDE
	KindOf = SELECTABLE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT INFANTRY HORDE ARCHER MELEE_HORDE ARMY_SUMMARY LARGE_RECTANGLE_PATHFIND//UNATTACKABLE

	Body = ImmortalBody ModuleTag_ImmortalBody
		MaxHealth = 1
	End

	ThreatLevel = GONDOR_RANGER_HORDE_THREAT
	ThreatBreakdown ArnorRangerHorde_DetailedThreat
		AIKindOf = ARCHER
	End

	#include "..\..\..\includes\CaptureBuilding.inc"

	Behavior = StancesBehavior ModuleTag_StancesBehavior
        StanceTemplate = ArcherHorde
    End

	;Wambly - Updated AI Preferences

	Behavior = HordeAIUpdate ModuleTag_HordeAIUpdate
		;AutoAcquireEnemiesWhenIdle = Yes ATTACK_BUILDINGS STEALTHED
		AutoAcquireEnemiesWhenIdle = Yes STEALTHED
		MoodAttackCheckRate        = 500
		MaxCowerTime				=	5000
		MinCowerTime				=	3000
		CanAttackWhileContained    = Yes  // Can fire out of garrisoned building
        AILuaEventsList				= DaleGeneralsFunctions
        AttackPriority				= 	AttackPriority_ARCHER
	End

	Behavior = HordeContain ModuleTag_HordeContain
		FrontAngle = 270
		FlankedDelay = 500
		ObjectStatusOfContained =
		InitialPayload = DaleGenerals 12 ;;,;; GOOD_MEN_HORDE_SIZE
		Slots = 12 ;;,;; 10
		PassengerFilter = NONE +INFANTRY
		ShowPips = No
		ThisFormationIsTheMainFormation = Yes	//Used to determine which armorset to use (and anything else we want!)
		RandomOffset = X:5 Y:3 ;RandomOffset=X:4 Y:4
		MeleeBehavior = Amoeba
		End

		// Banner Carrier info
		BannerCarriersAllowed	= DaleLaketownBanner										// types of units that are allowed as banner carriers
		BannerCarrierPosition	= UnitType:DaleGenerals		Pos:X:40.0 Y:0.0		; (DEFAULT) position of banner carrier for archer horde

		RankInfo = RankNumber:1 UnitType:DaleGenerals Position:X:0 Y:12		Position:X:0 Y:-12	Position:X:0 Y:-36	Position:X:0 Y:36	Position:X:0 Y:-60 	Position:X:0 Y:60
		RankInfo = RankNumber:2 UnitType:DaleGenerals Position:X:20 Y:12	Position:X:20 Y:-12	Position:X:20 Y:-36	Position:X:20 Y:36	Position:X:20 Y:-60	Position:X:20 Y:60 ;;,;;

		RanksToReleaseWhenAttacking = 1 2

		MeleeAttackLeashDistance = 50   //How far the hordes	can	move from the center of	the	horde when melee attacking.
	End

	#include "..\..\..\includes\DefaultInvisibilityUpdate.inc"

	Behavior = PhysicsBehavior ModuleTag_PhysicsBehavior
		GravityMult = 1.0
	End

   	Behavior = EmotionTrackerUpdate	Module_EmotionTracker
		TauntAndPointDistance		=	INFANTRY_TAUNT_POINT_RADIUS		// max distance to taunted/pointed objet
		TauntAndPointUpdateDelay	=	1000	// how often scan (milliseconds)
		TauntAndPointExcluded		=	NONE
 		AfraidOf					=	AOTR_EMOTION_AFRAIDOF_OBJECTFILTER
		AlwaysAfraidOf				=	EMOTION_ALWAYS_AFRAIDOF_OBJECTFILTER
 		PointAt						=	EMOTION_POINTAT_OBJECTFILTER
		HeroScanDistance		=	150
		FearScanDistance		=	ARCHER_FEAR_SCAN_RADIUS

		AddEmotion	=	Terror_Base
		AddEmotion	=	Doom_Base
		AddEmotion	=   BraceForBeingCrushed_Base
		AddEmotion	=	UncontrollableFear_Base
		AddEmotion	=	FearIdle_Base
		AddEmotion	=	FearBusy_Base
		AddEmotion	=	Point_Base

		//Rangers are very stoic and do not taunt. -
		//AddEmotion	=	OVERRIDE Taunt_Base
 			//AttributeModifier		=	ArnorFighterTaunt
 		//End

 		AddEmotion	=	CheerIdle_Base
		AddEmotion	=	CheerBusy_Base
		AddEmotion	=	HeroCheerIdle_Base
		AddEmotion	=	HeroCheerBusy_Base
		AddEmotion	=	Alert_Base
	End

	LocomotorSet
		Locomotor     = NormalRangedHordeLocomotor
		Condition     = SET_NORMAL
		Speed         = NORMAL_FOOT_FAST_HORDE_SPEED
	End

	CommandSet = DaleGeneralsHordeCommandSet

	Behavior = ProductionUpdate ProductionUpdateModuleTag
		GiveNoXP = Yes
	End

	Behavior = PickupStuffUpdate ModuleTag_PickupStuffUpdate
		SkirmishAIOnly = Yes
		StuffToPickUp = NONE +CRATE
		ScanRange = 200
		ScanIntervalSeconds = 0.5
	End

	Behavior = AutoHealBehavior ModuleTag_MHHHealing	;;,;; Added for 3.0.0
		StartsActive 			= No
		TriggeredBy 			= Upgrade_MiniHordeLvl2
		HealingAmount 			= 15 ;10
		HealingDelay 			= 1000
		StartHealingDelay 		= 20000
		UnitHealPulseFX			= FX_SpellHealUnitHealBuff
		NonStackable			= Yes
		HealOnlyIfNotInCombat 		= Yes
		HealOnlyIfNotUnderAttack	= Yes
		AffectsContained		= Yes
	End

	;-------------------------------------------------------------------------
	; Experienced Warriors
	;-------------------------------------------------------------------------
	Behavior = AttributeModifierAuraUpdate ModuleTag_ExperiencedWarriorsPassive
		StartsActive				= No
		BonusName					= DaleExperiencedWarriors
		TriggeredBy					= Upgrade_ObjectLevel1
		RefreshDelay				= 2000
		Range						= 200
		ObjectFilter				= AOTR_GENERIC_BUFF_RECIPIENT_OBJECT_FILTER
	End
	;----- Level 5 upgrade
	Behavior = CommandSetUpgrade ModueTag_CommandSetLvl5
		TriggeredBy					= Upgrade_ObjectLevel5
		CommandSet					= DaleGeneralsHordeCommandSetLvl5
		RequiresAllTriggers			= Yes
	End
	Behavior = UnpauseSpecialPowerUpgrade ModuleTag_ExperiencedWarriorsEnabler
		SpecialPowerTemplate 		= SpecialAbilityTheodenGloriousCharge
		TriggeredBy 				= Upgrade_ObjectLevel5
	End
	Behavior = SpecialPowerModule ModuleTag_ExperiencedWarriorsBuff
		SpecialPowerTemplate      	= SpecialAbilityTheodenGloriousCharge
		UpdateModuleStartsAttack  	= Yes
		StartsPaused 				= Yes
		AttributeModifier 			= DaleExperiencedWarriorsActive
		AttributeModifierRange 		= 0
		AttributeModifierAffectsSelf = Yes
		AttributeModifierAffects 	= NONE
	End
	
	Behavior = SpecialAbilityUpdate ModuleTag_ExperiencedWarriorsAnimation
		UnpackTime              	= 0
		UnpackingVariation			= 1
		SpecialPowerTemplate		= SpecialAbilityTheodenGloriousCharge
 		PreparationTime         	= 1
 		PersistentPrepTime      	= 0
 		PackTime                	= 0
		Instant						= Yes
 	End
	;-------------------------------------------------------------------------
	; Fearsome Veterans
	;-------------------------------------------------------------------------
	Behavior = UnpauseSpecialPowerUpgrade ModuleTag_FearsomeVeteransEnabler
		SpecialPowerTemplate      	= FountainGuardAbilityTwo
		TriggeredBy		  			= Upgrade_MiniHordeLvl7
	End
	
	Behavior = OCLSpecialPower ModuleTag_FearsomeVeterans_OCL
		SpecialPowerTemplate 		= FountainGuardAbilityTwo
		OCL                  		= OCL_FearsomeVeteransStarter
		CreateLocation       		= USE_OWNER_OBJECT
		StartsPaused		 		= Yes
;		TriggerFX	 				= FX_FountainGuardArdentDefenderStart
	End

	Behavior = AutoAbilityBehavior ModuleTag_AutoAbilityFearsomeVeterans
		SpecialAbility				= FountainGuardAbilityTwo
		ForbiddenStatus 			= INSIDE_GARRISON
		MaxScanRange				= 200
		Query						= 15 ANY ENEMIES +INFANTRY +CAVALRY -STRUCTURE -WALL_UPGRADE -WALL_HUB -WALL_SEGMENT -DEFENSIVE_WALL -FS_BASE_DEFENSE
	End
