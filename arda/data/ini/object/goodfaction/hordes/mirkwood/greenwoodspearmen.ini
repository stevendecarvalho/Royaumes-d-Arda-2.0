        RankInfo                            = RankNumber:2 UnitType:MirkwoodFerenGreenwoodSpearmen_Summoned Position:X:30 Y:0 Leader 1 0 Position:X:30 Y:20 Leader 1 1 Position:X:30 Y:-20 Leader 1 2 Position:X:30 Y:40 Leader 1 3 Position:X:30 Y:-40 Leader 1 4
        
