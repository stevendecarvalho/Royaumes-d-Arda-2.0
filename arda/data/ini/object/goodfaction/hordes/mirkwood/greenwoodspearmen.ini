    ;/////////////////////////////
    ;// PARAMÈTRES D'INGÉNIERIE //
    ;/////////////////////////////
    
    KindOf                              = +SUMMONED
    
    
    
    ;///////////////
    ;// BATAILLON //
    ;///////////////
    
