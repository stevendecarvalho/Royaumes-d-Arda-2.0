    ;/////////////////////////
    ;// PARAMÈTRES GÉNÉRAUX //
    ;/////////////////////////
    
    IsTrainable                         = No
    
    CommandPoints                       = 0
    CommandSet                          = GenericCommandSet
    
    
    
    ;/////////////////////////////
    ;// PARAMÈTRES D'INGÉNIERIE //
    ;/////////////////////////////
    
    KindOf                              = +SUMMONED
    
    
    
    ;///////////////
    ;// BATAILLON //
    ;///////////////
    
    Behavior                            = HordeContain ModuleTag_HordeContain
        FrontAngle                          = 270
        FlankedDelay                        = 500
        ObjectStatusOfContained             = 
        InitialPayload                      = MirkwoodTaurielRanger_Summoned 10
        Slots                               = 10
        PassengerFilter                     = NONE +INFANTRY
        ShowPips                            = No
        ThisFormationIsTheMainFormation     = Yes
        RandomOffset                        = X:3 Y:3
        MeleeBehavior                       = Amoeba
        End
        
        RankInfo                            = RankNumber:1 UnitType:MirkwoodTaurielRanger_Summoned Position:X:0 Y:0 Position:X:0 Y:25 Position:X:0 Y:-25 Position:X:0 Y:50 Position:X:0 Y:-50
        RankInfo                            = RankNumber:2 UnitType:MirkwoodTaurielRanger_Summoned Position:X:20 Y:0 Position:X:20 Y:25 Position:X:20 Y:-25 Position:X:20 Y:50 Position:X:20 Y:-50
        
