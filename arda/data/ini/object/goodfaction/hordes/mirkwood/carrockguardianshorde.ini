Object CarrockGuardianHorde
    SelectPortrait                      = UPMirkwoodCarrockGuardian
    ButtonImage                         = UIMirkwoodCarrockGuardian
    
    ;////////////////////////////
    ;// PARAMÈTRES ARTISTIQUES //
    ;////////////////////////////
    
    Draw                                = W3DScriptedModelDraw ModuleTag_W3DModelDraw
        DependencySharedModelFlags          = EMOTION_ALERT EMOTION_MORALE_HIGH EMOTION_MORALE_LOW EMOTION_AFRAID EMOTION_COWER SELECTED EMOTION_TERROR EMOTION_LOOK_TO_SKY
        
        DefaultModelConditionState
            Model                               = None
        End
        
        ModelConditionState                 = HORDE_EMPTY
            Model                               = None
        End
        
        ModelConditionState                 = WORLD_BUILDER
            Model                               = HordeMarkIUHai
        End
    End
    
    
    
    ;/////////////////////////
    ;// PARAMÈTRES GÉNÉRAUX //
    ;/////////////////////////
    
    DisplayName                         = OBJECT:CarrockGuardianHorde
    DisplayNameStrategic                = CONTROLBAR:LW_Unit_CarrockGuardianHorde
    DescriptionStrategic                = CONTROLBAR:LW_ToolTip_CarrockGuardianHorde

    BuildCost                           = RDA_MIRKWOOD_CARROCK_GUARDIANS_BUILDCOST
    BuildTime                           = GENERIC_SEMI_ELITE_15_HORDE
    VisionRange                         = GENERIC_STANDARD_VISION                       ;// Distance pour voir les ennemis
    ShroudClearingRange                 = GENERIC_STANDARD_SHROUD_CLEAR                 ;// Rayon qui dévoile le brouillard
    VisionSide                          = GENERIC_STANDARD_VISIONSIDE                   ;// Vision sur le côté
    VisionRear                          = GENERIC_STANDARD_VISIONREAR                   ;// Vision derrière
    ;MaxVisionBonusPercent              = GENERIC_UNIT_MAXVISION%                       ;// Empêche la vision de devenir infinie
    ;VisionBonusTestRadius              = GENERIC_UNIT_VISIONBONUS                      ;// Vision bonus sur les collines
    VisionBonusPercentPerFoot           = GENERIC_STANDARD_VISIONBONUSPERCENTPERFOOT    ;// Bonus de vision par unité en hauteur

    Side                                = Obsolete
    EditorSorting                       = SYSTEM
    ThreatLevel                         = 200
    EmotionRange                        = 240

    CrushableLevel                      = 0               ;// Est écrasé   - 0 : Infanterie / 1 : Arbres / 2 : Cavalerie / Lourd
    CrusherLevel                        = 0               ;// Peut écraser - 0 : Animaux / 1 : Infanterie / 2 : Arbres / 3 : Lourd
	UseCrushAttack			            = No				            ;// N'attaque pas en écrasant, écrase juste en marchant
    ;CrushWeapon                        =                               ;// Arme utilisé pour le piétinement
    ;CrushOnlyWhileCharging             = Yes                           ;// Le piétinement ne marche que pendant une charge
    ;MinCrushVelocityPercent            = 50%                           ;// Vitesse minimale pour écraser
    ;CrushDecelerationPercent           = 5                             ;// Perte de vitesse quand elle piétine
    ;CrushKnockback                     = 40                            ;// Valeur haute 50, plus les unités sont projetées loin
    ;CrushZFactor                       = 1.0                           ;// 0 = vol au sol / 1 = projection / >1 = spectaculaire
    CrushRevengeWeapon                  = RangedInfantryCrushRevenge    ;// Dégâts qu'inflige l'unité lorsqu'elle se fait écrasée
    ;RamPower                           = 20                            ;// Puissance de collision des monstres sur les structures
    ;RamZMult                           = 0.5                           ;// Soulèvement lors du choc, valeur haute soulève
    TransportSlotCount                  = TRANSPORTSLOTCOUNT_LARGE_HORDE
    
    FormationWidth                      = 2
    FormationDepth                      = 2
    
    CommandPoints                       = GENERIC_SEMI_ELITE_15_HORDE
    CommandSet                          = CarrockGuardiansHordeCommandSet
    
    
    
    ;/////////////////////
    ;// ARMES & ARMURES //
    ;/////////////////////
    
    WeaponSet
        Conditions                          = None
        Weapon                              = PRIMARY NormalMeleeHordeRangefinder
    End
    
    
    
    ;/////////////////////////////
    ;// PARAMÈTRES D'INGÉNIERIE //
    ;/////////////////////////////
    
    KindOf                              = SELECTABLE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT CAN_USE_SIEGE_TOWER INFANTRY HORDE MELEE_HORDE ARMY_SUMMARY LARGE_RECTANGLE_PATHFIND
    
    ThreatBreakdown IsengardFighterHorde_DetailedThreat
        AIKindOf                            = INFANTRY
    End
    
    Behavior                            = PhysicsBehavior ModuleTag_PhysicsBehavior
        GravityMult                         = 1.0
    End
    
    
    
    ;/////////////////////////
    ;// PARAMÈTRES DE SANTÉ //
    ;/////////////////////////
    
    Body                                = ImmortalBody ModuleTag_ImmortalBody
        MaxHealth                           = 1
    End
    
    
    
    ;/////////////
    ;// STANCES //
    ;/////////////
    
    Behavior                            = StancesBehavior ModuleTag_StancesBehavior
        StanceTemplate                      = FighterHorde
    End
    
    
    
    ;//////////////////////////
    ;// CAPTURER UN BÂTIMENT //
    ;//////////////////////////
    
    #include "..\..\..\includes\CaptureBuilding.inc"
    
    
    
    ;///////////////////////////////
    ;// INTELLIGENCE ARTIFICIELLE //
    ;///////////////////////////////
    
    Behavior                            = HordeAIUpdate ModuleTag_HordeAIUpdate
        AutoAcquireEnemiesWhenIdle          = Yes
        MoodAttackCheckRate                 = 500
        AILuaEventsList                     = CarrockGuardianFunctions InfantryFunctions
        MaxCowerTime                        = 5000
        MinCowerTime                        = 3000
        AttackPriority                      = AttackPriority_INFANTRY
    End
    
    
    
    ;///////////////
    ;// LOCOMOTOR //
    ;///////////////
    
    LocomotorSet
        Locomotor                           = NormalMeleeHordeLocomotor
        Condition                           = SET_NORMAL
        Speed                               = NORMAL_FOOT_FAST_HORDE_SPEED
    End
    
    
    
    ;///////////////
    ;// BATAILLON //
    ;///////////////
    
    Behavior                            = HordeContain ModuleTag_HordeContain
        FrontAngle                          = 270
        FlankedDelay                        = 500
        ObjectStatusOfContained             = 
        InitialPayload                      = CarrockGuardian 15
        Slots                               = 15
        PassengerFilter                     = NONE +INFANTRY
        ShowPips                            = No
        ThisFormationIsTheMainFormation     = Yes
        RandomOffset                        = X:0 Y:0
        MeleeBehavior                       = Amoeba
        End
        
        BannerCarriersAllowed               = CarrockGuardianBanner
        BannerCarrierPosition               = UnitType:CarrockGuardian Pos:X:70.0 Y:0.0
        
        RankInfo                            = RankNumber:1 UnitType:CarrockGuardian Position:X:50 Y:0 Position:X:50 Y:20 Position:X:50 Y:-20 Position:X:50 Y:40 Position:X:50 Y:-40
        RankInfo                            = RankNumber:2 UnitType:CarrockGuardian Position:X:30 Y:0 Leader 1 0 Position:X:30 Y:20 Leader 1 1 Position:X:30 Y:-20 Leader 1 2 Position:X:30 Y:40 Leader 1 3 Position:X:30 Y:-40 Leader 1 4
        RankInfo                            = RankNumber:3 UnitType:CarrockGuardian Position:X:10 Y:0 Leader 1 0 Position:X:10 Y:20 Leader 2 1 Position:X:10 Y:-20 Leader 2 2 Position:X:10 Y:40 Leader 2 3 Position:X:10 Y:-40 Leader 2 4
        
        RanksToReleaseWhenAttacking         = 1 2 3
        AlternateFormation                  = CarrockGuardiansHordeBlock
        
        MeleeAttackLeashDistance            = 50
    End
    
    
    
    ;//////////////
    ;// ÉMOTIONS //
    ;//////////////
    
    Behavior                            = EmotionTrackerUpdate Module_EmotionTracker
        TauntAndPointDistance               = INFANTRY_TAUNT_POINT_RADIUS
        TauntAndPointUpdateDelay            = 1000
        TauntAndPointExcluded               = NONE
        AfraidOf                            = RDA_EMOTION_AFRAIDOF_OBJECTFILTER
        AlwaysAfraidOf                      = EMOTION_ALWAYS_AFRAIDOF_OBJECTFILTER
        PointAt                             = EMOTION_POINTAT_OBJECTFILTER
        HeroScanDistance                    = 150
        FearScanDistance                    = INFANTRY_FEAR_SCAN_RADIUS
        AddEmotion                          = Terror_Base
        AddEmotion                          = Doom_Base
        AddEmotion                          = BraceForBeingCrushed_Base
        AddEmotion                          = UncontrollableFear_Base
        AddEmotion                          = FearIdle_Base
        AddEmotion                          = FearBusy_Base
        AddEmotion                          = Point_Base
        AddEmotion                          = OVERRIDE Taunt_Base
        End
        AddEmotion                          = CheerIdle_Base
        AddEmotion                          = CheerBusy_Base
        AddEmotion                          = HeroCheerIdle_Base
        AddEmotion                          = HeroCheerBusy_Base
    End



    ;////////////////
    ;// PRODUCTION //
    ;////////////////

    Behavior                            = ProductionUpdate ProductionUpdateModuleTag
        GiveNoXP                            = Yes
    End



    ;///////////
    ;// STUFF //
    ;///////////

    Behavior                            = PickupStuffUpdate ModuleTag_PickupStuffUpdate
        SkirmishAIOnly                      = Yes
        StuffToPickUp                       = NONE +CRATE
        ScanRange                           = 200
        ScanIntervalSeconds                 = 0.5
    End



    ;//////////////
    ;// NIVEAU 2 //
    ;//////////////

    Behavior                            = LevelUpUpgrade ModuleTag_BasicTraining
        TriggeredBy                         = Upgrade_MirkwoodBasicTrainingWoodmen
        LevelsToGain                        = 1
        LevelCap                            = 2
    End

    Behavior                            = ObjectCreationUpgrade ModuleTag_GrantBC
        TriggeredBy                         = Upgrade_ObjectLevel2
        GrantUpgrade                        = Upgrade_MirkwoodBasicTrainingWoodmen
    End



    ;//////////////////////////////
    ;// SYSTÈMES D'AMÉLIORATIONS //
    ;//////////////////////////////
    
	Behavior                            = ObjectCreationUpgrade ModuleTag_RemoveUpgrades3
		TriggeredBy                         = Upgrade_TechnologyWoodmensArmaments_Deactivated 
		ConflictsWith                       = Upgrade_ObjectUnderAIControl
		RemoveUpgrade                       = Upgrade_TechnologyWoodmensArmaments_Activated
	End

	Behavior                            = ObjectCreationUpgrade ModuleTag_RemoveUpgrades4
		TriggeredBy                         = Upgrade_TechnologyWoodmensArmaments_Activated
		ConflictsWith                       = Upgrade_ObjectUnderAIControl
		RemoveUpgrade                       = Upgrade_TechnologyWoodmensArmaments_Deactivated
	End



    ;//////////////////////////////////
    ;// COMPÉTENCE : FURIE DE L'OURS //
    ;//////////////////////////////////

    Behavior                            = UnpauseSpecialPowerUpgrade ModuleTag_EscapeEnabler
        SpecialPowerTemplate                = SpecialAbilityCarrockGuardianFury
        TriggeredBy                         = Upgrade_ObjectLevel1
    End

    Behavior                            = WeaponModeSpecialPowerUpdate ModuleTag_CarrockGuardianFuryWeaponUpdate
        SpecialPowerTemplate                = SpecialAbilityCarrockGuardianFury
        Duration                            = 10000
        AttributeModifier                   = CarrockGuardianFury
		WeaponSetFlags						= WEAPONSET_HERO_MODE
        StartsPaused                        = Yes
    End

    Behavior                            = AutoAbilityBehavior ModuleTag_EscapeAutoAbility
        SpecialAbility                      = SpecialAbilityCarrockGuardianFury
        ForbiddenStatus                     = INSIDE_GARRISON
        MaxScanRange                        = 100
        Query                               = 1 ALL ENEMIES -WALL_UPGRADE -WALL_HUB -WALL_SEGMENT -DEFENSIVE_WALL -FS_BASE_DEFENSE
    End



    ;///////////////////
    ;// AMÉLIORATIONS //
    ;///////////////////

    Behavior                            = StatusBitsUpgrade ModuleTag_ProductionLegality
        TriggeredBy                         = Upgrade_MirkwoodWoodmenForgedBlades
    End



    ;////////////////////
    ;// COMPÉTENCES IA //
    ;////////////////////

    Behavior                            = AISpecialPowerUpdate IsengardFighterHordeCaptureBuildingAI
        CommandButtonName                   = Command_CaptureBuilding
        SpecialPowerAIType                  = AI_SPECIAL_POWER_CAPTURE_BUILDING
    End

    Behavior                            = AISpecialPowerUpdate GondorFighterHordeStanceBattle
        CommandButtonName                   = Command_SetStanceBattle
        SpecialPowerAIType                  = AI_SPECIAL_POWER_STANCEBATTLE
    End

    Behavior                            = AISpecialPowerUpdate GondorFighterHordeStanceAggressive
        CommandButtonName                   = Command_SetStanceAggressive
        SpecialPowerAIType                  = AI_SPECIAL_POWER_STANCEAGGRESSIVE
    End

    Behavior                            = AISpecialPowerUpdate GondorFighterHordeHoldGround
        CommandButtonName                   = Command_SetStanceHoldGround
        SpecialPowerAIType                  = AI_SPECIAL_POWER_STANCEHOLDGROUND
    End



    ;//////////////////////////
    ;// AUTO-RÉSOLUTION WOTR //
    ;//////////////////////////

    WorldMapArmoryUpgradesAllowed       = Upgrade_MirkwoodBasicTrainingWoodmen Upgrade_MirkwoodWoodmenForgedBlades



    ;/////////////////////////////
    ;// PARAMÈTRES DE GÉOMÉTRIE //
    ;/////////////////////////////

    Geometry                            = BOX
    GeometryMajorRadius                 = 30.0
    GeometryMinorRadius                 = 45.0
    GeometryHeight                      = 20.0
    GeometryIsSmall                     = No
End





ChildObject CarrockGuardiansHordeBlock CarrockGuardianHorde
    
    ;///////////////
    ;// BATAILLON //
    ;///////////////
    
    Behavior                            = HordeContain ModuleTag_HordeContain
        AttributeModifiers                  = FormationMurDeBoucliers
        FrontAngle                          = 270
        FlankedDelay                        = 500
        ObjectStatusOfContained             = 
        InitialPayload                      = CarrockGuardian 15
        Slots                               = 15
        PassengerFilter                     = NONE +INFANTRY
        ShowPips                            = No
        ThisFormationIsTheMainFormation     = No
        MeleeBehavior                       = Amoeba
        End
        
        BannerCarriersAllowed               = CarrockGuardianBanner
        BannerCarrierPosition               = UnitType:CarrockGuardian Pos:X:10.0 Y:0.0
        
        RankInfo                            = RankNumber:1 UnitType:CarrockGuardian Position:X:34 Y:0 Position:X:34 Y:10 Position:X:34 Y:-10 Position:X:34 Y:20 Position:X:34 Y:-20
        RankInfo                            = RankNumber:2 UnitType:CarrockGuardian Position:X:22 Y:0 Leader 1 0 Position:X:22 Y:10 Leader 1 1 Position:X:22 Y:-10 Leader 1 2 Position:X:22 Y:20 Leader 1 3 Position:X:22 Y:-20 Leader 1 4
        RankInfo                            = RankNumber:3 UnitType:CarrockGuardian Position:X:10 Y:0 Leader 2 0 Position:X:10 Y:10 Leader 2 1 Position:X:10 Y:-10 Leader 2 2 Position:X:10 Y:20 Leader 2 3 Position:X:10 Y:-20 Leader 2 4
        
        RanksToReleaseWhenAttacking         = 1
        
        AlternateFormation                  = CarrockGuardianHorde
        MeleeAttackLeashDistance            = 1
        BackUpMinDelayTime                  = 1
        BackUpMaxDelayTime                  = 3000
        BackUpMinDistance                   = 1
        BackUpMaxDistance                   = 3
        BackupPercentage                    = 80%
    End
End