;////////////////////////////////////////////////////////////////////////////////////
;////////////////////////////////////////////////////////////////////////////////////
;/////																			/////
;/////						PATROUILLEURS DE VERTBOIS							/////
;/////																			/////
;////////////////////////////////////////////////////////////////////////////////////
;////////////////////////////////////////////////////////////////////////////////////

Object MirkwoodOutriderHorde
    SelectPortrait                      = UPMirkwoodOutriders
    ButtonImage                         = UIMirkwoodOutriders
    
    ;////////////////////////////
    ;// PARAMÈTRES ARTISTIQUES //
    ;////////////////////////////
    
    Draw                                = W3DScriptedModelDraw ModuleTag_W3DModelDraw
        DependencySharedModelFlags          = EMOTION_ALERT EMOTION_MORALE_HIGH EMOTION_MORALE_LOW EMOTION_AFRAID EMOTION_COWER SELECTED EMOTION_TERROR EMOTION_CELEBRATING
        
        DefaultModelConditionState
            Model                               = None
        End
        
        ModelConditionState                 = HORDE_EMPTY
            Model                               = None
        End
        
        ModelConditionState                 = WORLD_BUILDER
            Model                               = HordeMarkRURoh
        End
    End
    
    
    
    ;/////////////////////////
    ;// PARAMÈTRES GÉNÉRAUX //
    ;/////////////////////////
    
    DisplayName                         = OBJECT:HordeMirkwoodOutrider
    DisplayNameStrategic                = CONTROLBAR:LW_Unit_MirkwoodOutriderHorde
    DescriptionStrategic                = CONTROLBAR:LW_ToolTip_MirkwoodOutriderHorde
    
    BuildCost                           = RDA_MIRKWOOD_OUTRIDERS_BUILDCOST
    BuildTime                           = SEMI_ELITE_UNIT_BUILDTIME
    VisionRange                         = GENERIC_ARCHER_SEMI_ELITE_VISION              ;// Distance pour voir les ennemis
    ShroudClearingRange                 = GENERIC_ARCHER_SEMI_ELITE_SHROUD_CLEAR        ;// Rayon qui dévoile le brouillard
    VisionSide                          = GENERIC_STANDARD_VISIONSIDE                   ;// Vision sur le côté
    VisionRear                          = GENERIC_STANDARD_VISIONREAR                   ;// Vision derrière
    ;MaxVisionBonusPercent              = GENERIC_UNIT_MAXVISION%                       ;// Empêche la vision de devenir infinie
    ;VisionBonusTestRadius              = GENERIC_UNIT_VISIONBONUS                      ;// Vision bonus sur les collines
    VisionBonusPercentPerFoot           = GENERIC_STANDARD_VISIONBONUSPERCENTPERFOOT    ;// Bonus de vision par unité en hauteur
    
    Side                                = Obsolete
    EditorSorting                       = SYSTEM
    ThreatLevel                         = 300
    EmotionRange                        = 240

    CrushableLevel                      = 2               ;// Est écrasé   - 0 : Infanterie / 1 : Arbres / 2 : Cavalerie / Lourd
    CrusherLevel                        = 1               ;// Peut écraser - 0 : Animaux / 1 : Infanterie / 2 : Arbres / 3 : Lourd
	;UseCrushAttack			            = No				            ;// N'attaque pas en écrasant, écrase juste en marchant
    ;CrushWeapon                         = RohirrimCrush                 ;// Arme utilisé pour le piétinement
    ;CrushOnlyWhileCharging             = Yes                           ;// Le piétinement ne marche que pendant une charge
    MinCrushVelocityPercent             = GENERIC_STANDARD_MIN_CRUSH    ;// Vitesse minimale pour écraser
    CrushDecelerationPercent            = GENERIC_STANDARD_CRUSH_DECELERATION   ;// Perte de vitesse quand elle piétine
    CrushKnockback                      = GENERIC_STANDARD_CRUSHKNOCKBACK   ;// Valeur haute, plus les unités sont projetées loin
    CrushZFactor                        = 1                             ;// 0 = vol au sol / 1 = projection / >1 = spectaculaire
    ;CrushRevengeWeapon                  = RangedInfantryCrushRevenge    ;// Dégâts qu'inflige l'unité lorsqu'elle se fait écrasée
    ;RamPower                           = 20                            ;// Puissance de collision des monstres sur les structures
    ;RamZMult                           = 0.5                           ;// Soulèvement lors du choc, valeur haute soulève
    TransportSlotCount                  = TRANSPORTSLOTCOUNT_SMALL_HORDE
    
    FormationWidth                      = 2
    FormationDepth                      = 1
    
    CommandPoints                       = GENERIC_SEMI_ELITE_CAV_ARCH_10_HORDE
    CommandSet                          = MirkwoodOutriderHordeCommandSet
    
    
    
    ;/////////////////////
    ;// ARMES & ARMURES //
    ;/////////////////////
    
    WeaponSet
        Conditions                          = None
        Weapon                              = PRIMARY NormalMissileHordeRangefinder
    End
	
    WeaponSet
        Conditions                          = WEAPONSET_CREATE_A_HERO_WS_01
        Weapon                              = PRIMARY RohanRohirrimBowMoving
        AutoChooseSources                   = PRIMARY FROM_PLAYER FROM_SCRIPT FROM_AI
    End
    
    
    
    ;/////////////////////////////
    ;// PARAMÈTRES D'INGÉNIERIE //
    ;/////////////////////////////
    
    KindOf                              = SELECTABLE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT CAVALRY ARCHER HORDE MELEE_HORDE ARMY_SUMMARY LARGE_RECTANGLE_PATHFIND
    
    ThreatBreakdown RohanRohirrimHorde_DetailedThreat
    AIKindOf                            = CAVALRY
    End
    
    Behavior                            = PhysicsBehavior ModuleTag_PhysicsBehavior
        GravityMult                         = 1.0
    End
    
    Behavior                            = HordeNotifyTargetsOfImminentProbableCrushingUpdate ModuleTag_NotifyCrushScan
        ScanWidth                           = 70.0
    End
    
    
    
    ;/////////////////////////
    ;// PARAMÈTRES DE SANTÉ //
    ;/////////////////////////
    
    Body                                = ImmortalBody ModuleTag_ImmortalBody
        MaxHealth                           = 1
    End
    
    
    
    ;/////////////
    ;// STANCES //
    ;/////////////
    
    Behavior                            = StancesBehavior ModuleTag_StancesBehavior
        StanceTemplate                      = CavalryHorde
    End
    
    
    
    ;//////////////////////////
    ;// CAPTURER UN BÂTIMENT //
    ;//////////////////////////
    
    #include "..\..\..\includes\CaptureBuilding.inc"
    
    
    
    ;///////////////////////////////
    ;// INTELLIGENCE ARTIFICIELLE //
    ;///////////////////////////////
    
    Behavior                            = HordeAIUpdate ModuleTag_HordeAIUpdate
        AutoAcquireEnemiesWhenIdle          = Yes
        MoodAttackCheckRate                 = 500
        MaxCowerTime                        = 5000
        MinCowerTime                        = 3000
        AILuaEventsList                     = MirkwoodSilvanRiderFunctions RohirrimArcherFunctions
        AttackPriority                      = AttackPriority_ARCHER
    End
    
    
    
    ;///////////////
    ;// BATAILLON //
    ;///////////////
    
    Behavior                            = HorseHordeContain ModuleTag_HordeContain
        FrontAngle                          = 270
        FlankedDelay                        = 500
        ObjectStatusOfContained             = 
        InitialPayload                      = MirkwoodOutrider 10
        Slots                               = 10
        PassengerFilter                     = NONE +CAVALRY +MirkwoodOutriderBanner
        ShowPips                            = No
        ThisFormationIsTheMainFormation     = Yes
        RandomOffset                        = X:0 Y:0
        MeleeBehavior                       = Amoeba
        End
        
        BannerCarriersAllowed               = MirkwoodOutriderBanner
        BannerCarrierPosition               = UnitType:MirkwoodOutrider Pos:X:75.0 Y:0.0
        
        RankInfo                            = RankNumber:1 UnitType:MirkwoodOutrider Position:X:45 Y:0 Position:X:45 Y:20 Position:X:45 Y:-20 Position:X:45 Y:40 Position:X:45 Y:-40
        RankInfo                            = RankNumber:2 UnitType:MirkwoodOutrider Position:X:10 Y:0 Leader 1 0 Position:X:10 Y:20 Leader 1 1 Position:X:10 Y:-20 Leader 1 2 Position:X:10 Y:40 Leader 1 3 Position:X:10 Y:-40 Leader 1 4
        
        RanksToReleaseWhenAttacking         = 1 2
        MeleeAttackLeashDistance            = 25
        BackUpMinDelayTime                  = 1
        BackUpMaxDelayTime                  = 3000
        BackUpMinDistance                   = 1
        BackUpMaxDistance                   = 3
        BackupPercentage                    = 80%
    End
    
    
    
    ;///////////////
    ;// LOCOMOTOR //
    ;///////////////
    
    LocomotorSet
        Locomotor                           = NormalCavalryHordeLocomotor
        Condition                           = SET_NORMAL
        Speed                               = 100
    End
    
    
    
    ;//////////////
    ;// ÉMOTIONS //
    ;//////////////
    
    Behavior                            = EmotionTrackerUpdate Module_EmotionTracker
        TauntAndPointDistance               = INFANTRY_TAUNT_POINT_RADIUS
        TauntAndPointUpdateDelay            = 1000
        TauntAndPointExcluded               = NONE
        AfraidOf                            = RDA_EMOTION_AFRAIDOF_OBJECTFILTER
        AlwaysAfraidOf                      = EMOTION_ALWAYS_AFRAIDOF_OBJECTFILTER
        PointAt                             = EMOTION_POINTAT_OBJECTFILTER
        HeroScanDistance                    = 150
        FearScanDistance                    = CAVALRY_FEAR_SCAN_RADIUS
        AddEmotion                          = Terror_Base
        AddEmotion                          = Doom_Base
        AddEmotion                          = BraceForBeingCrushed_Base
        AddEmotion                          = UncontrollableFear_Base
        AddEmotion                          = FearIdle_Base
        AddEmotion                          = FearBusy_Base
        AddEmotion                          = Point_Base
        AddEmotion                          = Taunt_Base
        AddEmotion                          = CheerIdle_Base
        AddEmotion                          = CheerBusy_Base
        AddEmotion                          = HeroCheerIdle_Base
        AddEmotion                          = HeroCheerBusy_Base
        AddEmotion                          = Alert_Base
        AddEmotion                          = CheerForAboutToCrush_Base
    End
    
    
    
    ;////////////////
    ;// PRODUCTION //
    ;////////////////
    
    Behavior                            = ProductionUpdate ProductionUpdateModuleTag
        GiveNoXP                            = Yes
    End
    
    
    
    ;///////////
    ;// STUFF //
    ;///////////
    
    Behavior                            = PickupStuffUpdate ModuleTag_PickupStuffUpdate
        SkirmishAIOnly                      = Yes
        StuffToPickUp                       = NONE +CRATE
        ScanRange                           = 200
        ScanIntervalSeconds                 = 0.5
    End
    
    
    
    ;//////////////
    ;// NIVEAU 2 //
    ;//////////////
    
    Behavior                            = LevelUpUpgrade ModuleTag_BasicTraining
        TriggeredBy                         = Upgrade_MirkwoodBasicTraining
        LevelsToGain                        = 1
        LevelCap                            = 2
    End
    
    
    
    ;//////////////////
    ;// INVISIBILITÉ //
    ;//////////////////
    
    Behavior                            = InvisibilityUpdate ModuleTag_ElvenCloak
        InvisibilityNugget
            InvisibilityType                    = STEALTH
            ForbiddenConditions                 = MOVING FIRING_ANY TAKING_DAMAGE
            BecomeStealthedFX                   = FX_ElvenCloakOn
            ExitStealthFX                       = FX_ElvenCloakOff
            Options                             = UNTOGGLE_HIDDEN_WHEN_LEAVING_STEALTH
        End
        StartsActive                        = No
        UpdatePeriod                        = 2000
    End
    
    Behavior                            = SpecialPowerModule ModuleTag_ElfCloakStarter
        SpecialPowerTemplate                = SpecialAbilityElfCloak
        UpdateModuleStartsAttack            = Yes
        StartsPaused                        = Yes
    End
    
    Behavior                            = ToggleHiddenSpecialAbilityUpdate ModuleTag_ElfCloakUpdate
        SpecialPowerTemplate                = SpecialAbilityElfCloak
    End
    
    #include "..\..\..\includes\DefaultInvisibilityUpdate.inc"
    
    
    
    ;///////////////////////////////////////
    ;// COMPÉTENCE : COURSIERS FORESTIERS //
    ;///////////////////////////////////////
    
    Behavior                            = UnpauseSpecialPowerUpgrade ModuleTag_EscapeEnabler
        SpecialPowerTemplate                = SpecialAbilitySilvanEscape
        TriggeredBy                         = Upgrade_ObjectLevel2
    End
    
    Behavior                            = WeaponModeSpecialPowerUpdate ModuleTag_EscapePowerUpdate
        SpecialPowerTemplate                = SpecialAbilitySilvanEscape
        Duration                            = 30000
        AttributeModifier                   = MirkwoodHorseMastery
        StartsPaused                        = Yes
    End
    
    Behavior                            = AutoAbilityBehavior ModuleTag_EscapeAutoAbility
        SpecialAbility                      = SpecialAbilitySilvanEscape
        ForbiddenStatus                     = INSIDE_GARRISON
        MaxScanRange                        = 100
        Query                               = 1 ALL ENEMIES -WALL_UPGRADE -WALL_HUB -WALL_SEGMENT -DEFENSIVE_WALL -FS_BASE_DEFENSE
    End
	
	
	
	;/////////////////////////////////
	;// COMPÉTENCE : TRAITS ÉPINEUX //
	;/////////////////////////////////
	
	Behavior								= UnpauseSpecialPowerUpgrade ModuleTag_BlackArrowsEnabler
		SpecialPowerTemplate					= SpecialAbilityBlackArrows
		TriggeredBy								= Upgrade_ObjectLevel3
	End
	
	Behavior								= SpecialPowerModule ModuleTag_BlackArrowsStarter
		SpecialPowerTemplate					= SpecialAbilityBlackArrows
		UpdateModuleStartsAttack				= Yes
		StartsPaused							= Yes
	End
	
	Behavior								= WeaponFireSpecialAbilityUpdate ModuleTag_BlackArrowsWeaponFireUpdate
		SpecialPowerTemplate					= SpecialAbilityBlackArrows
        FreezeAfterTriggerDuration              = 100
		PackTime								= 2000
		StartAbilityRange						= #MULTIPLY( 350 0.95 )
		SpecialWeapon							= MirkwoodHorseBowBlackArrowsRangeFinder
		ApproachUntilMembersInRange				= Yes
	End
	
	Behavior								= AutoAbilityBehavior ModuleTag_BlackArrowsAutoAbility
		SpecialAbility							= SpecialAbilityBlackArrows
		ForbiddenStatus							= INSIDE_GARRISON
		MaxScanRange							= 380
		Query									= 1 ANY ENEMIES +HERO +MONSTER -STRUCTURE -WALL_UPGRADE -WALL_HUB -WALL_SEGMENT -DEFENSIVE_WALL -FS_BASE_DEFENSE
		Query									= 1 ANY ENEMIES +INFANTRY +CAVALRY -STRUCTURE -WALL_UPGRADE -WALL_HUB -WALL_SEGMENT -DEFENSIVE_WALL -FS_BASE_DEFENSE
	End



    ;//////////////////////////////
    ;// SYSTÈMES D'AMÉLIORATIONS //
    ;//////////////////////////////
    
	Behavior                            = ObjectCreationUpgrade ModuleTag_RemoveUpgrades3
		TriggeredBy                         = Upgrade_MirkwoodSilverthornArrows_Deactivated 
		ConflictsWith                       = Upgrade_ObjectUnderAIControl
		RemoveUpgrade                       = Upgrade_MirkwoodSilverthornArrows_Activated
	End

	Behavior                            = ObjectCreationUpgrade ModuleTag_RemoveUpgrades4
		TriggeredBy                         = Upgrade_MirkwoodSilverthornArrows_Activated
		ConflictsWith                       = Upgrade_ObjectUnderAIControl
		RemoveUpgrade                       = Upgrade_MirkwoodSilverthornArrows_Deactivated
	End
    
    
    
    ;///////////////////
    ;// AMÉLIORATIONS //
    ;///////////////////
    
    Behavior                            = StatusBitsUpgrade ModuleTag_ProductionLegality
        TriggeredBy                         = Upgrade_MirkwoodSilverthornArrows
    End
    
    Behavior                            = StatusBitsUpgrade ModuleTag_ProductionLegality2
        TriggeredBy                         = Upgrade_SindarinHeavyArmor
    End
    
    
    
    ;////////////////////
    ;// COMPÉTENCES IA //
    ;////////////////////
    
    Behavior                            = AISpecialPowerUpdate MenRohirrimHordeCaptureBuildingAI
        CommandButtonName                   = Command_CaptureBuilding
        SpecialPowerAIType                  = AI_SPECIAL_POWER_CAPTURE_BUILDING
    End
    
    Behavior                            = AISpecialPowerUpdate GondorFighterHordeStanceBattle
        CommandButtonName                   = Command_SetStanceBattle
        SpecialPowerAIType                  = AI_SPECIAL_POWER_STANCEBATTLE
    End
    
    Behavior                            = AISpecialPowerUpdate GondorFighterHordeStanceAggressive
        CommandButtonName                   = Command_SetStanceAggressive
        SpecialPowerAIType                  = AI_SPECIAL_POWER_STANCEAGGRESSIVE
    End
    
    Behavior                            = AISpecialPowerUpdate GondorFighterHordeHoldGround
        CommandButtonName                   = Command_SetStanceHoldGround
        SpecialPowerAIType                  = AI_SPECIAL_POWER_STANCEHOLDGROUND
    End
    
    Behavior                            = AISpecialPowerUpdate SilvanEscapeAI
        CommandButtonName                   = Command_SpecialAbilityMirkwoodHorseMastery
        SpecialPowerAIType                  = AI_SPECIAL_POWER_BASIC_SELF_BUFF
    End
    
    
    
    ;//////////////////////////
    ;// AUTO-RÉSOLUTION WOTR //
    ;//////////////////////////

    WorldMapArmoryUpgradesAllowed       = Upgrade_MirkwoodBasicTraining Upgrade_MirkwoodSilverthornArrows Upgrade_SindarinHeavyArmor



    ;/////////////////////////////
    ;// PARAMÈTRES DE GÉOMÉTRIE //
    ;/////////////////////////////

    Geometry                            = BOX
    GeometryMajorRadius                 = 30.0
    GeometryMinorRadius                 = 40.0
    GeometryHeight                      = 20.0
    GeometryIsSmall                     = No
End





ChildObject MirkwoodOutriderHorde_WOTR MirkwoodOutriderHorde
    EditorSorting                       = SYSTEM
    KindOf                              = -ARMY_SUMMARY
End