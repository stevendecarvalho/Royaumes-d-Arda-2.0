			ExitStealthFX							= FX_ElvenCloakOff
			Options									= UNTOGGLE_HIDDEN_WHEN_LEAVING_STEALTH
		End
		StartsActive							= No
		UpdatePeriod							= 2000
	End
	
	Behavior								= SpecialPowerModule ModuleTag_ElfCloakStarter
