Object WoodmenMarksmenHorde
    SelectPortrait                      = UPGreenwoodWoodmenMarksmen
    ButtonImage                         = UIGreenwoodWoodmenMarksmen
    
    ;////////////////////////////
    ;// PARAMÈTRES ARTISTIQUES //
    ;////////////////////////////
    
    Draw                                = W3DScriptedModelDraw ModuleTag_W3DModelDraw
        DependencySharedModelFlags          = EMOTION_TAUNTING EMOTION_ALERT EMOTION_MORALE_HIGH EMOTION_MORALE_LOW EMOTION_AFRAID EMOTION_COWER SELECTED EMOTION_TERROR EMOTION_LOOK_TO_SKY
        
        DefaultModelConditionState
            Model                               = None
        End
        
        ModelConditionState                 = HORDE_EMPTY
            Model                               = None
        End
        
        ModelConditionState                 = WORLD_BUILDER
            Model                               = HordeMarkEUMIA
        End
    End
    
    
    
    ;/////////////////////////
    ;// PARAMÈTRES GÉNÉRAUX //
    ;/////////////////////////
    
    DisplayName                         = OBJECT:WoodmenMarksmenHorde
    DisplayNameStrategic                = CONTROLBAR:LW_Unit_WoodmenMarksmenHorde
    DescriptionStrategic                = CONTROLBAR:LW_ToolTip_WoodmenMarksmenHorde
    PlacementViewAngle                  = -90

    BuildCost                           = RDA_MIRKWOOD_WOODMENS_BUILDCOST
    BuildTime                           = STANDARD_UNIT_BUILDTIME
    VisionRange                         = GENERIC_ARCHER_STANDARD_VISION                ;// Distance pour voir les ennemis
    ShroudClearingRange                 = GENERIC_ARCHER_STANDARD_SHROUD_CLEAR          ;// Rayon qui dévoile le brouillard
    VisionSide                          = GENERIC_STANDARD_VISIONSIDE                   ;// Vision sur le côté
    VisionRear                          = GENERIC_STANDARD_VISIONREAR                   ;// Vision derrière
    ;MaxVisionBonusPercent              = GENERIC_UNIT_MAXVISION%                       ;// Empêche la vision de devenir infinie
    ;VisionBonusTestRadius              = GENERIC_UNIT_VISIONBONUS                      ;// Vision bonus sur les collines
    VisionBonusPercentPerFoot           = GENERIC_STANDARD_VISIONBONUSPERCENTPERFOOT    ;// Bonus de vision par unité en hauteur

    Side                                = Obsolete
    EditorSorting                       = SYSTEM
    ThreatLevel                         = 200
    EmotionRange                        = 240

    CrushableLevel                      = 0               ;// Est écrasé   - 0 : Infanterie / 1 : Arbres / 2 : Cavalerie / Lourd
    CrusherLevel                        = 0               ;// Peut écraser - 0 : Animaux / 1 : Infanterie / 2 : Arbres / 3 : Lourd
	UseCrushAttack			            = No				            ;// N'attaque pas en écrasant, écrase juste en marchant
    ;CrushWeapon                        =                               ;// Arme utilisé pour le piétinement
    ;CrushOnlyWhileCharging             = Yes                           ;// Le piétinement ne marche que pendant une charge
    ;MinCrushVelocityPercent            = 50%                           ;// Vitesse minimale pour écraser
    ;CrushDecelerationPercent           = 5                             ;// Perte de vitesse quand elle piétine
    ;CrushKnockback                     = 40                            ;// Valeur haute 50, plus les unités sont projetées loin
    ;CrushZFactor                       = 1.0                           ;// 0 = vol au sol / 1 = projection / >1 = spectaculaire
    CrushRevengeWeapon                  = RangedInfantryCrushRevenge    ;// Dégâts qu'inflige l'unité lorsqu'elle se fait écrasée
    ;RamPower                           = 20                            ;// Puissance de collision des monstres sur les structures
    ;RamZMult                           = 0.5                           ;// Soulèvement lors du choc, valeur haute soulève
    TransportSlotCount                  = TRANSPORTSLOTCOUNT_LARGE_HORDE
    
    FormationWidth                      = 2
    FormationDepth                      = 1
    
    CommandPoints                       = GENERIC_STANDARD_15_HORDE
    CommandSet                          = MirkwoodWoodmenCommandSetBow
    
    
    
    ;/////////////////
    ;// COMMANDSETS //
    ;/////////////////
    
    Behavior                            = MonitorConditionUpdate MonitorConditionUpdateModuleTag
        WeaponSetFlags                      = WEAPONSET_TOGGLE_1
        WeaponToggleCommandSet              = MirkwoodWoodmenCommandSetAxe
    End
    
    
    
    ;/////////////////////
    ;// ARMES & ARMURES //
    ;/////////////////////
    
    WeaponSet
        Conditions                          = None
        Weapon                              = PRIMARY GoodArcherMissileHordeRangefinder
    End
    
    WeaponSet
        Conditions                          = WEAPONSET_TOGGLE_1
        Weapon                              = PRIMARY NormalMeleeHordeRangefinder
    End
    
    
    
    ;/////////////////////////////
    ;// PARAMÈTRES D'INGÉNIERIE //
    ;/////////////////////////////
    
    KindOf                              = SELECTABLE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT INFANTRY HORDE ARCHER ARMY_SUMMARY LARGE_RECTANGLE_PATHFIND MELEE_HORDE
    
    ThreatBreakdown GondorArcherHorde_DetailedThreat
        AIKindOf                            = ARCHER
    End
    
    Behavior                            = PhysicsBehavior ModuleTag_PhysicsBehavior
        GravityMult                         = 1.0
    End
    
    
    
    ;/////////////////////////
    ;// PARAMÈTRES DE SANTÉ //
    ;/////////////////////////
    
    Body                                = ImmortalBody ModuleTag_ImmortalBody
        MaxHealth                           = 1
    End
    
    
    
    ;/////////////
    ;// STANCES //
    ;/////////////
    
    Behavior                            = StancesBehavior ModuleTag_StancesBehavior
        StanceTemplate                      = ArcherHorde
    End
    
    
    
    ;//////////////////////////
    ;// CAPTURER UN BÂTIMENT //
    ;//////////////////////////
    
    #include "..\..\..\includes\CaptureBuilding.inc"
    
    
    
    ;///////////////////////////////
    ;// INTELLIGENCE ARTIFICIELLE //
    ;///////////////////////////////
    
    Behavior                            = HordeAIUpdate ModuleTag_HordeAIUpdate
        AutoAcquireEnemiesWhenIdle          = Yes
        MoodAttackCheckRate                 = 500
        MaxCowerTime                        = 5000
        MinCowerTime                        = 3000
        CanAttackWhileContained             = Yes
        AILuaEventsList                     = MirkwoodWoodmenFunctions InfantryFunctions
        AttackPriority                      = AttackPriority_ARCHER
    End
    
    
    
    ;///////////////
    ;// LOCOMOTOR //
    ;///////////////
    
    LocomotorSet
        Locomotor                           = NormalRangedHordeLocomotor
        Condition                           = SET_NORMAL
        Speed                               = NORMAL_FOOT_MED_HORDE_SPEED
    End
    
    
    
    ;///////////////
    ;// BATAILLON //
    ;///////////////
    
    Behavior                            = HordeContain ModuleTag_HordeContain
        FrontAngle                          = 270
        FlankedDelay                        = 500
        ObjectStatusOfContained             = 
        InitialPayload                      = WoodmenMarksmen 15
        Slots                               = 15
        PassengerFilter                     = NONE +INFANTRY
        ShowPips                            = No
        ThisFormationIsTheMainFormation     = Yes
        RandomOffset                        = X:0 Y:0
        MeleeBehavior                       = Amoeba
        End
        
        BannerCarriersAllowed               = WoodmenMarksmenBanner
        BannerCarrierPosition               = UnitType:WoodmenMarksmen Pos:X:70.0 Y:0.0
        
        RankInfo                            = RankNumber:1 UnitType:WoodmenMarksmen Position:X:50 Y:0 Position:X:50 Y:20 Position:X:50 Y:-20 Position:X:50 Y:40 Position:X:50 Y:-40
        RankInfo                            = RankNumber:2 UnitType:WoodmenMarksmen Position:X:30 Y:0 Leader 1 0 Position:X:30 Y:20 Leader 1 1 Position:X:30 Y:-20 Leader 1 2 Position:X:30 Y:40 Leader 1 3 Position:X:30 Y:-40 Leader 1 4
        RankInfo                            = RankNumber:3 UnitType:WoodmenMarksmen Position:X:10 Y:0 Leader 2 0 Position:X:10 Y:20 Leader 2 1 Position:X:10 Y:-20 Leader 2 2 Position:X:10 Y:40 Leader 2 3 Position:X:10 Y:-40 Leader 2 4
        
        RanksToReleaseWhenAttacking         = 1 2 3
        MeleeAttackLeashDistance            = 1
        BackUpMinDelayTime                  = 1
        BackUpMaxDelayTime                  = 3000
        BackUpMinDistance                   = 1
        BackUpMaxDistance                   = 3
        BackupPercentage                    = 80%
    End
    
    
    
    ;//////////////
    ;// ÉMOTIONS //
    ;//////////////
    
    Behavior                            = EmotionTrackerUpdate Module_EmotionTracker
        TauntAndPointDistance               = INFANTRY_TAUNT_POINT_RADIUS
        TauntAndPointUpdateDelay            = 1000
        TauntAndPointExcluded               = NONE
        AfraidOf                            = RDA_EMOTION_AFRAIDOF_OBJECTFILTER
        AlwaysAfraidOf                      = EMOTION_ALWAYS_AFRAIDOF_OBJECTFILTER
        PointAt                             = EMOTION_POINTAT_OBJECTFILTER
        HeroScanDistance                    = 150
        FearScanDistance                    = ARCHER_FEAR_SCAN_RADIUS
        AddEmotion                          = Terror_Base
        AddEmotion                          = Doom_Base
        AddEmotion                          = BraceForBeingCrushed_Base
        AddEmotion                          = UncontrollableFear_Base
        AddEmotion                          = FearIdle_Base
        AddEmotion                          = FearBusy_Base
        AddEmotion                          = Point_Base
        AddEmotion                          = Taunt_Base
        AddEmotion                          = CheerIdle_Base
        AddEmotion                          = CheerBusy_Base
        AddEmotion                          = HeroCheerIdle_Base
        AddEmotion                          = HeroCheerBusy_Base
        AddEmotion                          = Alert_Base
    End
    
    
    
    ;////////////////
    ;// PRODUCTION //
    ;////////////////
    
    Behavior                            = ProductionUpdate ProductionUpdateModuleTag
        GiveNoXP                            = Yes
    End
    
    
    
    ;///////////
    ;// STUFF //
    ;///////////
    
    Behavior                            = PickupStuffUpdate ModuleTag_PickupStuffUpdate
        SkirmishAIOnly                      = Yes
        StuffToPickUp                       = NONE +CRATE
        ScanRange                           = 200
        ScanIntervalSeconds                 = 0.5
    End
    
    
    
    ;//////////////
    ;// NIVEAU 2 //
    ;//////////////
    
    Behavior                            = LevelUpUpgrade ModuleTag_BasicTraining
        TriggeredBy                         = Upgrade_MirkwoodBasicTrainingWoodmen
        LevelsToGain                        = 1
        LevelCap                            = 2
    End
    
    Behavior                            = ObjectCreationUpgrade ModuleTag_GrantBC
        TriggeredBy                         = Upgrade_ObjectLevel2
        GrantUpgrade                        = Upgrade_MirkwoodBasicTrainingWoodmen
    End



    ;//////////////////////////////
    ;// SYSTÈMES D'AMÉLIORATIONS //
    ;//////////////////////////////
    
	Behavior                            = ObjectCreationUpgrade ModuleTag_RemoveUpgrades3
		TriggeredBy                         = Upgrade_TechnologyWoodmensArmaments_Deactivated 
		ConflictsWith                       = Upgrade_ObjectUnderAIControl
		RemoveUpgrade                       = Upgrade_TechnologyWoodmensArmaments_Activated
	End

	Behavior                            = ObjectCreationUpgrade ModuleTag_RemoveUpgrades4
		TriggeredBy                         = Upgrade_TechnologyWoodmensArmaments_Activated
		ConflictsWith                       = Upgrade_ObjectUnderAIControl
		RemoveUpgrade                       = Upgrade_TechnologyWoodmensArmaments_Deactivated
	End
    
    
    
    ;//////////////////
    ;// INVISIBILITÉ //
    ;//////////////////
    
    Behavior                            = InvisibilityUpdate ModuleTag_ElvenCamouflage
        InvisibilityNugget
            InvisibilityType                    = CAMOUFLAGE
            DetectionRange                      = CAMOUFLAGE_RADIUS
            ForbiddenConditions                 = FIRING_ANY AWAY_FROM_TREES
        End
        UpdatePeriod                        = 2000
        StartsActive                        = Yes
        UnitSpecificSoundNameToUseAsVoiceMoveToStealthyArea = VoiceMoveToTrees
        UnitSpecificSoundNameToUseAsVoiceEnterStateMoveToStealthyArea = VoiceEnterStateMoveToTrees
    End
    
    
    
    ;////////////////////////////////////
    ;// COMPÉTENCE : COMPAGNONS LOYAUX //
    ;////////////////////////////////////
    
    Behavior                            = ObjectCreationUpgrade ModuleTag_Hound1
        TriggeredBy                         = Upgrade_LoyalCompanions
        RequiresAllTriggers                 = Yes
        Delay                               = 0.0
        ThingToSpawn                        = MirkwoodHuntingHound
        Offset                              = X:0.0 Y:0.0 Z:0.0
        FadeInTime                          = 600
    End
    
    Behavior                            = ObjectCreationUpgrade ModuleTag_Hound2
        TriggeredBy                         = Upgrade_LoyalCompanions
        RequiresAllTriggers                 = Yes
        Delay                               = 0.0
        ThingToSpawn                        = MirkwoodHuntingHound
        Offset                              = X:0.0 Y:0.0 Z:0.0
        FadeInTime                          = 600
    End
    
    Behavior                            = ObjectCreationUpgrade ModuleTag_Hound3
        TriggeredBy                         = Upgrade_LoyalCompanions
        RequiresAllTriggers                 = Yes
        Delay                               = 0.0
        ThingToSpawn                        = MirkwoodHuntingHound
        Offset                              = X:0.0 Y:0.0 Z:0.0
        FadeInTime                          = 600
    End
    
    Behavior                            = ObjectCreationUpgrade ModuleTag_Hound4
        TriggeredBy                         = Upgrade_LoyalCompanions
        RequiresAllTriggers                 = Yes
        Delay                               = 0.0
        ThingToSpawn                        = MirkwoodHuntingHound
        Offset                              = X:0.0 Y:0.0 Z:0.0
        FadeInTime                          = 600
    End
    
    Behavior                            = ObjectCreationUpgrade ModuleTag_Hound5
        TriggeredBy                         = Upgrade_LoyalCompanions
        RequiresAllTriggers                 = Yes
        Delay                               = 0.0
        ThingToSpawn                        = MirkwoodHuntingHound
        Offset                              = X:0.0 Y:0.0 Z:0.0
        FadeInTime                          = 600
    End
    
    
    
    ;/////////////////////////////////
    ;// COMPÉTENCE : MARQUE DE BÉMA //
    ;/////////////////////////////////
    
    Behavior                            = UnpauseSpecialPowerUpgrade ModuleTag_SkilledHuntersEnabler
        SpecialPowerTemplate                = SpecialAbilityGreyCompanyHunt
        TriggeredBy                         = Upgrade_ObjectLevel2
    End
    
    Behavior                            = SpecialPowerModule ModuleTag_SkilledHuntersStarter
        SpecialPowerTemplate                = SpecialAbilityGreyCompanyHunt
        StartsPaused                        = Yes
        UpdateModuleStartsAttack            = Yes
        InitiateSound                       = WoodmenVoiceMarkofBema
    End
    
    Behavior                            = WeaponFireSpecialAbilityUpdate ModuleTag_GondorSpamLeggo
        SpecialPowerTemplate                = SpecialAbilityGreyCompanyHunt
        TriggerSound                        = WoodmenVoiceMarkofBema
        StartAbilityRange                   = 600
        SpecialWeapon                       = WoodmenBemaWeapon
    End
    
    Behavior                            = AutoAbilityBehavior ModuleTag_SkilledHuntersAutoAbility
        SpecialAbility                      = SpecialAbilityGreyCompanyHunt
        ForbiddenStatus                     = INSIDE_GARRISON
        MaxScanRange                        = 200
        Query                               = 1 ALL ENEMIES -STRUCTURE -WALL_UPGRADE -WALL_HUB -WALL_SEGMENT -DEFENSIVE_WALL
    End
    
    
    
    ;///////////////////
    ;// AMÉLIORATIONS //
    ;///////////////////
    
    Behavior                            = StatusBitsUpgrade ModuleTag_ProductionLegality
        TriggeredBy                         = Upgrade_MirkwoodWoodmenArrows
    End
    
    Behavior                            = StatusBitsUpgrade ModuleTag_ProductionLegality2
        TriggeredBy                         = Upgrade_MirkwoodWoodmenForgedBlades
    End
    
    
    
    ;////////////////////
    ;// COMPÉTENCES IA //
    ;////////////////////
    
    Behavior                            = AISpecialPowerUpdate GondorArcherHordeCaptureBuildingAI
        CommandButtonName                   = Command_CaptureBuilding
        SpecialPowerAIType                  = AI_SPECIAL_POWER_CAPTURE_BUILDING
    End
    
    Behavior                            = AISpecialPowerUpdate GondorFighterHordeStanceBattle
        CommandButtonName                   = Command_SetStanceBattle
        SpecialPowerAIType                  = AI_SPECIAL_POWER_STANCEBATTLE
    End
    
    Behavior                            = AISpecialPowerUpdate GondorFighterHordeStanceAggressive
        CommandButtonName                   = Command_SetStanceAggressive
        SpecialPowerAIType                  = AI_SPECIAL_POWER_STANCEAGGRESSIVE
    End
    
    Behavior                            = AISpecialPowerUpdate GondorFighterHordeHoldGround
        CommandButtonName                   = Command_SetStanceHoldGround
        SpecialPowerAIType                  = AI_SPECIAL_POWER_STANCEHOLDGROUND
    End
    
    Behavior                            = AISpecialPowerUpdate MarkOfBema
        CommandButtonName                   = Command_MarkofBema
        SpecialPowerAIType                  = AI_SPECIAL_POWER_CHARGE
    End
    
    Behavior                            = AISpecialPowerUpdate BowAndAxeToggle
        CommandButtonName                   = Command_ToggleWoodmenWeapon
        SpecialPowerAIType                  = AI_SPECIAL_POWER_TOGGLE_MELEE_AND_RANGE
        SpecialPowerRadius                  = 20.0
    End
    
    
    
    ;//////////////////////////
    ;// AUTO-RÉSOLUTION WOTR //
    ;//////////////////////////

    WorldMapArmoryUpgradesAllowed       = Upgrade_MirkwoodBasicTrainingWoodmen Upgrade_MirkwoodWoodmenArrows Upgrade_MirkwoodWoodmenForgedBlades



    ;/////////////////////////////
    ;// PARAMÈTRES DE GÉOMÉTRIE //
    ;/////////////////////////////

    Geometry                            = BOX
    GeometryMajorRadius                 = 20.0
    GeometryMinorRadius                 = 60.0
    GeometryHeight                      = 10.0
    GeometryIsSmall                     = No
End



ChildObject WoodmenMarksmenHorde_Axes WoodmenMarksmenHorde
    EquivalentTo                        = WoodmenMarksmenHorde
    Side                                = Obsolete
    EditorSorting                       = SYSTEM
    
    RemoveModule BowAndAxeToggle
    
    Behavior                            = ObjectCreationUpgrade ModuleTag_SummonSpearsAIDelayer
        TriggeredBy                         = Upgrade_ChooseSubFactionMirkwood
        GrantUpgrade                        = Upgrade_SwitchToRockThrowing
        Delay                               = 6000
    End
    
    Behavior                            = DoCommandUpgrade ModuleTag_AxesSwap
        TriggeredBy                         = Upgrade_SwitchToRockThrowing
        GetUpgradeCommandButtonName         = Command_ToggleWoodmenWeapon
    End
End
