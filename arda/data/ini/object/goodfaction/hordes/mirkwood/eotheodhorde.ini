Object MirkwoodEotheodHorde
    SelectPortrait                      = UPGreenwoodEotheod
    ButtonImage                         = uieotheod
    
    ;////////////////////////////
    ;// PARAMÈTRES ARTISTIQUES //
    ;////////////////////////////
    
    Draw                                = W3DScriptedModelDraw ModuleTag_W3DModelDraw
        DependencySharedModelFlags          = EMOTION_ALERT EMOTION_MORALE_HIGH EMOTION_MORALE_LOW EMOTION_AFRAID EMOTION_COWER SELECTED EMOTION_TERROR EMOTION_CELEBRATING
        
        DefaultModelConditionState
            Model                               = None
        End
        
        ModelConditionState                 = HORDE_EMPTY
            Model                               = None
        End
        
        ModelConditionState                 = WORLD_BUILDER
            Model                               = HordeMarkRURoh
        End
    End
    
    
    
    ;/////////////////////////
    ;// PARAMÈTRES GÉNÉRAUX //
    ;/////////////////////////
    
    DisplayName                         = OBJECT:HordeEotheod
    DisplayNameStrategic                = CONTROLBAR:LW_Unit_MirkwoodEotheodHorde
    DescriptionStrategic                = CONTROLBAR:LW_ToolTip_MirkwoodEotheodHorde
    MaxSimultaneousOfType               = GENERIC_ELITE_MAX_SIMULTANEOUS

    BuildCost                           = RDA_MIRKWOOD_EOTHEOD_BUILDCOST
    BuildTime                           = ELITE_UNIT_BUILDTIME
    VisionRange                         = GENERIC_ELITE_VISION                          ;// Distance pour voir les ennemis
    ShroudClearingRange                 = GENERIC_ELITE_SHROUD_CLEAR                    ;// Rayon qui dévoile le brouillard
    VisionSide                          = GENERIC_STANDARD_VISIONSIDE                   ;// Vision sur le côté
    VisionRear                          = GENERIC_STANDARD_VISIONREAR                   ;// Vision derrière
    ;MaxVisionBonusPercent              = GENERIC_UNIT_MAXVISION%                       ;// Empêche la vision de devenir infinie
    ;VisionBonusTestRadius              = GENERIC_UNIT_VISIONBONUS                      ;// Vision bonus sur les collines
    VisionBonusPercentPerFoot           = GENERIC_STANDARD_VISIONBONUSPERCENTPERFOOT    ;// Bonus de vision par unité en hauteur

    Side                                = Obsolete
    EditorSorting                       = SYSTEM
    ThreatLevel                         = 300
    EmotionRange                        = 240

    CrushableLevel                      = 3               ;// Est écrasé   - 0 : Infanterie / 1 : Arbres / 2 : Cavalerie / Lourd
    CrusherLevel                        = 1               ;// Peut écraser - 0 : Animaux / 1 : Infanterie / 2 : Arbres / 3 : Lourd
	;UseCrushAttack			            = No				            ;// N'attaque pas en écrasant, écrase juste en marchant
    CrushWeapon                         = RohirrimCrush                 ;// Arme utilisé pour le piétinement
    ;CrushOnlyWhileCharging             = Yes                           ;// Le piétinement ne marche que pendant une charge
    MinCrushVelocityPercent             = GENERIC_ELITE_MIN_CRUSH_UNIT  ;// Vitesse minimale pour écraser
    CrushDecelerationPercent            = GENERIC_ELITE_CRUSH_DECELERATION_UNIT     ;// Perte de vitesse quand elle piétine
    CrushKnockback                      = GENERIC_STANDARD_CRUSHKNOCKBACK   ;// Valeur haute, plus les unités sont projetées loin
    CrushZFactor                        = 1                             ;// 0 = vol au sol / 1 = projection / >1 = spectaculaire
    ;CrushRevengeWeapon                  = RangedInfantryCrushRevenge    ;// Dégâts qu'inflige l'unité lorsqu'elle se fait écrasée
    ;RamPower                           = 20                            ;// Puissance de collision des monstres sur les structures
    ;RamZMult                           = 0.5                           ;// Soulèvement lors du choc, valeur haute soulève
    TransportSlotCount                  = TRANSPORTSLOTCOUNT_SMALL_HORDE
    
    FormationWidth                      = 2
    FormationDepth                      = 1
    
    CommandPoints                       = GENERIC_ELITE_10_HORDE
    CommandSet                          = MirkwoodEotheodHordeCommandSet
    
    
    
    
    ;/////////////////////
    ;// ARMES & ARMURES //
    ;/////////////////////
    
    WeaponSet
        Conditions                          = None
        Weapon                              = PRIMARY NormalMeleeHordeRangefinder
    End
    
    
    
    ;/////////////////////////////
    ;// PARAMÈTRES D'INGÉNIERIE //
    ;/////////////////////////////
    
    KindOf                              = SELECTABLE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT CAVALRY HORDE MELEE_HORDE ARMY_SUMMARY LARGE_RECTANGLE_PATHFIND
    
    ThreatBreakdown RohanRohirrimHorde_DetailedThreat
        AIKindOf                            = CAVALRY
    End
    
    Behavior                            = PhysicsBehavior ModuleTag_PhysicsBehavior
        GravityMult                         = 1.0
    End
    
    Behavior                            = HordeNotifyTargetsOfImminentProbableCrushingUpdate ModuleTag_NotifyCrushScan
        ScanWidth                           = 70.0
    End
    
    
    
    ;/////////////////////////
    ;// PARAMÈTRES DE SANTÉ //
    ;/////////////////////////
    
    Body                                = ImmortalBody ModuleTag_ImmortalBody
        MaxHealth                           = 1
    End
    
    
    
    ;/////////////
    ;// STANCES //
    ;/////////////
    
    Behavior                            = StancesBehavior ModuleTag_StancesBehavior
        StanceTemplate                      = CavalryHorde
    End
    
    
    
    ;//////////////////////////
    ;// CAPTURER UN BÂTIMENT //
    ;//////////////////////////
    
    #include "..\..\..\includes\CaptureBuilding.inc"
    
    
    
    ;///////////////////////////////
    ;// INTELLIGENCE ARTIFICIELLE //
    ;///////////////////////////////
    
    Behavior                            = HordeAIUpdate ModuleTag_HordeAIUpdate
        AutoAcquireEnemiesWhenIdle          = Yes
        MoodAttackCheckRate                 = 500
        MaxCowerTime                        = 5000
        MinCowerTime                        = 3000
        AILuaEventsList                     = EotheodFunctions RohanCavalryFunctions
        AttackPriority                      = AttackPriority_CAVALRY
    End
    
    
    
    ;///////////////
    ;// LOCOMOTOR //
    ;///////////////
    
    LocomotorSet
        Locomotor                           = NormalCavalryHordeLocomotor
        Condition                           = SET_NORMAL
        Speed                               = NORMAL_MOUNTED_MED_HORDE_SPEED
    End
    
    
    
    ;///////////////
    ;// BATAILLON //
    ;///////////////
    
    Behavior                            = HorseHordeContain ModuleTag_HordeContain
        FrontAngle                          = 270
        FlankedDelay                        = 500
        ObjectStatusOfContained             = 
        InitialPayload                      = MirkwoodEotheod 10
        Slots                               = 10
        PassengerFilter                     = NONE +CAVALRY
        ShowPips                            = No
        ThisFormationIsTheMainFormation     = Yes
        AlternateFormation                  = MirkwoodEotheodHordeWedgeFormation
        RandomOffset                        = X:0 Y:0
        MeleeBehavior                       = Amoeba
        End
        
        BannerCarriersAllowed               = MirkwoodEotheodCaptain
        BannerCarrierPosition               = UnitType:MirkwoodEotheod Pos:X:75.0 Y:0.0
        
        RankInfo                            = RankNumber:1 UnitType:MirkwoodEotheod Position:X:45 Y:0 Position:X:45 Y:20 Position:X:45 Y:-20 Position:X:45 Y:40 Position:X:45 Y:-40
        RankInfo                            = RankNumber:2 UnitType:MirkwoodEotheod Position:X:10 Y:0 Leader 1 0 Position:X:10 Y:20 Leader 1 1 Position:X:10 Y:-20 Leader 1 2 Position:X:10 Y:40 Leader 1 3 Position:X:10 Y:-40 Leader 1 4
        
        RanksToReleaseWhenAttacking         = 1 2
        
        MeleeAttackLeashDistance            = 25
        BackUpMinDelayTime                  = 1
        BackUpMaxDelayTime                  = 3000
        BackUpMinDistance                   = 1
        BackUpMaxDistance                   = 3
        BackupPercentage                    = 80%
    End
    
    
    
    ;//////////////
    ;// ÉMOTIONS //
    ;//////////////
    
    Behavior                            = EmotionTrackerUpdate Module_EmotionTracker
        TauntAndPointDistance               = INFANTRY_TAUNT_POINT_RADIUS
        TauntAndPointUpdateDelay            = 1000
        TauntAndPointExcluded               = NONE
        AfraidOf                            = RDA_EMOTION_AFRAIDOF_OBJECTFILTER
        AlwaysAfraidOf                      = EMOTION_ALWAYS_AFRAIDOF_OBJECTFILTER
        PointAt                             = EMOTION_POINTAT_OBJECTFILTER
        HeroScanDistance                    = 150
        FearScanDistance                    = CAVALRY_FEAR_SCAN_RADIUS
        AddEmotion                          = Terror_Base
        AddEmotion                          = Doom_Base
        AddEmotion                          = BraceForBeingCrushed_Base
        AddEmotion                          = UncontrollableFear_Base
        AddEmotion                          = FearIdle_Base
        AddEmotion                          = FearBusy_Base
        AddEmotion                          = Point_Base
        AddEmotion                          = Taunt_Base
        AddEmotion                          = CheerIdle_Base
        AddEmotion                          = CheerBusy_Base
        AddEmotion                          = HeroCheerIdle_Base
        AddEmotion                          = HeroCheerBusy_Base
        AddEmotion                          = Alert_Base
        AddEmotion                          = CheerForAboutToCrush_Base
    End
    
    
    
    ;////////////////
    ;// PRODUCTION //
    ;////////////////
    
    Behavior                            = ProductionUpdate ProductionUpdateModuleTag
        GiveNoXP                            = Yes
    End
    
    
    
    ;///////////
    ;// STUFF //
    ;///////////
    
    Behavior                            = PickupStuffUpdate ModuleTag_PickupStuffUpdate
        SkirmishAIOnly                      = Yes
        StuffToPickUp                       = NONE +CRATE
        ScanRange                           = 200
        ScanIntervalSeconds                 = 0.5
    End



    ;//////////////
    ;// NIVEAU 2 //
    ;//////////////

    Behavior                            = LevelUpUpgrade ModuleTag_BasicTraining
        TriggeredBy                         = Upgrade_MirkwoodBasicTrainingEotheod
        LevelsToGain                        = 1
        LevelCap                            = 2
    End

    Behavior                            = ObjectCreationUpgrade ModuleTag_GrantBC
        TriggeredBy                         = Upgrade_ObjectLevel2
        GrantUpgrade                        = Upgrade_MirkwoodBasicTrainingEotheod
    End



    ;//////////////////////////////
    ;// SYSTÈMES D'AMÉLIORATIONS //
    ;//////////////////////////////
    
	Behavior                            = ObjectCreationUpgrade ModuleTag_RemoveUpgrades3
		TriggeredBy                         = Upgrade_TechnologyWoodmensArmaments_Deactivated 
		ConflictsWith                       = Upgrade_ObjectUnderAIControl
		RemoveUpgrade                       = Upgrade_TechnologyWoodmensArmaments_Activated
	End

	Behavior                            = ObjectCreationUpgrade ModuleTag_RemoveUpgrades4
		TriggeredBy                         = Upgrade_TechnologyWoodmensArmaments_Activated
		ConflictsWith                       = Upgrade_ObjectUnderAIControl
		RemoveUpgrade                       = Upgrade_TechnologyWoodmensArmaments_Deactivated
	End
    
    
    
    ;////////////////////////////////////
    ;// COMPÉTENCE : MAÎTRISE ÉQUESTRE //
    ;////////////////////////////////////
    
    Behavior                            = UnpauseSpecialPowerUpgrade ModuleTag_EscapeEnabler
        SpecialPowerTemplate                = SpecialAbilityEotheodHorseMastery
        TriggeredBy                         = Upgrade_ObjectLevel2
    End
    
    Behavior                            = WeaponModeSpecialPowerUpdate ModuleTag_EscapePowerUpdate
        SpecialPowerTemplate                = SpecialAbilityEotheodHorseMastery
        Duration                            = 30000
        AttributeModifier                   = MirkwoodEotheodHorseMastery
        StartsPaused                        = Yes
    End
    
    Behavior                            = AutoAbilityBehavior ModuleTag_EscapeAutoAbility
        SpecialAbility                      = SpecialAbilityEotheodHorseMastery
        ForbiddenStatus                     = INSIDE_GARRISON
        MaxScanRange                        = 100
        Query                               = 1 ALL ENEMIES -WALL_UPGRADE -WALL_HUB -WALL_SEGMENT -DEFENSIVE_WALL -FS_BASE_DEFENSE
    End
    
    
    
    ;///////////////////
    ;// AMÉLIORATIONS //
    ;///////////////////
    
    Behavior                            = StatusBitsUpgrade ModuleTag_ProductionLegality
        TriggeredBy                         = Upgrade_MirkwoodWoodmenForgedSpears
    End
    
    Behavior                            = StatusBitsUpgrade ModuleTag_ProductionLegality2
        TriggeredBy                         = Upgrade_EotheodHorseShield
    End
    
    
    
    ;////////////////////
    ;// COMPÉTENCES IA //
    ;////////////////////
    
    Behavior                            = AISpecialPowerUpdate MenRohirrimHordeCaptureBuildingAI
        CommandButtonName                   = Command_CaptureBuilding
        SpecialPowerAIType                  = AI_SPECIAL_POWER_CAPTURE_BUILDING
    End
    
    Behavior                            = AISpecialPowerUpdate GondorFighterHordeStanceBattle
        CommandButtonName                   = Command_SetStanceBattle
        SpecialPowerAIType                  = AI_SPECIAL_POWER_STANCEBATTLE
    End
    
    Behavior                            = AISpecialPowerUpdate GondorFighterHordeStanceAggressive
        CommandButtonName                   = Command_SetStanceAggressive
        SpecialPowerAIType                  = AI_SPECIAL_POWER_STANCEAGGRESSIVE
    End
    
    Behavior                            = AISpecialPowerUpdate GondorFighterHordeHoldGround
        CommandButtonName                   = Command_SetStanceHoldGround
        SpecialPowerAIType                  = AI_SPECIAL_POWER_STANCEHOLDGROUND
    End
    
    
    
    ;//////////////////////////
    ;// AUTO-RÉSOLUTION WOTR //
    ;//////////////////////////

    WorldMapArmoryUpgradesAllowed       = Upgrade_MirkwoodBasicTrainingEotheod Upgrade_MirkwoodWoodmenForgedSpears Upgrade_EotheodHorseShield



    ;/////////////////////////////
    ;// PARAMÈTRES DE GÉOMÉTRIE //
    ;/////////////////////////////

    Geometry                            = BOX
    GeometryMajorRadius                 = 30.0
    GeometryMinorRadius                 = 40.0
    GeometryHeight                      = 20.0
    GeometryIsSmall                     = No
End





ChildObject MirkwoodEotheodHordeWedgeFormation MirkwoodEotheodHorde
    CrushWeapon                         = RohirrimCrushFormation
    
    ;///////////////
    ;// BATAILLON //
    ;///////////////
    
    Behavior                            = HorseHordeContain ModuleTag_HordeContain
        AttributeModifiers                  = FormationFerDeLance
        ObjectStatusOfContained             = 
        InitialPayload                      = MirkwoodEotheod 10
        Slots                               = 10
        PassengerFilter                     = NONE +CAVALRY +MirkwoodEotheodCaptain
        ShowPips                            = No
        ThisFormationIsTheMainFormation     = No
        RandomOffset                        = X:0 Y:0
        
        BannerCarriersAllowed               = MirkwoodEotheodCaptain
        BannerCarrierPosition               = UnitType:MirkwoodEotheod Pos:X:0.0 Y:0.0
        
        RankInfo                            = RankNumber:1 UnitType:MirkwoodEotheod Position:X:-30 Y:25 Position:X:-30 Y:0 Position:X:-30 Y:-25 Position:X:-60 Y:45 Position:X:-60 Y:-45
        RankInfo                            = RankNumber:2 UnitType:MirkwoodEotheod Position:X:-60 Y:0 Position:X:-60 Y:25 Position:X:-60 Y:-25 Position:X:-90 Y:45 Position:X:-90 Y:-45
        
        RanksToReleaseWhenAttacking         = 1 2
        AlternateFormation                  = MirkwoodEotheodHorde
    End
End





