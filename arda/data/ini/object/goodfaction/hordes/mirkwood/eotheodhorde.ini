	End
	
	AutoResolveWeapon
		Weapon									= AutoResolve_RohanRohirrimForgedBlades
	End
	
	WorldMapArmoryUpgradesAllowed			= Upgrade_MirkwoodBasicTrainingWoodmen Upgrade_MirkwoodWoodmenForgedSpears Upgrade_EotheodHorseShield
	
	
	
	;/////////////////////////////
	;// PARAMÈTRES DE GÉOMÉTRIE //
	;/////////////////////////////

	Geometry								= BOX
	GeometryMajorRadius						= 30.0
	GeometryMinorRadius						= 40.0
	GeometryHeight							= 20.0
	GeometryIsSmall							= No
End





