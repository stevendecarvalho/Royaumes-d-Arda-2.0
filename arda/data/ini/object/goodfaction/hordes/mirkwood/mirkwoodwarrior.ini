Object MirkwoodWarriorHorde
	SelectPortrait							= UPGreenwoodWarriors
    ButtonImage								= UIGreenwoodWarrior
	
	;////////////////////////////
	;// PARAMÈTRES ARTISTIQUES //
	;////////////////////////////

    Draw									= W3DScriptedModelDraw ModuleTag_W3DModelDraw
        DependencySharedModelFlags				= EMOTION_ALERT EMOTION_MORALE_HIGH EMOTION_MORALE_LOW EMOTION_AFRAID EMOTION_COWER SELECTED EMOTION_TERROR
		
        DefaultModelConditionState
            Model									= None
        End
		
        ModelConditionState						= HORDE_EMPTY
            Model									= None
        End
		
        ModelConditionState						= WORLD_BUILDER
            Model									= HordeTemp_5By2
        End
    End
	
	
	
	;/////////////////////////
	;// PARAMÈTRES GÉNÉRAUX //
	;/////////////////////////

	DisplayName								= OBJECT:HordeMirkwoodWarrior
	DisplayNameStrategic					= CONTROLBAR:LW_Unit_MirkwoodWarriorHorde
	DescriptionStrategic					= CONTROLBAR:LW_ToolTip_MirkwoodWarriorHorde
	
	BuildCost								= RDA_MIRKWOOD_LASGALEN_WARRIORS_BUILDCOST
	BuildTime								= ELITE_UNIT_BUILDTIME
 	VisionRange								= GENERIC_STANDARD_VISION
	ShroudClearingRange						= GENERIC_STANDARD_SHROUD_CLEAR
	VisionSide								= GENERIC_STANDARD_VISIONSIDE
	VisionRear								= GENERIC_STANDARD_VISIONREAR
	VisionBonusPercentPerFoot				= GENERIC_STANDARD_VISIONBONUSPERCENTPERFOOT
	BountyValue								= RDA_MIRKWOOD_LASGALEN_WARRIORS_BOUNTY_VALUE
	
	Side									= Mirkwood
	EditorSorting							= UNIT
	ThreatLevel								= 300
	EmotionRange							= 240
	
	CrushableLevel							= 0
	CrusherLevel							= 0
	TransportSlotCount						= TRANSPORTSLOTCOUNT_SMALL_HORDE

	FormationWidth							= 2
	FormationDepth							= 1

	CommandPoints							= GENERIC_ELITE_10_HORDE
	CommandSet								= MirkwoodWarriorHordeSwordCommandSet
	
	
	
	;/////////////////////
	;// ARMES & ARMURES //
	;/////////////////////

	WeaponSet
		Conditions								= None
		Weapon									= PRIMARY NormalMeleeHordeRangefinder
	End
	
	WeaponSet
		Conditions								= CONTAINED
		Weapon									= PRIMARY GarrisonedUnitBowHordeRangefinder
	End
	
	
	
	;/////////////////////////////
	;// PARAMÈTRES D'INGÉNIERIE //
	;/////////////////////////////

	KindOf									= SELECTABLE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT INFANTRY HORDE ARMY_SUMMARY MELEE_HORDE LARGE_RECTANGLE_PATHFIND

	ThreatBreakdown ElvenLorienWarriorHorde_DetailedThreat
		AIKindOf								= INFANTRY
	End

	Behavior								= PhysicsBehavior ModuleTag_PhysicsBehavior
		GravityMult								= 1.0
	End
	
	
	
	;/////////////////////////
	;// PARAMÈTRES DE SANTÉ //
	;/////////////////////////
	
	Body									= ImmortalBody ModuleTag_ImmortalBody
		MaxHealth								= 1
	End
	
	
	
	;/////////////
	;// STANCES //
	;/////////////
	
	Behavior								= StancesBehavior ModuleTag_StancesBehavior
        StanceTemplate							= FighterHorde
    End
	
	
	
	;//////////////////////////
	;// CAPTURER UN BÂTIMENT //
	;//////////////////////////
	
	#include "..\..\..\includes\CaptureBuilding.inc"
	
	
	
	;///////////////////////////////
	;// INTELLIGENCE ARTIFICIELLE //
	;///////////////////////////////

	Behavior								= HordeAIUpdate ModuleTag_HordeAIUpdate
		AutoAcquireEnemiesWhenIdle				= Yes
		MoodAttackCheckRate						= 500
		MaxCowerTime							= 5000
		MinCowerTime							= 3000
		CanAttackWhileContained					= Yes
        AILuaEventsList							= RivendellInfantryFunctions
        AttackPriority							= AttackPriority_INFANTRY
	End
	
	
	
	;///////////////
	;// BATAILLON //
	;///////////////

    Behavior								= HordeContain ModuleTag_HordeContain
        FrontAngle								= 270
        FlankedDelay							= 500
        ObjectStatusOfContained					=
        InitialPayload							= MirkwoodWarrior 10
        Slots									= 10
        PassengerFilter							= NONE +INFANTRY
        ShowPips								= No
        ThisFormationIsTheMainFormation			= Yes
        RandomOffset							= X:0 Y:0
        MeleeBehavior							= Amoeba
        End
		
        BannerCarriersAllowed					= GreenwoodBanner
        BannerCarrierPosition					= UnitType:MirkwoodWarrior    Pos:X:70.0 Y:0.0

		RankInfo								= RankNumber:1 UnitType:MirkwoodWarrior		Position:X:50 Y:0				Position:X:50 Y:20				Position:X:50 Y:-20				Position:X:50 Y:40				Position:X:50 Y:-40
		RankInfo								= RankNumber:2 UnitType:MirkwoodWarrior		Position:X:30 Y:0 Leader 1 0	Position:X:30 Y:20 Leader 1 1	Position:X:30 Y:-20 Leader 1 2	Position:X:30 Y:40 Leader 1 3	Position:X:30 Y:-40 Leader 1 4

        RanksToReleaseWhenAttacking				= 1 2

 		AlternateFormation						= MirkwoodWarriorHordeBlock
		MeleeAttackLeashDistance				= 50
		BackUpMinDelayTime						= 1
		BackUpMaxDelayTime						= 3000
		BackUpMinDistance						= 1
		BackUpMaxDistance						= 3
		BackupPercentage						= 80%
	End
	
	
	
	;///////////////
	;// AUTO-HEAL //
	;///////////////
	
	Behavior								= AutoHealBehavior ModuleTag_ElvenAutoHealing
		HealOnlyIfNotInCombat					= Yes
		HealOnlyIfNotUnderAttack				= Yes
		StartsActive							= No
		TriggeredBy								= Upgrade_ObjectLevel2 Upgrade_TechnologyMirkwoodHeal
		HealingAmount							= 6
		HealingDelay							= 2000
		StartHealingDelay						= 15000
		KindOf									= INFANTRY CAVALRY
		UnitHealPulseFX							= FX_SpellHealUnitHealBuff
		AffectsContained						= Yes
		NonStackable							= Yes
	End

	Behavior								= CommandSetUpgrade ModueTag_ElvenHealCommandSet
		TriggeredBy								= Upgrade_ObjectLevel2
		CommandSet								= MirkwoodWarriorHordeSwordCommandSet_Lvl2
	End
	
	
	
	;///////////////
	;// LOCOMOTOR //
	;///////////////

	LocomotorSet
		Locomotor								= NormalMeleeHordeLocomotor
		Condition								= SET_NORMAL
		Speed									= NORMAL_FOOT_MED_HORDE_SPEED
	End
	
	
	
	;//////////////
	;// ÉMOTIONS //
	;//////////////

 	Behavior								= EmotionTrackerUpdate	Module_EmotionTracker
		TauntAndPointDistance					= INFANTRY_TAUNT_POINT_RADIUS
		TauntAndPointUpdateDelay				= 1000
		TauntAndPointExcluded					= NONE
		AfraidOf								= AOTR_EMOTION_AFRAIDOF_OBJECTFILTER
		AlwaysAfraidOf							= EMOTION_ALWAYS_AFRAIDOF_OBJECTFILTER
 		PointAt									= EMOTION_POINTAT_OBJECTFILTER
		HeroScanDistance						= 150
		FearScanDistance						= ARCHER_FEAR_SCAN_RADIUS
		AddEmotion								= Terror_Base
		AddEmotion								= Doom_Base
		AddEmotion								= BraceForBeingCrushed_Base
		AddEmotion								= UncontrollableFear_Base
		AddEmotion								= FearIdle_Base
		AddEmotion								= FearBusy_Base
		AddEmotion								= Point_Base
		AddEmotion								= Taunt_Base
		AddEmotion								= CheerIdle_Base
		AddEmotion								= CheerBusy_Base
		AddEmotion								= HeroCheerIdle_Base
		AddEmotion								= HeroCheerBusy_Base
		AddEmotion								= Alert_Base
	End
	
	
	
	;////////////////
	;// PRODUCTION //
	;////////////////
	
	Behavior								= ProductionUpdate ProductionUpdateModuleTag
		GiveNoXP								= Yes
	End
	
	
	
	;///////////
	;// STUFF //
	;///////////
	
	Behavior								= PickupStuffUpdate ModuleTag_PickupStuffUpdate
		SkirmishAIOnly							= Yes
		StuffToPickUp							= NONE +CRATE
		ScanRange								= 200
		ScanIntervalSeconds						= 0.5
	End
	
	
	
	;//////////////
	;// NIVEAU 2 //
	;//////////////
	
    Behavior								= LevelUpUpgrade ModuleTag_BasicTraining
        TriggeredBy								= Upgrade_MirkwoodBasicTraining
        LevelsToGain							= 1
        LevelCap								= 2
    End
	
	
	
	;///////////////////
	;// AMÉLIORATIONS //
	;///////////////////

	Behavior								= StatusBitsUpgrade ModuleTag_ProductionLegality
		TriggeredBy								= Upgrade_SindarinHeavyArmor
	End

	Behavior								= StatusBitsUpgrade ModuleTag_ProductionLegality2
		TriggeredBy								= Upgrade_MirkwoodForgedBlades
	End
	
	
	
	;////////////////////
	;// COMPÉTENCES IA //
	;////////////////////

	Behavior								= AISpecialPowerUpdate ElvenLorienWarriorHordeCaptureBuildingAI
		CommandButtonName						= Command_CaptureBuilding
		SpecialPowerAIType						= AI_SPECIAL_POWER_CAPTURE_BUILDING
	End

	Behavior								= AISpecialPowerUpdate GondorFighterHordeStanceBattle
		CommandButtonName						= Command_SetStanceBattle
		SpecialPowerAIType						= AI_SPECIAL_POWER_STANCEBATTLE
	End

	Behavior								= AISpecialPowerUpdate GondorFighterHordeStanceAggressive
		CommandButtonName						= Command_SetStanceAggressive
		SpecialPowerAIType						= AI_SPECIAL_POWER_STANCEAGGRESSIVE
	End

	Behavior								= AISpecialPowerUpdate GondorFighterHordeHoldGround
		CommandButtonName						= Command_SetStanceHoldGround
		SpecialPowerAIType						= AI_SPECIAL_POWER_STANCEHOLDGROUND
	End
	
	
	
	;//////////////////////////
	;// AUTO-RÉSOLUTION WOTR //
	;//////////////////////////

	AutoResolveUnitType						= AutoResolveUnit_Soldier
	AutoResolveCombatChain					= AutoResolve_SoldierCombatChain
	AutoResolveBody							= Aotr_AutoResolve_SoldierEliteMediumHordeBody
	
	AutoResolveArmor
		RequiredUpgrades						= Upgrade_SindarinHeavyArmor
		Armor									= Aotr_AutoResolve_EliteSoldierHeavyArmor
	End
	
	AutoResolveArmor
		ExcludedUpgrades						= Upgrade_SindarinHeavyArmor
		Armor									= Aotr_AutoResolve_EliteSoldierArmor
	End
	
	AutoResolveWeapon
		RequiredUpgrades						= Upgrade_MirkwoodForgedBlades
		Weapon									= AutoResolve_EliteInfantryStrongUpgradedWeapon
	End
	
	AutoResolveWeapon
		ExcludedUpgrades						= Upgrade_MirkwoodForgedBlades
		Weapon									= AutoResolve_EliteInfantryStrongWeapon
	End
	
	WorldMapArmoryUpgradesAllowed			= Upgrade_MirkwoodBasicTraining Upgrade_MirkwoodForgedBlades Upgrade_SindarinHeavyArmor
	
	
	
	;/////////////////////////////
	;// PARAMÈTRES DE GÉOMÉTRIE //
	;/////////////////////////////

	Geometry								= BOX
	GeometryMajorRadius						= 20.0
	GeometryMinorRadius						= 40.0
	GeometryHeight							= 20.0
	GeometryIsSmall							= No
End





