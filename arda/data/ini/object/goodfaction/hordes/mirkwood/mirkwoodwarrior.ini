ChildObject MirkwoodWarriorHorde_BotFA MirkwoodWarriorHorde
	EquivalentTo							= MirkwoodWarriorHorde
	EditorSorting							= SYSTEM
	CommandSet								= MirkwoodWarriorHordeSwordCommandSet_BotFA
	
	
	
	;/////////////
	;// NIVEAUX //
	;/////////////
	
	RemoveModule ModuleTag_BasicTraining

    Behavior								= LevelUpUpgrade ModuleTag_BasicTraining
        TriggeredBy								= Upgrade_DwarvenBasicTraining
        LevelsToGain							= 1
        LevelCap								= 2
    End
End
