		RankInfo								= RankNumber:2 UnitType:MirkwoodWarrior	Position:X:22 Y:0 Leader 1 0		Position:X:22 Y:10 Leader 1 1	Position:X:22 Y:-10 Leader 1 2	Position:X:22 Y:20 Leader 1 3	Position:X:22 Y:-20 Leader 1 4

