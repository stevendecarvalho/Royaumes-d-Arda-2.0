		DefaultModelConditionState
			Model									= None
		End
		
		ModelConditionState						= HORDE_EMPTY
			Model									= None
		End		
		
		ModelConditionState						= WORLD_BUILDER
			Model									= HordeMarkEULoW
		End
	End
	
	
	
	;/////////////////////////
	;// PARAMÈTRES GÉNÉRAUX //
	;/////////////////////////

	DisplayName								= OBJECT:GreenwoodSlayerHorde
	DisplayNameStrategic					= CONTROLBAR:LW_Unit_GreenwoodSlayerHorde
	DescriptionStrategic					= CONTROLBAR:LW_ToolTip_GreenwoodSlayerHorde
	
	BuildCost								= RDA_MIRKWOOD_LASGALEN_SLAYERS_BUILDCOST
	BuildTime								= ELITE_UNIT_BUILDTIME
 	VisionRange								= GENERIC_STANDARD_VISION
	ShroudClearingRange						= GENERIC_STANDARD_SHROUD_CLEAR
	VisionSide								= GENERIC_STANDARD_VISIONSIDE
	VisionRear								= GENERIC_STANDARD_VISIONREAR
	VisionBonusPercentPerFoot				= GENERIC_STANDARD_VISIONBONUSPERCENTPERFOOT
	BountyValue								= RDA_MIRKWOOD_LASGALEN_SLAYERS_BOUNTY_VALUE
	
	Side									= Mirkwood
	EditorSorting							= UNIT
	ThreatLevel								= 300
	EmotionRange							= 240
	
	CrushableLevel							= 0
	CrusherLevel							= 0
