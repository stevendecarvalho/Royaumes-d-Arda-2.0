	End
	
	
	
	;/////////////
	;// STANCES //
	;/////////////
	
	Behavior								= StancesBehavior ModuleTag_StancesBehavior
        StanceTemplate							= FighterHorde
    End
	
	
	
	;//////////////////////////
	;// CAPTURER UN BÂTIMENT //
	;//////////////////////////
	
	#include "..\..\..\includes\CaptureBuilding.inc"
	
	
	
	;///////////////////////////////
	;// INTELLIGENCE ARTIFICIELLE //
	;///////////////////////////////

	Behavior								= HordeAIUpdate ModuleTag_HordeAIUpdate
		AutoAcquireEnemiesWhenIdle				= Yes 
		MoodAttackCheckRate						= 500
		MaxCowerTime							= 5000
		MinCowerTime							= 3000
		CanAttackWhileContained					= Yes
        AILuaEventsList							= RivendellInfantryFunctions	
        AttackPriority							= AttackPriority_ARCHER
	End
	
	
	
	;///////////////
	;// BATAILLON //
	;///////////////
	
	Behavior								= HordeContain ModuleTag_HordeContain
		FrontAngle								= 270
		FlankedDelay							= 500
		ObjectStatusOfContained					= 
		InitialPayload							= GreenwoodSlayer 10
		Slots									= 10
		PassengerFilter							= NONE +INFANTRY
		ShowPips								= No
		ThisFormationIsTheMainFormation			= Yes
		RandomOffset							= X:0 Y:0
		MeleeBehavior							= Amoeba
		End
	
		BannerCarriersAllowed					= GreenwoodBanner
		BannerCarrierPosition					= UnitType:GreenwoodSlayer	Pos:X:70.0 Y:0.0
		
		RankInfo								= RankNumber:1 UnitType:GreenwoodSlayer Position:X:50 Y:0					Position:X:50 Y:20				Position:X:50 Y:-20				Position:X:50 Y:40				Position:X:50 Y:-40 RevokedWeaponCondition:WEAPONSET_TOGGLE_2
		RankInfo								= RankNumber:2 UnitType:GreenwoodSlayer Position:X:30 Y:0 Leader 1 0		Position:X:30 Y:20 Leader 1 1	Position:X:30 Y:-20 Leader 1 2	Position:X:30 Y:40 Leader 1 3	Position:X:30 Y:-40 Leader 1 4 RevokedWeaponCondition:WEAPONSET_TOGGLE_2
				

		RanksToReleaseWhenAttacking				= 1 2
        AlternateFormation						= GreenwoodSlayerHordeLoose
		MeleeAttackLeashDistance				= 50
		BackUpMinDelayTime						= 1
		BackUpMaxDelayTime						= 3000
		BackUpMinDistance						= 1
		BackUpMaxDistance						= 3
		BackupPercentage						= 80%
	End
	
	
	
	;///////////////
	;// AUTO-HEAL //
	;///////////////
	
	Behavior								= AutoHealBehavior ModuleTag_ElvenAutoHealing
