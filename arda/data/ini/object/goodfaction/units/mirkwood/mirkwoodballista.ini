		AnimationState							= STUNNED_FLAILING
			Animation								= StunFlail
				AnimationName							= IUSiegBall_SKL.IUSiegBall_IDLA
				AnimationMode							= LOOP
				AnimationSpeedFactorRange				= 0.4 0.6
			End
			Flags									= RANDOMSTART
		End
		
