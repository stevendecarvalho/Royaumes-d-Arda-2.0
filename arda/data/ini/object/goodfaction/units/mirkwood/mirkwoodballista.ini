			BeginScript
				Prev									= CurDrawablePrevAnimationState()
				if Prev									== "Stand" then CurDrawableSetTransitionAnimState("Trans_Stand_To_Left")
				elseif Prev								== "JUST_BUILT" then CurDrawableSetTransitionAnimState("TRANS_FROM_JUST_BUILT")
				end
			EndScript
