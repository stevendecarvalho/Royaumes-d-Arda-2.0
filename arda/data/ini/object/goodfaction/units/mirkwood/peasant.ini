				AnimationPriority						= 1
			End
			Animation								= IDLG
				AnimationName							= RUPsnt_1_IDLG
				AnimationMode							= ONCE
				AnimationPriority						= 1				
			End
			BeginScript
				Prev									= CurDrawablePrevAnimationState()
				if Prev									== "STATE_Selected" then CurDrawableSetTransitionAnimState("TRANS_SelectedToIdle") end
			EndScript		
		End
		
		;// Transitions
		TransitionState							= TRANS_SelectedToIdle	
