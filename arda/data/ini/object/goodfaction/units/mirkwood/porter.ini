;////////////////////////////////////////////////////////////////////////////////////
;////////////////////////////////////////////////////////////////////////////////////
;/////																			/////
;/////					BÂTISSEURS DU ROYAUME DES FORÊTS						/////
;/////																			/////
;////////////////////////////////////////////////////////////////////////////////////
;////////////////////////////////////////////////////////////////////////////////////

Object MirkwoodPorter
    SelectPortrait                      = UPGreenwoodBuilder
    ButtonImage                         = UIGreenwoodBuilder
    Scale                               = 1.1
    
    ;////////////////////////////
    ;// PARAMÈTRES ARTISTIQUES //
    ;////////////////////////////
    
    Draw                                = W3DTruckDraw ModuleTag_01
        OkToChangeModelColor                = Yes
        
        DefaultModelConditionState
            Model                               = tubuilder_skn
            Skeleton                            = GUPorter_SKL
        End
        
        IdleAnimationState
            Animation                           = IDLA
                AnimationName                       = GUPorter_IDLA
                AnimationMode                       = ONCE
                AnimationPriority                   = 20
            End
            Animation                           = IDLB
                AnimationName                       = GUPorter_IDLB
                AnimationMode                       = ONCE
                AnimationPriority                   = 1
            End
        End
        
        ;// Animations : Morts dans les airs
        AnimationState                      = STUNNED_FLAILING
            Animation                           = StunFlail
                AnimationName                       = GUPorter_IDLA
                AnimationMode                       = LOOP
                AnimationSpeedFactorRange           = 0.4 0.6
            End
            Flags                               = RANDOMSTART
        End
        
        ;// Animations : Morts
        AnimationState                      = DYING DEATH_1
            Animation                           = DIEB
                AnimationName                       = GUPorter_DIEB
                AnimationMode                       = ONCE
            End
        End
        AnimationState                      = DYING DEATH_2
            Animation
                AnimationName                       = GUPorter_IDLA
                AnimationMode                       = LOOP
            End
        End
        AnimationState                      = DYING
            Animation                           = DIEA
                AnimationName                       = GUPorter_DIEA
                AnimationMode                       = ONCE
            End
        End
        
        ;// Animations : Paralysies
        AnimationState                      = PARALYZED
            Animation
                AnimationName                       = GUPorter_IDLA
                AnimationMode                       = LOOP
            End
        End
        
        ;// Animations : Déplacements
        AnimationState                      = MOVING WANDER
            Animation                           = WLKA
                AnimationName                       = GUPorter_WLKA
                AnimationMode                       = LOOP
            End
            Flags                               = RANDOMSTART
        End
        AnimationState                      = MOVING
            Animation                           = RUNNING
                AnimationName                       = GUPorter_RUNA
                AnimationMode                       = LOOP
            End
            Flags                               = RANDOMSTART
        End
        
        ;// Animations : Extinctions des feux
        AnimationState                      = UNPACKING PACKING_TYPE_1
            Animation
                AnimationName                       = GUPorter_FIRA
                AnimationMode                       = ONCE
            End
            BeginScript
                CurDrawablePlaySound("MenBuilderFireExtinguish")
            EndScript
            ParticleSysBone                     = BUCKET PorterFireWater FollowBone:YES
        End
        
        LeftFrontTireBone                   = WHEEL_L01
        RightFrontTireBone                  = WHEEL_R01
        TireRotationMultiplier              = 0.2
    End
    
    #include "..\..\..\includes\StunDrawModuleMedium.inc"
    
    
    
    ;/////////////////////////
    ;// PARAMÈTRES GÉNÉRAUX //
    ;/////////////////////////
    
    DisplayName                         = OBJECT:MirkwoodPorter
    PlacementViewAngle                  = -90
    
    BuildCost                           = GENERIC_PORTER_BUILDCOST
    BuildTime                           = GENERIC_PORTER_BUILDTIME
    VisionRange                         = GENERIC_PORTER_VISION
    ShroudClearingRange                 = GENERIC_PORTER_SHROUD_CLEAR
    ShockwaveResistance                 = GENERIC_SHOCKWAVE_RESISTANCE_IMMUNE
    BountyValue                         = GENERIC_PORTER_BOUNTY_VALUE
    
    Side                                = Mirkwood
    IsTrainable                         = No
    EditorSorting                       = UNIT
    ThingClass                          = HORDE_UNIT
    
    CrushableLevel                      = 1
    TransportSlotCount                  = 1
    
    CommandPoints                       = 0
    CommandSet                          = MirkwoodPorterCommandSet



    ;/////////////////
    ;// COMMANDSETS //
    ;/////////////////
    
    Behavior                            = CommandSetUpgrade ModuleTag_MirkwoodPorterCommandSetAvenement
        TriggeredBy                         = Upgrade_MirkwoodAvenement
        CommandSet                          = MirkwoodPorterCommandSet_Green
    End
    
    
    
    ;/////////////////////
    ;// ARMES & ARMURES //
    ;/////////////////////
    
    ArmorSet
        Conditions                          = None
        Armor                               = RDA_CIVILIAN_UNITS_ARMOR
        DamageFX                            = NormalDamageFX
    End
    
    
    
    ;//////////////////////
    ;// PARAMÈTRES AUDIO //
    ;//////////////////////
    
    #include "..\..\..\Includes\StandardUnitEvaEvents.inc"
    
    VoiceCreated                        = WRElfBuilderVoiceSalute
    VoiceFullyCreated                   = WRElfBuilderVoiceSalute
    VoiceMove                           = WRElfBuilderVoiceMove
    VoiceMoveToCamp                     = WRElfBuilderVoiceMove
    VoicePriority                       = 6
    VoiceRetreatToCastle                = WRElfBuilderVoiceMove
    VoiceSelect                         = WRElfBuilderVoiceSelectMS
    
    SoundImpact                         = ImpactHorse
    SoundMoveLoop                       = ElfBuilderMoveLoopMS
    SoundMoveStart                      = ElfBuilderMoveStart
    
    UnitSpecificSounds
        VoiceBuildResponse                  = ElfBuilderVoiceBuild
        VoiceEnterUnitElvenTransportShip    = ElfBuilderVoiceGarrison
        VoiceExtinguishFireAtLocation       = WRElfBuilderVoiceMove
        VoiceGarrison                       = ElfBuilderVoiceGarrison
        VoiceInitiateCaptureBuilding        = WRElfBuilderVoiceMove
        VoiceNoBuild                        = ElfBuilderVoiceCantBuild
        VoiceSelectIdleWorker               = WRElfBuilderVoiceSelectIdle
    End
    
    ClientBehavior                      = ModelConditionAudioLoopClientBehavior ModuleTag_foo
        ModelCondition                      = Required:EMOTION_CELEBRATING Excluded:DYING ENGAGED Sound:EmotionElfCompilationVoxCheerSinglesLoop
        ModelCondition                      = Required:EMOTION_TAUNTING Excluded:DYING ENGAGED Sound:EmotionElfCompilationVoxTauntSinglesLoop
    End
    
    EvaEventDamagedOwner                = PorterUnderAttack
    
    
    
    ;/////////////////////////////
    ;// PARAMÈTRES D'INGÉNIERIE //
    ;/////////////////////////////
    
    RadarPriority                       = UNIT
    KindOf                              = PRELOAD SELECTABLE CAN_CAST_REFLECTIONS INFANTRY PATH_THROUGH_EACH_OTHER SCORE THROWN_OBJECT PORTER IGNORES_SELECT_ALL DOZER
    
    Behavior                            = PhysicsBehavior ModuleTag_04
        GravityMult                         = 1.0
    End
    
    Behavior                            = SquishCollide ModuleTag_06
    End
    
    
    
    ;/////////////////////////
    ;// PARAMÈTRES DE SANTÉ //
    ;/////////////////////////
    
    Body                                = ActiveBody ModuleTag_02
        MaxHealth                           = 500
        MaxHealthDamaged                    = 250
        RecoveryTime                        = MORDOR_PORTER_HEALTH_RECOVERY_TIME
    End
    
    
    
    ;////////////////
    ;// PRODUCTION //
    ;////////////////
    
    Behavior                            = ProductionUpdate ProductionUpdateModuleTag
        GiveNoXP                            = Yes
    End
    
    
    
    ;///////////////////////////////
    ;// INTELLIGENCE ARTIFICIELLE //
    ;///////////////////////////////
    
    Behavior                            = DozerAIUpdate ModuleTag_03
        AILuaEventsList                     = MirkwoodPorterFunctions
        RepairHealthPercentPerSecond        = 2%
        BoredTime                           = 5000
        BoredRange                          = 150
        AutoAcquireEnemiesWhenIdle          = No
        SpecialContactPoints                = Repair
    End
    
    
    
    ;///////////////
    ;// LOCOMOTOR //
    ;///////////////
    
    LocomotorSet
        Locomotor                           = PorterLocomotor
        Condition                           = SET_NORMAL
        Speed                               = NORMAL_INGAME_PORTER_SPEED
    End
    
    LocomotorSet
        Locomotor                           = PorterLocomotor
        Condition                           = SET_WANDER
        Speed                               = NORMAL_INGAME_PORTER_SPEED
    End
    
    
    
    ;////////////////
    ;// MORT LENTE //
    ;////////////////
    
    Behavior                            = SlowDeathBehavior SlowDeathBehaviorModuleTag_1
        DeathTypes                          = ALL -CRUSHED -EXPLODED -KNOCKBACK -DETONATED -SPLATTED -FADED -SLAUGHTERED
        SinkDelay                           = 3000
        SinkRate                            = 1.40
        DestructionDelay                    = 13000
        Sound                               = INITIAL ElfBuilderVoiceDie
        FX                                  = INITIAL FX_PorterDie
    End
    
    Behavior                            = SlowDeathBehavior SlowDeathBehaviorModuleTag_2
        DeathTypes                          = NONE +CRUSHED +EXPLODED +KNOCKBACK +DETONATED +SPLATTED
        SinkDelay                           = 3000
        SinkRate                            = 1.40
        DestructionDelay                    = 13000
        DeathFlags                          = DEATH_1
        FX                                  = INITIAL FX_PorterDieExplosion
        Sound                               = INITIAL ElfBuilderVoiceDie
    End
    
    Behavior                            = SlowDeathBehavior ModuleTag_ConstructionDeath
        DeathTypes                          = NONE +FADED
        DeathFlags                          = DEATH_2
        FadeDelay                           = 500
        FadeTime                            = 3500
        DestructionDelay                    = 4000
    End
    
    Behavior                            = SlowDeathBehavior SlowDeathBehaviorModuleTag_Decommissioned
        DeathTypes                          = NONE +SLAUGHTERED
        SinkDelay                           = 1000
        SinkRate                            = 1.40
        DestructionDelay                    = 5000
    End
    
    
    
    ;/////////////////
    ;// PROJECTILES //
    ;/////////////////
    
    Behavior                            = BezierProjectileBehavior ModuleTag_08
        FirstHeight                         = 24
        SecondHeight                        = 24
        FirstPercentIndent                  = 30%
        SecondPercentIndent                 = 70%
        TumbleRandomly                      = Yes
        CrushStyle                          = Yes
        DieOnImpact                         = Yes
        BounceCount                         = 1
        BounceDistance                      = 40
        BounceFirstHeight                   = 16
        BounceSecondHeight                  = 16
        BounceFirstPercentIndent            = 20%
        BounceSecondPercentIndent           = 80%
        GroundHitFX                         = FX_ThrownRockGroundHit
        GroundBounceFX                      = FX_ThrownRockBounceHit
    End
    
    
    
    ;//////////////
    ;// ÉMOTIONS //
    ;//////////////
    
    Behavior                            = EmotionTrackerUpdate Module_EmotionTracker
        AfraidOf                            = NONE +RohanTreeBerd +RohanEntFir +RohanEntAsh +RohanEntBirch +MordorBalrog +MordorCaveTroll +MordorMountainTroll +MordorDrummerTroll +MordorFellBeast +MordorMumakil
        AlwaysAfraidOf                      = NONE +MordorWitchKing +MordorWitchKingOnFellBeast +MordorBalrog +RohanOathbreaker
        FearScanDistance                    = 250
        AddEmotion                          = Terror_Base
    End
    
    
    
    ;///////////////
    ;// AUTO-HEAL //
    ;///////////////
    
    Behavior                            = AutoHealBehavior ModuleTag_BuilderHealing
        StartsActive                        = Yes
        HealingAmount                       = GENERIC_AUTO_HEALTH_1
        HealingDelay                        = GENERIC_HEALING_DELAY
        StartHealingDelay                   = GENERIC_START_HEALING_DELAY
        HealOnlyIfNotInCombat               = Yes
    End
    
    
    
    ;/////////////////////////
    ;// COMPÉTENCE : SPRINT //
    ;/////////////////////////

    Behavior                            = SpecialPowerModule ModuleTag_PorterSprint
        SpecialPowerTemplate                = SpecialAbilityPorterSprint
        StartsPaused                        = No
        UpdateModuleStartsAttack            = No
        AttributeModifier                   = PorterSprint
        AttributeModifierRange              = 1
        AttributeModifierAffectsSelf        = Yes
        AttributeModifierFX                 = FX_WindRunner
    End
    
    Behavior                            = SpecialAbilityUpdate ModuleTag_PorterSprintUpdate
        SpecialPowerTemplate                = SpecialAbilityPorterSprint
        TriggerAttributeModifier            = PorterSprint
        AttributeModifierDuration           = 20000
    End
    
    Behavior                            = AutoAbilityBehavior ModuleTag_PorterSprintAutoAbility
        SpecialAbility                      = SpecialAbilityPorterSprint
        ForbiddenStatus                     = INSIDE_GARRISON
        MaxScanRange                        = 200
        Query                               = 1 ALL ENEMIES -WALL_UPGRADE -WALL_HUB -WALL_SEGMENT -DEFENSIVE_WALL ;;,;;
    End
    
    
    
    ;///////////////////////////////////////
    ;// COMPÉTENCE : EXTINCTIONS DES FEUX //
    ;///////////////////////////////////////
    
    #include "..\..\..\Includes\PorterExtinguishFire.inc"
    
    
    
    ;/////////////////////////////
    ;// COMPÉTENCE : RÉPARATION //
    ;/////////////////////////////
    
    Behavior                            = RepairSpecialPower ModuleTag_RepairSPecialPower
        SpecialPowerTemplate                = SpecialRepairStructure
    End
    
    
    
    ;////////////////////
    ;// COMPÉTENCES IA //
    ;////////////////////
    
    Behavior                            = CommandSetUpgrade ModueTag_MirkwoodPorterCommandSetForEasyNormalAI
        TriggeredBy                         = Upgrade_EasyAISinglePlayer Upgrade_EasyAIMultiPlayer Upgrade_MediumAISinglePlayer Upgrade_MediumAIMultiPlayer
        ConflictsWith                       = Upgrade_HardAISinglePlayer Upgrade_HardAIMultiPlayer Upgrade_BrutalAISinglePlayer Upgrade_BrutalAIMultiPlayer
        CommandSet                          = MirkwoodPorterCommandSet_EasyNormalAI
    End
    
    Behavior                            = CommandSetUpgrade ModueTag_MirkwoodPorterCommandSetForHardBrutalAI
        TriggeredBy                         = Upgrade_HardAISinglePlayer Upgrade_HardAIMultiPlayer Upgrade_BrutalAISinglePlayer Upgrade_BrutalAIMultiPlayer
        ConflictsWith                       = Upgrade_EasyAISinglePlayer Upgrade_EasyAIMultiPlayer Upgrade_MediumAISinglePlayer Upgrade_MediumAIMultiPlayer
        CommandSet                          = MirkwoodPorterCommandSet_ForAI
    End
    
    
    
    ;/////////////////////////////
    ;// PARAMÈTRES DE GÉOMÉTRIE //
    ;/////////////////////////////
    
    Geometry                            = CYLINDER
    GeometryMajorRadius                 = 8.0
    GeometryMinorRadius                 = 8.0
    GeometryHeight                      = 16.0
    GeometryIsSmall                     = Yes
    Shadow                              = SHADOW_DECAL
    ShadowSizeX                         = 27
    ShadowSizeY                         = 27
    ShadowTexture                       = ShadowI
End





ChildObject MirkwoodPorterWotR MirkwoodPorter
    EquivalentTo                        = MirkwoodPorter
    Side                                = Obsolete
    EditorSorting                       = SYSTEM
End