Object LaketownCivilian1
	
	;////////////////////////////
	;// PARAMÈTRES ARTISTIQUES //
	;////////////////////////////

	Draw									= W3DScriptedModelDraw ModuleTag_01
        RandomTexture							= dumpeasent01.tga 0 dumpeasent01.tga
        RandomTexture							= dumpeasent02.tga 0 dumpeasent01.tga
        RandomTexture							= dumpeasent03.tga 0 dumpeasent01.tga
        RandomTexture							= dumpeasent04.tga 0 dumpeasent01.tga
		StaticModelLODMode						= Yes

        DefaultModelConditionState
            Model									= DUMpeasent_SKA
            Model									= DUMpeasent_SKB ExtraMesh:Yes
            Skeleton								= GUTownsmn_SKL
			WeaponLaunchBone						= PRIMARY B_HANDL
        End

        IdleAnimationState
            Animation								= IDLA
                AnimationName							= GUTownsmn_IDLA
                AnimationMode							= ONCE
                AnimationPriority						= 15
            End
            Animation								= IDLB
                AnimationName							= GUTownsmn_TLKA
                AnimationMode							= ONCE
                AnimationPriority						= 5
            End
            Animation								= IDLC
                AnimationName							= GUTownsmn_TLKB
                AnimationMode							= ONCE
                AnimationPriority						= 5
            End
            Animation								= IDLD
                AnimationName							= GUTownsmn_TLKC
                AnimationMode							= ONCE
                AnimationPriority						= 5
            End
        End
		
		;// Animations : Attaques
		AnimationState							= FIRING_OR_PREATTACK_A
			Animation
				AnimationName							= GUTownsmn_TLKC
				AnimationMode							= LOOP
			End		
		End
		
		;// Animations : Morts
        AnimationState							= DYING DEATH_1 AFLAME
            Animation								= MFDA
                AnimationName							= GUTownsmn_MFDA
                AnimationMode							= ONCE
            End
        End
        AnimationState							= DYING DEATH_1
            Animation								= DIEA
                AnimationName							= GUTownsmn_DIEA
                AnimationMode							= ONCE
            End
        End
        AnimationState							= DYING DEATH_2
            Animation								= DIEB
                AnimationName							= GUTownsmn_DIEB
                AnimationMode							= ONCE
            End
        End
        AnimationState							= DYING SPLATTED
            Animation								= LNDA
                AnimationName							= GUTownsmn_LNDA
                AnimationMode							= ONCE
            End
        End
		
		;// Animations : Morts dans les airs
        AnimationState							= STUNNED_FLAILING
            Animation								= FLYA
                AnimationName							= GUTownsmn_FLYA
                AnimationMode							= LOOP
            End
            Flags									= RANDOMSTART
        End
		
		;// Animations : Paralysies
        AnimationState							= STUNNED
            Animation								= LNDA
                AnimationName							= GUTownsmn_LNDA
                AnimationMode							= ONCE
            End
