		MoodAttackCheckRate						= 500
		AILuaEventsList							= MordorFighterFunctions
		AttackPriority							= AttackPriority_Infantry
		BurningDeathTime						= BURNINGDEATH_DURATION_INFANTRY
	End
	
	
	
	;///////////////
	;// LOCOMOTOR //
	;///////////////

    LocomotorSet
        Locomotor								= GondorCivilianLocomotor
        Condition								= SET_NORMAL
        Speed									= 17  
    End

    LocomotorSet
        Locomotor								= GondorCivilianLocomotor
        Condition								= SET_PANIC
        Speed									= 45
    End

    LocomotorSet
        Locomotor								= GondorCivilianLocomotor
        Condition								= SET_ENRAGED
        Speed									= 45
    End
	
	
	
	;//////////////
	;// ÉMOTIONS //
	;//////////////
	
	Behavior								= EmotionTrackerUpdate	Module_EmotionTracker
		AfraidOf								= NONE
        AlwaysAfraidOf							= NONE
        HeroScanDistance						= 150
        FearScanDistance						= INFANTRY_FEAR_SCAN_RADIUS
        AddEmotion								= Terror_Base
		AddEmotion								= Doom_Base
        AddEmotion								= UncontrollableFear_Base_Evil
        AddEmotion								= FearIdle_Base
        AddEmotion								= FearBusy_Base
	End	
	
	
	
	;////////////////
	;// RESSOURCES //
	;////////////////

    Behavior								= AutoDepositUpdate AutoDepositModuleTag
        DepositAmount							= 5
        DepositTiming							= 15000
        InitialCaptureBonus						= 0
    End
	
	
	
	;/////////////
	;// ESCLAVE //
	;/////////////

    Behavior								= SlavedUpdate ModuleTag_Slave
        GuardMaxRange							= 400
        GuardWanderRange						= 90
        DieOnMastersDeath						= Yes
    End
	
	
	
	;////////////
	;// ENRAGÉ //
	;////////////

    ; Behavior								= EntEnragedUpdate EnragedBehaviorModuleTag
        ; HatedObjectFilter						= ANY +LaketownFishfightEgg ALLIES
        ; EnragedTime								= 30000
		; ScanDistance							= 100
        ; TimeUntilCanRageAgain					= 0
        ; EnragedTransitionTime					= 0
    ; End
	
	
	
	;//////////////
	;// ÉMOTIONS //
	;//////////////

    Behavior								= BoredUpdate BoredModuleTagOne
        ScanDelayTime							= 15000
        ScanDistance							= 70
        BoredFilter								= NONE +LaketownCivilian1 +LaketownCivilian2 +LaketownCivilian3
        SpecialPowerTemplate					= SpecialAbilityMountainTrollBored
    End

	Behavior								= SpecialPowerModule ModuleTag_MordorMtTrollBoredAbility                     
        SpecialPowerTemplate					= SpecialAbilityMountainTrollBored
        UpdateModuleStartsAttack				= Yes
    End
  
    Behavior								= WeaponFireSpecialAbilityUpdate ModuleTag_MordorMtTrollBored   
        SpecialPowerTemplate					= SpecialAbilityMountainTrollBored
        UnpackTime								= 800
        PackTime								= 1200
        AwardXPForTriggering					= 0
        StartAbilityRange						= 12.0 
        SpecialWeapon							= FishmongerBored
        WhichSpecialWeapon						= 1
    End
	
	Behavior								= AttributeModifierAuraUpdate ModuleTag_Gossip
		StartsActive							= Yes
		BonusName								= GossipEffectFishmongers
		RefreshDelay							= 10000
		Range									= 10
		ObjectFilter							= NONE +LaketownCivilian1 +LaketownCivilian2 +LaketownCivilian3
	End
	
	
	
	;////////////////
	;// MORT LENTE //
	;////////////////
 
    Behavior								= SlowDeathBehavior ModuleTag_05
        DeathTypes								= ALL -CRUSHED
        SinkDelay								= 3000
        SinkRate								= 0.40
        DestructionDelay						= 8000
        DeathFlags								= DEATH_1
        Sound									= INITIAL CivilianManVoiceDie
    End
    
    Behavior								= SlowDeathBehavior ModuleTag_05b
        DeathTypes								= NONE +CRUSHED
        SinkDelay								= 3000
        SinkRate								= 0.40
        DestructionDelay						= 8000
        DeathFlags								= DEATH_2
        Sound									= INITIAL CivilianManVoiceDie
    End
	
	
	
	;/////////////////////////////
	;// PARAMÈTRES DE GÉOMÉTRIE //
	;/////////////////////////////
 
    Geometry								= CYLINDER
    GeometryMajorRadius						= 8.0
    GeometryMinorRadius						= 8.0
    GeometryHeight							= 19.2
    GeometryIsSmall							= Yes
	
    Shadow									= SHADOW_DECAL
    ShadowSizeX								= 12
    ShadowSizeY								= 12
    ShadowTexture							= ShadowI
End





