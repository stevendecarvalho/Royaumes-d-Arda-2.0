Object ProtectionoftheMountainBanner
	SelectPortrait = UPDurinBanner
	Draw = W3DScriptedModelDraw ModuleTag_Draw
		DefaultModelConditionState
			Model               = dbbalinbnr_skn
		End
	End
	DisplayName			= OBJECT:ProtectionoftheMountainBanner
	EditorSorting		= MISC_MAN_MADE
	Side				= Dale
	BuildTime					= 30.0
	ShroudClearingRange	= SHROUD_CLEAR_SKULL_TOTEM
	KindOf				= STRUCTURE IMMOBILE SELECTABLE IGNORE_FOR_VICTORY NOT_AUTOACQUIRABLE
	RadarPriority		= UNIT
	CommandSet = ProtectionoftheMountainBannerCommandSet
	ArmorSet
		Conditions			= None
		Armor				= StewPotArmor
	End
	Body            = ActiveBody ModuleTag_Body
		MaxHealth	= 1000
	End
	Behavior = DestroyDie ModuleTagDeath_Die
		DeathTypes = ALL
	End
	; Behavior = PassiveAreaEffectBehavior ModuleTag_FeelGoodHero
		; EffectRadius			= 300 ;DWARVEN_STATUE_AOE_RADIUS
		; PingDelay			= 2000;msec
		; ModifierName			= BalinFlagBuff
		; AllowFilter			= AOTR_GENERIC_BUFF_RECIPIENT_OBJECT_FILTER
	; End
	; Behavior = PassiveAreaEffectBehavior ModuleTag_SplashOfHealingWater_Ahh
		; EffectRadius			= 200 ;GONDOR_WELL_AOE_RADIUS
		; PingDelay			= 3000	;2000;msec
		; HealPercentPerSecond		= 2%	;3%
		; AllowFilter			= ANY +INFANTRY +CAVALRY -MACHINE -IMMOBILE +DOZER
		; NonStackable			= Yes
		; HealFX				= FX_SpellHealUnitHealBuff
	; End

	Behavior = AttributeModifierAuraUpdate ModuleTag_RoyalBannerStructureBuff
		StartsActive	  = Yes
		Range			  = 200 ;300 ;DWARVEN_STATUE_AOE_RADIUS
		RefreshDelay      = 2000;msec
		BonusName		  = RoyalBannerofEreborStructureLeadership
		ObjectFilter	  = ANY +STRUCTURE -EXPANSION_PAD ALLIES
	End
;--------------
	;-----------------------------------------------------------------------------
	;	UNIT ARMOR BUFF + REPLENISH ABILITY
	;-----------------------------------------------------------------------------
	; Behavior = UnpauseSpecialPowerUpgrade ModuleTag_Reinforcements
		; SpecialPowerTemplate	= SpecialAbilityFerenSummon
		; TriggeredBy				= Upgrade_ObjectLevel3
	; End
	Behavior = OCLSpecialPower ModuleTag_Reinforcements_OCL
		SpecialPowerTemplate 	= SpecialAbilityFerenSummon
		OCL                  	= OCL_ProtectionoftheMountainUnitReplenishandBuff
		TriggerFX			 	= FX_GenericWoodlandRealmSummon
		CreateLocation       	= USE_OWNER_OBJECT
		StartsPaused		 	= No ;Yes
        ;SetModelCondition       = ModelConditionState:USER_1
        ;SetModelConditionTime   = 8.1
	End
	Behavior = AutoAbilityBehavior ModuleTag_ReinforcementsAutoAbility
		SpecialAbility	= SpecialAbilityFerenSummon
		ForbiddenStatus = INSIDE_GARRISON
		MaxScanRange	= 300
		Query			= 30 ANY ENEMIES +INFANTRY +CAVALRY -STRUCTURE -WALL_UPGRADE -WALL_HUB -WALL_SEGMENT -DEFENSIVE_WALL -FS_BASE_DEFENSE
		Query     = 1 ANY ENEMIES +HERO
		StartsActive = No
	End
;--------------
	
	Behavior = LifetimeUpdate ModuleTag_LifetimeUpdate
	// This one does the work, but the one in the horde displays the timer
		MinLifetime		= CREATE_A_HERO_REINFORCEMENT_LIFETIME
		MaxLifetime		= CREATE_A_HERO_REINFORCEMENT_LIFETIME
		DeathType		= FADED
	End
	Scale = 1.0 ;0.7
	Geometry				= CYLINDER
  	GeometryMajorRadius		= 10.0
	GeometryHeight			= 30.0
	GeometryIsSmall			= No
	BuildCompletion			= PLACED_BY_PLAYER
	GeometryContactPoint = X:0.0	Y:0.0		Z:0
	GeometryContactPoint = X:0.0	Y:0.0		Z:30.0		Swoop
End



;--------------------------------
Object ProtectionoftheMountainHordeReplenishAndBuffPing


    EvaEnemyObjectSightedEvent = None  ; Not a real unit

    ; ***DESIGN parameters ***
    EditorSorting   = SYSTEM
    KindOf = NO_COLLIDE IMMOBILE UNATTACKABLE IGNORE_FOR_VICTORY IGNORE_FOR_EVA_SPEECH_POSITION ;INERT

    ; *** ENGINEERING Parameters ***
    Body = ImmortalBody ModuleTag_01
		MaxHealth = 10000
		InitialHealth = 10000
	End

	Behavior = DeletionUpdate ModuleTag_DeletionUpdate ; Not LifetimeUpdate because I can't die
		MinLifetime		= 1000 ; Last 1 second, just long enough to replenish once
		MaxLifetime		= 1000
	End

	Behavior = AttributeModifierAuraUpdate ModuleTag_ArmorBuff
		StartsActive		= Yes
		BonusName		= RoyalBannerofEreborArmorBuff
		RefreshDelay	= 2000
		Range			= 200 ;150
		TargetEnemy		= No ;Yes
		ObjectFilter	= AOTR_GENERIC_BUFF_RECIPIENT_OBJECT_FILTER
	End
	
	Behavior = BannerCarrierUpdate BannerCarrierUpdateModuleTag
		IdleSpawnRate			= 2000							; spawn a new member every n seconds when idle (in miliseconds). Greater than lifetime
		UnitSpawnFX				= FX_BannerCarrierSpawnUnit		; name of particle FX to use when the BannerCarrier spawns a new unit

		; This object acts like a banner carrier except it spawns unit on nearby hordes instead of itself.
		ReplenishNearbyHorde	= Yes
		ReplenishAllNearbyHordes = Yes ; Except it replenishes 1 for each horde, not 1 total
		ScanHordeDistance		= 200 ;170
	End
End