;------------------------------------------------------------------------------
; aka Ballista, BallistaIsengard
Object DwarvenIHBallista                         ;BALANCE Ballista 

; *** ART Parameters ***

  	; This is required for garrisoned objects - please put in all objects.
	ButtonImage		= uiironhillsballista
	SelectPortrait	= upironhillsballista
	DescriptionStrategic = CONTROLBAR:LW_ToolTip_MordorCatapult
	Draw = W3DTruckDraw ModuleTag_01
    
    	OkToChangeModelColor = Yes
    	
    	StaticModelLODMode = Yes
    		
		DefaultModelConditionState
			Model               = duIHbalsta_skn
			WeaponLaunchBone    = PRIMARY MINEDARROW
		End

		IdleAnimationState
			StateName           = Stand
			BeginScript
				Prev = CurDrawablePrevAnimationState()
				if Prev == "TurningLeft" then CurDrawableSetTransitionAnimState("TRANS_Left_To_Stand") end
				if Prev == "TurningRight" then CurDrawableSetTransitionAnimState("TRANS_Right_To_Stand") end
				if Prev == "JUST_BUILT" then CurDrawableSetTransitionAnimState("TRANS_FROM_JUST_BUILT") end
			EndScript
			Animation = IDLES
				AnimationName     = duIHbalsta_skl.duIHbalsta_idl
				AnimationMode       = ONCE
				AnimationBlendTime  = 15
			End
		End
		
		;------------------------------------ ATTEMPTED TO FIX INVISIBLE WHEN STUNNED BUG -------------------------------------------------
		; -- Stunned Anims		
		AnimationState        = STUNNED_FLAILING
			Animation           = StunFlail
				AnimationName     = duIHbalsta_skl.duIHbalsta_idl
				AnimationMode      = LOOP
				AnimationSpeedFactorRange	= 0.4 0.6
			End
			Flags               = RANDOMSTART
		End
		;---------------------------------------------------------------------------------------------------------------------------------------

		ModelConditionState =DYING
			Model               = iuNsiegball_d
		End
			
		ModelConditionState = JUST_BUILT
			Model               = duIHbalsta_skn ; CHANGE THIS WHEN WE GET A BUILD ANIMATION
		End

		;build the unit in the workshop
		AnimationState      = JUST_BUILT
			Animation         = IUSiegBall_BLDA
				AnimationName   = duIHbalsta_skl.duIHbalsta_idl; BLDA ; CHANGE THIS WHEN WE GET A BUILD ANIMATION
				AnimationMode   = ONCE
				AnimationBlendTime= 0
			End
			StateName           = JUST_BUILT
		End	

		;Die - ground unit destroys the trebuchet
		AnimationState      = DYING 
			Animation         = IUSiegBall_DIEB
				AnimationName   = IUSiegBall_DSKL.IUSiegBall_DIEB
				AnimationMode   = ONCE
			End
		End		
		
		AnimationState						= PARALYZED
			Animation
				AnimationName				= duIHbalsta_skl.duIHbalsta_idl
				AnimationMode				= LOOP
			End
		End

		; Moving and Firing Anims
		AnimationState        = TURN_LEFT FIRING_OR_PREATTACK_A
			StateName           = TurningLeft
			Animation           = IUSiegBall_TRNL
				AnimationName     = duIHbalsta_skl.duIHbalsta_trl
				AnimationMode     = ONCE
				AnimationBlendTime= 5
			End
			Flags = MAINTAIN_FRAME_ACROSS_STATES
		End
		
		AnimationState        = TURN_RIGHT FIRING_OR_PREATTACK_A
			StateName           = TurningRight
			Animation           = IUSiegBall_TRNR
				AnimationName     = duIHbalsta_skl.duIHbalsta_trr
				AnimationMode     = ONCE
				AnimationBlendTime= 5
			End
			Flags = MAINTAIN_FRAME_ACROSS_STATES
		End
		
		AnimationState        = MOVING FIRING_OR_PREATTACK_A
			Animation = Move
				AnimationName       = duIHbalsta_skl.duIHbalsta_wlk
				AnimationMode       = ONCE
				AnimationBlendTime= 5
			End
			Flags = MAINTAIN_FRAME_ACROSS_STATES
		End

		
		; --- Turning Anims 
		AnimationState        = TURN_LEFT 
			StateName           = TurningLeft
			BeginScript
				Prev = CurDrawablePrevAnimationState()
				if Prev == "Stand" then CurDrawableSetTransitionAnimState("Trans_Stand_To_Left")
				elseif Prev == "JUST_BUILT" then CurDrawableSetTransitionAnimState("TRANS_FROM_JUST_BUILT")
				;elseif Prev == "Attack"		then CurDrawableSetTransitionAnimState("BlendToTurnLeft")
				end
			EndScript
			Animation           = IUSiegBall_TRNL
				AnimationName     = duIHbalsta_skl.duIHbalsta_trl
				AnimationMode     = LOOP
				AnimationBlendTime= 15
				AnimationSpeedFactorRange = 3.0 3.0		;Hack... we need a proper TurnAngle entry
			End
		End
		
		TransitionState = BlendToTurnLeft
			Animation           = IUSiegBall_TRNL
				AnimationName     = duIHbalsta_skl.duIHbalsta_trl
				AnimationMode     = ONCE
				AnimationBlendTime= 30
				AnimationSpeedFactorRange = 3.0 3.0		;Hack... we need a proper TurnAngle entry
			End
		End

		AnimationState        = TURN_RIGHT 
			StateName           = TurningRight
			BeginScript
				Prev = CurDrawablePrevAnimationState()
				if Prev == "Stand" then CurDrawableSetTransitionAnimState("Trans_Stand_To_Right")
				elseif Prev == "JUST_BUILT" then CurDrawableSetTransitionAnimState("TRANS_FROM_JUST_BUILT")
				;elseif Prev == "Attack"		then CurDrawableSetTransitionAnimState("BlendToTurnRight")
				end
			EndScript
			ParticleSysBone     = WheelL01 GenericSiegeTrailDust
			ParticleSysBone     = WheelR01 GenericSiegeTrailDust
			Animation           = IUSiegBall_TRNR
				AnimationName     = duIHbalsta_skl.duIHbalsta_trr
				AnimationMode     = LOOP
				AnimationBlendTime= 15
				AnimationSpeedFactorRange = 3.0 3.0		;Hack... we need a proper TurnAngle entry
			End
		End
		
		TransitionState = BlendToTurnRight
			Animation           = IUSiegBall_TRNR
				AnimationName     = duIHbalsta_skl.duIHbalsta_trr
				AnimationMode     = ONCE
				AnimationBlendTime= 30
				AnimationSpeedFactorRange = 3.0 3.0		;Hack... we need a proper TurnAngle entry
			End
		End

		AnimationState        = MOVING
			Animation = Move
				AnimationName           = duIHbalsta_skl.duIHbalsta_wlk
				AnimationMode       = LOOP
				AnimationBlendTime= 15
				Distance = 15
			End
			BeginScript
				Prev = CurDrawablePrevAnimationState()
				if Prev == "Stand" then CurDrawableSetTransitionAnimState("Trans_Stand_To_Move")
				elseif Prev == "JUST_BUILT" then CurDrawableSetTransitionAnimState("TRANS_FROM_JUST_BUILT")
				;elseif Prev == "Attack" then CurDrawableSetTransitionAnimState("BlendToMove")
				end
			EndScript
		End
		
		TransitionState = BlendToMove
			Animation           = IUSiegBall_WLKA
				AnimationName     = duIHbalsta_skl.duIHbalsta_wlk
				AnimationMode     = ONCE
				AnimationBlendTime= 30
				AnimationSpeedFactorRange = 3.0 3.0		;Hack... we need a proper TurnAngle entry
			End
		End

		AnimationState			=	 FIRING_OR_PREATTACK_A 
			Animation			=	Normal
				AnimationName	=	duIHbalsta_skl.duIHbalsta_atk
				AnimationMode	=	ONCE
				;UseWeaponTiming	=	Yes
			End
			Animation			=	NoBlend
				AnimationName	=	duIHbalsta_skl.duIHbalsta_atk
				AnimationMode	=	ONCE
				;UseWeaponTiming	=	Yes
			End
			Flags = MAINTAIN_FRAME_ACROSS_STATES
			StateName			=	Attack
			FrameForPristineBonePositions = 31
			BeginScript
				Prev = CurDrawablePrevAnimationState()
				if Prev == "Stand" or Prev == "Attack"
				then 
					return "NoBlend"
				else
					return "Normal"
				end
			EndScript
		End		
		
		
		; --------- Click and Hit Reactions ------------	
		AnimationState = HIT_REACTION HIT_LEVEL_1
			Animation = Hit_Level_1_a
				AnimationName = duIHbalsta_skl.duIHbalsta_hit
				AnimationMode = ONCE
			End
		End
					

	    TrackMarks					= EXTireTrack2_Temp.tga
	    TrackMarksLeftBone			= WheelL02
	    TrackMarksRightBone			= WheelR02
	    
		; These parameters are only used if the model has a separate suspension,
		; and the locomotor has HasSuspension = Yes.
		LeftFrontTireBone           = WheelL01
		RightFrontTireBone          = WheelR01
		LeftRearTireBone            = WheelL02
		RightRearTireBone           = WheelR02
		TireRotationMultiplier      = 0.2   ; this * speed = rotation.
		PowerslideRotationAddition  = 2.5   ; This speed is added to the rotation speed when powersliding.

		ParticlesAttachedToAnimatedBones = Yes
	End


	Draw = W3DScriptedModelDraw DustEffects
	    DefaultModelConditionState
	      Model = None
	    End
	    IdleAnimationState
	    End
	    AnimationState = MOVING WADING
			ParticleSysBone     = WheelL02 FootstepSlash
			ParticleSysBone     = WheelR02 FootstepSlash
	    End
	    AnimationState        = TURN_RIGHT
			ParticleSysBone     = WheelL02 GenericSiegeTrailDust
			ParticleSysBone     = WheelR02 GenericSiegeTrailDust
	    End
	    AnimationState        = TURN_LEFT
			ParticleSysBone     = WheelL02 GenericSiegeTrailDust
			ParticleSysBone     = WheelR02 GenericSiegeTrailDust
	    End
	    AnimationState = MOVING
			ParticleSysBone     = WheelL02 GenericSiegeTrailDust
			ParticleSysBone     = WheelR02 GenericSiegeTrailDust
	    End
	    AnimationState        = TURN_RIGHT FIRING_OR_PREATTACK_A
			ParticleSysBone     = WheelL02 GenericSiegeTrailDust
			ParticleSysBone     = WheelR02 GenericSiegeTrailDust
	    End
	    AnimationState        = TURN_LEFT FIRING_OR_PREATTACK_A
			ParticleSysBone     = WheelL02 GenericSiegeTrailDust
			ParticleSysBone     = WheelR02 GenericSiegeTrailDust
	    End
	End
 
    #include "..\..\..\includes\StunDrawModuleLarge.inc"

; ***DESIGN parameters ***

	Side = Dwarves
	EditorSorting = UNIT
	
	ThreatLevel = ISENGARD_BALLISTA_THREAT_LEVEL
	ThreatBreakdown IsengardBallista_DetailedThreat
		AIKindOf = SIEGEWEAPON
	End
	
	TransportSlotCount = TRANSPORTSLOTCOUNT_SIEGE
	ThingClass = MACHINE

	VisionRange = ISENGARD_BALLISTA_VISION_RANGE
	ShroudClearingRange = SHROUD_CLEAR_ARTILLERY
	
	//VisionSide = 35%
	//VisionRear = 25%
	
	MaxVisionBonusPercent = 300%
	VisionBonusTestRadius = 200
	VisionBonusPercentPerFoot = 1.0%

	BountyValue = ISENGARD_BALLISTA_BOUNTY_VALUE 			
	DisplayName = OBJECT:IHBallista
	CrushableLevel = 2  ;What am I?:        0 = for infantry, 1 = for trees, 2 = general vehicles
	CrusherLevel   = 0 ;;,;; 2  ;What can I crush?: 0 = small animals, 1 = infantry, 2 = trees, 3 = vehicles
	ShockwaveResistance = SHOCKWAVE_RESISTANCE_IMMUNE
	CommandSet = IronHillsBallistaCommandSet
	CommandPoints = 30 ;;,;; 25

	Behavior = MonitorConditionUpdate MonitorConditionUpdateModuleTag
		ModelConditionFlags = ATTACKING_POSITION
		ModelConditionCommandSet = IronHillsBallistaCommandSetStopBombard
	End

	WeaponSet
		Conditions          = None 
		Weapon              = PRIMARY     IronHillsBallistaWeapon
	End
	ArmorSet
		Conditions      = None
		Armor           = SiegeEngineArmor
		DamageFX        = None
	End
  
  	; This is required so that the build phase lasts as long as the anim.
	BuildFadeInOnCreateTime = 2.5

	; *** AUTO RESOLVE DATA *** 
	AutoResolveUnitType     = AutoResolveUnit_Siege
	AutoResolveCombatChain  = AutoResolve_SiegeCombatChain
	AutoResolveBody         = Aotr_AutoResolve_SiegeBasicMediumHordeBody
	
	AutoResolveArmor
		Armor = Aotr_AutoResolve_SiegeNormalArmor
	End

	AutoResolveWeapon
		Weapon = AutoResolve_SiegeModerateWeapon
	End
  

; *** AUDIO Parameters ***;

	VoiceAttack					= IHBallistaVoiceAttack
	VoiceAttackCharge				= DwarfCatapultVoiceAttackCharge
	VoiceAttackMachine				= IHBallistaVoiceAttack
	VoiceAttackStructure				= IHBallistaVoiceAttackBuilding
	VoiceCreated					= IHBallistaVoiceSalute
	VoiceFullyCreated 				= IHBallistaVoiceSalute
	VoiceGuard					= IHBallistaVoiceMove
	VoiceMove					= IHBallistaVoiceMove
	VoiceMoveToCamp					= DwarfCatapultVoiceMoveCamp
	VoiceMoveToHigherGround				= DwarfCatapultVoiceMoveHighGround
	VoiceMoveWhileAttacking				= IHBallistaVoiceDisengage
	VoicePriority					= 26
	VoiceRetreatToCastle				= IHBallistaVoiceDisengage		
	VoiceSelect					= IHBallistaVoiceSelectMS
	VoiceSelectBattle 				= IHBallistaVoiceSelectCombat
	MinZIncreaseForVoiceMoveToHigherGround	= 45
	SoundImpact					= ImpactHorse
	SoundMoveLoop					= DwarfCatapultMoveLoop
	SoundMoveStart					= CatapultMoveStart
	SoundOnDamaged					= UnitDamageWoodLight
	SoundOnReallyDamaged				= UnitDamageWoodHeavy

	UnitSpecificSounds
		VoiceGarrison				= IHBallistaVoiceMove
		VoiceEnterUnitElvenTransportShip	= IHBallistaVoiceMove
		VoiceInitiateCaptureBuilding		= IHBallistaVoiceMove
	End

	;UnitSpecificSounds
	;	VoiceGarrison         		= NoSound
	;End

    	#include "..\..\..\includes\StandardUnitEvaEvents.inc"

	CrowdResponseKey = Dwarf

	Behavior = LargeGroupAudioUpdate ModuleTag_LGAU				; Tie into LargeGroupAudio system
		Key = Humanoid_Male Dwarf Dwarf_Male SiegeWeapon Catapult Dwarf_Siege
	End

	ClientBehavior = ModelConditionAudioLoopClientBehavior ModuleTag_foo
		ModelCondition = Required:RAISING_FLAG			Excluded:DYING ENGAGED	Sound:EmotionUrukCompilationVoxTauntSinglesLoop
	End
	
	Behavior = StancesBehavior ModuleTag_StancesBehavior
        StanceTemplate = Artillery
        End

	ClientBehavior = AnimationSoundClientBehavior ModuleTag_AnimAudioBehavior
		MaxUpdateRangeCap = 800
		AnimationSound = Sound:BallistaCrank		Animation:duIHbalsta_skl.duIHbalsta_atk	Frames:72
		AnimationSound = Sound:BallistaLock			Animation:duIHbalsta_skl.duIHbalsta_atk	Frames:137 160 200
		AnimationSound = Sound:BallistaCrewVoxWave	Animation:duIHbalsta_skl.duIHbalsta_atk	Frames:120

		AnimationSound = Sound:BallistaCrank		Animation:duIHbalsta_skl.duIHbalsta_trl	Frames:72
		AnimationSound = Sound:BallistaLock			Animation:duIHbalsta_skl.duIHbalsta_trl	Frames:137 165 205

		AnimationSound = Sound:BallistaCrank		Animation:duIHbalsta_skl.duIHbalsta_trr	Frames:72
		AnimationSound = Sound:BallistaLock			Animation:duIHbalsta_skl.duIHbalsta_trr	Frames:137 165 205

		AnimationSound = Sound:BallistaCrank		Animation:duIHbalsta_skl.duIHbalsta_wlk	Frames:72
		AnimationSound = Sound:BallistaLock			Animation:duIHbalsta_skl.duIHbalsta_wlk	Frames:137 162 200

		AnimationSound = Sound:BodyFallOrc			Animation:IUSiegBall_DSKL.IUSiegBall_DIEB	Frames:14
	End
    

; *** ENGINEERING Parameters ***

	RadarPriority = UNIT
	KindOf = PRELOAD SELECTABLE CAN_CAST_REFLECTIONS MACHINE PATH_THROUGH_EACH_OTHER SCORE CAN_ATTACK CAN_ATTACK_WALLS ATTACK_NEEDS_LINE_OF_SIGHT ARMY_SUMMARY SIEGEENGINE
    	BuildCost = ISENGARD_BALLISTA_BUILDCOST			
    	BuildTime = ISENGARD_BALLISTA_BUILDTIME			
	CamouflageDetectionMultiplier = CAMOUFLAGE_DETECTION_DISTANCE_SHORTISH
	
	Body = ActiveBody ModuleTag_02
		CheerRadius 	  = EMOTION_CHEER_RADIUS
		MaxHealth         = ISENGARD_BALLISTA_HEALTH				;BALANCE Ballista Health
		MaxHealthDamaged  = ISENGARD_BALLISTA_HEALTH_DAMAGED		
		;;RecoveryTime      = ISENGARD_BALLISTA_HEALTH_RECOVERY_TIME		
	End
 
	;Wambly's Notes - Added AttackPriority = AttackPriority_SIEGEWEAPON
	;Removed attack buildings command, unit should properly respect combat priorities now
	
	Behavior = AIUpdateInterface ModuleTag_03
	    ;AutoAcquireEnemiesWhenIdle = Yes ATTACK_BUILDINGS ;Yes
		AutoAcquireEnemiesWhenIdle = Yes 
		AttackPriority			   = 	AttackPriority_SIEGEWEAPON
		AILuaEventsList	=	BallistaFunctions
	End

	LocomotorSet
		Locomotor = CatapultLocomotor
		Condition = SET_NORMAL
		Speed     = NORMAL_SIEGE_MED_HORDE_SPEED			; originally 30
	End
 
	Behavior = PhysicsBehavior ModuleTag_04
	End
	
	Behavior = TransportContain ModuleTag_MineAmmoContain
		ObjectStatusOfContained 	= UNSELECTABLE ENCLOSED
		Slots				= 1
		DamagePercentToUnits		= 100%
		PassengerFilter			= NONE +CAN_RIDE_SIEGE_LADDER +CAN_USE_SIEGE_TOWER +CAN_RIDE_BATTERING_RAM
		AllowAlliesInside		= Yes
		KillPassengersOnDeath		= Yes ; fling passenger out to die when siege ladder is done for
		AllowEnemiesInside		= No
		AllowNeutralInside		= No
		NumberOfExitPaths		= 0 ; Defaults to 1.  Set 0 to not use ExitStart/ExitEnd, set higher than 1 to use ExitStart01-nn/ExitEnd01-nn
		ShowPips			= No
	End
 
	Behavior = SlowDeathBehavior ModuleTag_05
		DeathTypes 	= NONE +EXPLODED +BURNED
		SinkDelay 	= 6000
		SinkRate 	= 1.0     ; in Dist/Sec
		DestructionDelay = 22000  ;8000
		;OCL 		= FINAL OCL_MordorCatapultExplodeDeath
		FX 		= INITIAL FX_CatapultDieExplosion
		Sound 		= INITIAL	DwarfGenericVoiceDie
	End

	Behavior = SlowDeathBehavior ModuleTag_06 
		DeathTypes 	= ALL -EXPLODED -BURNED
		SinkDelay 	= 5000
		SinkRate 	= 1.0     ; in Dist/Sec
		DestructionDelay = 18000  ;8000
		;OCL 		= FINAL OCL_MordorCatapultDeath
		FX 		= INITIAL FX_CatapultDie
		Sound 		= INITIAL DwarfGenericVoiceDie
	End

	Behavior = SquishCollide ModuleTag_07
		;nothing
	End

	Behavior = NotifyTargetsOfImminentProbableCrushingUpdate ModuleTag_NotifyCrushScan
	End

	Behavior = TransitionDamageFX ModuleTag_8
	;    ReallyDamagedParticleSystem1 = Bone:None RandomBone:No PSys:FireBuildingLarge         ; persistant damage effect
		ReallyDamagedFXList1 = Loc: X:0 Y:0 Z:0 FXList:FX_GondorCatapultTransitionMedium     ; damage impact particle effect
	;   ReallyDamagedOCL1 = Loc: X:0 Y:0 Z:0 OCL:OCL_FireFieldSmall                           ; spawn debris and splinters
	End

	Behavior = HitReactionBehavior HitReactionBehaviorModuleTag
		HitReactionLifeTimer1 = 2000 ; level 1 (light  damage)  hit reaction animations in frames (5 per sec)
		HitReactionLifeTimer2 = 15 ; level 2 (medium damage)  hit reaction animations in frames (5 per sec)
		HitReactionLifeTimer3 = 10 ; level 3 (heavy  damage)  hit reaction animations in frames (5 per sec)

		HitReactionThreshold1 = 10.0   ; level 1 (light  damage) threshold trigger
		HitReactionThreshold2 = 25000.0  ; level 2 (medium damage) threshold trigger
		HitReactionThreshold3 = 50000.0  ; level 3 (heavy  damage) threshold trigger
	End


	;///////////////////
	; AISpecialPowers
	;///////////////////
	
