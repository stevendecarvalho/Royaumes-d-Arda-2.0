Object MirkwoodWoodmenArrow
    
    ;////////////////////////////
    ;// PARAMÈTRES ARTISTIQUES //
    ;////////////////////////////
    
    Draw                                = W3DScriptedModelDraw ModuleTag_Draw
        DefaultModelConditionState
            Model                               = tuwoodarrow
        End
        IdleAnimationState
            Animation                           = IDLE
                AnimationName                       = tuwoodarrow.tuwoodarrow
                AnimationMode                       = LOOP
            End
        End
    End
    
    Draw                                = W3DStreakDraw ModuleTag_Draw3
        Length                              = 50
        Width                               = 1
        NumSegments                         = 6
        Color                               = R:20 G:20 B:20
        Texture                             = EXLightStreaks2.tga
    End
    
    
    
    ;/////////////////////////
    ;// PARAMÈTRES GÉNÉRAUX //
    ;/////////////////////////
    
    Side                                = Obsolete
    EditorSorting                       = SYSTEM
    
    VisionRange                         = 0.0
    
    
    
    ;/////////////////////
    ;// ARMES & ARMURES //
    ;/////////////////////
    
    ArmorSet
        Armor                               = NoArmor
    End
    
    
    
    ;/////////////////////////////
    ;// PARAMÈTRES D'INGÉNIERIE //
    ;/////////////////////////////
    
    KindOf                              = PROJECTILE NO_COLLIDE HIDE_IF_FOGGED
    
    
    
    ;/////////////////////////
    ;// PARAMÈTRES DE SANTÉ //
    ;/////////////////////////
    
    Body                                = ActiveBody ModuleTag_02
        MaxHealth                           = 100.0
    End
    
    
    
    ;////////////////
    ;// MORT LENTE //
    ;////////////////
    
    Behavior                            = DestroyDie ModuleTag_03
    End
    
    
    
    ;/////////////////
    ;// PROJECTILES //
    ;/////////////////
    
    Behavior                            = BezierProjectileBehavior ModuleTag_04
        FirstHeight                         = 9
        SecondHeight                        = 9
        FirstPercentIndent                  = 20%
        SecondPercentIndent                 = 90%
        FlightPathAdjustDistPerSecond       = 50
        GroundHitFX                         = FX_GondorArrowDeath
        CurveFlattenMinDist                 = 100.0
    End
    
    
    
    ;/////////////////////////////
    ;// PARAMÈTRES DE GÉOMÉTRIE //
    ;/////////////////////////////
    
    Geometry                            = Sphere
    GeometryIsSmall                     = Yes
    GeometryMajorRadius                 = 0.8
End





