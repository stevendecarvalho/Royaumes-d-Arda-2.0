Object DummyBuilder
    
    ;////////////////////////////
    ;// PARAMÈTRES ARTISTIQUES //
    ;////////////////////////////
    
    Draw                                = W3DScriptedModelDraw ModuleTag_Draw
        DefaultModelConditionState
            Model                               = None
        End
    End
    
    
    
    ;/////////////////////////////
    ;// PARAMÈTRES D'INGÉNIERIE //
    ;/////////////////////////////
    
    KindOf                              = UNATTACKABLE INERT IMMOBILE
    
    
    
    ;/////////////////////////
    ;// PARAMÈTRES DE SANTÉ //
    ;/////////////////////////
    
    Body                                = ActiveBody ModuleTag_MakesKillWork
        MaxHealth                           = 1
    End
    
    
    
    ;///////////////////////
    ;// CHOIX DE FACTIONS //
    ;///////////////////////

    Behavior                            = ReplaceSelfUpgrade ModuleTag_SpawnLothlorienPorter
        TriggeredBy                         = Upgrade_ChooseSubFactionLothlorien
        Permanent                           = Yes
        ConflictsWith                       = Upgrade_ObjectUnderAIControl
        ReplaceWith                         = ElvenPorter
    End

    Behavior                            = ReplaceSelfUpgrade ModuleTag_SpawnLothlorienPorterAI
        TriggeredBy                         = Upgrade_ChooseSubFactionLothlorien Upgrade_ObjectUnderAIControl
        RequiresAllTriggers                 = Yes
        Permanent                           = Yes
        ReplaceWith                         = ElvenPorter
    End

    ;/////

    Behavior                            = ReplaceSelfUpgrade ModuleTag_SpawnMirkwoodPorter
        TriggeredBy                         = Upgrade_ChooseSubFactionMirkwood
        Permanent                           = Yes
        ConflictsWith                       = Upgrade_ObjectUnderAIControl
        ReplaceWith                         = MirkwoodPorter
    End

    Behavior                            = ReplaceSelfUpgrade ModuleTag_SpawnMirkwoodPorterAI
        TriggeredBy                         = Upgrade_ChooseSubFactionMirkwood Upgrade_ObjectUnderAIControl
        RequiresAllTriggers                 = Yes
        Permanent                           = Yes
        ReplaceWith                         = MirkwoodPorter
    End
End



;////////////////
;// RESTOREMAN //
;////////////////

Object MagicManSummonEgg
    
    ;////////////////////////////
    ;// PARAMÈTRES ARTISTIQUES //
    ;////////////////////////////
    
    Draw                                = W3DScriptedModelDraw ModuleTag_Draw
        DefaultModelConditionState
            Model                               = None
        End
    End
    
    
    
    ;/////////////////////////
    ;// PARAMÈTRES GÉNÉRAUX //
    ;/////////////////////////
    
    PlacementViewAngle                  = 0
    Side                                = Obsolete
    EditorSorting                       = SYSTEM
    
    
    
    ;/////////////////////////////
    ;// PARAMÈTRES D'INGÉNIERIE //
    ;/////////////////////////////
    
    KindOf                              = INERT IMMOBILE UNATTACKABLE
    
    
    
    ;/////////////////////////
    ;// PARAMÈTRES DE SANTÉ //
    ;/////////////////////////
    
    Body                                = ActiveBody ModuleTag_MakesKillWork
        MaxHealth                           = 1
    End
    
    
    
    ;///////////
    ;// TIMER //
    ;///////////
    
    Behavior                            = LifetimeUpdate ModuleTag_HatchTrigger
        MinLifetime                         = 0.0
        MaxLifetime                         = 0.0
    End
    
    
    
    ;////////////////
    ;// MORT LENTE //
    ;////////////////
    
    Behavior                            = SlowDeathBehavior ModuleTag_HatchProcess
        FX                                  = INITIAL FX_WhiteStagSummoningStart
        FX                                  = FINAL FX_WhiteStagSummoningFinish
        DestructionDelay                    = 2000
        OCL                                 = FINAL OCL_MagicMan
    End
End





