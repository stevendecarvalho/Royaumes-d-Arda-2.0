Object GenericInteractableOptimizedTree
    
    ;////////////////////////////
    ;// PARAMÈTRES ARTISTIQUES //
    ;////////////////////////////

    Draw                                = W3DTreeDraw ModuleTag_Opt_01
        ModelName                           = PTree01
        TextureName                         = PTreeShare.tga
        DoTopple                            = Yes
        ToppleFX                            = FX_ToppleTree
        BounceFX                            = FX_TreeBounce
        KillWhenFinishedToppling            = No
        SinkDistance                        = 9
        SinkTime                            = DEFAULT_TREE_SINK_TIME
    End
    
    Draw                                = W3DScriptedModelDraw ModuleTag_01
        DefaultModelConditionState
            Model                               = PTree01
        End
        ModelConditionState                 = PASSENGER CLUB
            Model                               = None
        End
        AnimationState                      = PASSENGER CLUB
            EnteringStateFX                     = FX_TreeBecomeClub
        End
        AnimationState                      = PASSENGER
            EnteringStateFX                     = FX_TreePickUp
        End
        ModelConditionState                 = BURNED
            Model                               = PTreeDeath11
        End
        AnimationState                      = AFLAME
            ParticleSysBone                     = None FireTreeSmall
            ParticleSysBone                     = None TreeEmbers
        End
        AnimationState                      = DYING
            ParticleSysBone                     = None FireTreeSmall
            ParticleSysBone                     = None TreeEmbers
        End
        AnimationState                      = BURNED
            ParticleSysBone                     = None FireTreeSmall
            ParticleSysBone                     = None TreeEmbers
        End
    End



    ;/////////////////////////
    ;// PARAMÈTRES GÉNÉRAUX //
    ;/////////////////////////
    
    DisplayName                         = OBJECT:Prop
    Side                                = Obsolete
    EditorSorting                       = SYSTEM

    CrushableLevel                      = 1
    TransportSlotCount                  = 1
    
    IsGrabbable                         = Yes
    IsHarvestable                       = Yes



    ;/////////////////////
    ;// ARMES & ARMURES //
    ;/////////////////////
    
    ArmorSet
        Conditions                          = None
        Armor                               = NoArmor
    End



    ;/////////////////////////////
    ;// PARAMÈTRES D'INGÉNIERIE //
    ;/////////////////////////////

    KindOf                              = SHRUBBERY IMMOBILE CLUB TREE SELECTABLE



    ;/////////////////////////
    ;// PARAMÈTRES DE SANTÉ //
    ;/////////////////////////
    
    Body                                = ActiveBody ModuleTag_10
        MaxHealth                           = 50.0
    End



    ;////////////////////
    ;// INFLAMMABILITÉ //
    ;////////////////////
    
    Behavior                            = FlammableUpdate ModuleTag_05
        FlameDamageLimit                    = 10
        FlameDamageExpiration               = 5000
        BurnedDelay                         = 2500
        AflameDuration                      = 7000
        AflameDamageDelay                   = 1000
        AflameDamageAmount                  = 8
        BurningSoundName                    = GenericFireMediumLoop
    End
    
    Behavior                            = FireSpreadUpdate ModuleTag_06
        MinSpreadDelay                      = 2000
        MaxSpreadDelay                      = 4000
        SpreadTryRange                      = 50
    End
    
    Flammability
        Fuel                                = 200
        MaxBurnRate                         = 20
        Decay                               = 5
        Resistance                          = 10
    End



    ;////////////////
    ;// MORT LENTE //
    ;////////////////

    Behavior                            = SlowDeathBehavior ModuleTag_11
        DeathTypes                          = ALL
        SinkDelay                           = 1000
        SinkRate                            = 16
        DestructionDelay                    = 11000
    End



    ;//////////////////////////////
    ;// CORRUPTION DE DOL GULDUR //
    ;//////////////////////////////

    Behavior                            = GrantUpgradeCreate ModuleTag_GrantUpgrade
        UpgradeToGrant                      = Upgrade_GondorStableLevel2
    End

    Behavior                            = ObjectCreationUpgrade MakeTheFakeTree
        TriggeredBy                         = Upgrade_GondorStableLevel2
        Delay                               = 0.0
        DestroyWhenSold                     = Yes
        ThingToSpawn                        = AOTRGenericTreeInterface
        Offset                              = X:0.0 Y:0.0. Z:0.0
        Angle                               = 0
        FadeInTime                          = 1000
    End

    Behavior                            = ModelConditionUpgrade ModuleTag_ForFX
        TriggeredBy                         = Upgrade_GondorStableLevel2
        RequiresAllTriggers                 = Yes
        AddConditionFlags                   = USER_8
    End

    ; Behavior                            = CreateObjectDie ModuleTag_DropTheTwistedTree
    ;     CreationList                        = OCL_GuldurCorruptedTree
    ;     UpgradeRequired                     = Upgrade_GuldurCorruptedTree
    ; End



    ;/////////////////////////////
    ;// PARAMÈTRES DE GÉOMÉTRIE //
    ;/////////////////////////////

    Shadow                              = SHADOW_DECAL
    InstanceScaleFuzziness              = 0.1
End





