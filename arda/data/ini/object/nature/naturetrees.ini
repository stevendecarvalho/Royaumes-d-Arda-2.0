#define DEFAULT_TREE_SINK_TIME          10000

Object TheOneTree

    ;/////////////////////////
    ;// PARAMÈTRES GÉNÉRAUX //
    ;/////////////////////////

    DisplayName                         = OBJECT:Prop
    TransportSlotCount                  = 1
    
    IsGrabbable                         = Yes
    IsHarvestable                       = Yes



    ;/////////////////////////////
    ;// PARAMÈTRES D'INGÉNIERIE //
    ;/////////////////////////////
    
    KindOf                              = SHRUBBERY IMMOBILE CLUB INERT TREE



    ;/////////////////////////
    ;// PARAMÈTRES DE SANTÉ //
    ;/////////////////////////

    Body                                = ImmortalBody ModuleTag_ImmortalBody
        MaxHealth                           = 1
    End
End





