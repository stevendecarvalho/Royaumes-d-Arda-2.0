Object ParticleSysProxy
    
    ;////////////////////////////
    ;// PARAMÈTRES ARTISTIQUES //
    ;////////////////////////////

    Draw                                = W3DScriptedModelDraw ModuleTag_01
        DefaultModelConditionState
            Model                               = NONE
            ParticleSysBone                     = None CHAreaFissureEffect
        End
        ModelConditionState                 = WORLD_BUILDER
            Model                               = locator
        End
    End



    ;/////////////////////////
    ;// PARAMÈTRES GÉNÉRAUX //
    ;/////////////////////////

    DisplayName                         = OBJECT:Prop
    Side                                = Obsolete
    EditorSorting                       = SYSTEM
    Browser                             = SYSTEM



    ;/////////////////////////////
    ;// PARAMÈTRES D'INGÉNIERIE //
    ;/////////////////////////////

    KindOf                              = IMMOBILE



    ;/////////////////////////
    ;// PARAMÈTRES DE SANTÉ //
    ;/////////////////////////

    Body                                = ActiveBody ModuleTag_03
        MaxHealth                           = 99999.0
    End



    ;/////////////////////////////
    ;// PARAMÈTRES DE GÉOMÉTRIE //
    ;/////////////////////////////
    
    Geometry                            = CYLINDER
    GeometryMajorRadius                 = 0.8
    GeometryMinorRadius                 = 0.8
    GeometryHeight                      = 0.8
    GeometryIsSmall                     = Yes

    Shadow                              = NONE
End





