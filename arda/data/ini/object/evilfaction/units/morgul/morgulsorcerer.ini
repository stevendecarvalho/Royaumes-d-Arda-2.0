			StateName		= Selected
			SimilarRestart		= Yes			
			Animation		= ATNB
				AnimationName	= KUNecro_ATNB
				AnimationMode	= LOOP
			End
			BeginScript
				Prev = CurDrawablePrevAnimationState()
				if Prev == "Idle" then CurDrawableSetTransitionAnimState("TRANS_Idle_to_Selected") end
			EndScript
		End
