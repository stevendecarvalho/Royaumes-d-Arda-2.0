        End
        AnimationState                      = EMOTION_CELEBRATING
            Animation                           = CHRB
                AnimationName                       = MUCorsar_CHRA
                AnimationMode                       = ONCE
            End
            Animation                           = CHRC
                AnimationName                       = MUCorsar_CHRB
                AnimationMode                       = ONCE
            End
            Animation                           = IDLD
                AnimationName                       = MUCorsar_CHRC
