            End
            Animation                           = CHRB
                AnimationName                       = MUCorsar_IDLE
                AnimationMode                       = ONCE
                AnimationSpeedFactorRange           = 0.9 1.1
            End
            Flags                               = RESTART_ANIM_WHEN_COMPLETE
            BeginScript
                Prev                                = CurDrawablePrevAnimationState()
                if Prev                             = = "STATE_Selected" then CurDrawableSetTransitionAnimState("TRANS_SelectedToIdle") end
            EndScript
        End
        
        IdleAnimationState
            StateName                           = STATE_Idle
            Animation                           = IDLB
                AnimationName                       = MUCorsar_IDLB
                AnimationMode                       = ONCE
                AnimationPriority                   = 20
                AnimationSpeedFactorRange           = 0.9 1.1
                AnimationBlendTime                  = 15
            End
            Animation                           = IDLF
                AnimationName                       = MUCorsar_IDLC
                AnimationMode                       = ONCE
                AnimationPriority                   = 3
                AnimationSpeedFactorRange           = 0.9 1.1
                AnimationBlendTime                  = 15
            End
            Animation                           = IDLG
                AnimationName                       = MUCorsar_IDLD
                AnimationMode                       = ONCE
                AnimationPriority                   = 3
                AnimationSpeedFactorRange           = 0.9 1.1
                AnimationBlendTime                  = 15
            End
            Animation                           = IDLJ
                AnimationName                       = MUCorsar_IDLE
                AnimationMode                       = ONCE
                AnimationPriority                   = 3
                AnimationSpeedFactorRange           = 0.9 1.1
                AnimationBlendTime                  = 15
            End
            BeginScript
                Prev                                = CurDrawablePrevAnimationState()
                if Prev                             = = "STATE_Selected" then CurDrawableSetTransitionAnimState("TRANS_SelectedToIdle") end
            EndScript
        End
		
		;// Transitions
        TransitionState                     = TRANS_TO_USER_1
            Animation
                AnimationName                       = MUCorsar_RCTA
                AnimationMode                       = ONCE
            End
        End
        TransitionState                     = TRANS_IdleToSelected
            Animation                           = ATNA
                AnimationName                       = MUCorsar_ATNA
                AnimationMode                       = ONCE
                AnimationSpeedFactorRange           = 0.8 1.0
                
            End
        End
        TransitionState                     = TRANS_SelectedToIdle
            Animation                           = ATND
                AnimationName                       = MUCorsar_ATNC
                AnimationMode                       = ONCE
                AnimationSpeedFactorRange           = 0.8 1.0
            End
        End
    End
	
	
	
