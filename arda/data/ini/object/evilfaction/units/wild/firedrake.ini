            End
        End
        TransitionState                     = TRANS_Selected_to_Idle
            Animation                           = ATNC
                AnimationName                       = WUNDRAKE_ATNC
                AnimationMode                       = ONCE
                AnimationBlendTime                  = 10
                AnimationSpeedFactorRange           = 0.9 1.1
            End
        End
        TransitionState                     = TRANS_AlertToSleeping
            Animation                           = ATNC
                AnimationName                       = WUNDRAKE_GTPA
                AnimationMode                       = ONCE_BACKWARDS
                AnimationBlendTime                  = 25
                AnimationSpeedFactorRange           = 0.7 0.7
            End
            Flags                               = START_FRAME_LAST
        End
        TransitionState                     = TRANS_SleepingToAlert
            Animation                           = ATNC
                AnimationName                       = WUNDRAKE_GTPA
                AnimationMode                       = ONCE
                AnimationBlendTime                  = 10
                AnimationSpeedFactorRange           = 1.2 1.2
            End
        End
    End

