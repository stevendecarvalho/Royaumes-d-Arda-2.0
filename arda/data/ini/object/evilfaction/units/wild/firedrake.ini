                Prev                                = CurDrawablePrevAnimationState()
                if Prev                             = = "STATE_Selected" or Prev == "STATE_Decel" then
                CurDrawableSetTransitionAnimState("TRANS_Selected_to_Idle") return end
                if Prev                             = = "STATE_Sleepy" then
                CurDrawableSetTransitionAnimState("TRANS_SleepingToAlert") return end
            EndScript
        End
        AnimationState                      = EMOTION_AFRAID
            Animation
                AnimationName                       = WUNDRAKE_CHRA
                AnimationMode                       = ONCE
                AnimationPriority                   = 20
            End
            Animation
                AnimationName                       = WUNDRAKE_CHRB
                AnimationMode                       = ONCE
                AnimationPriority                   = 10
            End
            Flags                               = RESTART_ANIM_WHEN_COMPLETE
        End
        AnimationState                      = EMOTION_POINTING
