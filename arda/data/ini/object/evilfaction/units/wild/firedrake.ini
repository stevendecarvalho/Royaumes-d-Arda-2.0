                AnimationMode                       = ONCE
                AnimationPriority                   = 5
                AnimationSpeedFactorRange           = 0.7 0.7
                AnimationBlendTime                  = 25
            End
            Animation                           = SleepFidget
                AnimationName                       = WUNDRAKE_SLPB
                AnimationMode                       = ONCE
                AnimationPriority                   = 1
                AnimationBlendTime                  = 25
            End
            Flags                               = RESTART_ANIM_WHEN_COMPLETE
            BeginScript
                Prev                                = CurDrawablePrevAnimationState()
                if Prev                             = = "STATE_Alert" or Prev == "STATE_Decel" or Prev == "STATE_Engaged" or Prev == "STATE_Taunting" then
                CurDrawableSetTransitionAnimState("TRANS_AlertToSleeping") return end
            EndScript
        End
    
        IdleAnimationState
            StateName                           = STATE_Idle
            SimilarRestart                      = Yes
            Animation                           = Breathe
                AnimationName                       = WUNDRAKE_IDLA
                AnimationMode                       = ONCE
                AnimationPriority                   = 10
                AnimationSpeedFactorRange           = 0.9 1.1
            End
            Animation                           = Breathe
                AnimationName                       = WUNDRAKE_IDLB
                AnimationMode                       = ONCE
                AnimationPriority                   = 5
            End
            Animation                           = Breathe
                AnimationName                       = WUNDRAKE_IDLC
                AnimationMode                       = ONCE
                AnimationPriority                   = 5
            End
            Animation                           = Sniff
                AnimationName                       = WUNDRAKE_IDLD
                AnimationMode                       = ONCE
                AnimationPriority                   = 5
            End
            Flags                               = RESTART_ANIM_WHEN_COMPLETE
            BeginScript
                Prev                                = CurDrawablePrevAnimationState()
                if Prev                             = = "STATE_Selected" or Prev == "STATE_Decel" then
                CurDrawableSetTransitionAnimState("TRANS_Selected_to_Idle") return end
            EndScript
        End
		
		;// Animations : Attaques
        TransitionState                     = TRANS_Idle_to_Selected
