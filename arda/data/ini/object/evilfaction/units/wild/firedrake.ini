                AnimationMode                       = LOOP
                AnimationSpeedFactorRange           = 0.9 1.1
            End
            BeginScript
                Prev                                = CurDrawablePrevAnimationState()
                if Prev                             = = "STATE_Idle" then
                    CurDrawableSetTransitionAnimState("TRANS_Idle_to_Selected")
                    return
                end
            EndScript
        End
    
        AnimationState                      = RIDER1
            StateName                           = STATE_Sleepy
            Animation                           = Sleep
