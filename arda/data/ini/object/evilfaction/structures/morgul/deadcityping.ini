;------------------------------------------------------------------------------
;Elven grove object
Object DeadCityPing

	; *** ART Parameters ***
	Draw = W3DScriptedModelDraw ModuleTag_Draw
		OkToChangeModelColor  = Yes
		UseStandardModelNames = Yes
		DefaultModelConditionState
			Model = NONE
			ParticleSysBone = None DeadCityGlowFX FollowBone:Yes ;HouseColor:yes
			ParticleSysBone = None DeadCityPingFX FollowBone:Yes
		End

		MultiPlayerOnly = No
	End 

	; *** AUDIO Parameters ***
	SoundAmbient				= CastellanAmbient

	; ***DESIGN parameters ***
	Side            = Morgul
	EditorSorting   = STRUCTURE
	ThreatLevel		= 0.5

	; *** ENGINEERING Parameters ***  
	RadarPriority       = NOT_ON_RADAR
	KindOf              = NO_COLLIDE IMMOBILE UNATTACKABLE IGNORE_FOR_VICTORY IGNORE_FOR_EVA_SPEECH_POSITION MOVE_ONLY

	Body = ActiveBody ModuleTag_01
		MaxHealth		= 999999
		InitialHealth	= 999999
	End
	
	Behavior = FireWeaponUpdate ModuleTag_DamageHandler
		FireWeaponNugget
			WeaponName	= MorgulDeadCityWeapon
			Offset 		= X:0 Y:0 Z:0
			FireDelay	= 0
			OneShot		= Yes
		End
	End

	Behavior = AttributeModifierAuraUpdate ModuleTag_DreadVisage
		StartsActive		= Yes ;If no, requires upgrade to turn on.
		BonusName		= DeadCityDebuff
		RefreshDelay	= 2000
		Range			= 300
		TargetEnemy		= Yes
		ObjectFilter	= ANY +STRUCTURE -EXPANSION_PAD ;
	End	
	
	Behavior = LifetimeUpdate ModuleTag_LifetimeUpdate		
			MinLifetime		= 30000
			MaxLifetime		= 30000
			DeathType		= FADED
	End
	
	Shadow		= SHADOW_DECAL
	ShadowSizeX = 120
	ShadowSizeY = 120
End