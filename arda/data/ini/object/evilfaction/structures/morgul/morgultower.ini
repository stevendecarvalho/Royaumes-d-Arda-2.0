		ModelName = mbNtower_bib
		;WeatherTexture		= SNOWY WBTower_Bib_S.tga
  		HideIfModelConditions	=	AWAITING_CONSTRUCTION
  		HideIfModelConditions	=	PARTIALLY_CONSTRUCTED
	End

  PlacementViewAngle  = 135

	; ***DESIGN parameters ***
	DisplayName         = OBJECT:MorgulBattleTower
	Description		= CONTROLBAR:ToolTipConstructMordorBattleTower
	Side                = Morgul
	EditorSorting       = STRUCTURE
	ThreatLevel = 1.0

	BuildCost           = 400 ;MORDOR_SENTRY_TOWER_BUILDCOST ;,; 400 ;;,;; 500
	BuildTime           = MORDOR_SENTRY_TOWER_BUILDTIME ;,; 45 ;;,;; 60 ; in seconds
	VisionRange         = VISION_BASE_DEFENSE
	ShroudClearingRange = SHROUD_CLEAR_BASE_DEFENSE

	CommandSet = MorgulBattleTowerCommandSet

	ArmorSet
		Conditions        = None
		Armor             = FortressExpansionArmor
	End

