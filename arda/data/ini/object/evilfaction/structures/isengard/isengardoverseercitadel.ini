//------------------------------------------------------------------------------
Object IsengardOverseerCitadel
;This citadel is summoned in Adventure: White Hand
	Scale = 1.0
	
	;; *** ART Parameters ***
	SelectPortrait = upwotrcitadelisengard

     Draw = W3DScriptedModelDraw ModuleTag_Draw
    OkToChangeModelColor  = Yes
    UseStandardModelNames = Yes

    DefaultModelConditionState  
      Model = IBCCenter
      ParticleSysBone	  = smokebone01 furnaceSparks
;      ParticleSysBone     = smokebone02 furnaceSmoke
;      ParticleSysBone	  = glowbone01 TorchGlow
;      ParticleSysBone     = glowbone02 TorchGlow
;      ParticleSysBone	  = glowbone03 TorchGlow
;      ParticleSysBone     = glowbone04 TorchGlow
    End

	ModelConditionState = WORLD_BUILDER
		Model = IBCCenterW
	End
    
	IdleAnimationState
	End

 ;  ------------Build Up States
    ModelConditionState   = BASE_BUILD
      Model               = IBCCenter_A
;      ParticleSysBone	  = NONE BuildingDoughnutCloud
      ParticleSysBone     = NONE BuildingContructDust
    End  

	AnimationState		  = BASE_BUILD
		Animation
			AnimationName = IBCCenter_A.IBCCenter_A
			AnimationMode = ONCE
			AnimationBlendTime = 0			
			AnimationSpeedFactorRange = 10.0 10.0 ; 300 frame anim, but need to shrink down to 5 seconds
		End		
		BeginScript
			CurDrawablePlaySound("DebrisDust")
			CurDrawablePlaySound("GondorBarracksBeginConstruction")
			CurDrawablePlaySound("BuildingTopple")
		EndScript
	End

    ModelConditionState   = JUST_BUILT
      Model               = IBCCenter_A
;      ParticleSysBone	  = NONE BuildingDoughnutCloud
      ParticleSysBone     = NONE BuildingContructDust
    End  

	AnimationState		  = JUST_BUILT
		Animation
			AnimationName = IBCCenter_A.IBCCenter_A
			AnimationMode = ONCE			
			AnimationBlendTime = 0
            AnimationSpeedFactorRange = 4.0 4.0
		End
        Flags = START_FRAME_FIRST
		;BeginScript
		;	CurDrawablePlaySound("DebrisDust")
		;	CurDrawableHideSubObject("FIRE02")
		;EndScript
	End


;------------Build Up States
    ModelConditionState   = ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
      Model               = IBCCenter_A
;      ParticleSysBone	  = NONE BuildingDoughnutCloud
      ParticleSysBone     = NONE BuildingContructDust
    End  

	AnimationState          = ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
		Animation
			AnimationName	= IBCCenter_A.IBCCenter_A
			AnimationMode   = MANUAL
		End
		StateName		= BeingConstructed
		BeginScript
			;CurDrawableHideSubObject("FIRE02")
			CurDrawablePlaySound("GondorBarracksBeginConstruction")
			CurDrawablePlaySound("BuildingTopple")
		EndScript
        Flags				= START_FRAME_FIRST
	End

    

    ModelConditionState  = DAMAGED
      Model         = IBCCenter_D1 
      ParticleSysBone Smokebone01 TrebuchetImpactSplinters
;      ParticleSysBone Smokebone02 furnaceSmoke
	

    End
    AnimationState = DAMAGED
     EnteringStateFX	= FX_BuildingDamaged
    End

    ModelConditionState  = REALLYDAMAGED
      Model         = IBCCenter_D2 
      ParticleSysBone Smokebone01 TrebuchetImpactSplinters
;      ParticleSysBone Smokebone02 furnaceSmoke
    End
    AnimationState = REALLYDAMAGED
     	EnteringStateFX	= FX_BuildingReallyDamaged
    End
    
    ModelConditionState  = RUBBLE
      Model         = IBCCenter_D2  
      ParticleSysBone Smokebone01 Explosion3
      ParticleSysBone Smokebone02 Explosion5
    End

    AnimationState = RUBBLE
	;EnteringStateFX	= FX_IsengardCitadelDie		;added to trigger BuildingSink audio but already being triggered in StructureCollapseUpdate module
    End

  	ModelConditionState  = POST_RUBBLE
		Model         = none
		ParticleSysBone NONE SmokeBuildingMediumRubble
	End
    AnimationState = POST_RUBBLE
    End
	
	ModelConditionState  = POST_COLLAPSE
		Model         = none
		ParticleSysBone NONE SmokeBuildingMediumRubble
	End
    AnimationState = POST_COLLAPSE
    End

  End


	// ***DESIGN parameters ***
	DisplayName         		= OBJECT:IsengardSummonedCitadel
	Side                		= Wild
	EditorSorting       		= STRUCTURE
	ThreatLevel					= FORTRESS_THREAT_LEVEL		; 1.0
;	CommandPointBonus			= GENERIC_FORTRESS_COMMAND_POINT_BONUS ;;,;; GENERIC_ECONOMY_COMMAND_POINT_BONUS

	BuildCost				= 0
	BuildTime				= 50.0 ;25.0           ; in seconds
	VisionRange				= 350.0 ;;,;; 160.0          
	ShroudClearingRange		= 550.0 ;;,;; 200

	CommandSet				= IsengardOverseerTowerCommandSet
	
	ArmorSet
		Conditions			= None
		Armor				= DolGuldurCitadelArmor	
	End

;	WeaponSet
;		Weapon				= PRIMARY FortressArrowTowerBow
;		AutoChooseSources		= PRIMARY FROM_PLAYER FROM_SCRIPT FROM_AI
;	End 
	
	// *** AUDIO Parameters ***

	VoiceSelect         			= GuldurFortressSelect
	VoiceSelectUnderConstruction		= BuildingGoodVoiceSelectUnderConstruction

	SoundOnDamaged				= BuildingLightDamageStone
	SoundOnReallyDamaged			= BuildingHeavyDamageStone

	UnitSpecificSounds
		UnderConstruction		= BuildingBigConstructionLoop	;// Built first time
		;//UnderRepairFromDamage	= NoSound						;// Repaired No animation on the building, so don't bother playing sound
		UnderRepairFromRubble		= BuildingBigConstructionLoop	;// Repaired from completely destroyed (not used???)
	End


	#include "..\..\..\Includes\StandardBuildingEvaEvents.inc"

;	CampnessValue = CAMPNESS_SUMMONED_CITADEL

	// *** ENGINEERING Parameters ***

	RadarPriority       	= STRUCTURE
	KindOf			= PRELOAD STRUCTURE IMMOBILE CASTLE_KEEP SELECTABLE FS_FACTORY AUTO_RALLYPOINT SCORE DONT_USE_CANCEL_BUILD_BUTTON SUMMONED MP_COUNT_FOR_VICTORY ;;.;; DOZER_FACTORY COMMANDCENTER VITAL_FOR_BASE_SURVIVAL ;; Removed GARRISONABLE_UNTIL_DESTROYED

	Behavior            	= GettingBuiltBehavior ModuleTag_GettingBuiltBehavior
		//WorkerName			= WildLaborerNoSelect
		UseSpawnTimerWithoutWorker 	= Yes
		SpawnTimer			= DEFAULT_STRUCTURE_HEALDELAY		
	End

     Behavior = CastleMemberBehavior ModuleTag_CMB
		BeingBuiltSound = BuildingBigConstructionLoop
     End 

	Behavior = TerrainResourceBehavior ModuleTag_NewMoneyDeadSpot
		Radius			= 80	;150	// How far we try to claim ground
		MaxIncome		= 0		// If we were to get all we wanted, how much we would earn.  Linear slope to 0 at 0% claim
		IncomeInterval		= 999999	// How often (in msec) we give that much money
		HighPriority		= Yes		// A high priority claim gets to pretend it was there first.
		Visible = No 		;// Don't show decal when a resource building is selected.
	End

	//-----------------------------------------------	
	Behavior = ProductionUpdate ProductionUpdateModuleTag
  		NumDoorAnimations            = 1
		DoorOpeningTime              = 3000  //in mSeconds how long you want doors to be in open state
		DoorWaitOpenTime             = 3000  //in mSeconds time the door stays open, so units can exit
		DoorCloseTime                = 3000  //in mSeconds how long you want doors to be in open state		
	End

	Behavior = QueueProductionExitUpdate ModuleTag_QueuePEU
		UnitCreatePoint   = X:0.0 Y:-10.0 Z:0.0
		NaturalRallyPoint = X:0.0 Y:-90.0 Z:0.0
		ExitDelay = STANDARD_HORDE_EXIT_DELAY
		PlacementViewAngle = -90
		UseReturnToFormation = No		
	End  
	
	//-----------------------------------------------
	Body                = StructureBody ModuleTag_05
		MaxHealth			= 2000 ;DWARVEN_SUMMONED_CITADEL_HEALTH
		MaxHealthDamaged  		= 1000 ;DWARVEN_SUMMONED_CITADEL_HEALTH_DAMAGED
		MaxHealthReallyDamaged 	  	= 500  ;DWARVEN_SUMMONED_CITADEL_HEALTH_REALLY_DAMAGED
	End
 
	Behavior                  = StructureCollapseUpdate ModuleTag_08
		MinCollapseDelay        = 000
		MaxCollapseDelay        = 000
		CollapseDamping         = .5
		MaxShudder              = 0.6
		MinBurstDelay           = 250
		MaxBurstDelay           = 800
		BigBurstFrequency       = 4
		FXList                  = INITIAL   FX_StructureMediumCollapse
		FXList                  = ALMOST_FINAL  FX_StructureAlmostCollapse
		DestroyObjectWhenDone	= Yes
		CollapseHeight		= 155
	End
	
	MaxSimultaneousOfType		= 2

	Behavior = AIUpdateInterface ModuleTag_SoWeCanUseWeapon
		AutoAcquireEnemiesWhenIdle	= Yes
		MoodAttackCheckRate		= 250
	End

// money maker ;;,;; added for 2.02d
	;Behavior = AutoDepositUpdate AutoDepositModuleTag
	;	DepositTiming       	= GENERIC_KEEP_MONEY_TIME
	;	DepositAmount       	= GENERIC_KEEP_MONEY_AMOUNT 
	;	InitialCaptureBonus 	= 0  ;// no initial bonus
	;End
	
	Behavior = FireWeaponWhenDeadBehavior FireDeadTag1
		DeathTypes					= ALL
		StartsActive				= Yes
		ActiveDuringConstruction	= Yes
		DeathWeapon					= DolGuldurGarrsionDeath
	End

    ;-------------------------------------------------------------------------
	; Industry Eco Bonus
	;-------------------------------------------------------------------------
    Behavior = GrantUpgradeCreate ModuleTag_GrantUpgrade
		UpgradeToGrant	= Upgrade_GondorStableLevel2
	End

	Behavior = PassiveAreaEffectBehavior ModuleTag_IsengardIndustryAreaBuff
		EffectRadius				= 400
		PingDelay					= 2000
		UpgradeRequired 			= Upgrade_GondorStableLevel2
		ModifierName				= IsengardCitadelEconomyBonus
		AllowFilter					= NONE +IsengardArmory +IsengardFurnace +IsengardFurnace_ForAI +IsengardLumberMill +IsengardLumberMill_ForAI ALLIES SAME_PLAYER
	End

	Behavior = StatusBitsUpgrade ModuleTag_FakeOut
		TriggeredBy	= Upgrade_GondorStableLevel2
	End

;-------------------------------------------------------------------------------
;------------------------- EXCAVATIONS -----------------------------------------
;-------------------------------------------------------------------------------
    Behavior = ObjectCreationUpgrade ModuleTag_EscavationsTrigger
        TriggeredBy = Upgrade_AngmarFortressIceMunitions
        GrantUpgrade = Upgrade_GondorStableLevel3
    End

	Behavior = PassiveAreaEffectBehavior ModuleTag_FeelGoodHero
	    UpgradeRequired			= Upgrade_GondorStableLevel3  ;TriggeredBy				= Upgrade_IsengardFortressExcavations
		EffectRadius			= 400 ;GONDOR_STATUE_AOE_RADIUS
		PingDelay				= 2000
		ModifierName			= ExcavationsStructureLeadership
		AllowFilter				= NONE +STRUCTURE -IsengardBattleTower -DunlendingLonghouse -DunlendingLonghouseFoundation -IsengardFurnace -IsengardFurnaceFoundation -IsengardFurnace_ForAI -COMMANDCENTER -IsengardFortress -IsengardFortressCitadel -IsengardTowerExpansion -IsengardMineLauncherExpansion -IsengardBallistaExpansion -IsengardCastleWallHubExpansion -EXPANSION_PAD
	End

	Behavior = PassiveAreaEffectBehavior ModuleTag_FeelGoodHero_BattleTower
	    UpgradeRequired			= Upgrade_GondorStableLevel3  ;TriggeredBy				= Upgrade_IsengardFortressExcavations
		EffectRadius			= 400 ;GONDOR_STATUE_AOE_RADIUS
		PingDelay				= 2000
		ModifierName			= ExcavationsStructureLeadership_BattleTower
		AllowFilter				= NONE +IsengardBattleTower
	End

	Behavior = PassiveAreaEffectBehavior ModuleTag_FeelGoodHero_Furnace&Longhouse
	    UpgradeRequired			= Upgrade_GondorStableLevel3  ;TriggeredBy				= Upgrade_IsengardFortressExcavations
		EffectRadius			= 400 ;GONDOR_STATUE_AOE_RADIUS
		PingDelay				= 2000
		ModifierName			= ExcavationsStructureLeadership_Furnace&Longhouse
		AllowFilter				= NONE +IsengardFurnace +IsengardFurnaceFoundation +IsengardFurnace_ForAI +DunlendingLonghouse +DunlendingLonghouseFoundation
	End
;--------------------------------------------------------------------------------
	
	; Behavior = CitadelSlaughterHordeContain ModuleTag_SlaughterMe ;;,;; added for 2.02f
		; PassengerFilter					= GENERIC_FACTION_SLAUGHTERABLE
		; ObjectStatusOfContained			= UNSELECTABLE ENCLOSED
		; CashBackPercent					= 200%		
		; ContainMax						= 99	// give it a huge capacity, just in case player sends his whole army in at once
		; AllowEnemiesInside				= No
		; AllowAlliesInside				= No
 		; AllowNeutralInside				= No
 		; AllowOwnPlayerInsideOverride	= Yes
		; EnterSound						= GUI_RingReturned
		; EntryOffset						= X:-125.0 Y:0.0 Z:0.0
		; EntryPosition					= X:-30.0 Y:0.0 Z:0.0
		
		; ExitOffset						= X:125.0 Y:0.0 Z:0.0
		; StatusForRingEntry				= HOLDING_THE_RING
		; ;StatusForRingEntry				= USER_DEFINED_2		
		; UpgradeForRingEntry				= Upgrade_RingHero Upgrade_FortressRingHero ;;,;; CE graphics fix
		; ObjectToDestroyForRingEntry		= NONE +TheDroppedRing
		; FXForRingEntry					= FX_OneRingFlare
	; End
	

	//Main
	Geometry              	= CYLINDER
	GeometryMajorRadius   	= 32
	GeometryMinorRadius   	= 32
	GeometryHeight        	= 150

	GeometryIsSmall			= No
	Shadow					= SHADOW_VOLUME

	GeometryContactPoint = X:-90		Y:82		Z:0			Repair
	GeometryContactPoint = X:84			Y:-79		Z:0			Repair
	GeometryContactPoint = X:5.576		Y:44.987	Z:0
	GeometryContactPoint = X:-38.348	Y:-42.113	Z:0
	GeometryContactPoint = X:-28.448	Y:-0.003	Z:75.14		Swoop


End

Object CitadelExcavationsUpgradeGranter

  EvaEnemyObjectSightedEvent = None ; Not a real unit

	ArmorSet
		Conditions	  = None
		Armor		   = PingArmor
		DamageFX		= NormalDamageFX
	End

 ; ***DESIGN parameters ***

  EditorSorting   = SYSTEM
  KindOf = NO_COLLIDE CREEP IGNORE_FOR_VICTORY IGNORE_FOR_EVA_SPEECH_POSITION SUMMONED;INERT

	ThreatLevel			= 0.0
	VisionRange		= 0
	ShroudClearingRange	= 0

 ; *** ENGINEERING Parameters ***

	Body = ActiveBody ModuleTag_Body;Can take damage, but won't die.  Can only die from ::kill() or other unresistable damage
		MaxHealth	  = 1.0
	End

	Behavior = DestroyDie ModuleTag_Die
	End

	Behavior = LifetimeUpdate ModuleTag_HatchTrigger
		MinLifetime = 1000.0
		MaxLifetime = 1000.0
		DeathType		= FADED
	End

	Behavior = AttachUpdate ModuleTag_Attach
		ObjectFilter = NONE +STRUCTURE SAME_PLAYER
		ScanRange = 20
		AlwaysTeleport = No
		AnchorToTopOfGeometry = Yes
	End

	Behavior = AIUpdateInterface	ModuleTag_AIUpdateInterface
		AutoAcquireEnemiesWhenIdle = No
	End

	LocomotorSet
		Locomotor = InvisiblePingLocomotor
		Condition = SET_NORMAL
		Speed	 = 1000
	End

	Behavior = SlavedUpdate ModuleTag_Slave
		UseSlaverAsControlForEvaObjectSightedEvents = Yes
		DieOnMastersDeath	= Yes	;//Die when my master dies!
	End

    Behavior = GrantUpgradeCreate ModuleTag_ExcavationsGranter ;;,;; added
		UpgradeToGrant		= Upgrade_AngmarFortressIceMunitions
		;GiveOnBuildComplete = Yes ;// The ExemptStatus UnderConstruction hack doesn't work on foundation buildings.
	End

	Behavior = SlowDeathBehavior ModuleTag_SlowDeath
		DeathTypes			= NONE +FADED
		FadeDelay			= 0
		FadeTime			= 0
		DestructionDelay	= 1800
		DeathFlags			= DEATH_3
		ShadowWhenDead = No
	End

End
