Object AngmarJaggedSpireExpansion

	SelectPortrait 	= BPAngmarJaggedSpire
	ButtonImage  	=  BIAngmarSpireExpansion

	Draw = W3DScriptedModelDraw ModuleTag_01
		ExtraPublicBone	= ARROW01
		ExtraPublicBone	= ARROW02
		ExtraPublicBone	= ARROW03
		ExtraPublicBone	= ARROW04
		ExtraPublicBone	= ARROW05
		
		DefaultModelConditionState
			Model               = kbNforttwr_skn
		End
	End

	Side = Angmar
	EditorSorting = STRUCTURE
	BuildCost           = 400
	BuildTime           = WILD_ARROWDENEXPANSION_BUILD_TIME
	BuildVariations = AngmarJaggedSpireExpansionA AngmarJaggedSpireExpansionB
	KindOf              = PRELOAD STRUCTURE SELECTABLE IMMOBILE SCORE NEED_BASE_FOUNDATION FS_BASE_DEFENSE MADE_OF_STONE CAN_ATTACK	 SPAWNS_ARE_THE_WEAPONS

End

