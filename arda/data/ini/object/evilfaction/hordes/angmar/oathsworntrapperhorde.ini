;//--------------------------------------------------------------------------------------------------
Object OathswornTrapperHorde

  SelectPortrait  =  UPAngmarOathswornTrapper
  ButtonImage = UIAngmarOathswornTrapper

	Draw = W3DScriptedModelDraw ModuleTag_W3DModelDraw
	    DependencySharedModelFlags = EMOTION_ALERT EMOTION_MORALE_HIGH EMOTION_MORALE_LOW EMOTION_AFRAID EMOTION_COWER SELECTED EMOTION_TERROR EMOTION_LOOK_TO_SKY EMOTION_TAUNTING
		DefaultModelConditionState
			Model = None //InvisHrdeTmp5x2
		End
		ModelConditionState = HORDE_EMPTY
			Model = None
		End		
		
		ModelConditionState = WORLD_BUILDER
			Model = HordeMarkGURan
		End
	End
	
	Side 			= Angmar
	EditorSorting 		= UNIT
	EmotionRange 		= 240
	DisplayName 		= OBJECT:OathswornTrapperHorde
	DisplayNameStrategic 	= CONTROLBAR:LW_Unit_AngmarDarkRangerHorde
	DescriptionStrategic 	= CONTROLBAR:LW_ToolTip_AngmarDarkRangerHorde
	
	WeaponSet
		Conditions 	= None 
		Weapon 		= PRIMARY    GondorRangerMissileHordeRangefinder
		Weapon 		= TERTIARY   GondorRangerMissileHordeRangefinderBombard
		AutoChooseSources = TERTIARY FROM_PLAYER FROM_SCRIPT				; Not AI.
	End

	// *** AUDIO Parameters ***
	// Note: Don't put voice parameters here -- they will be ignored. Voice play requests
	// are always passed through to members
	#include "..\..\..\includes\StandardHordeEvaEvents.inc"


	BuildCost 		= 650
	BuildTime 		= ANGMAR_RANGER_BUILDTIME
	VisionRange 		= ANGMAR_RANGER_HORDE_VISION_RANGE
	ShroudClearingRange 	= ANGMAR_RANGER_HORDE_SHROUD_RANGE
	VisionSide 		= 50%
	VisionRear 		= 25%
	MaxVisionBonusPercent 	= 300%
	VisionBonusTestRadius 	= 200
	VisionBonusPercentPerFoot = 1.0%
	CommandPoints 		= 90		; originally 60
		
 	CrushableLevel 		= 0  		//What am I?:        0 = for infantry, 1 = for trees, 2 = general vehicles
	CrusherLevel 		= 0
	UseCrushAttack 		= No		;Archer hordes cannot crush or Bombard will not work

	FormationWidth 		= 2 		// Width it occupies in formations. Current choices are 1 or 2.
	FormationDepth 		= 1 		// Depth it occupies in formations. Current choices are 1 or 2.
	
    TransportSlotCount = TRANSPORTSLOTCOUNT_SMALL_HORDE
	KindOf = SELECTABLE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT INFANTRY HORDE ARCHER ARMY_SUMMARY LARGE_RECTANGLE_PATHFIND//UNATTACKABLE 
	CamouflageDetectionMultiplier 	= CAMOUFLAGE_DETECTION_DISTANCE_LONG
	
	Body = ImmortalBody ModuleTag_ImmortalBody
		MaxHealth = 1
	End
	
	ThreatLevel = GONDOR_RANGER_HORDE_THREAT
	ThreatBreakdown GondorRangerHorde_DetailedThreat
		AIKindOf = ARCHER
	End
	
	#include "..\..\..\includes\CaptureBuilding.inc"
	
	Behavior = StancesBehavior ModuleTag_StancesBehavior
        StanceTemplate = ArcherHorde
    End

	Behavior = HordeAIUpdate ModuleTag_HordeAIUpdate
		AutoAcquireEnemiesWhenIdle 	= Yes ATTACK_BUILDINGS STEALTHED
		MoodAttackCheckRate        	= 500
		MaxCowerTime			= 5000
		MinCowerTime			= 3000
		CanAttackWhileContained    	= Yes  						// Can fire out of garrisoned building		
        AILuaEventsList				= InfantryFunctions
        AttackPriority				= AttackPriority_Archer
	End

	Behavior = HordeContain ModuleTag_HordeContain
		FrontAngle 			= 270
		FlankedDelay = 500
		ObjectStatusOfContained 	= 
		InitialPayload 			= OathswornTrapper 10	; GOOD_MEN_HORDE_SIZE
		Slots 				= 10						// originally 10
		PassengerFilter 		= NONE +INFANTRY
		ShowPips 			= No
		ThisFormationIsTheMainFormation = Yes						//Used to determine which armorset to use (and anything else we want!)
		RandomOffset			= X:3 Y:3
		MeleeBehavior 			= Amoeba
		End
		
		BannerCarriersAllowed	= OathswornBanner					; types of units that are allowed as banner carriers
		BannerCarrierPosition	= UnitType:OathswornTrapper	Pos:X:70.0 Y:0.0	; (DEFAULT) position of banner carrier
		
		RankInfo = RankNumber:1 UnitType:OathswornTrapper Position:X:50 Y:0			Position:X:50 Y:20				Position:X:50 Y:-20				Position:X:50 Y:40				Position:X:50 Y:-40
		RankInfo = RankNumber:2 UnitType:OathswornTrapper Position:X:30 Y:0 Leader 1 0	Position:X:30 Y:20 Leader 1 1	Position:X:30 Y:-20 Leader 1 2	Position:X:30 Y:40 Leader 1 3	Position:X:30 Y:-40 Leader 1 4

		RanksToReleaseWhenAttacking 	= 1 2 
		AlternateFormation = OathswornTrapperHordeAmbush				
		MeleeAttackLeashDistance 	= 1   			// How far the hordes	can	move from the center of	the	horde when melee attacking.				  
		BackUpMinDelayTime		= 1			// The minimum amount of	time to	delay before backing up
		BackUpMaxDelayTime		= 3000			// The maximum amount of	time to	delay before backing up
		BackUpMinDistance		= 1			// The minimum number of	cells to backup
		BackUpMaxDistance		= 3			// The maximum number of	cells to backup
		BackupPercentage		= 80%			// The amount of	chance that	a unit will	back up.
	End

	Behavior = PhysicsBehavior ModuleTag_PhysicsBehavior
		GravityMult = 1.0
	End
	
   	Behavior = EmotionTrackerUpdate	Module_EmotionTracker
		TauntAndPointDistance		=	INFANTRY_TAUNT_POINT_RADIUS		// max distance to taunted/pointed objet
		TauntAndPointUpdateDelay	=	1000		// how often scan (milliseconds)
		TauntAndPointExcluded		=	NONE
 		AfraidOf			=	AOTR_EMOTION_AFRAIDOF_OBJECTFILTER
		AlwaysAfraidOf			=	EMOTION_ALWAYS_AFRAIDOF_OBJECTFILTER
 		PointAt				=	EMOTION_POINTAT_OBJECTFILTER
		HeroScanDistance		=	150
		FearScanDistance		=	ARCHER_FEAR_SCAN_RADIUS

		AddEmotion		=	Terror_Base
		AddEmotion		=	Doom_Base
		AddEmotion		=   	BraceForBeingCrushed_Base
		AddEmotion		=	UncontrollableFear_Base
		AddEmotion		=	FearIdle_Base
		AddEmotion		=	FearBusy_Base
		AddEmotion		=	Point_Base 		
 		AddEmotion	=	CheerIdle_Base
		AddEmotion	=	CheerBusy_Base
		AddEmotion	=	HeroCheerIdle_Base
		AddEmotion	=	HeroCheerBusy_Base
		AddEmotion	=	Alert_Base
	End	
	
		Behavior = InvisibilityUpdate ModuleTag_ElvenCamouflage	;;,;; Added for 2.3
		InvisibilityNugget
			InvisibilityType	= CAMOUFLAGE
			DetectionRange		= CAMOUFLAGE_RADIUS
			ForbiddenConditions	= AWAY_FROM_TREES FIRING_ANY ; Hobbits are extra stealthy so they can remain invisible while moving in trees
		End
		UpdatePeriod			= 2000
		StartsActive			= Yes
		; This is the only way to get different move-to-trees voices on different units with this being
		; in an include file.
		UnitSpecificSoundNameToUseAsVoiceMoveToStealthyArea = VoiceMoveToTrees
		UnitSpecificSoundNameToUseAsVoiceEnterStateMoveToStealthyArea = VoiceEnterStateMoveToTrees
	End	
		
	LocomotorSet
		Locomotor     = NormalRangedHordeLocomotor
		Condition     = SET_NORMAL
		Speed         = NORMAL_FOOT_MED_HORDE_SPEED
	End

	CommandSet = OathswornTrapperHordeCommandSet

	;-----------------------------------------------------------------------------
	;	Serrated Blades
	;-----------------------------------------------------------------------------
	Behavior = UnpauseSpecialPowerUpgrade ModuleTag_KnottedStringsEnabler
		SpecialPowerTemplate = SpecialAbilityKnottedStrings
		TriggeredBy = Upgrade_ObjectLevel2
	End
	Behavior = HordeDispatchSpecialPower ModuleTag_KnottedStringsDispatch
		SpecialPowerTemplate		= SpecialAbilityKnottedStrings
		StartsPaused		  		= Yes
	End
	Behavior = AutoAbilityBehavior ModuleTag_AppetiteDestructionAutoAbility ;;,;;
		SpecialAbility				= SpecialAbilityKnottedStrings
		ForbiddenStatus = INSIDE_GARRISON
		MaxScanRange				= 200
		Query						= 1 ALL ENEMIES -WALL_UPGRADE -WALL_HUB -WALL_SEGMENT -DEFENSIVE_WALL
	End
	;-----------------------------------------------------------------------------
	
	Behavior = ProductionUpdate ProductionUpdateModuleTag
		GiveNoXP = Yes
	End

	Behavior = LevelUpUpgrade ModuleTag_BasicTraining
		TriggeredBy = Upgrade_GuldurBasicTraining
		LevelsToGain = 1
		LevelCap = 2
	End
	
	Behavior = PickupStuffUpdate ModuleTag_PickupStuffUpdate
		SkirmishAIOnly = Yes
		StuffToPickUp = NONE +CRATE
		ScanRange = 200
		ScanIntervalSeconds = 0.5
	End	
	
	/////////////////////
	// AISpecialPowers
	/////////////////////
	
	Behavior = AISpecialPowerUpdate GondorRangerHordeCaptureBuildingAI
		CommandButtonName = Command_CaptureBuilding
		SpecialPowerAIType = AI_SPECIAL_POWER_CAPTURE_BUILDING
	End
	
	Behavior = AISpecialPowerUpdate GondorFighterHordeStanceBattle
		CommandButtonName = Command_SetStanceBattle
		SpecialPowerAIType = AI_SPECIAL_POWER_STANCEBATTLE
	End

	Behavior = AISpecialPowerUpdate GondorFighterHordeStanceAggressive
		CommandButtonName = Command_SetStanceAggressive
		SpecialPowerAIType = AI_SPECIAL_POWER_STANCEAGGRESSIVE
	End

	Behavior = AISpecialPowerUpdate GondorFighterHordeHoldGround
		CommandButtonName = Command_SetStanceHoldGround
		SpecialPowerAIType = AI_SPECIAL_POWER_STANCEHOLDGROUND
	End

	Geometry = BOX
	GeometryMajorRadius = 20.0
	GeometryMinorRadius = 60.0
	GeometryHeight = 10.0
	GeometryIsSmall = No
	
	
	// *** AUTO RESOLVE DATA *** 
	AutoResolveUnitType = AutoResolveUnit_Archer
	AutoResolveCombatChain = AutoResolve_ArcherCombatChain
	
	AutoResolveBody = AutoResolve_AngmarDarkRangerHordeBody ;;,;; AutoResolve_GondorRangerHordeBody

	AutoResolveArmor
		Armor = AutoResolve_AngmarRangerArmor ;;,;; AutoResolve_GondorRangerArmor
	End

	AutoResolveWeapon
		RequiredUpgrades = Upgrade_AngmarIceArrows
		Weapon = AutoResolve_AngmarEliteArcherUpgradedWeapon ;;,;; AutoResolve_GondorRangerUpgradedWeapon
	End

	AutoResolveWeapon
		ExcludedUpgrades = Upgrade_AngmarIceArrows
		Weapon = AutoResolve_AngmarEliteArcherWeapon ;;,;; AutoResolve_GondorRangerWeapon
	End
	
	WorldMapArmoryUpgradesAllowed = Upgrade_AngmarBasicTraining Upgrade_AngmarIceArrows
End

//------------------------------------------------------------------------------
ChildObject OathswornTrapperHordeAmbush OathswornTrapperHorde

	// Note - for alternate formations, all info outside of the Contain Behavior module is ignored.
	// Any modifications need to be done via the Attribute Modifiers in the contain module. 
	Behavior = HordeContain ModuleTag_HordeContain
		FrontAngle						= 270
		FlankedDelay = 500
		ObjectStatusOfContained			= 
		InitialPayload					= OathswornTrapper 10
		Slots							= 10
		PassengerFilter					= NONE +INFANTRY
		ShowPips						= No
		ThisFormationIsTheMainFormation = No
		AttributeModifiers				= OathswornTrapperAmbush
		RandomOffset					= X:3 Y:3
		MeleeBehavior = Amoeba
			;FacingBonus	= 30.0
			;AngleLimitCos	= -0.17
			;InnerRange	= 5
			;OuterRange	= 10
			;OuterRangeBuildings	= 140
		End
		
		; Banner Carrier info		
		BannerCarriersAllowed		= OathswornBanner				; types of units that are allowed as banner carriers
		BannerCarrierPosition		= UnitType:OathswornTrapper	Pos:X:70.0 Y:0.0	; (DEFAULT) position of banner carrier	
		
		RankInfo = RankNumber:1 UnitType:OathswornTrapper Position:X:50 Y:0		Position:X:50 Y:30		Position:X:50 Y:-30		Position:X:50 Y:60		Position:X:50 Y:-60
		RankInfo = RankNumber:2 UnitType:OathswornTrapper Position:X:30 Y:0 Leader 1 0	Position:X:30 Y:30 Leader 1 1	Position:X:30 Y:-30 Leader 1 2	Position:X:30 Y:60 Leader 1 3	Position:X:30 Y:-60 Leader 1 4
		
		RanksToReleaseWhenAttacking = 1 2
			
		AlternateFormation = OathswornTrapperHorde
		MeleeAttackLeashDistance = 50   //How far the hordes	can	move from the center of	the	horde when melee attacking.				  
		BackUpMinDelayTime		 = 1	//The minimum amount of	time to	delay before backing up
		BackUpMaxDelayTime		 = 3000	//The maximum amount of	time to	delay before backing up
		BackUpMinDistance		 = 1	//The minimum number of	cells to backup
		BackUpMaxDistance		 = 3	//The maximum number of	cells to backup
		BackupPercentage		 = 80%	//The amount of	chance that	a unit will	back up.		
	End	
End