		RankInfo = RankNumber:1 UnitType:MorgulShieldbearer   Position:X:10 Y:6.5   Position:X:10 Y:-6.5   Position:X:10 Y:19.5   Position:X:10 Y:-19.5  Position:X:10 Y:32.5   Position:X:10 Y:-32.5

		RanksToReleaseWhenAttacking = 1

		AlternateFormation		= MorgulShieldbearerHorde
