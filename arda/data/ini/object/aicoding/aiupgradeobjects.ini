;//Ces objets servent à déclencher le mécanisme de sécurité de mise à niveau de l'IA, qui lui accorde
;//des améliorations si elle ne les a pas achetées après un certain délai

Object AIUpgradeGranter

    ;/////////////////////////
    ;// PARAMÈTRES GÉNÉRAUX //
    ;/////////////////////////
    
    Side                                = Obsolete
    EditorSorting                       = SYSTEM
    
    ThreatLevel                         = 0.0
    VisionRange                         = 0
    ShroudClearingRange                 = 0



    ;/////////////////////
    ;// ARMES & ARMURES //
    ;/////////////////////

    ArmorSet
        Conditions                          = None
        Armor                               = PingArmor
        DamageFX                            = NormalDamageFX
    End

    ;//////////////////////
    ;// PARAMÈTRES AUDIO //
    ;//////////////////////
    
    EvaEnemyObjectSightedEvent          = None



    ;/////////////////////////////
    ;// PARAMÈTRES D'INGÉNIERIE //
    ;/////////////////////////////
    
    KindOf                              = NO_COLLIDE CREEP IGNORE_FOR_VICTORY IGNORE_FOR_EVA_SPEECH_POSITION SUMMONED



    ;/////////////////////////
    ;// PARAMÈTRES DE SANTÉ //
    ;/////////////////////////
    
    Body                                = ActiveBody ModuleTag_Body
        MaxHealth                           = 1.0
    End



    ;///////////////////////////////
    ;// INTELLIGENCE ARTIFICIELLE //
    ;///////////////////////////////
    
    Behavior                            = AIUpdateInterface ModuleTag_AIUpdateInterface
        AutoAcquireEnemiesWhenIdle          = No
    End



    ;///////////////
    ;// LOCOMOTOR //
    ;///////////////
    
    LocomotorSet
        Locomotor                           = InvisiblePingLocomotor
        Condition                           = SET_NORMAL
        Speed                               = 1000
    End



    ;////////////////
    ;// MORT LENTE //
    ;////////////////
    
    Behavior                            = DestroyDie ModuleTag_Die
    End



    ;///////////
    ;// TIMER //
    ;///////////
    
    Behavior                            = LifetimeUpdate ModuleTag_HatchTrigger
        MinLifetime                         = 1000.0
        MaxLifetime                         = 1000.0
        DeathType                           = FADED
    End



    ;/////////////
    ;// ESCLAVE //
    ;/////////////
    
    Behavior                            = AttachUpdate ModuleTag_Attach
        ObjectFilter                        = NONE +STRUCTURE SAME_PLAYER
        ScanRange                           = 20
        AlwaysTeleport                      = No
        AnchorToTopOfGeometry               = Yes
    End
    
    Behavior                            = SlavedUpdate ModuleTag_Slave
        UseSlaverAsControlForEvaObjectSightedEvents = Yes
        DieOnMastersDeath                   = Yes
    End
    
    Behavior                            = SlowDeathBehavior ModuleTag_SlowDeath
        DeathTypes                          = NONE +FADED
        FadeDelay                           = 0
        FadeTime                            = 0
        DestructionDelay                    = 1800
        DeathFlags                          = DEATH_3
        ShadowWhenDead                      = No
    End
End





ChildObject LateGameUpgradeGranter AIUpgradeGranter
    Behavior                            = GrantUpgradeCreate ModuleTag_GH23
        UpgradeToGrant                      = Upgrade_AILategameTrigger
    End
End





ChildObject MirkwoodBasicTrainingGranter AIUpgradeGranter
    Behavior                            = GrantUpgradeCreate ModuleTag_GH23
        UpgradeToGrant                      = Upgrade_TechnologyMirkwoodBasicTraining
    End
End

ChildObject MirkwoodForgedBladesGranter AIUpgradeGranter
    Behavior                            = GrantUpgradeCreate ModuleTag_GH23
        UpgradeToGrant                      = Upgrade_TechnologyMirkwoodForgedBlades
    End
End

ChildObject MirkwoodFireArrowsGranter AIUpgradeGranter
    Behavior                            = GrantUpgradeCreate ModuleTag_GH23
        UpgradeToGrant                      = Upgrade_TechnologyMirkwoodSilverthornArrows
    End
End






