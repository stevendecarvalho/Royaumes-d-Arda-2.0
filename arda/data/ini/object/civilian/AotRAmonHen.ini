Object AotRAmonHenSeeingSeat01

  ; *** ART Parameters ***
  Draw = W3DScriptedModelDraw ModuleTag_01
  OkToChangeModelColor = Yes

    DefaultModelConditionState
      Model = cbNamon01
    End

    WallBoundsMesh = P1
	RampMesh1 = R1

    ModelConditionState  = RUBBLE
      Model         = cbNamon01
      ParticleSysBone SmokeLarge01 SmokeBuildingLarge
    End

    ModelConditionState  = POST_RUBBLE
      Model         = None
      ParticleSysBone NONE SmokeBuildingMediumRubble
    End

    ModelConditionState  = POST_COLLAPSE
      Model         = None
      ParticleSysBone NONE SmokeBuildingMediumRubble
    End
  End

  ; *** AUDIO Parameters ***
  SoundAmbientDamaged = GenericFireMediumLoop
  SoundAmbientReallyDamaged = GenericFireLargeLoop

  ; ***DESIGN parameters ***
  DisplayName      = OBJECT:Ruins

  EditorSorting   = STRUCTURE
  ArmorSet
    Conditions        = None
    Armor             = NoArmor
    DamageFX          = None
  End

  ; *** ENGINEERING Parameters ***
	KindOf = STRUCTURE IMMOBILE WALK_ON_TOP_OF_WALL CHUNK_VENDOR NOT_AUTOACQUIRABLE IGNORE_FOR_VICTORY NEVER_CULL_FOR_MP DONT_HIDE_IF_FOGGED
  RadarPriority = STRUCTURE

	Body						= ActiveBody ModuleTag_05
		MaxHealth				= 10000.0
		MaxHealthDamaged		= 50.0
		MaxHealthReallyDamaged  = 15.0
	End

  ; Note that structures with "RUBBLE" states should not use DestroyDie; such buildings are
  ; never truly destroyed, even when reduced to zero health. Also note that garrisonable
  ; buildings automatically stick around because GarrisonContain has it's own DieModule
  Behavior = SlowDeathBehavior ModuleTag_SlowDeathWithoutRubble
      DestructionDelay  = 2100
  End

  Behavior                  = StructureCollapseUpdate ModuleTag_03
    MinCollapseDelay        = 000
    MaxCollapseDelay        = 000
    CollapseDamping         = .5
    MaxShudder              = 0.6
    MinBurstDelay           = 250
    MaxBurstDelay           = 800
    BigBurstFrequency       = 4
    FXList                  = INITIAL   FX_StructureMediumCollapse
    OCL						= INITIAL	OCL_StructureRubblePileLarge ; creates a rising pile of debris halfway-done
  End


  	Behavior = AttributeModifierAuraUpdate ModuleTag_WallBonus
		StartsActive	= Yes ;If no, requires upgrade to turn on.
		BonusName		= WallBonus
		RefreshDelay	= 2000
		;Range			= 120		; Range is overridden to affect people on us since we are a wall
		;TargetEnemy		= Yes	; Alliances are ignored to affect people on us since we are a wall
	End

  Geometry              = BOX
  GeometryMajorRadius   = 47.0
  GeometryMinorRadius   = 10.5
  GeometryHeight        = 44.0
  GeometryOffset		= X:-28.0 Y:-27.0 Z:0
  
  AdditionalGeometry    = BOX
  GeometryMajorRadius   = 47.0
  GeometryMinorRadius   = 10.5
  GeometryHeight        = 44.0
  GeometryOffset		= X:-28 Y:27.0 Z:0
  
  ;AdditionalGeometry    = BOX
  ;GeometryMajorRadius   = 5.75
  ;GeometryMinorRadius   = 5.25
  ;GeometryHeight        = 44.0
  ;GeometryOffset		= X:51.0 Y:28.0 Z:0
  
  ;AdditionalGeometry    = BOX
  ;GeometryMajorRadius   = 5.75
  ;GeometryMinorRadius   = 5.25
  ;GeometryHeight        = 44.0
  ;GeometryOffset		= X:51.0 Y:-28.0 Z:0
  
  AdditionalGeometry    = BOX
  GeometryMajorRadius   = 14.35
  GeometryMinorRadius   = 36.35
  GeometryHeight        = 44.0
  GeometryOffset		= X:-60.0 Y:0.3 Z:0

  GeometryIsSmall       = No
  Shadow                = SHADOW_VOLUME

End

