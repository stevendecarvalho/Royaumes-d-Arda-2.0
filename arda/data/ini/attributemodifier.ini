;// Ensemble de bonus pouvant être attribués sous forme de package. Vous ne pouvez pas recevoir la même liste deux fois simultanément, mais vous pouvez avoir deux listes différentes ayant le même effet.

;//	Catégorie =
;// LEADERSHIP, 			// Charisme
;//	FORMATION, 				// Formation
;//	SPELL, 					// Sort
;//	WEAPON, 				// Arme
;//	STRUCTURE, 				// Structure
;//	LEVEL, 					// Niveau
;//	BUFF, 					// Bonus
;//	DEBUFF, 				// Malus
;//	STUN, 					// Paralysie
;//	INNATE_ARMOR,			// Armure permanente du Héros personnalisé.
;//	INNATE_DAMAGEMULT		// Multiplicateur de dégâts permanent du Héros personnalisé.
;// INNATE_VISION			// Portée de vision permanente du Héros personnalisé.
;// INNATE_AUTOHEAL			// Soin automatique permanent du Héros personnalisé.
;// INNATE_HEALTH			// Santé permanente du Héros personnalisé.

;// En général, les bonus additifs devraient être d'environ 20% pour donner un bonus, et les bonus multiplicatifs d'environ 120%.

;// Modificateur =
;//	ARMOR,					// Additif. Les coefficients d'armure du fichier Armor.ini servent d'abord à multiplier les dégâts. Ensuite, tous ces coefficients sont additionnés, plafonnés à la protection AttributeModifierArmorMaxBonus de GameData, puis les dégâts sont à nouveau multipliés par ce coefficient.
;//	DAMAGE_ADD,				// Additif. Les dégâts de base sont augmentés de ce coefficient avant d'atteindre DamageMult.
;//	DAMAGE_MULT,			// Multiplicatif.
;//	RESIST_FEAR,			// Additif. Somme de ces valeurs (PEUR, CONDAMNATION, PEUR INCONTRÔLABLE).
;//	RESIST_TERROR,			// Additif. Somme de ces valeurs (TERREUR).
;//	EXPERIENCE,				// Multiplicatif.
;//	SPEED,					// Multiplicatif.
;//	CRUSH_DECELERATE,		// Multiplicatif.
;//	RESIST_KNOCKBACK,		// Additif.
;//	SPELL_DAMAGE,			// Multiplicatif.
;//	RECHARGE_TIME,			// Multiplicatif.
;//	PRODUCTION,				// Multiplicatif.
;//	HEALTH,					// Additif.
;//	HEALTH_MULT,			// Multiplicatif.
;//	VISION,					// Additif.
;// RANGE                   // Multiplicatif.
;//	BOUNTY_PERCENTAGE		// Multiplicatif.
;//	MIN_CRUSH_VELOCITY_PERCENTAGE
;//	AUTO_HEAL,				// Additif.
;//	SHROUD_CLEARING,		// Additif.
;//	RATE_OF_FIRE,			// Multiplicatif. 
;//	DAMAGE_STRUCTURE_BOUNTY_ADD	// Additif.
;//	COMMAND_POINT_BONUS		// Additif.
;//	CRUSHABLE_LEVEL			// Additif.
;//	CRUSHED_DECELERATE		// Multiplicatif.
;//	INVULNERABLE





