AIData
    AltCameraZoomOverride = 1.1 ; 1.0 = no change, 0.5 = half height, 2.0 = twice height.
    AltCameraPitchOverride = 1 ; 1.0 = no change, 0.0 = looking straight down. 2.0 = looking more towards the horizon
