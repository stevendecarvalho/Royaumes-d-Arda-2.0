	KindOf = HERO UNATTACKABLE PRELOAD SELECTABLE CAN_CAST_REFLECTIONS INFANTRY PATH_THROUGH_EACH_OTHER SCORE NOTIFY_OF_PREATTACK ARMY_SUMMARY ATTACK_NEEDS_LINE_OF_SIGHT HEAVY_MELEE_HITTER
CommandSet = CampaignSarumanCommandSetX
ReplaceModule ModuleTag_FireballUpdate
	Behavior = WeaponFireSpecialAbilityUpdate ModuleTag_FireballUpdateX 
		SpecialPowerTemplate    = SpecialAbilitySarumanFireball
		WhichSpecialWeapon		= 1
		SkipContinue			= Yes

		UnpackTime             	= 800
		PreparationTime			= 1   
		PersistentPrepTime		= 1000 
		PackTime				= 100
		
		AwardXPForTriggering    = 0
		
		StartAbilityRange		= 2990
		MustFinishAbility		= Yes
		SpecialWeapon			= SarumanFireballLastMarch ;SarumanFireball
	End
End
ReplaceModule ModuleTag_KingsFavor
 	Behavior = LevelGrantSpecialPower ModuleTag_KingsFavorX
		SpecialPowerTemplate		= SpecialAbilityKingsFavor
		UnpackingVariation			= 2
		StartAbilityRange			= 2990.0
;		LevelFX = FX_PorterDeliver

		Experience					= 100 ;85 ;,; 70 ;80 ;100 ;;,;; 50
		RadiusEffect				= 150 ;;,;; 100
		AcceptanceFilter			= KINGSFAVOR_OBJECTFILTER
		LevelFX						= FX_LevelUp
		
		UnpackTime					= 2000
		PreparationTime				= 1   
		FreezeAfterTriggerDuration	= 2500 ; Hold AI for this long after we fire.		
	End
End
ReplaceModule ModuleTag_IstariLightUpdate
	Behavior = WeaponFireSpecialAbilityUpdate ModuleTag_IstariLightUpdateX
		SpecialPowerTemplate    = SpecialAbilityLightingBolt
		SkipContinue			= Yes
		UnpackTime              = 1500
 		PreparationTime         = 1  
 		PersistentPrepTime      = 1000
 		PackTime                = 500
		AwardXPForTriggering    = 0
		StartAbilityRange		= 2990; Note: This has to be smaller than the weapon range or it'll never succeed
		ApproachRequiresLOS		= Yes		
		SpecialWeapon			= SarumanLightningBlastWeaponLastMarch ;SarumanLightningBlastWeapon
		MustFinishAbility		= Yes
		WhichSpecialWeapon		= 3
		BusyForDuration			= 2500
	End
End
End

