          ;Distance					= 30
        End
        Flags							= RANDOMSTART
        ;//ParticleSysBone				= None InfantryDustTrails
      End
    ;;//======= UNCONTROLLABLY AFRAID
    ;// This is before Attacking so it overrides it.  Normal fear is below so you don't go to little-fear in between swings.
      AnimationState						= EMOTION_UNCONTROLLABLY_AFRAID
        Animation						= FERA
          AnimationName				= DUPhalanx_FERA
          AnimationMode				= LOOP
        End
        Animation						= FERB
          AnimationName				= DUPhalanx_FERB
          AnimationMode				= LOOP
        End
        Animation						= FERC
          AnimationName				= DUPhalanx_FERC
          AnimationMode				= LOOP
        End
      End
      ;;//---------------------- ATTACKING ----------------------------------------------------------------
      AnimationState						= FIRING_OR_PREATTACK_A
        Animation						= ATK1
          AnimationName				= DUPhalanx_ATKA
          AnimationMode				= ONCE
          UseWeaponTiming				= Yes
        End			
        Animation						= ATK1
          AnimationName				= DUPhalanx_ATKB
          AnimationMode				= ONCE
          UseWeaponTiming				= Yes
        End			
        Animation						= ATK1
          AnimationName				= DUPhalanx_ATKC
          AnimationMode				= ONCE
          UseWeaponTiming				= Yes
        End			
        ;//ParticleSysBone				= None MeleeDust
      End
      
      ;;//----------------- HIT REACTIONS -------------------------------------------------------------------------
      AnimationState						= HIT_REACTION
        Animation						= HITA
          AnimationName				= DUPhalanx_HITA
          AnimationMode				= ONCE
        End
      End

      ;;//----------------- EMOTIONS ----------------------------------------------------------------
      
      
      ;;//======= AFRAID
      AnimationState						= EMOTION_AFRAID
        Animation						= FERA
          AnimationName				= DUPhalanx_FERA
          AnimationMode				= LOOP
        End
        Animation						= FERB
          AnimationName				= DUPhalanx_FERB
          AnimationMode				= LOOP
        End
        Animation						= FERC
          AnimationName				= DUPhalanx_FERC
          AnimationMode				= LOOP
        End
        Flags							= RANDOMSTART
      End
      
      AnimationState						= ATTACKING
        Animation						= ALERT_1
          AnimationName				= DUPhalanx_IDLA
          AnimationMode				= LOOP
        End
      End

      ;;//======== POINTING
      AnimationState						= EMOTION_POINTING
        Animation						= Pointing1A
          AnimationName				= DUPhalanx_PNTA
          AnimationMode				= LOOP
        End
        Animation						= Pointing1B
          AnimationName				= DUPhalanx_PNTB
          AnimationMode				= LOOP
        End
        Animation						= Pointing1C
          AnimationName				= DUPhalanx_PNTC
          AnimationMode				= LOOP
        End
        Flags							= RANDOMSTART
      End

      ;;//======= CELEBRATING
      ;AnimationState						= EMOTION_CELEBRATING
      ;	Animation						= CHRA
      ;		AnimationName				= DUPhalanx_CHRA
      ;		AnimationMode				= LOOP
      ;		AnimationPriority			= 5
      ;	End						
      ;	Animation						= CHRB
      ;		AnimationName				= DUPhalanx_CHRB
      ;		AnimationMode				= LOOP
      ;		AnimationPriority			= 5
      ;	End						
      ;	Animation						= CHRC
      ;		AnimationName				= DUPhalanx_CHRC
      ;		AnimationMode				= LOOP
      ;		AnimationPriority			= 1
      ;	End						
      ;	Flags							= RANDOMSTART
      ;End
      
      ;;//======= TAUNTING
      AnimationState					= EMOTION_TAUNTING
        Animation
          AnimationName			= DUPhalanx_TNTA
          AnimationMode			= LOOP
        End
        Animation
          AnimationName			= DUPhalanx_TNTB
          AnimationMode			= LOOP
        End
        Animation
          AnimationName			= DUPhalanx_TNTC
          AnimationMode			= LOOP
        End
        Flags							= RANDOMSTART
      End
      
      ;;//----------------- ALERT STATE ---------------------------------------------------------------------------

      AnimationState						= EMOTION_ALERT
        Animation						= ALERT_1
          AnimationName				= DUPhalanx_IDLA
          AnimationMode				= LOOP
          AnimationPriority			= 10
        End
        Flags							= RESTART_ANIM_WHEN_COMPLETE ;// acts like an idle animation & keeps running the animations.
      End
      
      AnimationState						= RAISING_FLAG
        Animation						= CHRA
          AnimationName				= DUPhalanx_CHRA
          AnimationMode				= LOOP
          AnimationPriority			= 5
        End						
        Animation						= CHRB
          AnimationName				= DUPhalanx_CHRB
          AnimationMode				= LOOP
          AnimationPriority			= 5
        End						
        Animation						= CHRC
          AnimationName				= DUPhalanx_CHRC
          AnimationMode				= LOOP
          AnimationPriority			= 1
        End						
      End

      ;;//----------------- SELECTED STATES -----------------------------------------------------------------------
      AnimationState        = SELECTED
        StateName           = STATE_Selected
              Animation				= IDLA
                  AnimationName       = uutombgrd_idla
          AnimationMode       = LOOP
          AnimationPriority   = 10 
          AnimationSpeedFactorRange = 1.0 1.0
          AnimationBlendTime	= 15
        End
              Animation				= IDLB
                  AnimationName       = uutombgrd_idlb
          AnimationMode       = LOOP
          AnimationPriority   = 10 
          AnimationSpeedFactorRange = 1.0 1.0
          AnimationBlendTime	= 15
        End
              Animation				= IDLC
                  AnimationName       = uutombgrd_idlc
          AnimationMode       = LOOP
          AnimationPriority   = 10 
          AnimationSpeedFactorRange = 1.0 1.0
          AnimationBlendTime	= 15
        End
        BeginScript
          Prev = CurDrawablePrevAnimationState()
          if Prev == "STATE_Idle" then CurDrawableSetTransitionAnimState("TRANS_IdleToSelected") end
        EndScript
      End
      
      ;;//----------------- IDLE STATES ---------------------------------------------------------------------------
      IdleAnimationState
          ;//AllowRepeatInRandomPick = no
          ;//Flags = RANDOMSTART
        StateName				= STATE_Idle
              Animation				= IDLA
                  AnimationName       = uutombgrd_idla
          AnimationMode       = ONCE
          AnimationPriority   = 10 
          AnimationSpeedFactorRange = 1.0 1.0
          AnimationBlendTime	= 15
        End
              Animation				= IDLB
                  AnimationName       = uutombgrd_idlb
          AnimationMode       = ONCE
          AnimationPriority   = 10 
          AnimationSpeedFactorRange = 1.0 1.0
          AnimationBlendTime	= 15
        End
              Animation				= IDLC
                  AnimationName       = uutombgrd_idlc
          AnimationMode       = ONCE
          AnimationPriority   = 10 
          AnimationSpeedFactorRange = 1.0 1.0
          AnimationBlendTime	= 15
        End	
        BeginScript
          Prev = CurDrawablePrevAnimationState()
          if Prev == "STATE_Planted"	then CurDrawableSetTransitionAnimState("Trans_Down_To_Up") return end
          if Prev == "STATE_Selected" or Prev == "Trans_Down_To_Up" then CurDrawableSetTransitionAnimState("TRANS_SelectedToIdle") end
        EndScript
      End
      ;;//--------------- TRANSITIONS ---------------------------------------------------------------------------
    
      TransitionState = Trans_Down_To_Up
        Animation = Transition
          AnimationName = DUPhalanx_PLTC
          AnimationMode = ONCE
        End
      End
        
      TransitionState = Trans_Up_To_Down
        Animation = Transition
          AnimationName = DUPhalanx_PLTA
          AnimationMode = ONCE
        End
      End

      TransitionState       = TRANS_IdleToSelected
        Animation           = ATNA
          AnimationName     = uutombgrd_atna
          AnimationMode     = ONCE
          AnimationSpeedFactorRange = 0.8 1.0
          
        End
      End
      TransitionState		= TRANS_SelectedToIdle
        Animation			= ATNC
          AnimationName	= uutombgrd_atna
          AnimationMode	= ONCE_BACKWARDS
          AnimationSpeedFactorRange = 0.8 1.0
        End
      End
    End
End	
