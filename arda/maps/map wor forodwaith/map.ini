FXParticleSystem CINEsmokeSmall
  System
    Priority = ALWAYS_RENDER
    Shader = ALPHA
    ParticleName = EXCloud02.tga
    Lifetime = 405 405
    SortLevel = 1
    Size = 1 3
    BurstCount = 1 1
  End
  Color = DefaultColor
    Color1 = R:173 G:90 B:29 0
    Color2 = R:102 G:103 B:110 25
    Color3 = R:0 G:0 B:0 600
  End
  Alpha = DefaultAlpha
    Alpha1 = 0 0 10
    Alpha2 = 0.05 0.05 25
    Alpha3 = 0 0 300
  End
  Update = DefaultUpdate
    SizeRate = 0.01 0.5
    SizeRateDamping = 0.95 1
    AngleZ = 5 -5
    AngularRateZ = -0.03 0.03
    AngularDamping = 1 1
    AngularDampingXY = 1 1
  End
  Physics = DefaultPhysics
    Gravity = 0.01
    VelocityDamping = 0.98 0.99
    DriftVelocity = X:0 Y:0.0 Z:0
  End
  EmissionVelocity = OrthoEmissionVelocity
    X = 0.0 0.0
    Y = 0.0 0.0
    Z = 0.2 0.2
  End
  EmissionVolume = CylinderEmissionVolume
    Radius = 5
  End
  Draw = DefaultDraw
  End
  Wind = DefaultWind
    WindMotion = PingPong
    WindStrength = 0.2
    WindFullStrengthDist = 20
    WindZeroStrengthDist = 600
    WindAngleChangeMin = 0.1
    WindAngleChangeMax = 1
    WindPingPongStartAngleMax = 1
    WindPingPongEndAngleMin = 1
    WindPingPongEndAngleMax = 2
    TurbulenceAmplitude = 0.02
    TurbulenceFrequency = 20
  End
End

