;; --------------------------------- 
;;               FALLING WEATHER
;; --------------------------------- 
;; This code will automatically put in falling snow.  The denser the snow, the more laggy the map. 
 
Weather 
        SnowEnabled = Yes                         ; enable/disable snow on the map. 
        IsSnowing = Yes                         ; is it snowing today? 
        SnowTexture = exraindrop.tga    ; which .tga texture is falling from the sky? 
        SnowBoxHeight = 800                     ; height from which snow falls 
        SnowSpacing = 10                          ; snow spacing -- less means more; 
        NumberTiles = 4 
 
        SnowAmplitude = 3                     ; amount of side-to-side movement.  
        SnowFrequencyScaleX = 0.01       ; speed of side-to-side wave movement. 
        SnowFrequencyScaleY = 0.005     ; speed of side-to-side wave movement.  
 
        SnowPointSize = 22                        ; scale the size of snow particles. 
        SnowMinPointSize =  12              ; min point size 
        SnowMaxPointSize = 19               ; max point size 
 
        SnowPointSprites = No             ; set to "no" for point-sprite emulation. 
        SnowQuadSize = 3                           ; scale the size of snow particles when using point-sprite emulation. 
 
        SnowSpeed = 140                           ; speed at which snow falls 
   ;;;SnowXYSpeed = X:40 Y:25 
 
 
 

	HardwareFogColor = R:165 G:180 B:180
	HardwareFogEnable = Yes
	HardwareFogStart = 400
	HardwareFogEnd = 9000



End
;startOfAuto-Generation
