Object MinisGateDoor
RemoveModule ModuleTag_AI
RemoveModule ModuleTage_AIGateUpdate
ReplaceModule ModuleTag_GATE
	Behavior = GateOpenAndCloseBehavior ModuleTag_GATEX
		ResetTimeInMilliseconds = 10500;must be longer than animation to avoid ->pop<-
		OpenByDefault = Yes
		PercentOpenForPathing = 50
		SoundOpeningGateLoop = GateOpenStart
		SoundClosingGateLoop = GateCloseStart
		SoundFinishedOpeningGate = GateOpenEnd
		SoundFinishedClosingGate = GateCloseEnd
		TimeBeforePlayingOpenSound = 9500
		TimeBeforePlayingClosedSound = 9500
	End
End
ArmorSet
        Conditions        = None
        Armor             = CastleGateArmorAttackable ; DefaultWallArmor
        DamageFX          = GateDamageFX
    End

End

Object AmonSulGate
RemoveModule ModuleTage_AIGateUpdate
ReplaceModule ModuleTag_GATE
	Behavior = GateOpenAndCloseBehavior ModuleTag_GATEX
		ResetTimeInMilliseconds			= 4000				;important! this must be longer than the gates animation, ir it will twitch
		OpenByDefault					= Yes
		PercentOpenForPathing			= 50
		SoundOpeningGateLoop			= GateOpenStart
		SoundClosingGateLoop			= GateCloseStart
		SoundFinishedOpeningGate		= GateOpenEnd
		SoundFinishedClosingGate		= GateCloseEnd
		TimeBeforePlayingOpenSound		= 3000
		TimeBeforePlayingClosedSound	= 3000
	End
End
ArmorSet
        Conditions        = None
        Armor             = CastleGateArmorAttackable ; DefaultWallArmor
        DamageFX          = GateDamageFX
    End

End

