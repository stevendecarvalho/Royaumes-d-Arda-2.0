Object MordorSiegeTower
	ReplaceModule ModuleTag_07
		Behavior = SiegeDeploySpecialPower ModuleTag_WallSearchDistanceLocal
	    	SpecialPowerTemplate = SpecialAbilitySiegeDeploy
            LowerDelay = 1200
            RaiseDelay = 2000
            EvacuatePassengersOnDeploy = Yes
            SkipAdjustPosition = Yes ; have to skip the path find adjust or it this will not go to the right docking position
            WallSearchDistance = 99999.0
 		End
	End
End

Armor SiegeTowerArmor
  Armor = DEFAULT          10%     ;this sets the level for all nonspecified damage types
  Armor = CRUSH           15% ;25%     ;horseman damage
  Armor = SLASH           25% ;1%     ;soldier damage
  Armor = SIEGE		  30%     ;war machine attack
  Armor = STRUCTURAL	  30%	   ;Structural damage (Ent rocks)
  Armor = FLAME            20% ;10%     ;fire attack
  Armor = PIERCE            1%     ;archer damage 
  Armor = HERO		   10%     ;hero damage
  Armor = MAGIC		  50%     ;hero damage
  Armor = HERO_RANGED       1%     ;Hero bow damage     
End









