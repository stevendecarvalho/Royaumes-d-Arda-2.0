;-------5 points
Science SCIENCE_ElvenGifts
  PrerequisiteSciences = SCIENCE_MEN OR SCIENCE_GOOD
  SciencePurchasePointCost = GOOD_RANK_1_COST
  SciencePurchasePointCostMP = 5
  IsGrantable = Yes
End
Science SCIENCE_Heal
  PrerequisiteSciences = SCIENCE_GOOD OR SCIENCE_MEN OR SCIENCE_ELVES OR SCIENCE_DWARVES OR SCIENCE_ARNOR
  SciencePurchasePointCost = GOOD_RANK_1_COST
  SciencePurchasePointCostMP = 5
  IsGrantable = Yes
End
Science SCIENCE_RallyingCall
  PrerequisiteSciences = SCIENCE_MEN OR SCIENCE_GOOD ;SCIENCE_EnshroudingMistSP
  SciencePurchasePointCost = GOOD_RANK_1_COST
  SciencePurchasePointCostMP = 5
  IsGrantable = Yes
End
Science SCIENCE_RallyingCallMP
  PrerequisiteSciences = SCIENCE_MEN OR SCIENCE_GOOD ;SCIENCE_EnshroudingMistSP
  SciencePurchasePointCost = GOOD_RANK_1_COST
  SciencePurchasePointCostMP = 5
  IsGrantable = Yes
End
;-------10 points
Science SCIENCE_CampaignElvenWood
  PrerequisiteSciences = SCIENCE_GOOD OR SCIENCE_ElvenGifts
  SciencePurchasePointCost = GOOD_RANK_2_COST
  SciencePurchasePointCostMP = 10
  IsGrantable = Yes
End
Science SCIENCE_CampaignRebuild
  PrerequisiteSciences = SCIENCE_GOOD OR SCIENCE_ElvenGifts OR SCIENCE_Heal
  SciencePurchasePointCost = GOOD_RANK_2_COST
  SciencePurchasePointCostMP = 10
  IsGrantable = Yes
End
Science SCIENCE_UndermineErebor
  PrerequisiteSciences = SCIENCE_GOOD SCIENCE_Heal OR SCIENCE_RallyingCall
  SciencePurchasePointCost = GOOD_RANK_2_COST
  SciencePurchasePointCostMP = 10
  IsGrantable = Yes
End
Science SCIENCE_CampaignRadagast
  PrerequisiteSciences = SCIENCE_GOOD OR SCIENCE_RallyingCall OR SCIENCE_RallyingCallMP
  SciencePurchasePointCost = GOOD_RANK_2_COST
  SciencePurchasePointCostMP = 10
  IsGrantable = Yes
End
;-------15 points
Science SCIENCE_CampaignArrowVolley
  PrerequisiteSciences = SCIENCE_GOOD OR SCIENCE_CampaignElvenWood OR SCIENCE_CampaignRebuild
  SciencePurchasePointCost = GOOD_RANK_3_COST
  SciencePurchasePointCostMP = 15
  IsGrantable = Yes
End
Science SCIENCE_CampaignCloudBreak
  PrerequisiteSciences = SCIENCE_GOOD OR SCIENCE_CampaignRebuild OR SCIENCE_UndermineErebor
  SciencePurchasePointCost = GOOD_RANK_3_COST
  SciencePurchasePointCostMP = 15
  IsGrantable = Yes
End
Science SCIENCE_CampaignEagleAllies
  PrerequisiteSciences = SCIENCE_GOOD OR SCIENCE_UndermineErebor OR SCIENCE_CampaignRadagast
  SciencePurchasePointCost = GOOD_RANK_3_COST
  SciencePurchasePointCostMP = 15
  IsGrantable = Yes
End
;-------25 points
Science SCIENCE_Earthquake
  PrerequisiteSciences = SCIENCE_GOOD OR SCIENCE_CampaignArrowVolley OR SCIENCE_CampaignCloudBreak
  SciencePurchasePointCost = GOOD_RANK_4_COST
  SciencePurchasePointCostMP = 25
  IsGrantable = Yes
End
Science SCIENCE_Flood
  PrerequisiteSciences = SCIENCE_GOOD OR SCIENCE_CampaignEagleAllies OR SCIENCE_CampaignCloudBreak
  SciencePurchasePointCost = GOOD_RANK_4_COST
  SciencePurchasePointCostMP = 25
  IsGrantable = Yes
End

