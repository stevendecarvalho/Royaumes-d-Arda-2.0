Object MirkwoodWaystone
ReplaceModule ModuleTag_Draw
	Draw = W3DScriptedModelDraw ModuleTag_DrawGreen
		OkToChangeModelColor		= Yes
		StaticModelLODMode = yes
		UseStandardModelNames		= Yes
		
		RandomTexture = tbwaystone_green.tga 0 tbwaystone.tga
		RandomTexture = tbwaystone_green_d.tga 0 tbwaystone_d.tga	

		DefaultModelConditionState
			Model					= tbwaystone_skn
		End

		IdleAnimationState
		End

		;-- building being placed
		;ModelConditionState				= BUILD_PLACEMENT_CURSOR
		;	Shadow						= SHADOW_ALPHA_DECAL
		;	ShadowTexture				= decal_hero_good
		;	ShadowSizeX					= ELVEN_STATUE_AOE_RADIUS_DECAL
		;	ShadowSizeY					= ELVEN_STATUE_AOE_RADIUS_DECAL
		;    ShadowOverrideLODVisibility = Yes
		;End
		
		ModelConditionState   = JUST_BUILT
			Model               = tbwaystone_bld
		End
	    
		AnimationState		  = JUST_BUILT
			StateName				= JustBuilt
			Animation				= GBBtlTwrM_A
				AnimationName		= tbwaystone_bld.tbwaystone_bld
				AnimationMode		= ONCE
				AnimationBlendTime	= 0
				AnimationSpeedFactorRange = 5.0 5.0
			End
			Flags = START_FRAME_FIRST
		End		

		ModelConditionState = SNOW ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
			Model	= tbwaystone_bld
			Texture = tbwaystone.tga tbwaystone_snow.tga
		End  
		ModelConditionState = ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
			Model					= tbwaystone_bld
			ParticleSysBone			= NONE BuildingContructDust
		End  
		AnimationState = ACTIVELY_BEING_CONSTRUCTED
			Animation
				AnimationName		= tbwaystone_bld.tbwaystone_bld
				AnimationMode		= MANUAL
			End
			StateName				= BeingConstructed
			BeginScript
				CurDrawablePlaySound("GondorBarracksBeginConstruction")
			EndScript
		End

		ModelConditionState = DAMAGED
			Model					= tbwaystone_d1
		End  
		AnimationState = DAMAGED
			EnteringStateFX			= FX_StatueDamaged
		End

		ModelConditionState = REALLYDAMAGED
			Model					= tbwaystone_d2
		End  
		AnimationState = REALLYDAMAGED
			EnteringStateFX			= FX_StatueDamaged
		End
		ModelConditionState = RUBBLE
			Model					= tbwaystone_d2
			ParticleSysBone SmokeLarge01 SmokeBuildingLarge
		End
		AnimationState = RUBBLE
	  		EnteringStateFX			= FX_StatueDamaged
		End
		ModelConditionState = POST_RUBBLE
			Model					= None
			ParticleSysBone NONE SmokeBuildingMediumRubble
		End

		ModelConditionState = POST_COLLAPSE
			Model					= None
			ParticleSysBone NONE SmokeBuildingMediumRubble
		End
		    
		ModelConditionState = SNOW
			Model = tbwaystone_skn
			Texture = tbwaystone.tga tbwaystone_snow.tga
		End  
    
	End
END
ReplaceModule ModuleTag_DrawFloor
	Draw = W3DFloorDraw ModuleTag_DrawFloorGreen
		StaticModelLODMode = yes ; Will append M or L to the skin name depending on GameLOD
		ModelName = tbwaystone_gbib
		;WeatherTexture		= SNOWY tbwaystone_bib_snow.tga
  		HideIfModelConditions	=	AWAITING_CONSTRUCTION
  		HideIfModelConditions	=	PARTIALLY_CONSTRUCTED
	End
End	
End	

Object MirkwoodWell
ReplaceModule ModuleTag_DrawFloor
  Draw = W3DFloorDraw ModuleTag_DrawFloorGreen    
	StaticModelLODMode = Yes		; THIS NEEDS TO BE COMMENTED OUT WHEN ENGINEERING ENABLES LOD'S IN THE FLOOR DRAW
    ModelName = tbwell_gbib
    WeatherTexture		= SNOWY tbwell_bib_snow.tga
  	HideIfModelConditions	=	AWAITING_CONSTRUCTION
  	HideIfModelConditions	=	PARTIALLY_CONSTRUCTED
  End
End
End

