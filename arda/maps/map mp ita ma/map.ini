Object Bear
  ReplaceModule ModuleTag_01
  Draw = W3DScriptedModelDraw ModuleTag_Polar
    DefaultModelConditionState
		Model               = CUBear_SKN
    End
    RandomTexture = cupolarbear.tga 0 cubear.tga
   	IdleAnimationState
		StateName					=   STATE_Idle
		Animation = IdleA
			AnimationName       = CUBear_SKL.CUBear_IDLA
			AnimationPriority	= 10
			AnimationMode       = ONCE
			AnimationBlendTime	=	10
		End
		Animation = IdleB
			AnimationName       = CUBear_SKL.CUBear_IDLB
			AnimationPriority	= 10
			AnimationMode       = ONCE
			AnimationBlendTime	=	10
		End
		BeginScript
			Prev = CurDrawablePrevAnimationState()
			if Prev == "STATE_Alert" then CurDrawableSetTransitionAnimState("TRANS_AlertToIdle") end
		EndScript
    End
	AnimationState				= MOVING PANICKING
		Animation				= RUNA
			AnimationName		= CUBear_SKL.CUBear_RUNA
			AnimationMode		= LOOP
		End
		Flags					= RANDOMSTART
	End        	
	AnimationState			=	MOVING
		StateName			=	STATE_moving
		Animation			=	Moving
			AnimationName	=	CUBear_SKL.CUBear_WALKA
			AnimationBlendTime	=	10
			AnimationMustCompleteBlend = yes
		End
		
		BeginScript
			Prev = CurDrawablePrevAnimationState()
			if Prev == "STATE_Alert" then CurDrawableSetTransitionAnimState("TRANS_AlertToIdle") end
		EndScript
		
	End
	TransitionState					=	TRANS_AlertToIdle
		Animation					=   IDLE
			AnimationName			=	CUBear_SKL.CUBear_IDLE
			AnimationMode			=	ONCE
		End
	End		
	TransitionState					=	TRANS_IdleToAlert
		Animation					=   IDLC
			AnimationName			=	CUBear_SKL.CUBear_IDLC
			AnimationMode			=	ONCE
		End
	End			
	AnimationState        = DYING DEATH_1
		Animation           = CUBear_DIEA
  			AnimationName     = CUBear_SKL.CUBear_IDLA
			AnimationMode     = LOOP
		End
	End		
	AnimationState        = DYING
		Animation           = CUBear_DIEA
  			AnimationName     = CUBear_SKL.CUBear_DIEA
			AnimationMode     = ONCE
		End
	End			
 End
 End
