;-------5 points
Science SCIENCE_WarChantMordor
  PrerequisiteSciences = SCIENCE_MORDOR OR SCIENCE_EVIL
  SciencePurchasePointCost = EVIL_RANK_1_COST
  SciencePurchasePointCostMP = 5
  IsGrantable = Yes
End
Science SCIENCE_CaveBats
  PrerequisiteSciences = SCIENCE_EVIL OR SCIENCE_MORDOR OR SCIENCE_ELVES OR SCIENCE_DWARVES OR SCIENCE_ARNOR
  SciencePurchasePointCost = EVIL_RANK_1_COST
  SciencePurchasePointCostMP = 5
  IsGrantable = Yes
End
Science SCIENCE_ChillWind
  PrerequisiteSciences = SCIENCE_GULDUR OR SCIENCE_EVIL ;SCIENCE_EnshroudingMistSP
  SciencePurchasePointCost = EVIL_RANK_1_COST
  SciencePurchasePointCostMP = 5
  IsGrantable = Yes
End
;-------10 points
Science SCIENCE_GuldurFearForest
  PrerequisiteSciences = SCIENCE_GULDUR OR SCIENCE_EVIL SCIENCE_WarChantMordor
  SciencePurchasePointCost = EVIL_RANK_2_COST
  SciencePurchasePointCostMP = 10
  IsGrantable = Yes
End
Science SCIENCE_GuldurBlackWarg
  PrerequisiteSciences = SCIENCE_EVIL OR SCIENCE_EVIL SCIENCE_WarChantMordor OR SCIENCE_EVIL SCIENCE_CaveBats
  SciencePurchasePointCost = EVIL_RANK_2_COST
  SciencePurchasePointCostMP = 10
  IsGrantable = Yes
End
Science SCIENCE_Scavenger
  PrerequisiteSciences = SCIENCE_GULDUR OR SCIENCE_EVIL SCIENCE_CaveBats OR SCIENCE_ChillWind
  SciencePurchasePointCost = EVIL_RANK_2_COST
  SciencePurchasePointCostMP = 10
  IsGrantable = Yes
End
Science SCIENCE_Barricade
  PrerequisiteSciences = SCIENCE_GULDUR OR SCIENCE_EVIL SCIENCE_ChillWind
  SciencePurchasePointCost = EVIL_RANK_2_COST
  SciencePurchasePointCostMP = 10
  IsGrantable = Yes
End
;-------15 points
Science SCIENCE_WatcherAlly
  PrerequisiteSciences = SCIENCE_GULDUR OR SCIENCE_EVIL SCIENCE_GuldurFearForest OR SCIENCE_GuldurBlackWarg
  SciencePurchasePointCost = EVIL_RANK_3_COST
  SciencePurchasePointCostMP = 15
  IsGrantable = Yes
End
Science SCIENCE_GuldurDarkness
  PrerequisiteSciences = SCIENCE_GULDUR OR SCIENCE_EVIL SCIENCE_GuldurBlackWarg OR SCIENCE_Scavenger
  SciencePurchasePointCost = EVIL_RANK_3_COST
  SciencePurchasePointCostMP = 15
  IsGrantable = Yes
End
Science SCIENCE_DragonStrike
  PrerequisiteSciences = SCIENCE_GULDUR OR SCIENCE_EVIL SCIENCE_Scavenger OR SCIENCE_Barricade
  SciencePurchasePointCost = EVIL_RANK_3_COST
  SciencePurchasePointCostMP = 15
  IsGrantable = Yes
End
;-------25 points
Science SCIENCE_RainOfFire
  PrerequisiteSciences = SCIENCE_GULDUR OR SCIENCE_EVIL SCIENCE_WatcherAlly OR SCIENCE_GuldurDarkness
  SciencePurchasePointCost = EVIL_RANK_4_COST
  SciencePurchasePointCostMP = 25
  IsGrantable = Yes
End
Science SCIENCE_EyeofSauronNew
  PrerequisiteSciences = SCIENCE_GULDUR OR SCIENCE_EVIL SCIENCE_DragonStrike OR SCIENCE_GuldurDarkness
  SciencePurchasePointCost = EVIL_RANK_4_COST
  SciencePurchasePointCostMP = 25
  IsGrantable = Yes
End

