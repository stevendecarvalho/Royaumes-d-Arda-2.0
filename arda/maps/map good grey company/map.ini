                AnimationName                = mucorsar_CHRB
                AnimationMode                = LOOP
            End
            Animation                        = Taunting1C
                AnimationName                = mucorsar_CHRC
                AnimationMode                = LOOP
            End
            Flags                            = RESTART_ANIM_WHEN_COMPLETE
        End


;;----------------- SELECTED STATES -----------------------------------------------------------------------
        AnimationState        = SELECTED
            StateName           = STATE_Selected
            Animation           = ATNB
                AnimationName     = mucorsar_ATNB
                AnimationMode     = LOOP
            End
            
            BeginScript
                Prev = CurDrawablePrevAnimationState()
                if Prev == "STATE_Idle" 
                then 
                    CurDrawableSetTransitionAnimState("TRANS_IdleToSelected") 
                end
                if CurDrawableModelcondition("ATTACKING")
                then
                    return "IDLA"
                else
                    return "ATNA"
                end
            EndScript
            
            BeginScript
                Prev = CurDrawablePrevAnimationState()
                if Prev == "STATE_Idle" then CurDrawableSetTransitionAnimState("TRANS_IdleToSelected") end
            EndScript
        End
        
;;----------------- IDLE STATES ---------------------------------------------------------------------------      
        AnimationState                = USER_3
            StateName                = STATE_User_3
            Animation                = GUARD_STANCE
                AnimationName        = mucorsar_IDLA
                AnimationMode        = LOOP
            End
        End
		
		IdleAnimationState
			StateName				= STATE_Idle
			Animation				= IDLB
				AnimationName       = MUCorsar_IDLB
				AnimationMode       = ONCE
				AnimationPriority   = 20
				AnimationSpeedFactorRange = 0.9 1.1
				AnimationBlendTime	= 15
			End
			Animation				= IDLF
				AnimationName       = MUCorsar_IDLC
				AnimationMode       = ONCE
				AnimationPriority   = 3
				AnimationSpeedFactorRange = 0.9 1.1
				AnimationBlendTime	= 15
			End
			Animation				= IDLG
				AnimationName       = MUCorsar_IDLD
				AnimationMode       = ONCE
				AnimationPriority   = 3
				AnimationSpeedFactorRange = 0.9 1.1
				AnimationBlendTime	= 15
			End
			Animation				= IDLJ
				AnimationName       = MUCorsar_IDLE
				AnimationMode       = ONCE
				AnimationPriority   = 3
				AnimationSpeedFactorRange = 0.9 1.1
				AnimationBlendTime	= 15
			End
			BeginScript
				Prev = CurDrawablePrevAnimationState()
				if Prev == "STATE_Selected" then CurDrawableSetTransitionAnimState("TRANS_SelectedToIdle") end
			EndScript
		End
;;--------------- TRANSITIONS ---------------------------------------------------------------------------
        TransitionState       = TRANS_IdleToSelected
            Animation           = ATNA
                AnimationName     = mucorsar_ATNA
                AnimationMode     = ONCE
                AnimationSpeedFactorRange = 0.9 1.0
                
            End
        End
        TransitionState        = TRANS_SelectedToIdle
            Animation            = ATNC
                AnimationName    = mucorsar_ATNC
                AnimationMode    = ONCE
                AnimationSpeedFactorRange = 0.9 1.0
            End
        End
    End
