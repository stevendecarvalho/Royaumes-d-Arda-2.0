Weather
	
;; ---------------------------------
;;              SNOW, ACTUALLY ASH
;; ---------------------------------
    SnowEnabled = Yes               ; enable/disable snow on the map.
    IsSnowing = Yes               ; is it snowing today?
    SnowTexture = exash01.tga
    SnowBoxHeight = 1100             ; height from which snow falls
    SnowSpacing = 80             ; snow spacing -- less means more
    NumberTiles = 4

    SnowAmplitude = 40              ; amount of side-to-side movement. 
    SnowFrequencyScaleX = 0.02        ; speed of side-to-side wave movement.
    SnowFrequencyScaleY = 0.005         ; speed of side-to-side wave movement. 

    SnowPointSize = 1               ; scale the size of snow particles.
    SnowMinPointSize = 1           ; min point size
    SnowMaxPointSize = 3           ; max point size

    SnowPointSprites = No           ; set to "no" for point-sprite emulation.
    SnowQuadSize = 3               ; scale the size of snow particles when using point-sprite emulation.

    SnowSpeed = 30               ; speed at which snow falls
    SnowXYSpeed = X:50 Y:30



  HardwareFogColor = R:135 G:115 B:90
  HardwareFogEnable = Yes
  HardwareFogStart = 450
  HardwareFogEnd = 8000


End



