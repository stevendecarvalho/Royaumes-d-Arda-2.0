FXParticleSystem LeavesBlowing
  System
    Priority = ALWAYS_RENDER
	Shader = ALPHA
    ParticleName = EXLeaf01.tga; EXCloud02.tga; EXCineSparks.tga
    Lifetime = 150 300; 100 200
    SortLevel = 1
    Size = 1.5 2.5; 0.1 0.2
    BurstDelay = 5 150
    BurstCount = 30 55; 3 5
  End
 
  Color = DefaultColor
    Color1 = R:225 G:80 B:55 0; R:255 G:185 B:79 0
    ;Color2 = R:105 G:92 B:68 100; R:0 G:0 B:0 200
    ColorScale = 2 -2
  End
  
    Alpha = DefaultAlpha
    Alpha1 = 0 0 10; 0.1 0.3 50
    Alpha2 = 1 1 50; 0 0 350
	Alpha3 = 1 1 300; 0 0 350
	Alpha4 = 0 0 180; 0 0 350
  End
  Update = DefaultUpdate
    SizeRate = 0.03 0.08
    SizeRateDamping = 0.8 0.9
    AngleZ = -10 10
    AngularRateZ = -1 1
    AngularDamping = 0.9 0.99
    AngularDampingXY = 1 1
  End
  Physics = DefaultPhysics
    Gravity = -0.01
    VelocityDamping = 0.95 0.99
    DriftVelocity = X:0.15 Y:0.08 Z:0.1; X:0 Y:0 Z:0.64
  End
  EmissionVelocity = OrthoEmissionVelocity
    X = .8 1.8
    Y = -0.4 0.4
    Z = 0.1 .3
  End
  EmissionVolume = CylinderEmissionVolume
    Radius = 20; 7
    Length = 2; 1
  End
  Draw = DefaultDraw
  End
  Wind = DefaultWind
    WindMotion = PingPong

    WindStrength = 0.25; 0.25
    WindFullStrengthDist = 5
    WindZeroStrengthDist = 100
    WindAngleChangeMin = 0.034907
    WindAngleChangeMax = 0.034907
    WindPingPongStartAngleMin = 1.22173
    WindPingPongStartAngleMax = 1.22173
    WindPingPongEndAngleMin = 1.91986
    WindPingPongEndAngleMax = 1.91986
    TurbulenceAmplitude = 0.2
    TurbulenceFrequency = 50
  End
End

