Object AIBaseMarkerBase // THIS IS SPAWNED TO MAKE A TEAM EXIST, ALLOWING UNITS TO BE RECRUITED ONTO IT
RemoveModule ModuleTag_01
AddModule
	Body = ActiveBody ModuleTag_02
		MaxHealth         = 1
	End
End
End

ChildObject PrimaryAIBaseMarker AIBaseMarkerBase // DARK PRESENCE CASTER
	KindOf          = PRELOAD STRUCTURE IMMOBILE AUTO_RALLYPOINT FS_FACTORY IGNORE_FOR_VICTORY IGNORE_FOR_EVA_SPEECH_POSITION NO_COLLIDE UNATTACKABLE NOT_AUTOACQUIRABLE
AddModule
	Behavior = GrantUpgradeCreate ModuleTag_GrantUpgrade
		UpgradeToGrant	= Upgrade_GondorStableLevel2
	End
End
AddModule
	Behavior = AttributeModifierAuraUpdate ModuleTag_DarkPresence
		StartsActive	= Yes
		TriggeredBy		= Upgrade_GondorStableLevel2
		BonusName		= GuldurDarkPresence
		RefreshDelay	= 2000
		Range			= 20000
		ObjectFilter	= ANY +GuldurBrokenRabble +GuldurBrokenRabbleA +GuldurBrokenRabbleB +GuldurBrokenRabbleC +GuldurBrokenRabbleHorde +GuldurOrcArcher +GuldurOrcArcherHorde +GuldurOrcPikeman +GuldurOrcPikemanForBrokenRabble +GuldurOrcPikemanHorde +GuldurOrcArcherHorde_Summoned +GuldurOrcPikemanHorde_Summoned +GuldurBannerOrc +GuldurPikemenArcherComboHorde
	End
End
End

Object ElvenCastleWallGate
RemoveModule ModuleTage_AIGateUpdate
ReplaceModule ModuleTag_GATE
	Behavior = GateOpenAndCloseBehavior ModuleTag_GATEX
		ResetTimeInMilliseconds			= 3000				//important! this must be longer than the gates animation, ir it will twitch
		OpenByDefault					= Yes
		PercentOpenForPathing			= 50
		SoundOpeningGateLoop			= GateOpenStart
		SoundClosingGateLoop			= GateCloseStart
		SoundFinishedOpeningGate		= GateOpenEnd
		SoundFinishedClosingGate		= GateCloseEnd
		TimeBeforePlayingOpenSound		= 9500
		TimeBeforePlayingClosedSound	= 9500
	End
End
End

WaterTransparency
  ReflectionPlaneZ = 95.0;
  ReflectionOn = Yes
End

Weather

	HardwareFogColor = R:30 G:50 B:60 
	HardwareFogEnable = Yes
	HardwareFogStart = 500
	HardwareFogEnd = 7000 ;2200
	
End

Object CINE_ParticleSysProxy3

  ; *** ART Parameters ***
 ReplaceModule ModuleTag_01
  Draw = W3DScriptedModelDraw ModuleTag_01_Override
    DefaultModelConditionState
      Model = NONE
      ParticleSysBone = emberBone CINECampfireEmbers
      ParticleSysBone = None None;FireSmokeBig
    End
  
    ModelConditionState = WORLD_BUILDER
	  Model = locator
	End
  End
 End
End


FXParticleSystem CINECampfireEmbers;falling dust
  System
    Priority = ALWAYS_RENDER
	Shader = ALPHA
    ParticleName = EXCloud02.tga; EXCineSparks.tga
    Lifetime = 150 300; 100 200
    SortLevel = 1
    Size = 0.5 1; 0.1 0.2
    BurstDelay = 30 60
    BurstCount = 20 30; 3 5
  End
 
  Color = DefaultColor
    Color1 = R:215 G:215 B:160 0; R:255 G:185 B:79 0
    Color2 = R:230 G:200 B:90 100; R:0 G:0 B:0 200
    ColorScale = 2 -2
  End
  
    Alpha = DefaultAlpha
    Alpha1 = 0 0 30; 0.1 0.3 50
	Alpha2 = 1 1 80; 0.1 0.3 50
    Alpha3 = .7 .7 150; 0 0 350
	Alpha4 = 0 0 200; 0 0 350
  End
  Update = DefaultUpdate
    SizeRate = 0.01 0.07
    SizeRateDamping = 0.65 0.8
    AngleZ = -3 3
    AngularRateZ = -0.3 0.3
    AngularDamping = 0.9 0.99
    AngularDampingXY = 1 1
  End
  Physics = DefaultPhysics
    Gravity = 0.008
    VelocityDamping = 0.95 0.99
    DriftVelocity = X:0.2 Y:0.15 Z:-0.5; X:0 Y:0 Z:0.64
  End
  EmissionVelocity = OrthoEmissionVelocity
  End
  EmissionVolume = CylinderEmissionVolume
    Radius = 100; 7
    Length = 3; 1
  End
  Draw = DefaultDraw
  End
  Wind = DefaultWind
    WindMotion = PingPong

    WindStrength = 0.25; 0.25
    WindFullStrengthDist = 5
    WindZeroStrengthDist = 100
    WindAngleChangeMin = 0.034907
    WindAngleChangeMax = 0.034907
    WindPingPongStartAngleMin = 1.22173
    WindPingPongStartAngleMax = 1.22173
    WindPingPongEndAngleMin = 1.91986
    WindPingPongEndAngleMax = 1.91986
    TurbulenceAmplitude = 0.2
    TurbulenceFrequency = 50
  End
End



