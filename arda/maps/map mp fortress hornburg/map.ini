    Priority = ALWAYS_RENDER
    Shader = W3D_EMISSIVE
    Type = DRAWABLE
    ParticleName = EXCldBrkRays.W3D
    Lifetime = 300 300
 ;   SystemLifetime = 200
    Size = 1.2 1.2;0.1 0.1
    BurstDelay = 180 180;20 90
    BurstCount = 1 1; 0 2
  End
  Color = DefaultColor
    Color1 = R:95 G:140 B:160 0; R:164 G:140 B:104 0
    Color2 = R:0 G:0 B:0 400
  End
  Alpha = DefaultAlpha
    Alpha2 = 0.05 0.05 120
    Alpha3 = 0.0 0.0 220
	;Alpha4 = 0 0 400
	;Alpha5 = 0 0 400
  End
    Update = DefaultUpdate
    ;SizeRate = 0.04 0.04
    ;SizeRateDamping = 0.95 0.97
    AngleZ = -5.9 -5.9
    ;AngularDamping = 1 1
    Rotation = ROTATE_Y
    ;AngularDampingXY = 1 1
  End
  ; Update = RenderObjectUpdate
    ; StartSizeX = 0.3 0.3
    ; StartSizeY = 0.3 0.3
    ; StartSizeZ = 1 1
    ; SizeRateX = 0.01 0.01
    ; SizeRateY = 0.01 0.01
    ; SizeDampingX = 0.99 0.99
    ; SizeDampingY = 0.99 0.99
    ; SizeDampingZ = 0.98 0.98
    ; AngleZ = 1.6 1.6; -5 5
    ; AngularRateZ = -0.01 0.01
    ; AngularDamping = 0.99 0.99
    ; Rotation = ROTATE_Z
  ; End
  Physics = DefaultPhysics
    VelocityDamping = 1 1
	DriftVelocity = X:0.02 Y:0 Z:0.05;
  End
  EmissionVelocity = OrthoEmissionVelocity
    ; X = 0.5 0.5
    ; Y = 0 0
    ; Z = -0.2 -0.2
  End
   EmissionVolume = PointEmissionVolume;
    ; Radius = 50
    ; Length = 5
   End
  Draw = RenderObjectDraw
  End
End

