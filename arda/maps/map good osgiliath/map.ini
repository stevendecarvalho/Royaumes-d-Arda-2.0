Object GondorRangerHorde
CommandSet = GondorRangerHordeCommandSetX
ReplaceModule ModuleTag_HordeContain
	Behavior = HordeContain ModuleTag_HordeContainC
		FrontAngle = 270
		FlankedDelay = 2000
		ObjectStatusOfContained = 
		InitialPayload = GondorRanger 2
		InitialPayload = GondorArcher 1
		Slots = 3
		PassengerFilter = NONE +INFANTRY
		ShowPips = No
		ThisFormationIsTheMainFormation = Yes	//Used to determine which armorset to use (and anything else we want!)
		RandomOffset=X:4 Y:4
		MeleeBehavior = Amoeba
		End
		
		// Banner Carrier info		
		BannerCarriersAllowed	= GondorRangerCaptain_Muted ;GondorRangerCaptain ;GondorInfantryBanner										// types of units that are allowed as banner carriers
		BannerCarrierPosition	= UnitType:GondorRangerCaptain_Muted		Pos:X:10.0 Y:0.0		; (DEFAULT) position of banner carrier for archer horde   ;GondorRangerCaptain		Pos:X:10.0 Y:0.0
		
		RandomOffset = X:0 Y:-12
		
		RankInfo = RankNumber:1 UnitType:GondorRanger Position:X:-10 Y:0	Position:X:0 Y:20
		RankInfo = RankNumber:2 UnitType:GondorArcher	Position:X:0 Y:-20
		
		// Positions for 5

		RanksToReleaseWhenAttacking = 1 2
				
		MeleeAttackLeashDistance = 50   //How far the hordes	can	move from the center of	the	horde when melee attacking.				  
		BackUpMinDelayTime		 = 1	//The minimum amount of	time to	delay before backing up
		BackUpMaxDelayTime		 = 3000	//The maximum amount of	time to	delay before backing up
		BackUpMinDistance		 = 1	//The minimum number of	cells to backup
		BackUpMaxDistance		 = 3	//The maximum number of	cells to backup
		BackupPercentage		 = 80%	//The amount of	chance that	a unit will	back up.
	End
End
End

