Object MinisTop1
 ReplaceModule ModuleTag_01
  Draw = W3DScriptedModelDraw ModuleTag_01_Overide
				OkToChangeModelColor = Yes
	  
		ExtraPublicBone = Elev01
		ExtraPublicBone = Elev02
		ExtraPublicBone = Elev03
		ExtraPublicBone = Elev04
	  
		DefaultModelConditionState
		Model = GBMTop1
		End
		WallBoundsMesh = P2
		RampMesh1 = P1
	        
		ModelConditionState = DAMAGED
			Model = GBMTOP1_D1
		End 
	       
		ModelConditionState = REALLYDAMAGED
			Model = GBMTOP1_D2
		End    

		AlphaCameraFadeOuterRadius = 5
		AlphaCameraFadeInnerRadius = 1
		AlphaCameraAtInnerRadius = 0%    
  End
 End
End

