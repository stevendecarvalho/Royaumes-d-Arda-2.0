ChildObject GondorArcherRangeFoundation GondorArcherRange
RemoveModule ModuleTag_SpawnPatrols
RemoveModule ModuleTag_SpawnPatrols2
RemoveModule ModuleTag_SpawnPatrols3
RemoveModule MakeTheFreeArcher3
ReplaceModule GetBuiltBehaviorTag
 	Behavior = GettingBuiltBehavior ModuleTag_GetBuilt2
		SpawnTimer	= DEFAULT_STRUCTURE_HEALDELAY
