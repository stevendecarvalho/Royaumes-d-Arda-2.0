    BurstDelay = 180 180;20 90
    BurstCount = 1 1; 0 2
  End
  Color = DefaultColor
    Color1 = R:95 G:140 B:160 0; R:164 G:140 B:104 0
    Color2 = R:0 G:0 B:0 400
  End
  Alpha = DefaultAlpha
    Alpha2 = 0.05 0.05 120
    Alpha3 = 0.0 0.0 220
	;Alpha4 = 0 0 400
	;Alpha5 = 0 0 400
  End
    Update = DefaultUpdate
    ;SizeRate = 0.04 0.04
    ;SizeRateDamping = 0.95 0.97
    AngleZ = -5.9 -5.9
    ;AngularDamping = 1 1
    Rotation = ROTATE_Y
    ;AngularDampingXY = 1 1
  End
  ; Update = RenderObjectUpdate
    ; StartSizeX = 0.3 0.3
