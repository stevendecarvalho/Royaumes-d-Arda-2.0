		ShockWaveArc		= 90
		ShockWaveRadius		= 50.0 ;,; 40.0
		ShockWaveTaperOff	= 0.75
		ShockWaveZMult		= 1.000
		ShockWaveSpeed		= 300.0 
	End
End

