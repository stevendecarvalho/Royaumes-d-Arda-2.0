Weapon AvalancheCrush  .
ClearNuggets ; Clear all the damage/fx/paralyze etc nuggets so they can be replaced.
  LeechRangeWeapon      = Yes
  AttackRange           = 40.0
  MeleeWeapon           = No
  DelayBetweenShots     = 0            ; time between shots, msec
  PreAttackDelay        = 0 ;PreAttackDelay+FiringDuration = UseWeaponTiming = Yes duration
  PreAttackType         = PER_SHOT 
  FiringDuration        = 0 ;
;  FireFX		= FX_GenericCrushImpactSound

  DamageNugget                        ; A basic Nugget that just does damage
    Damage        = 1			; A whole lot of damage.
    Radius        = 40.0
    DelayTime     = 0
    DamageType    = CRUSH
    DeathType     = CRUSHED
  End
End

Weapon AvalancheRadiusWeapon			// Shot out every DelayBetweenShots
ClearNuggets ; Clear all the damage/fx/paralyze etc nuggets so they can be replaced.
	RadiusDamageAffects		= ENEMIES NEUTRALS NOT_SIMILAR ALLIES ;;,;; added ALLIES
	LeechRangeWeapon		= Yes
	AttackRange				= 9999999.0
	MeleeWeapon				= No
	DelayBetweenShots		= 0				// time between shots, msec
	PreAttackDelay			= 0				// PreAttackDelay+FiringDuration = UseWeaponTiming = Yes duration
	PreAttackType			= PER_SHOT 
;	FireFX               		= FX_PackWolfHit
	FiringDuration			= 0 

	// A basic Nugget that just does damage
	DamageNugget							
		Damage        = 25	// A whole lot of damage.
		Radius        = 40
		DelayTime     = 0
		DamageType    = HERO
		DamageFXType  = BIG_ROCK
		DeathType     = CRUSHED
	End

	// A Nugget that throws things back with force
