ChildObject DwimoCairn GuldurRestlessBarrow
	ButtonImage		= uiundeadcairn
	SelectPortrait	= UPUndeadCairn
	CommandSet = CairnCommandSet
	Scale = 1.3
	Draw = W3DScriptedModelDraw ModuleTag_Draw

		DefaultModelConditionState
			Model = ubbarrow_skn
		End

		IdleAnimationState
			;ParticleSysBone     = FXGLOW GuldurBarrowGlow Followbone:YES
			ParticleSysBone     = FXGLOW AngTempleMist Followbone:YES
	  		; ParticleSysBone     = FXGLOW AngTempleWhirl_V2 Followbone:YES Persist:SPAWN  PersistID:102
	  		; ParticleSysBone     = FXGLOW AngTempleMistV2 Followbone:YES Persist:SPAWN  PersistID:103
	  		; ParticleSysBone     = FXGLOW AngTempleWhirl Followbone:YES Persist:KILL PersistID:100
	  		; ParticleSysBone     = FXGLOW AngTempleMist Followbone:YES Persist:KILL PersistID:101
		End

		;-- building being constructed
		ModelConditionState = SNOW AWAITING_CONSTRUCTION
			Model			= ubbarrow_bld
			Texture			= ubbarrow.tga ubbarrow_snow.tga
		End
    	ModelConditionState   = AWAITING_CONSTRUCTION
      		Model               = ubbarrow_bld
    	End
    	AnimationState        = AWAITING_CONSTRUCTION
      		Animation           = ubbarrow_bld
        		AnimationName     = ubbarrow_bld.ubbarrow_bld
        		AnimationMode     = MANUAL
      		End
	  		Flags				  = START_FRAME_FIRST
    	End

		ModelConditionState = SNOW ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
			Model			= ubbarrow_bld
			Texture			= ubbarrow.tga ubbarrow_snow.tga
			ParticleSysBone   	= NONE GuldurBuildingContructDust
			ParticleSysBone   	= NONE AOTRBuildingsWild
			ParticleSysBone   	= NONE GuldurBuildUpAuraShafts
			ParticleSysBone   	= NONE GuldurBuildUpRocks
		End
    	ModelConditionState   = ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
      	Model               = ubbarrow_bld
			ParticleSysBone   	= NONE GuldurBuildingContructDust
			ParticleSysBone   	= NONE AOTRBuildingsWild
			ParticleSysBone   	= NONE GuldurBuildUpAuraShafts
			ParticleSysBone   	= NONE GuldurBuildUpRocks
    	End
    	AnimationState        = ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
      		Animation           = ubbarrow_bld
        		AnimationName     = ubbarrow_bld.ubbarrow_bld
        		AnimationMode     = MANUAL
      		End
			Flags				= START_FRAME_FIRST
			StateName			= BeingConstructed
	    End

		;--damaged building

		ModelConditionState  = DAMAGED
			Model         = ubbarrow_d1
		End
		AnimationState = DAMAGED
			EnteringStateFX	= FX_BuildingDamaged
		End

		ModelConditionState  = REALLYDAMAGED
			Model         = ubbarrow_d2
		End

	    AnimationState = REALLYDAMAGED
		    EnteringStateFX	= FX_BuildingReallyDamaged
		End

		ModelConditionState  = COLLAPSING
			Model         = ubbarrow_d2
		End

		AnimationState = COLLAPSING
  			EnteringStateFX	= FX_StructureMediumCollapse
		End

		ModelConditionState  = RUBBLE
			Model         = None
		End

		ModelConditionState  = POST_RUBBLE
			Model         = NONE
			ParticleSysBone NONE SmokeBuildingMediumRubble
		End

		AnimationState = POST_RUBBLE
		End

		ModelConditionState  = POST_COLLAPSE
		Model         = None
			ParticleSysBone NONE SmokeBuildingMediumRubble
		End

		AnimationState = POST_COLLAPSE
		End

		ModelConditionState = SNOW
			Model			= ubbarrow_skn
			Texture			= ubbarrow.tga ubbarrow_snow.tga
		End

		ModelConditionState		= SNOW JUST_BUILT
			Model               	= ubbarrow_bld
			Texture 		= ubbarrow.tga ubbarrow_snow.tga
		End

		ModelConditionState   = JUST_BUILT
			Model               = ubbarrow_bld
		End

		AnimationState		  = JUST_BUILT
			StateName				= JustBuilt
			Animation				= GBBtlTwrM_A
				AnimationName		= ubbarrow_bld.ubbarrow_bld
				AnimationMode		= ONCE
				AnimationBlendTime	= 0
				AnimationSpeedFactorRange = 4 4
			End
		Flags = START_FRAME_FIRST
		End
	End

	ReplaceModule ModuleTag_SpawnFighters
	Behavior = SpawnBehavior ModuleTag_SpawnOathbreakers
		SpawnNumber				= 6
		InitialBurst			= 6
		SpawnTemplateName		= OathbreakerWarrior_Patrol
		SpawnReplaceDelay		= 12000 ;;.;; 10000
		FadeInTime				= 1000
		SpawnInsideBuilding		= No
	End
	End


	MaxSimultaneousOfType = 2

	RemoveModule ModuleTag_GrantUpgrade
	RemoveModule ModuleTag_DarkPresence

	ReplaceModule ModuleTag_05
	Body                = StructureBody ModuleTag_SummonHealth
		MaxHealth			= DWARVEN_SUMMONED_CITADEL_HEALTH
		MaxHealthDamaged  		= DWARVEN_SUMMONED_CITADEL_HEALTH_DAMAGED
		MaxHealthReallyDamaged 	  	= DWARVEN_SUMMONED_CITADEL_HEALTH_REALLY_DAMAGED
	End
	End

	ReplaceModule ModuleTag_SummonRestlessWarriors
	Behavior = OCLSpecialPower ModuleTag_SummonMoreRestlessWarriors
		SpecialPowerTemplate 		= SpecialAbilityGuldurSpawnRestless
		OCL                  		= OCL_GuldurBarrowMoreRDEgg
		CreateLocation       		= USE_OWNER_OBJECT
		StartsPaused		 		= No
	End
	End
;--------------Dread Visage-------------------;
	Behavior = GrantUpgradeCreate ModuleTag_GrantBetterUpgrade
		UpgradeToGrant	= Upgrade_ObjectLevel1
	End
	Behavior = UnpauseSpecialPowerUpgrade ModuleTag_BlackRiderDreadVisage
		SpecialPowerTemplate = SpecialAbilityFakeLeadership2
		TriggeredBy = Upgrade_ObjectLevel1
	End
	Behavior = SpecialPowerModule ModuleTag_BlackRiderDreadVisageUpdate
		SpecialPowerTemplate      = SpecialAbilityFakeLeadership2
		UpdateModuleStartsAttack  = Yes
		StartsPaused = Yes
	End
	Behavior = AttributeModifierAuraUpdate ModuleTag_DreadVisage
