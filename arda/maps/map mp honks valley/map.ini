    Priority = VERY_LOW_OR_ABOVE
    Shader = ALPHA
    ParticleName = EXCloud02.tga
    Lifetime = 350 350; 350 350
    Size = 0.1 0.1; 1 1
    BurstDelay = .2 .5; 2 5
    BurstCount = 1 2; 1 1
    IsEmitAboveGroundOnly = No
  End
  Color = DefaultColor
    Color1 = R:140 G:175 B:190 50
  End
  Alpha = DefaultAlpha
    Alpha1 = 0.08 0.2 50; 0.1 0.3 50
    Alpha2 = 0 0 100; 0 0 350
  End
  Update = DefaultUpdate
    SizeRate = 1 3; 1 3
    SizeRateDamping = 0.9 0.99
    AngularRateZ = -0.02 0.02
    AngularDamping = 1 1
    AngularDampingXY = 1 1
  End
  Physics = DefaultPhysics
    VelocityDamping = 0.7 0.8
    DriftVelocity = X:.8 Y:-.8 Z:0.7; X:0.2 Y:0.2 Z:0.08
  End
