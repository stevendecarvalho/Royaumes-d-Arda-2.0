Object CINE_ParticleSysProxy

  ; *** ART Parameters ***
 ReplaceModule ModuleTag_01
  Draw = W3DScriptedModelDraw ModuleTag_01_Override
    DefaultModelConditionState
      Model = NONE
      ParticleSysBone = None DoomHaze
    End
  
    ModelConditionState = WORLD_BUILDER
	  Model = locator
	End
  End
 End
End

FXParticleSystem DoomHaze
  System
    Priority = MEDIUM_OR_ABOVE
    Shader = ALPHA
    ParticleName = EXCloud01.tga
    Lifetime = 300 300
    SortLevel = 1
    Size = 50 150
    BurstCount = 1 3
  End
  Color = DefaultColor
    Color1 = R:75 G:70 B:61 0
    Color2 = R:0 G:0 B:0 300
  End
  Alpha = DefaultAlpha
    Alpha2 = 0.35 0.35 15
    Alpha3 = 0 0 30
  End
  Update = DefaultUpdate
    SizeRateDamping = 1.01 1.01
    AngleZ = 1 -1
    AngularRateZ = -0.01 0.01
    AngularDamping = 1 1
    AngularDampingXY = 1 1
  End
  Physics = DefaultPhysics
    VelocityDamping = 1 1
    DriftVelocity = X:0.32 Y:0 Z:0.24
  End
  EmissionVelocity = OrthoEmissionVelocity
  End
  EmissionVolume = CylinderEmissionVolume
    Radius = 400
    Length = 20
  End
  Draw = DefaultDraw
  End
End

