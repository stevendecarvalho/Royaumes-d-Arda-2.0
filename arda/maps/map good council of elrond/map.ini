			AnimationPriority = 1
		End
		Flags = RESTART_ANIM_WHEN_COMPLETE RANDOMSTART
		BeginScript
			Prev = CurDrawablePrevAnimationState()
			if Prev ~= "Quarrel"
			then
				return "BIG_BLEND_QUARREL"
			end
		EndScript

    End
  End
End
