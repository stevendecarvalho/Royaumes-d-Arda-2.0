Object TDHEreborThroneKeep

	WeaponSet
		Conditions			= None
		Weapon				= PRIMARY None
		AutoChooseSources	= PRIMARY FROM_PLAYER FROM_SCRIPT FROM_AI
	End 
	
	
	ReplaceModule ModuleTag_Draw
	Draw = W3DScriptedModelDraw ModuleTag_ruin
	
	    OkToChangeModelColor  = Yes
    UseStandardModelNames = Yes
	
	WallBoundsMesh = WALLPLANE
	RampMesh1 = STAIRPLANE
	
		RandomTexture = dbMthrone_gun.tga 0 dbMthrone.tga
		DefaultModelConditionState
			Model = dbMthrone_skn
		End
		
		IdleAnimationState
		StateName = STATE_None
	End
		
			;------------Build Up States
    ModelConditionState   = ACTIVELY_BEING_CONSTRUCTED
      Model               = dbMthrone_bld
      ParticleSysBone     = NONE BuildingContructDust
    End  

	AnimationState          = ACTIVELY_BEING_CONSTRUCTED
		StateName = STATE_Constructing
		Animation
			AnimationName	= dbMthrone_bld.dbMthrone_bld
			AnimationMode   = MANUAL
		End
		BeginScript
			;CurDrawableHideSubObject("FIRE02")
			CurDrawablePlaySound("GondorBarracksBeginConstruction")
			CurDrawablePlaySound("BuildingTopple")
		EndScript
	End
	
	ModelConditionState   = DESTROYED_WHILST_BEING_CONSTRUCTED
		Model = dbMthrone_bld
		Texture			= dbMthrone_gun.tga dbMthrone.tga
		ParticleSysBone NONE Explosion3
		ParticleSysBone NONE ExplosiveMineSmoke02
    End  
	AnimationState	= DESTROYED_WHILST_BEING_CONSTRUCTED
		StateName = STATE_DetroyedConstructing
		Animation
			AnimationName		= dbMthrone_bld.dbMthrone_bld
			AnimationMode		= ONCE_BACKWARDS
			AnimationBlendTime	= 90	; 3 seconds * 30 frames
		End
		; Specifically no start last frame flag here.
		Flags = START_FRAME_FIRST
	End
	
	;------------Build Up States
    ModelConditionState   = BASE_BUILD
      Model               = dbMthrone_bld
      ParticleSysBone     = NONE BuildingContructDust
    End  

	AnimationState		  = BASE_BUILD
		StateName = STATE_None
		Animation
			AnimationName = dbMthrone_bld.dbMthrone_bld
			AnimationMode = ONCE
			AnimationBlendTime = 0			
			AnimationSpeedFactorRange = 2.0 2.0 ; 300 frame anim, but need to shrink down to 5 seconds
		End
		BeginScript
			CurDrawablePlaySound("GondorBarracksBeginConstruction")
			CurDrawablePlaySound("BuildingTopple")
		EndScript
	End

    ModelConditionState   = JUST_BUILT
      Model               = dbMthrone_bld
    End  
	AnimationState		  = JUST_BUILT
		StateName = STATE_None
		Animation
			AnimationName = dbMthrone_bld.dbMthrone_bld
			AnimationMode = MANUAL			
			AnimationBlendTime = 0
		End
        Flags = START_FRAME_FIRST
	End
	
	
    ModelConditionState  = DAMAGED
      Model         = dbMthrone_d1 
	  Texture		= dbMthrone_gun.tga dbMthrone.tga
	 Texture		= dbMthrone_gun.tga dbMthrone_d.tga
    End
    
    AnimationState = DAMAGED
		StateName = STATE_None
		EnteringStateFX	= FX_BuildingDamaged
    End

    ModelConditionState  = REALLYDAMAGED
      Model         = dbMthrone_d2
	 Texture		= dbMthrone_gun.tga dbMthrone.tga
	 Texture		= dbMthrone_gun.tga dbMthrone_d.tga
    End
    AnimationState = REALLYDAMAGED
	StateName = STATE_None
       	Animation				=	ReallyDamagedanimation
			AnimationName		=	 dbMthrone_d2.dbMthrone_d2
			AnimationMode		=	ONCE
   		End
   		StateName = STATE_None
		EnteringStateFX	= FX_BuildingReallyDamaged
    End

	; RUBBLE--------------------------------------------------------------------------------------------------------
  
	TransitionState = TRANS_U_IntoRubble
		Animation = D3
			AnimationName		= dbMthrone_D3.dbMthrone_D3
			AnimationMode		= ONCE
			AnimationBlendTime = 0
		End
		ParticleSysBone NONE Explosion3
		ParticleSysBone NONE ExplosiveMineSmoke02
	End
    ModelConditionState  = RUBBLE
		Model         = dbMthrone_D3
	    Texture	   	  = dbMthrone_gun.tga dbMthrone.tga
		Texture		  = dbMthrone_gun.tga dbMthrone_d.tga
    End
    AnimationState = RUBBLE
		Flags = START_FRAME_LAST
		StateName = STATE_Rubble
		Animation				=	Death
			AnimationName		=	dbMthrone_D3.dbMthrone_D3
			AnimationMode		=	ONCE
		End
		BeginScript
			Prev = CurDrawablePrevAnimationState()
			if Prev == "STATE_None"
			then
				; Only play the rubble anim if we havn't come from another rubble.
				CurDrawableSetTransitionAnimState("TRANS_U_IntoRubble")
			end
		EndScript
 End
	End
	End
End

