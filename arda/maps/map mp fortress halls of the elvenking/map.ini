FXParticleSystem WhiteDriftingClouds
  System
    Priority = VERY_LOW_OR_ABOVE
    Shader = ALPHA
    ParticleName = EXCloud02.tga
    Lifetime = 350 350
    Size = 1 1
    BurstDelay = 2 5
    BurstCount = 1 1
    IsEmitAboveGroundOnly = Yes
  End
  Color = DefaultColor
    Color1 = R:255 G:255 B:255 75
  End
  Alpha = DefaultAlpha
    Alpha1 = 0.1 0.3 50
    Alpha2 = 0 0 350
  End
  Update = DefaultUpdate
    SizeRate = 1 3
    SizeRateDamping = 0.9 0.99
    AngularRateZ = -0.02 0.02
    AngularDamping = 1 1
    AngularDampingXY = 1 1
  End
  Physics = DefaultPhysics
    VelocityDamping = 0.7 0.8
    DriftVelocity = X:0.2 Y:-0.2 Z:0.08
  End
  EmissionVelocity = OrthoEmissionVelocity
    X = -0.4 -0.4
  End
  EmissionVolume = LineEmissionVolume
    IsHollow = Yes
    StartPoint = X:0 Y:-80 Z:0
    EndPoint = X:0 Y:100 Z:0
  End
  Draw = DefaultDraw
  End
End



